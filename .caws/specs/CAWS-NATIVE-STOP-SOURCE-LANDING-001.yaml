invariants:
  - 'Source landing does not qualify production publication, close parent acceptance, alter the selected machine runtime, or remove branches/worktrees used by other lanes.'
  - 'Preserve original 30000ms deadlines, full byte/inventory/identity checks and failed Unknown fixtures; no replay or settlement is inferred.'
acceptance:
  - id: A1
    given: 'Reviewed candidate and retained checks'
    when: 'The coherent checkpoint lands through a separate main-based governed lane'
    then: 'Landed implementation blobs equal the reviewed candidate and every contributed path has admitted provenance.'
  - id: A2
    given: 'Actual positive, hostile and mutation controls for the candidate'
    when: 'Source landing evidence is adjudicated'
    then: 'Exact-source executed checks and the failed installed 30000ms scenario are retained with explicit component and runtime limits; no full publication or cutover success is asserted.'
  - id: A3
    given: 'Active parent/publication specs, existing dependent lanes and the selected machine generation'
    when: 'The source landing is complete'
    then: 'Parent/publication acceptance remains open, existing dependent base refs and worktrees are preserved, and the selected machine runtime is unchanged.'
observability:
  - 'Retained execution receipts, source hashes, actual partial-publication files and Unknown journal; main ancestry and live registry/spec/pointer checks.'
rollback:
  - 'Use a new governed corrective or revert commit for landed source; do not rewrite history, replay partial publication, remove dependent bases or change the machine pointer.'
non_functional:
  security:
    - 'Preserve explicit native identity fields and all authority/effect checks; bounded source acceptance confers no runtime adoption permission.'
contracts:
  - name: 'bounded-stop-source-landing'
    type: behavior
