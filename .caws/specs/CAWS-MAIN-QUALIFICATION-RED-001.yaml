  out: []
  support:
    - package.json
    - package-lock.json
invariants:
  - 'A test exercises the candidate build and its own declared environment, never an ambient installed caws or runner variable'
  - 'A shipped shared template never changes without a pack version bump and recomputed fingerprint'
  - 'Compiled reviewed-prefix digests change only with a source review; template drift keeps the prefix serial'
acceptance:
  - id: A1
    given: 'main with no caws on PATH and LD_LIBRARY_PATH set, as on the Linux runner'
    when: 'the Candidate tests and contracts job steps run'
    then: 'each step exits zero, including native service_image, audit, typecheck, lint, jest, node scripts, docs check, bats and pytest'
  - id: A2
    given: 'a registered worktree whose owner is unknown'
    when: 'a Write targets it in default mode and in bypassPermissions mode'
    then: 'default mode emits a typed ask naming ask_uncertain:worktree-payload-no-owner and bypass mode refuses, while a known foreign owner is refused in both'
  - id: A3
    given: 'hook templates that differ from the compiled reviewed prefix'
    when: 'the native prefix tests run'
    then: 'the positive control uses authenticated retained source bytes and a changed, missing, duplicate or misbound fixture entry is rejected'
