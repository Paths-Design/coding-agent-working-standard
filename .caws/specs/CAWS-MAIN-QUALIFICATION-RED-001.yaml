operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-native/src/service_image/prefix/tests.rs'
    - 'packages/caws-native/tests/fixtures/reviewed-stop-prefix.json'
    - 'packages/caws-cli/'
    - '.github/workflows/release-qualification.yml'
    - scripts/prepare-ci-test-interpreter.cjs
    - scripts/prepare-ci-test-interpreter.test.mjs
