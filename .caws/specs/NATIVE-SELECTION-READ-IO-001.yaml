  - id: A5
    given: 'complete runtime verification in an immutable snapshot'
    when: 'discovery retries or another snapshot changes runtime bytes modes or inventory'
    then: 'successful verification reuses only that snapshot and partial failures are never cached'
  - id: A6
    given: 'surface adapter selection and absent higher priority targets'
    when: 'a fresh observation source adds a user adapter or an old observation is replaced'
    then: 'fresh selection and readsets show changed absence inventory and ancestry while replacement under old identity is refused'
  - id: A7
    given: 'redirected paths special files changed read identity invalid link count or executable access refusal'
    when: 'live and snapshot read contracts execute'
    then: 'applicable refusals preserve file capture and access semantics without fabricated Stats'
  - id: A8
    given: 'the committed bounded IO slice'
    when: 'build focused checks doctor gates and independent review are inspected'
    then: 'evidence supports this read abstraction only and no engine capability or publication activation is introduced'
observability:
