id: HANDOFF-EXPORT-IMPORT-001
title: 'Portable handoff brief: export a session''s handoff context (redacted, .caws-scoped) and import it on pickup'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-handoff-brief
created_at: '2026-08-26T04:55:13.771Z'
updated_at: '2026-08-26T04:57:20.128Z'
