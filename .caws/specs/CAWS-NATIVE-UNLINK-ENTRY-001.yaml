    given: 'the committed reviewed candidate isolated from the active frozen guard run'
    when: 'focused existing producer and copied-hook consumer checks run with matching analyzer and real oracle'
    then: 'semantic positive and hostile controls pass with retained raw output and fixture effects, without claiming installed publication or machine cutover'
