id: CAWS-DEFECT-MERGE-APPLY-FLAG-01
title: 'Add caws worktree merge --apply to collapse dry-run then real ceremony'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-merge-apply
created_at: '2026-08-06T13:46:29.806Z'
updated_at: '2026-08-06T13:46:31.268Z'
blast_radius:
  modules:
    - packages/caws-cli/src/shell/commands/worktree.ts
    - packages/caws-cli/src/shell/command-metadata.ts
    - packages/caws-cli/src/shell/register.ts
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/shell/commands/worktree.ts
    - packages/caws-cli/src/shell/command-metadata.ts
    - packages/caws-cli/src/shell/register.ts
