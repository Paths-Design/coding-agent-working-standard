invariants:
  - '--apply is a pure shell-layer composition: it calls mergeWorktree twice (first with dryRun:true as a gate, then for real). The writer is unchanged; no new mutation path is introduced.'
  - '--apply is a precondition gate, not a force: if the dry-run canProceed is false (foreign owner, uncommitted changes, missing binding), --apply reports the findings and exits 1 WITHOUT merging. It never overrides a finding.'
  - '--dry-run and --apply are mutually exclusive: --apply implies the dry-run gate runs internally, so passing both is a usage error (exit 2, no mutation).'
acceptance:
  - id: A1
    given: 'A ready-to-merge worktree (clean tree, owner is caller, spec + branch binding present) and a caller cwd outside the worktree.'
    when: 'caws worktree merge <name> --apply runs.'
    then: 'The dry-run gate passes (canProceed) and the real merge proceeds in one command; the output is the merged-success line (same as a real merge), exit 0.'
  - id: A2
    given: 'A NOT-ready worktree (e.g. uncommitted changes, or foreign owner).'
    when: 'caws worktree merge <name> --apply runs.'
    then: 'The dry-run gate refuses; the findings are printed; exit 1; NO merge commit / spec close / event append occurs.'
  - id: A3
    given: 'A caller passing both --dry-run and --apply.'
    when: 'The command is parsed.'
    then: 'A usage error is reported (exit 2) and no merge runs.'
non_functional:
  reliability:
    - 'The dry-run gate and the real merge see the same registry entry; a concurrent merge landing between the two calls is bounded by the writer existing retry budget (the real merge recomputes against the current base).'
contracts:
  - name: 'merge-apply-flag'
    type: behavior
