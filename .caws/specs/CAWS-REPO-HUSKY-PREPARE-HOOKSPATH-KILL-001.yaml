invariants:
  - 'No lifecycle script may reconfigure core.hooksPath as a silenced side effect; a command that can disable every git hook must fail loudly or not run at all.'
  - 'A guard''s delivery mechanism must be reachable by the command that documents it. If npm run <script> does not reach the root script, the script is not installed.'
  - 'Silencing output and forcing the exit code (>/dev/null 2>&1 || true) turns a failure into an invisible state change, and is banned for anything that mutates git configuration.'
acceptance:
  - id: A1
    given: 'the caws monorepo with core.hooksPath correctly set to .husky'
    when: 'npm install or npm run prepare runs from the repo root'
    then: >-
      core.hooksPath still resolves to .husky and every hook-named file is still
      found; no lifecycle script repoints it at .husky/_
  - id: A2
    given: 'the documented entry point npm run test:hooks and a root .npmrc carrying workspaces=true'
    when: 'it is invoked from the repo root'
    then: 'the root script runs rather than npm resolving the name against a workspace that does not define it'
  - id: A3
    given: 'the hook test suite''s assertion that prepare wires core.hooksPath'
    when: 'the assertion runs'
    then: >-
      it exercises the root prepare script rather than passing because
      core.hooksPath already held the right value
