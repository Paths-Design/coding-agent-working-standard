    status: waived
    evidence_ref: "NOT FIXED, deliberately. 'npm run test:hooks' from the repo root still fails with 'Missing script' against workspace @paths.design/caws-cli; only 'npm run test:hooks --workspaces=false' reaches the root script. The actual fix is removing workspaces=true from the root .npmrc, which changes name resolution for EVERY root script in this repo (build, test, lint, typecheck, clean, the caws: and codemod: groups) — a repo-wide behaviour change far outside a hook hotfix, and one that could silently alter what CI and every agent session runs. Mitigation shipped instead: the root package.json carries an inline note naming --workspaces=false, .husky/README.md documents the shadowing with the exact error text, and the suite is invocable as 'bash .husky/tests/run.sh' which is unaffected. The concrete harm this shadowing caused — a vacuous prepare assertion — is closed separately by A3/T6f. Remaining obligation: decide the .npmrc question under its own spec, because every other root script has the same defect and nobody has checked whether 'npm run build' at the root has been running turbo or per-workspace builds."
