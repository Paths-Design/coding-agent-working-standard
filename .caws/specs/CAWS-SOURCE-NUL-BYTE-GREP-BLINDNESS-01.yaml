id: CAWS-SOURCE-NUL-BYTE-GREP-BLINDNESS-01
title: 'a raw NUL byte in kernel leases.ts makes the whole file invisible to grep; escape it and add a repo-wide gate so no source file can go unsearchable again'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-source-nul-gate
created_at: '2026-09-19T10:28:48.680Z'
updated_at: '2026-09-19T10:30:55.942Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'caws-cli kernel lease path validation'
    - 'caws-cli repo-wide source integrity gate'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/kernel/worktree/leases.ts'
    - 'packages/caws-cli/tests/ci/source-text-integrity.test.js'
  out: []
invariants:
  - 'The edit is semantically identity-preserving: in a JavaScript string literal ''\u0000'' and a raw U+0000 byte denote the same one-character string, so the LEASE_PATH_NULL_BYTE guard must behave identically afterwards. Proving the file still compiles is not proving the guard still refuses.'
  - 'The deliverable is the gate, not the one-character edit. The defect class is ''a tracked source file that grep silently cannot read''; fixing the single instance without a repo-wide gate leaves the class open and the next occurrence just as invisible.'
  - 'The gate reads bytes directly and never shells out to grep. grep is the tool this defect defeats, so a grep-based detector would be blind to exactly the files it is meant to find.'
  - 'The gate must be observed failing against the unfixed file before the fix lands. A hygiene assertion that has never failed is indistinguishable from one that cannot.'
acceptance:
  - id: A1
    given: 'the repository with the raw NUL still present in kernel leases.ts'
    when: 'the new source-text-integrity gate runs'
    then: 'it fails and names that file with the byte offset, demonstrating the gate can fail for the right reason rather than passing vacuously'
  - id: A2
    given: 'kernel leases.ts after the escape is applied'
    when: 'its bytes are inspected and grep is run against it'
    then: 'it contains zero U+0000 bytes and grep returns the symbol matches it previously reported as absent with exit 1'
  - id: A3
    given: 'the LEASE_PATH_NULL_BYTE validator after the change'
    when: 'a lease path containing an actual NUL character is validated'
    then: 'it is still refused with the same diagnostic rule, proving the escape preserved the guard rather than disarming it'
  - id: A4
    given: 'any tracked source file that acquires a raw NUL byte in future'
    when: 'the gate runs'
    then: 'it fails and names that file, so the class is closed and not merely this one instance'
non_functional: {}
contracts:
  - name: 'source-text-integrity'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Observed failing against the unfixed tree BEFORE the fix was applied, which is the whole point of this AC. Running tests/ci/source-text-integrity.test.js with the raw NUL still present produced: violations = ['packages/caws-cli/src/kernel/worktree/leases.ts:628 (byte offset 25037)'] against an expected []. Byte offset 25037 and line 628 match the offset derived independently by direct byte inspection before the test existed, so the detector and the diagnosis agree rather than one being fitted to the other. The run was 2 failed / 6 passed; the second failure was my own bad assertion (the test asserted the scan contained the then-untracked test file itself) and was replaced with an extension-breadth check that is correct while uncommitted and does not rot on a rename."
    recorded_at: "2026-09-19T10:37:46.295Z"
    commit_sha: "821db384"
  - criterion_id: A2
    status: pass
    evidence_ref: "Measured on the file at 821db384. Before: 'file' reported 'data'; 'grep -c summarizeActiveAgents <leases.ts>' printed nothing and exited 1 while a direct byte count found 5 occurrences -- grep was blind to all 861 lines. After: 'file' reports 'Unicode text, UTF-8 text'; the same grep prints 5. 'grep -n u0000' now shows line 628 alongside the pre-existing line 780, confirming the edit adopted the idiom the file already used. git diff --stat is 1 file changed, 1 insertion, 1 deletion; cat -v renders the change as -entry.indexOf('^@') +entry.indexOf('\\u0000'). Byte size 33138 -> 33143 (+5), exactly the delta of one raw byte replaced by a six-character escape. Test 'grep can read kernel leases.ts' uses the real grep binary rather than a byte scan, because the claim is specifically about what grep can see."
    recorded_at: "2026-09-19T10:37:47.732Z"
    commit_sha: "821db384"
  - criterion_id: A3
    status: pass
    evidence_ref: "Proven behaviorally AND by mutation, because 'it still compiles' is not proof the guard survived. Four tests call the compiled validateLeasePathMetadata: a claimed_path, a last_modified_path, and NULs at the start / middle / end of a string are each refused with rule kernel.lease.path_null_byte and a 'null byte' message; the fourth is the must-stay-admitted counterweight asserting ordinary paths still return ok (a validator that refused everything would satisfy the first three). Mutation evidence: replacing the escape with '\\\\u0000' -- the plausible fat-finger, a six-character string that can never match a real NUL -- and rebuilding produced exactly 3 failed / 5 passed, the three 'still refused' assertions failing while the counterweight and all four file-scanning tests passed. The file's sha256 was 677c5f985239bbfd9702c674c4991845b81dddf7dd52666879180a68fb11a8d2 before the mutation and identical after restoration."
    recorded_at: "2026-09-19T10:38:02.752Z"
    commit_sha: "821db384"