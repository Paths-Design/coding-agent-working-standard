invariants:
  - 'Remediation asserts only facts sourced from the loaded snapshot (specs, worktree registry, events) or returned by the kernel''s evaluatePath; it never claims a binding admits a path unless evaluatePath under that binding returned admit.'
  - 'The kernel decision fields (decision, rule, mode, boundSpecId, ambiguousClaimants) are unchanged by this slice; only shell-rendered remediation text and additive optional candidate fields change.'
  - 'The scope show --json contract changes additively: every existing authorityCandidates field keeps its name and meaning, so hook consumers parsing today''s fields see identical values.'
acceptance:
  - id: A1
    given: 'an unbound checkout and one active spec with no worktree whose scope.in admits the path and under whose binding evaluatePath returns admit'
    when: 'caws scope show <path> --json runs'
    then: 'a remediation note names the spec, its lifecycle state, that it has no worktree, the admitting scope.in entry, and that the kernel admits the path under its binding; the worktree ensure description states what ensure creates and that it changes no other spec or worktree; the redundant scope show --spec command for that claimant is absent; and no note contains ''does not grant current-checkout write authority'''
  - id: A2
    given: 'an active spec with no worktree that claims the path and whose latest binding-lifecycle event is worktree_merged with auto_closed_spec false'
    when: 'caws scope show <path> --json runs from an unbound checkout'
    then: 'no worktree ensure or worktree bind command names that spec, a note states it landed in merge <sha> at <ts> from session <id> and was left open with --no-close so it is finished work and not a lane for this edit, and the remediation directs the caller to author a new spec that claims the path'
  - id: A3
    given: 'a spec whose scope.in admits the path but under whose binding evaluatePath does not return admit (a scope.out exclusion)'
    when: 'caws scope show <path> --json runs from an unbound checkout'
    then: 'the remediation does not state that binding it admits the path, names the kernel rule that refuses it, and keeps the read-only scope show --spec command for that spec'
  - id: A4
    given: 'a path claimed by an active worktree W bound to spec S'
    when: 'caws scope show <path> --json runs from the canonical checkout'
    then: 'the summary names W, S and the admitting scope.in entry, and the note states that a base-checkout write to the path is blocked by worktree-write-guard because W claims it, without ''can still be'''
  - id: A5
    given: 'a spec merged with --no-close whose later event for that spec is spec_reopened, worktree_created or worktree_bound'
    when: 'caws scope show runs for a path it claims'
    then: 'the spec is not reported as landed and is offered the normal verified handoff'
  - id: A6
    given: 'any of the fixtures above'
    when: 'caws scope show --json runs'
    then: 'decision, rule, mode, boundSpecId and ambiguousClaimants equal their pre-change values, and every authorityCandidates entry still carries specId, lifecycleState, worktreeName and matchedScopeInEntry with unchanged meaning'
