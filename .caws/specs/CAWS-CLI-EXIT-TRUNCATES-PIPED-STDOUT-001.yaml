id: CAWS-CLI-EXIT-TRUNCATES-PIPED-STDOUT-001
title: 'caws command exit must flush piped stdout: process.exit discards the buffer, so any >64KB output is silently truncated at exit 0'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-exit-flush
created_at: '2026-09-16T04:25:16.428Z'
updated_at: '2026-09-16T04:25:57.780Z'
created_by_session: '0d83351d-d384-4100-8148-a3f40dbc6b7a'
blast_radius:
  modules:
    - 'packages/caws-cli/src/shell/register.ts (shared exit hook for all 97 command exits)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/register.ts'
    - 'packages/caws-cli/src/index.js'
    - 'packages/caws-cli/tests/shell/exit-flushes-piped-stdout.test.js'
  out: []
invariants:
  - 'NO CAWS EXIT PATH THAT FOLLOWS COMMAND OUTPUT MAY DISCARD IT: the shared command exit hook sets process.exitCode and returns, letting Node drain stdout/stderr before the process ends. process.exit() is never the mechanism by which a command''s own exit code is delivered.'
  - 'EXIT CODES ARE PRESERVED EXACTLY: changing the delivery mechanism must not change a single observed exit status. Every code a command returns (0, 1, 2) is the process''s observed status, on both the success and refusal paths.'
  - 'TERMINATION STAYS PROMPT: the shell and store layers are fully synchronous (no timers, watchers, servers, or async handles), so a natural exit ends as soon as output drains. A hang is a regression, not an acceptable trade for a flush.'
  - 'CONTROL FLOW IS UNCHANGED: every call site of the hook already terminates its block (returns or is the last statement), so setting exitCode instead of terminating the process cannot let code run that previously did not.'
  - 'THE PROOF MUST CROSS A PROCESS BOUNDARY: this defect is invisible to any test that injects an out() sink, because the loss happens between the write and the pipe. Evidence is a real spawn with a real pipe and output larger than the OS pipe buffer.'
acceptance:
  - id: A1
    given: >-
      a CAWS repo whose 'caws status --json' payload exceeds the OS pipe buffer
      (populated with enough lease records to push it past 64KiB)
    when: 'the built CLI is spawned as a child process with stdout attached to a pipe'
    then: >-
      the captured stdout is complete and parses as JSON, its last non-whitespace
      character is the closing brace, and the process exit status is 0
  - id: A2
    given: 'the same repo and the same command'
    when: 'stdout is captured once through a pipe and once redirected to a file'
    then: >-
      the two byte counts are equal, proving the output is not channel-dependent —
      which is the precise shape of this defect, since the file path never truncated
  - id: A3
    given: >-
      commands whose handlers return 0, 1, and 2 respectively (a successful status,
      a refused lifecycle op, and a usage error)
    when: 'each is spawned with piped stdio'
    then: >-
      the observed process exit status equals the handler's returned code in every
      case; changing the delivery mechanism preserves every exit code exactly
  - id: A4
    given: 'a spawn with a generous timeout set on the child'
    when: 'any of the above commands runs to completion'
    then: >-
      the child terminates on its own — the result carries no kill signal and no
      timeout — proving a natural exit does not hang waiting on an unreferenced
      handle
  - id: A5
    given: 'the shared exit hook registered by registerShellCommands with no injected exit override'
    when: 'it is invoked with a code'
    then: >-
      it sets process.exitCode to that code and returns, and does not call
      process.exit — pinned directly so a future refactor back to process.exit fails
      here and not only in the slow spawn test
  - id: A6
    given: 'every .action() handler registered by registerShellCommands'
    when: 'the source is scanned for exit() calls that are not the handler''s final one'
    then: >-
      each such call is immediately followed by return — because under exitCode
      delivery a missing return both overwrites the refusal code with a later 0 AND
      executes the command the caller was just refused; the scanner also asserts it
      found >50 handlers so the check cannot pass vacuously
