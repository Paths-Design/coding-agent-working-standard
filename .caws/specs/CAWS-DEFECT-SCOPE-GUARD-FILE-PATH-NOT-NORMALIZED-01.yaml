id: CAWS-DEFECT-SCOPE-GUARD-FILE-PATH-NOT-NORMALIZED-01
title: 'scope-guard misclassifies an in-repo path with a redundant separator as a foreign repository'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-scope-guard-norm
created_at: '2026-09-19T01:15:51.883Z'
updated_at: '2026-09-19T02:27:24.973Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'shared hook pack: scope-guard.sh foreign-repo containment classifier'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/scope-guard.sh'
    - 'packages/caws-cli/tests/hooks/bats/scope-guard.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
invariants:
  - 'FILE_PATH is normalized the same way PROJECT_DIR already is before any containment comparison — the file''s own owned_worktree_root() states this ''compare like with like'' rule and applies it to the worktree-root candidate but not to FILE_PATH itself.'
  - 'The fix may only NARROW the set of paths classified foreign. A path in a genuinely different repository must still take the containment hard block; no normalization may make a foreign path read as in-repo.'
  - 'Normalization must not require the target file to exist: a Write creates a file that is not on disk yet, so a resolution strategy depending on the path existing would fail exactly on the tool it must govern.'
acceptance:
  - id: A1
    given: 'a Write/Edit envelope whose file_path is inside the governed project but carries a redundant separator (e.g. a TMPDIR ending in a slash yielding /var/.../T//repo/native/core.rs)'
    when: 'scope-guard.sh adjudicates it'
    then: 'the path is treated as in-repo and evaluated against ALLOW_PREFIXES and the kernel scope decision, NOT hard-blocked by the foreign-repo containment branch'
  - id: A2
    given: 'a Write/Edit envelope whose file_path is genuinely in a different repository'
    when: 'scope-guard.sh adjudicates it after the normalization fix'
    then: 'it is still hard-blocked with exit 2 and the DIFFERENT repository diagnostic — the fix must not widen containment'
  - id: A3
    given: 'a file_path containing . or .. segments that resolve inside the governed project'
    when: 'scope-guard.sh adjudicates it'
    then: 'it is treated as in-repo, and a path whose segments resolve OUTSIDE the project is still foreign'
non_functional: {}
contracts:
  - name: 'scope-guard-path-normalization'
    type: behavior
    path: 'packages/caws-cli/tests/hooks/bats/scope-guard.bats'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Falsifying-first, and the pre-fix run captured the defect verbatim. Arms 'an in-repo path with a REDUNDANT SEPARATOR is not foreign', 'an in-repo path with . and .. segments is not foreign', and 'normalization does not require the target to EXIST' were written BEFORE the fix and all three failed, with the block text reading: CAWS scope-guard: BLOCKED — '/var/folders/.../T//caws-bats-Rypi8G/./src/../src/app.ts' is in a DIFFERENT repository than this session's project (/var/folders/.../T/caws-bats-Rypi8G). Those two paths are the same directory. Post-fix all three pass. ORACLE NOTE: the assertion is on the BLOCK TEXT (refute_output --partial 'DIFFERENT repository'), not on exit status — an admitted Write exits 0 SILENTLY and so does a guard that skipped the branch for an unrelated reason, so an exit-code oracle would pass vacuously (the same trap that made six arms vacuous earlier in this work). Non-vacuity is pinned by a fourth arm, 'a normalized in-repo path is still REFUSED when the kernel refuses', which drives the same normalized path with the stub returning exit 1 and asserts the refusal text still surfaces — so skipping the foreign branch does not admit everything. Run: cd packages/caws-cli && npx bats tests/hooks/bats/scope-guard.bats => 22/22; full bats tests/hooks/bats/ => 407 ok, 0 not ok; full jest => 247/247 suites, 3320/3320 tests, exit 0."
    recorded_at: "2026-09-19T02:39:53.269Z"
    artifact_path: packages/caws-cli/tests/hooks/bats/scope-guard.bats
    commit_sha: "60460679"
  - criterion_id: A2
    status: pass
    evidence_ref: "The containment half — the fix may only NARROW the foreign set. Arm 'a foreign path with a redundant separator is still foreign' drives a path in a genuinely different temp repository, spelled with the SAME doubled separator that A1 proves is now tolerated in-repo, and asserts exit 2 plus 'DIFFERENT repository'. That pairing is the point: it discriminates a fix that compares normalized absolute paths from one that merely collapsed separators or loosened the prefix match, which would have admitted this path too. The pre-existing arm 'a write into ANOTHER repository's linked worktree is hard-blocked as foreign (no strike ramp)' also still passes, with its 'linked worktree of <repo>' attribution and its refute of 'strike 1 of 3' intact. WHAT MAKES THESE NON-VACUOUS: both containment arms passed BEFORE the fix as well as after, so they are genuine regression locks rather than arms that only became reachable with the change. WHY PHYSICAL RESOLUTION IS THE SAFE DIRECTION: 'cd $dir && pwd' resolves symlinks to their targets, so a symlinked directory inside the project pointing outside resolves to the outside physical path and remains foreign — normalization cannot manufacture in-repo membership. Run: npx bats tests/hooks/bats/scope-guard.bats => 22/22; full bats => 407 ok, 0 not ok; full jest => 247/247, 3320/3320, exit 0."
    recorded_at: "2026-09-19T02:40:05.489Z"
    artifact_path: packages/caws-cli/tests/hooks/bats/scope-guard.bats
    commit_sha: "60460679"