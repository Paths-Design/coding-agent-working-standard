invariants:
  - 'Every corrected claim is re-derived from the installed CLI 12.2.0-rc.2, repo source, kernel schemas or workflow files at the landed revision; another doc repeating the claim is not confirmation.'
  - 'Point-in-time records keep their dates and explicit non-claims; a historical entry is not rewritten as current procedure.'
  - 'Every command example left in a strict-set consumer doc succeeds as printed against the installed CLI.'
acceptance:
  - id: A1
    given: 'docs checks run in CI through release-qualification docs:check'
    when: 'the corrections land'
    then: 'validate-docs.mjs runs inside docs:check and exits 0 for the strict set'
  - id: A2
    given: 'the front-matter standard document'
    when: 'compared to validate-docs.mjs'
    then: >-
      required fields include audience, the strict set description matches
      STRICT_SET, and the documented backlog matches --all output
  - id: A3
    given: 'a reader opens any of the six docs/api service specs'
    when: 'they read the file header'
    then: 'it states the spec is a never-implemented design and not the CAWS API'
  - id: A4
    given: 'a reader runs the command examples in the strict-set consumer guides'
    when: 'executed against the installed CLI'
    then: >-
      the commands succeed as printed: specs create with --mode and valid ids, claim
      ownership semantics, merge-only teardown, non-idempotent revoke
  - id: A5
    given: 'architecture and release docs'
    when: 'compared to live help, kernel schemas and workflow files'
    then: >-
      stale group counts, evidence types, command leaves, tag handling, file
      citations and statuses are corrected
  - id: A6
    given: 'a maintainer uses docs/README.md as the index'
    when: 'they follow it'
    then: 'docs/internal is described accurately and the omitted areas and files are listed'
  - id: A7
    given: 'a doc cites a test, script, release artefact or anchor as evidence'
    when: 'the cited path is resolved at the landed revision'
    then: 'the citation resolves, or the doc states the artefact is historical or unimplemented'
  - id: A8
    given: 'hook and machine-runtime docs'
    when: 'compared to the live dispatch chain and machine launcher'
    then: >-
      legacy project-pack layouts are labelled legacy and current system-runtime
      install paths are documented
non_functional: {}
