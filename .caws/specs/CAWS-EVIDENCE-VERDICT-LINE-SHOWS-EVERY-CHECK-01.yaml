id: CAWS-EVIDENCE-VERDICT-LINE-SHOWS-EVERY-CHECK-01
title: 'verify-acs, evidence --verify and the close advisory print one check per criterion and a [self-reported] tag on every row, so an executed test reads as a commit-only check'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-23T19:09:04.062Z'
updated_at: '2026-09-23T19:18:04.834Z'
