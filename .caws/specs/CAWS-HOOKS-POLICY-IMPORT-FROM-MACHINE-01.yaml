evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Arm 'two surfaces with identical policy collapse to one default entry' spawns the BUILT dist CLI (node dist/index.js hooks import --from-machine) against a scratch git repo plus an isolated CAWS_HOME holding the machine state file at state/projects/<sha256(realpath(repo))>.json. Fixture is the shape sterling actually carries: claude-code and codex with byte-identical extensions+handlers. Observed exit 0, stdout containing 'collapsed 2 identical surfaces', and Object.keys(policy.surfaces) === ['default'] with the extension's handler and before anchor intact. Control arm 'surfaces that DIFFER are kept apart rather than collapsed onto one' asserts the opposite for unlike surfaces (keys stay ['claude-code','codex'], no 'default'), so the collapse is not unconditional. This pair found a REAL defect during development: the provenance reason originally embedded the source surface name, which made two identical surfaces compare unequal and silently disabled the collapse; the fix stamps reasons after the destination is chosen and compares the machine input instead. Run: cd packages/caws-cli && npx jest tests/shell/hooks-mutating.test.js => 46/46; full suite at this sha => 247/247 suites, 3320/3320 tests, exit 0."
    recorded_at: "2026-09-19T02:25:55.452Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-mutating.test.js
    commit_sha: "8ca16514"
  - criterion_id: A2
    status: pass
    evidence_ref: "Two halves, deliberately at different layers. (a) The machine-state clear is asserted end-to-end in hooks-mutating.test.js 'two surfaces with identical policy collapse to one default entry': after the real CLI run, the state file is re-read and every migrated surface's disabled/extensions/handlers/libraries is {} — while the SURFACE ITSELF survives and root is unchanged, because emptying a surface's keys must not de-register the project from the machine runtime. (b) The splice-exactly-once claim is asserted in repo-hook-policy.test.js 'after a COMPLETE import the handler splices exactly once': resolveChain over the imported policy with a cleared machine tier yields exactly one occurrence of rg-replace-guard.sh, AND it sits immediately before its scope-guard.sh anchor — position, not mere membership, because a guard spliced elsewhere adjudicates against different state. A third arm pins that 'clear' lists only surfaces that actually carried overrides (a registered-but-empty codex surface is excluded), since the caller drives the second write off that list and a missing entry is a surface that stays populated and double-splices. Run: npx jest tests/shell/hooks-mutating.test.js tests/init/repo-hook-policy.test.js => 46/46 and 131/131; full suite => 247/247 suites, 3320/3320, exit 0."
    recorded_at: "2026-09-19T02:26:06.203Z"
    artifact_path: packages/caws-cli/tests/init/repo-hook-policy.test.js
    commit_sha: "8ca16514"
  - criterion_id: A3
    status: pass
    evidence_ref: "Arm 'when the machine clear did NOT happen, resolution REFUSES and names the handler' reconstructs the interrupted state exactly: policyImportFromMachine produces the repo policy, then resolveChain is called with the machine tier STILL carrying the same extensions and handlers. Observed resolved.ok === false with resolved.error containing both 'rg-replace-guard.sh' and 'already in the chain'. Its paired control is the A2 arm, which runs the identical fixture with the machine tier cleared and gets ok === true with exactly one occurrence — so the refusal is caused by the duplication and not by the fixture being unresolvable. NOT A NEW GUARD: resolveChain's cross-tier duplicate check already existed; this slice's contribution is CHOOSING the write order that fails into it. The repo policy is written first precisely because its failure mode is this loud refusal, whereas clearing machine state first would fail by dropping the override with nothing left to notice. The CLI's half-migrated message says the refusal is intended and names the file to finish by hand. NOT COVERED: no test injects a real mid-command filesystem failure between the two writes; the arm reconstructs the resulting state rather than producing it by interruption. Run: npx jest tests/init/repo-hook-policy.test.js => 131/131; full suite => 247/247, 3320/3320, exit 0."
    recorded_at: "2026-09-19T02:26:17.627Z"
    artifact_path: packages/caws-cli/tests/init/repo-hook-policy.test.js
    commit_sha: "8ca16514"