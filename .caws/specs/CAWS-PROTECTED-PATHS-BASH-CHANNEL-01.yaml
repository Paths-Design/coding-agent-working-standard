id: CAWS-PROTECTED-PATHS-BASH-CHANNEL-01
title: 'Protected hook paths are unguarded on the Bash channel'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-protected-bash
created_at: '2026-09-18T21:15:25.675Z'
updated_at: '2026-09-18T21:18:22.643Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'hooks/protected-paths'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/protected-paths.sh'
    - 'packages/caws-cli/tests/hooks/bats/protected-paths.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
  support:
    - packages/caws-cli/src/init/manifest-shared.ts
    - packages/caws-cli/templates/hook-packs/pack-fingerprints.json
invariants:
  - 'A protected path is protected on every write channel a harness exposes; a guard that keys on tool name rather than on the write itself leaves the unlisted channels open.'
  - 'The Bash arm must reuse the same protected-set matcher as the Write/Edit arm — two matchers for one resource diverge, and the permissive one becomes the bypass.'
acceptance:
  - id: A1
    given: 'an agent Bash command that redirects, seds, tees or removes a file under .caws/hooks/'
    when: 'protected-paths.sh adjudicates the PreToolUse payload'
    then: 'it blocks with exit 2, because the Write/Edit channel already refuses that same path'
  - id: A2
    given: 'a Bash command whose mutation targets are all outside every protected hooks directory'
    when: 'protected-paths.sh adjudicates it'
    then: 'it exits 0, so the new arm does not broaden refusal beyond the protected set'
  - id: A3
    given: 'a Bash command writing a *.md file under a protected hooks directory'
    when: 'protected-paths.sh adjudicates it'
    then: 'it exits 0, matching the Write/Edit docs-not-scripts carve-out on the same path'
non_functional: {}
contracts:
  - name: 'protected-paths-tool-parity'
    type: behavior
