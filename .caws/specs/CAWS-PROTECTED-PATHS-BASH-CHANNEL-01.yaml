id: CAWS-PROTECTED-PATHS-BASH-CHANNEL-01
title: 'Protected hook paths are unguarded on the Bash channel'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-protected-bash
created_at: '2026-09-18T21:15:25.675Z'
updated_at: '2026-09-18T21:21:25.511Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'hooks/protected-paths'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/protected-paths.sh'
    - 'packages/caws-cli/tests/hooks/bats/protected-paths.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
  support: []
invariants:
  - 'A protected path is protected on every write channel a harness exposes; a guard that keys on tool name rather than on the write itself leaves the unlisted channels open.'
  - 'The Bash arm must reuse the same protected-set matcher as the Write/Edit arm — two matchers for one resource diverge, and the permissive one becomes the bypass.'
acceptance:
  - id: A1
    given: 'an agent Bash command that redirects, seds, tees or removes a file under .caws/hooks/'
    when: 'protected-paths.sh adjudicates the PreToolUse payload'
    then: 'it blocks with exit 2, because the Write/Edit channel already refuses that same path'
  - id: A2
    given: 'a Bash command whose mutation targets are all outside every protected hooks directory'
    when: 'protected-paths.sh adjudicates it'
    then: 'it exits 0, so the new arm does not broaden refusal beyond the protected set'
  - id: A3
    given: 'a Bash command writing a *.md file under a protected hooks directory'
    when: 'protected-paths.sh adjudicates it'
    then: 'it exits 0, matching the Write/Edit docs-not-scripts carve-out on the same path'
non_functional: {}
contracts:
  - name: 'protected-paths-tool-parity'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "bats tests/hooks/bats/protected-paths.bats, three arms, all written RED first and observed failing with 'command succeeded, but it was expected to fail' before the fix: 'a shell redirect into a guard script under .caws/hooks/ is BLOCKED' (echo x > .caws/hooks/protected-paths.sh), 'an in-place sed of a guard script under the vendor hooks dir is BLOCKED' (sed -i s/exit/return/ .claude/hooks/scope-guard.sh), 'rm of a shared lib under .caws/hooks/lib/ is BLOCKED'. Each asserts exact status 2 (the only status the PreToolUse protocol treats as a block), not bare non-zero. Two further arms pin the design: a multi-operand sed naming README.md then protected-paths.sh still blocks (candidate order verified README.md-first, so the .md branch returning rather than exiting is what makes this pass), and a missing lib/bash-mutation-targets.sh fails CLOSED with exit 2. Full run: 17/17 ok, BATS_EXIT=0; whole hooks plane 301 ok / 0 not ok."
    recorded_at: "2026-09-18T21:27:51.808Z"
    command: npx bats tests/hooks/bats/protected-paths.bats
    exit_code: 0
    artifact_path: packages/caws-cli/tests/hooks/bats/protected-paths.bats
    commit_sha: "1220c0cd"
  - criterion_id: A2
    status: pass
    evidence_ref: "bats tests/hooks/bats/protected-paths.bats: 'a Bash mutation OUTSIDE every hooks dir is admitted' (echo x > src/index.ts) exits 0. This is the discrimination control for A1 — without it the A1 arms would pass even if the implementation blocked every Bash mutation regardless of path. Companion arm 'READING a guard script via Bash is admitted' (cat .claude/hooks/scope-guard.sh) pins that only mutations are protected; it was renamed from 'a non-Write/Edit tool is ignored' because after this change Bash no longer exits at the tool gate and the old name described behavior that no longer exists. A separate arm covers a tool that is neither Write, Edit nor Bash. Full run 17/17 ok, BATS_EXIT=0."
    recorded_at: "2026-09-18T21:28:05.820Z"
    command: npx bats tests/hooks/bats/protected-paths.bats
    exit_code: 0
    artifact_path: packages/caws-cli/tests/hooks/bats/protected-paths.bats
    commit_sha: "1220c0cd"
  - criterion_id: A3
    status: pass
    evidence_ref: "bats tests/hooks/bats/protected-paths.bats: 'a Bash write to a *.md under the hooks dir is admitted (docs-not-scripts parity)' (echo x > .caws/hooks/README.md) exits 0, matching the Write/Edit arms on the same path ('a *.md doc under .caws/hooks/ is still admitted', 'a *.md doc under .claude/hooks/ is ADMITTED'). Parity holds because both channels call one _protected_adjudicate over one matcher rather than each carrying its own path logic. The carve-out uses return 0, not exit 0, so a command naming a doc alongside a guard script is still adjudicated to completion — pinned by the multi-operand arm cited in A1. Full run 17/17 ok, BATS_EXIT=0."
