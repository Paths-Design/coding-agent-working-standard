id: CAWS-ADAPTER-STOP-BLOCK-UNBOUNDED-02
title: 'A repeatedly-blocking Stop handler has no budget, so a broken handler result still traps the session'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: adapter-stop-budget
created_at: '2026-09-19T03:03:41.343Z'
updated_at: '2026-10-05T03:34:56.292Z'
created_by_session: '34188473-6516-4d12-a4e5-df7ff5132232'
blast_radius:
  modules:
    - 'caws-cli/hook-runtime'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/runtime/caws-hook.py'
    - 'packages/caws-cli/tests/adapter/machine-runtime.test.js'
  out: []
invariants:
  - 'Bounding a Stop refusal must not convert it to silent success: the release states plainly that it is releasing an unmet condition, so the drop is auditable in the transcript.'
  - 'A Stop refusal that no actor can discharge - a malformed, unparseable or crashed handler result - is bounded: the adapter refuses it a finite number of consecutive times, then releases.'
  - 'A well-formed block from a guard whose condition the agent can satisfy (for example the goal-ac-gate Stop hook) is not consumed by this budget; bounding it would disarm a designed gate.'
acceptance:
  - id: A1
    given: 'a handler whose result is malformed on every stop'
    when: 'the session stops repeatedly'
    then: 'the adapter refuses at most N consecutive times and then releases with an explicit statement that it is releasing over an unmet condition'
  - id: A2
    given: 'the same handler after any successful stop'
    when: 'it next emits a malformed result'
    then: 'the consecutive counter has reset, so the budget is per-run of failures and not a lifetime cap'
  - id: A3
    given: >-
      a handler that returns a well-formed, legitimate Stop block (a guard whose
      condition is unmet but dischargeable)
    when: 'the session stops more than N consecutive times'
    then: 'every stop is still refused and the malformed-result counter is unchanged'
non_functional: {}
contracts:
  - name: 'stop-block-budget'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "At 46875fdb67ca0e451404739449c9051d7db6ab66 (templates/hook-packs/runtime/caws-hook.py, STOP_UNDELIVERABLE_BUDGET=3, counter at $CAWS_HOME/state/sessions/<sid>/stop-undeliverable.json): five consecutive malformed Stop results exit [2,2,2,0,2]; the three refusals carry decision:block, the 4th prints a systemMessage stating it releases over an unmet, undeliverable condition (also on stderr) and resets the counter. Break-the-fix (release disabled) failed with Expected 0, Received 2 at the 4th stop. Not observed in a native Claude/Codex session; the runtime needs caws init adapters install to take effect."
    recorded_at: "2026-10-05T04:56:07.151Z"
    test_nodeid: "packages/caws-cli/tests/adapter/machine-runtime.test.js::an undeliverable Stop result is refused a finite number of consecutive times, then released explicitly"
    commit_sha: "46875fdb67ca0e451404739449c9051d7db6ab66"
    test_verified_at: "46875fdb67ca0e451404739449c9051d7db6ab66"
  - criterion_id: A2
    status: pass
    evidence_ref: "At 46875fdb67ca0e451404739449c9051d7db6ab66: after two malformed stops the state is 2; an exit-0 Stop result sets it to 0, after which three fresh refusals precede a release (a lifetime cap would not). Break-the-fix (reset disabled) failed the state-0 assertion."
    recorded_at: "2026-10-05T04:56:37.347Z"
    test_nodeid: "packages/caws-cli/tests/adapter/machine-runtime.test.js::a successful Stop resets the consecutive counter so the budget is per run of failures"
    commit_sha: "46875fdb67ca0e451404739449c9051d7db6ab66"
    test_verified_at: "46875fdb67ca0e451404739449c9051d7db6ab66"
