  - id: A2
    given: 'the refresh applied'
    when: 'the hook tree is inspected'
    then: 'the six previously absent shared libs (bash-mutation-analysis.sh, copy-roles.sh, session-render-writer.sh, guard-config.cjs, reprieve-reader.cjs, advisory_truncate.cjs) exist and the telemetry rows are retained for co-installed surfaces'
  - id: A3
    given: 'the refreshed pack is merged into canonical'
    when: 'caws doctor runs'
    then: 'doctor.hooks.installed_pack_version_lag and doctor.hooks.pack_body_drift no longer fire for .caws/hooks'
