id: CAWS-GUARD-REMEDIATION-CROSS-REPO-CONSISTENCY-01
title: 'A guard''s remediation may not name a route a sibling guard refuses: block-dangerous must not offer the script-file route for a cross-repo write'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-remediation-xrepo
created_at: '2026-09-19T04:55:04.541Z'
updated_at: '2026-09-19T04:55:27.042Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'hook pack shared guards (block-dangerous, bash-write-guard, lib/bash-mutation-targets)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/bash-write-guard.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/bash-mutation-targets.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/bats/block-dangerous.bats'
    - 'packages/caws-cli/tests/hooks/bash-write-guard-interpreter-cross-repo.test.js'
    - 'packages/caws-cli/tests/hooks/block-dangerous-cross-repo-remediation.test.js'
  out: []
invariants:
  - 'A remediation printed by one guard must not name a route a sibling guard refuses; when the payload carries a detectable cross-repo write target, the script-file route is not printed at all.'
  - 'The cross-repo predicate has ONE implementation shared by every guard that adjudicates it, so two guards cannot disagree about what is foreign.'
  - 'The general remediation text is correct even when the detector is blind: routing a write through a script file never reaches a target the direct write could not.'
  - 'A missing or unloadable shared lib must not cause the harmful sentence to print; the conservative remediation is the fallback, and the block still fires.'
acceptance:
  - id: A1
    given: 'an opaque python3 -c payload whose write target is a path inside a SIBLING git repository'
    when: 'block-dangerous refuses it'
    then: 'the refusal names the sibling repo and does NOT contain the ''write the probe to a script file ... and run it by path'' option'
  - id: A2
    given: 'an opaque node -e payload whose only paths are inside THIS repo or /tmp'
    when: 'block-dangerous refuses it'
    then: 'the script-file option is still offered, so the narrowing is targeted rather than a blanket removal'
  - id: A3
    given: 'an opaque payload that only READS from a sibling repo (no write verb)'
    when: 'block-dangerous refuses it for opacity'
    then: 'the script-file option is still offered, because a cross-repo read is not a refused route'
  - id: A4
    given: 'the general (non-cross-repo) remediation'
    when: 'it is printed'
    then: 'it states that a script file''s write targets are adjudicated exactly as a direct write, so the route cannot reach a target the direct write could not'
  - id: A5
    given: 'lib/bash-mutation-targets.sh is missing or fails to load'
    when: 'block-dangerous refuses an opaque payload'
    then: 'the command is still blocked and the script-file option is NOT printed (fail toward the conservative text)'
  - id: A6
    given: 'the extracted shared detector'
    when: 'bash-write-guard adjudicates the interpreter cross-repo cases it already covered'
    then: 'every existing decision is unchanged, proving the extraction is behavior-preserving'
non_functional: {}
contracts:
  - name: 'cross-repo-remediation-consistency'
    type: behavior
  - name: 'shared-cross-repo-detector'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "bats B1 in packages/caws-cli/tests/hooks/bats/block-dangerous.bats: a python3 -c payload writing to a path in a SIBLING git repo is refused, the refusal names that repo root, and asserts the absence of 'run it by path'. Asserted-failing baseline established before the fix: B1 reported 'not ok' against the pre-fix guard; after the change it reports 'ok 1'. Run: cd packages/caws-cli && npx bats tests/hooks/bats/block-dangerous.bats (exit 0, zero 'not ok' lines across the full 417-test bats sweep)."
    recorded_at: "2026-09-19T05:23:51.296Z"
    commit_sha: "14d0ffe19126e71e83e9da68b4115a4d92f20de3"
  - criterion_id: A2
    status: pass
    evidence_ref: "bats B2 (must-stay-legal counterweight): a node -e payload whose only write paths are inside THIS repo and /tmp is still refused for opacity AND still prints the script-file option. B2 was 'ok' in the pre-fix baseline and stays 'ok' after, which is the point: it proves the change is a targeted narrowing, not a blanket removal of the remediation. Run: npx bats tests/hooks/bats/block-dangerous.bats."
    recorded_at: "2026-09-19T05:24:01.205Z"
    commit_sha: "14d0ffe19126e71e83e9da68b4115a4d92f20de3"
  - criterion_id: A3
    status: pass
    evidence_ref: "bats B3 (discriminating pair with B1): the SAME sibling-repo path, but the payload only READS it (open().read(), no write verb). Still refused for opacity, and the script-file option IS still printed, because a cross-repo read is not a route any sibling guard refuses. B3 was 'ok' pre-fix and stays 'ok'. Together B1/B3 prove the suppression keys on the write-verb co-occurrence predicate in caws_bash_interpreter_write_literals, not on the mere presence of a foreign path."
    recorded_at: "2026-09-19T05:24:10.987Z"
    commit_sha: "14d0ffe19126e71e83e9da68b4115a4d92f20de3"
  - criterion_id: A4
    status: pass
    evidence_ref: "bats B4: the general remediation now asserts 'adjudicated exactly as a direct write'. Asserted-failing baseline: B4 reported 'not ok' pre-fix and its diff printed the old sentence verbatim — '(1) write the probe to a script file in your scope (e.g. a .py or .js file) and run it by path' — with no adjudication clause, i.e. text that reads as a route with different reach. After the change B4 is 'ok 4'. The corrected clause states the route makes the payload reviewable and does not reach anywhere a direct write could not."
    recorded_at: "2026-09-19T05:24:21.433Z"
    commit_sha: "14d0ffe19126e71e83e9da68b4115a4d92f20de3"
  - criterion_id: A5
    status: pass
    evidence_ref: "bats B5 (fail-direction test): with lib/bash-mutation-targets.sh removed from the installed pack copy, block-dangerous STILL blocks the opaque payload, prints that the detector could not load and that it will not suggest a rewrite that might reach across repos, and does NOT print the script-file option. B5 reported 'not ok' pre-fix (the old code printed the harmful sentence unconditionally) and is 'ok 5' after. Separately, bash-write-guard gained a per-function declare -F check so a lib that LOADS but predates caws_foreign_repo_root / caws_bash_interpreter_write_literals exits 2 with a block rather than silently losing its cross-repo arm."
    recorded_at: "2026-09-19T05:24:31.860Z"
    commit_sha: "14d0ffe19126e71e83e9da68b4115a4d92f20de3"