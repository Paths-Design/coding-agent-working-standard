invariants:
  - 'The kernel classifies; the store observes. Every comparison needing filesystem or template access (the shipped pack version, the rendered template body, the compiled chain bytes) is computed in the store and passed to the kernel as plain data, so the kernel keeps no I/O and no dependency on src/init.'
  - 'An absent hook-policy.json is silent, never a finding. A repo that has not opted in is not in a degraded state, and a doctor that complains about it trains its readers to ignore it.'
  - 'A document doctor cannot parse is reported as invalid rather than treated as empty. Treating an unreadable policy as absent would report a repo as healthy at the exact moment its guard plane is failing closed on every tool call.'
  - 'Fork lag is reported at the severity the evidence supports: a fork whose upstream has NOT moved is informational (a standing, discharged decision), and only a fork whose upstream HAS moved is a warning (an outstanding retrofit). Reporting every fork as a warning would make the signal unreadable, which is how the pre-existing inversion survived.'
acceptance:
  - id: A1
    given: 'a repo whose hook-policy.json records a fork of a shared-pack handler at a pack_version behind the shipping SHARED_PACK_VERSION'
    when: 'caws doctor runs'
    then: 'a doctor.hooks.repo_policy_fork_lag finding names the handler, the recorded pack version, the shipping version and the distance, and its data payload carries them as fields rather than only in prose'
  - id: A2
    given: 'a fork recorded at the CURRENT pack version whose shipped template body is unchanged since it was taken'
    when: 'caws doctor runs'
    then: 'the fork is reported at info severity, or not at all, and never as a warning — so the warning in A1 discriminates rather than firing on every recorded fork'
  - id: A3
    given: 'a repo with a compiled dispatch/<event>.chain whose bytes disagree with what the current policy and installed dispatcher would compile'
    when: 'caws doctor runs'
    then: 'a doctor.hooks.repo_policy_chain_stale finding names each stale event and prescribes caws hooks compile, and a repo whose chains are current produces no such finding'
  - id: A4
    given: 'a hook-policy.json that is unparseable, or valid JSON that the repo-policy validator rejects (an over-authority floor entry, an unknown key)'
    when: 'caws doctor runs'
    then: 'a doctor.hooks.repo_policy_invalid finding fires at error severity carrying the validator message, and doctor does NOT also report the repo as having no policy'
  - id: A5
    given: 'a repo still carrying the superseded .caws/hooks/adapter-policy.json'
    when: 'caws doctor runs'
    then: 'a doctor.hooks.legacy_adapter_policy finding names the file and points at the hook-policy.json replacement, and a repo without that file produces no such finding'
  - id: A6
    given: 'a repo with no .caws/hooks/hook-policy.json at all'
    when: 'caws doctor runs'
    then: 'none of the four rules fire, and the doctor findings are byte-identical to the same repo before this slice existed'
non_functional:
  reliability:
    - 'Every new observation is optional in the snapshot type: an unreadable or absent input yields undefined (unobserved, silent) rather than a synthesized zero value, so a collection failure can never present as a clean verdict.'
    - 'Collection is best-effort and never throws into doctor: a malformed policy, a missing dispatch directory or an unreadable template degrades that one observation, leaving the other doctor findings intact.'
contracts:
  - name: 'doctor.hooks repo-policy finding ids and data payloads'
    type: schema
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "A1 fork lag names handler, recorded pack version, shipping version and distance, in DATA not only prose. Kernel arm 'A1: a fork behind the shipping pack with a moved upstream warns, naming versions and distance in DATA not only prose' asserts message contains 'shared@67' / 'shipping 83' / '16 behind' AND data.forks[0] carries recorded_pack_version:67, shipping_pack_version:83, distance:16. Store arm 'A1: a fork recording a STALE sha256 reports upstreamChange=true with the real shipping version' measures against the REAL shipped scope-guard.sh bytes via shippedHandlerProvenance. Rendered live: the end-to-end arm asserts the real caws doctor binary prints 'doctor.hooks.repo_policy_fork_lag' and 'shared@67'. Run: cd packages/caws-cli && npx jest tests/kernel/unit/doctor-repo-hook-policy.test.ts tests/store/doctor-snapshot-repo-hook-policy.test.js => 39 passed. Mutation: filtering on upstreamChange !== undefined broke 3 kernel arms; measuring by pack_version instead of sha256 broke the store discriminator arm."
    recorded_at: "2026-09-19T00:27:55.836Z"
    artifact_path: packages/caws-cli/tests/kernel/unit/doctor-repo-hook-policy.test.ts
    commit_sha: "18e80d74"
  - criterion_id: A2
    status: pass
    evidence_ref: "A2 a current fork is never a warning, so the A1 warning discriminates. inspect.ts filters movedForks on upstreamChange === true, so a fork whose upstream has not moved fires nothing at all (A2 permits 'info severity, or not at all'). Kernel arms: 'A2: a fork at the CURRENT pack whose upstream body is unchanged is NOT a warning'; 'A2: the discriminator is the MOVED BODY, not the version distance — a stale version with an unmoved body stays silent' (recorded at pack 67 vs shipping 83, still silent); 'mixed forks: only the moved ones are named' (3 forks in, fork_count 2 out); 'a fork whose shipped counterpart could not be measured is UNOBSERVED'. Store arm 'A2: the version number is NOT the discriminator' records the REAL current scope-guard.sh sha256 at pack_version 67 and asserts upstreamChange===false. Run: npx jest tests/kernel/unit/doctor-repo-hook-policy.test.ts tests/store/doctor-snapshot-repo-hook-policy.test.js => 39 passed."
    recorded_at: "2026-09-19T00:28:17.175Z"
    artifact_path: packages/caws-cli/tests/kernel/unit/doctor-repo-hook-policy.test.ts
    commit_sha: "18e80d74"
  - criterion_id: A3
    status: pass
    evidence_ref: "A3 chain staleness names each stale event, prescribes caws hooks compile, and is silent when current. Measured through checkCompiledChains — the SAME comparator caws hooks compile and compile --check use, extracted into hook-chain.ts precisely so doctor cannot disagree with them. Store arms over REAL shipped dispatchers copied into a fixture: 'freshly compiled sidecars report NO stale chains' (the silence half); 'a policy with NO compiled sidecar at all reports every installed event stale' (reason 'no compiled chain on disk'); 'editing the policy after compiling makes the sidecar stale' (reason 'compiled against a different hook-policy.json'; every sidecar goes stale because the header records the whole-document digest); 'a HAND-EDITED sidecar whose header still matches is caught by the body comparison' (reason 'compiled chain body differs from the current policy' — the case a digest-only check would call fresh); 'an event with no installed dispatcher is not reported'. Kernel arms assert severity warning, narrowRepair contains 'caws hooks compile', data.stale_events carries event+reason, and the message names all five project-wired surfaces. Rendered live: the end-to-end arm asserts the real caws doctor binary prints 'doctor.hooks.repo_policy_chain_stale'. Run: npx jest tests/kernel/unit/doctor-repo-hook-policy.test.ts tests/store/doctor-snapshot-repo-hook-policy.test.js => 39 passed."
    recorded_at: "2026-09-19T00:28:19.699Z"
    artifact_path: packages/caws-cli/tests/store/doctor-snapshot-repo-hook-policy.test.js
    commit_sha: "18e80d74"
  - criterion_id: A4
    status: pass
    evidence_ref: "A4 an invalid policy fires at ERROR carrying the validator message, and doctor does NOT also report the repo as policy-free. The observation type has no 'absent' variant by construction: absence is the snapshot field being undefined, invalidity is kind:'invalid'. Kernel arms: 'an invalid document is an ERROR carrying the validator message' (severity error, message and data.error carry the text, narrowRepair names caws hooks validate); 'an invalid document does NOT also report the repo as policy-free: no fork or chain finding rides along'; 'the message states the fail-closed consequence'. Store arms distinguish the two rejection routes: 'A4: unparseable JSON observes invalid' (truncated '{ \"version\": 1, ') and 'A4: valid JSON the VALIDATOR rejects is invalid too' (disabling protected-paths.sh, a REPO_POLICY_FLOOR handler — error names the handler). Mutation: making the ENOENT branch return an empty valid observation broke 'A6: a repo with no hook-policy.json observes UNDEFINED' and the A5 independence arm, proving absent and invalid are not collapsed. Consequence recorded: because doctor exits 1 when any error-severity finding exists (doctor.ts 'return hasErrors ? 1 : 0'), an unparseable hook-policy.json now makes caws doctor exit 1 — intended, since the launcher is fail-closed on the same file. Rendered live: the end-to-end arm flips one variable (policy becomes '{ oops') and asserts the real binary prints doctor.hooks.repo_policy_invalid while repo_policy_fork_lag and repo_policy_chain_stale disappear. Run: npx jest tests/kernel/unit/doctor-repo-hook-policy.test.ts tests/store/doctor-snapshot-repo-hook-policy.test.js => 39 passed."
    recorded_at: "2026-09-19T00:28:39.739Z"
