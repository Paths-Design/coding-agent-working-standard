id: CAWS-DOCTOR-FORK-LAG-UPSTREAM-MOVED-01
title: 'A guard fork whose upstream moved must not silence the pack-lag warning'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-18T20:57:12.631Z'
updated_at: '2026-09-18T20:57:12.631Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'kernel/doctor'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/kernel/doctor/inspect.ts'
    - 'packages/caws-cli/tests/kernel/unit/doctor-hook-growth-classification.test.ts'
  out: []
invariants:
  - 'Forking a guard must never silence the signal that the guard is stale: local growth explains a pack-version lag only while the upstream template it forked from has not moved.'
  - 'Severity is derived from the recorded drift observation, never from the absence of one — an unobserved or baseline-less row keeps the warning.'
acceptance:
  - id: A1
    given: 'a drift row that is baseline-verified local growth whose upstream template ALSO moved since the baseline was recorded'
    when: 'doctor classifies doctor.hooks.installed_pack_version_lag'
    then: 'the finding is warning, because the retrofit is genuinely owed'
  - id: A2
    given: 'every drift row is baseline-verified local growth whose upstream template has NOT moved'
    when: 'doctor classifies the lag'
    then: 'the finding stays info, because refreshing would destroy repo-owned growth and nothing is owed'
  - id: A3
    given: 'a lag finding that is not fully explained by growth'
    when: 'the finding data payload is read'
    then: 'it reports how many drifted rows carry upstream movement, so the operator can see why the lag is not explained'
non_functional: {}
contracts:
  - name: 'doctor-lag-severity'
    type: behavior
