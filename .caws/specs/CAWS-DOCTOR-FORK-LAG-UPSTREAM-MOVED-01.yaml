id: CAWS-DOCTOR-FORK-LAG-UPSTREAM-MOVED-01
title: 'A guard fork whose upstream moved must not silence the pack-lag warning'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-doctor-fork-lag
created_at: '2026-09-18T20:57:12.631Z'
updated_at: '2026-09-18T20:58:45.848Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'kernel/doctor'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/kernel/doctor/inspect.ts'
    - 'packages/caws-cli/tests/kernel/unit/doctor-hook-growth-classification.test.ts'
    - packages/caws-cli/src/kernel/doctor/rules.ts
  out: []
invariants:
  - 'Forking a guard must never silence the signal that the guard is stale: local growth explains a pack-version lag only while the upstream template it forked from has not moved.'
  - 'Severity is derived from the recorded drift observation, never from the absence of one — an unobserved or baseline-less row keeps the warning.'
acceptance:
  - id: A1
    given: 'a drift row that is baseline-verified local growth whose upstream template ALSO moved since the baseline was recorded'
    when: 'doctor classifies doctor.hooks.installed_pack_version_lag'
    then: 'the finding is warning, because the retrofit is genuinely owed'
  - id: A2
    given: 'every drift row is baseline-verified local growth whose upstream template has NOT moved'
    when: 'doctor classifies the lag'
    then: 'the finding stays info, because refreshing would destroy repo-owned growth and nothing is owed'
  - id: A3
    given: 'a repo with forked hook files whose upstream templates have moved'
    when: 'the fork finding''s data payload and remediation are read'
    then: >-
      it names how many files are affected and which ones, and its repair prescribes
      the three-way port while explicitly prohibiting caws init --overwrite --force,
      because that refresh discards the growth
non_functional: {}
contracts:
  - name: 'doctor-lag-severity'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: KEEP
    recorded_at: "2026-09-18T21:06:31.094Z"
    test_nodeid: packages/caws-cli/tests/kernel/unit/doctor-hook-growth-classification.test.ts
  - criterion_id: A2
    status: pass
    evidence_ref: "A6b is the discrimination control: two growth rows with upstreamChange false produce NO pack_fork_upstream_moved finding and summary.warnings === 0. A6c separates the adjacent class: a row with upstreamChange true but localGrowth false (an un-edited stale copy) is reported as pack_body_drift warning and NOT as a fork. A3 (fixture corrected to pure growth) still pins that the version lag stays info at 0 warnings. PROOF THE CONTROL IS NOT VACUOUS: mutating the fire condition from 'upstreamAlso.length > 0' to 'growthPaths.length > 0' in inspect.ts was killed by exactly A6b and A3 (2 failed, 6 passed); the mutation was reverted and 99/99 across 12 doctor suites pass. Note A6b/A6c also passed BEFORE the rule existed, vacuously -- the mutation run is what establishes they now discriminate."
    recorded_at: "2026-09-18T21:06:00.520Z"
    test_nodeid: tests/kernel/unit/doctor-hook-growth-classification.test.ts
    command: npx jest tests/kernel/unit/doctor
    exit_code: 0
    commit_sha: "136798d1"
  - criterion_id: A3
    status: pass
    evidence_ref: "Data payload: A6 asserts fork_count 2 and fork_paths listing exactly the upstream-moved files. Remediation: A6 asserts narrowRepair contains 'caws init port' AND matches /Do NOT run `caws init --overwrite --force`/ -- the prohibition is asserted positively rather than by absence, because silence would leave the operator free to reach for the destructive refresh anyway. Verbatim from the live run against sterling: 'repair: Discharge with a three-way port, never a refresh: `caws init diff` to read each delta, then `caws init port <path> --from <staging-file>` to land the upstream change on top of your growth and re-baseline. Do NOT run `caws init --overwrite --force` for these paths -- it discards the local growth instead of reconciling it.' AC AMENDED during implementation: originally it named the version-lag finding's data payload. Escalating that rule would have routed forks into its warning branch, whose remediation prescribes the destructive --overwrite --force; the obligation therefore got its own rule and the payload requirement moved with it. Rationale recorded verbatim on the spec_body_amended event."
    recorded_at: "2026-09-18T21:06:11.571Z"
    test_nodeid: tests/kernel/unit/doctor-hook-growth-classification.test.ts
    command: node dist/index.js doctor
    exit_code: 0
    commit_sha: "136798d1"