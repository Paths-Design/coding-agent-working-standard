id: CAWS-NATIVE-SUBSTITUTION-PRECEDENCE-001
title: 'Preserve command-substitution enforcement precedence'
mode: fix
lifecycle_state: draft
created_at: '2026-10-19T11:28:58.875Z'
updated_at: '2026-10-19T11:28:58.875Z'
created_by_session: '01a153d4-2936-7bd0-9460-6a001aa5e0bf'
blast_radius:
  modules:
    - 'Typed shell classifier execution-proof and substitution aggregation'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/runtime/classifier/index.ts'
    - 'packages/caws-cli/tests/runtime/classifier.test.js'
  out: []
invariants:
  - 'Executing command substitutions retain baseline precedence over ordinary segment findings while receiving their own statement-specific directory and Git proof.'
  - 'First equal-strength ordinary findings remain stable; this slice does not change Python fallback policy or inherited direct-command advisory masking.'
acceptance:
  - id: A1
    given: 'an earlier advisory and a later executing capability-risk substitution'
    when: 'the typed classifier evaluates either statement order'
    then: 'it returns the substitution capability confirmation while inert quoted and escaped text stays nonexecuting.'
  - id: A2
    given: 'directory-changing statements or wrappers before executing substitutions'
    when: 'substitution classification needs checkout or deletion exemptions'
    then: 'it cannot borrow the original checkout proof and independent catastrophic denial is retained.'
  - id: A3
    given: 'ordinary findings or substitution findings of equal decision strength'
    when: 'the classifier combines them'
    then: 'the first equal finding retains its source reason and enforcement outside the repaired precedence boundary.'
observability:
  - 'Focused classifier tests assert semantic decision source enforcement and proof-sensitive Git calls; retained red and green outputs identify revision and command.'
rollback:
  - 'Revert the logical classifier and regression-test commit through an ordinary new commit; preserve retained failing evidence and parent integration obligations.'
non_functional:
  security:
    - 'Do not execute supplied shell text or authorize a guard action through test fixtures; use read-only classifier ports and disposable Git fixtures.'
contracts:
  - name: 'substitution-precedence'
    type: behavior
