invariants:
  - >-
    THE LANE IS THE AUTHORITY UNIT. Provenance is recorded per lane (spec +
    worktree binding), never per session. A lane legitimately spans multiple
    sessions (authorized --takeover writes prior_owners); commits authored by
    any session in the lane's ownership chain are attributable to the lane.
    Session ids remain operational metadata (who to ask), never the
    provenance key.
  - >-
    MERGE IS THE SINGLE GOVERNED LANDING DOOR. Provenance teeth live inside
    mergeWorktree, evaluated BEFORE the merge-tree/commit-tree/update-ref CAS
    sequence begins. A refused merge mutates nothing: no ref updates, no
    events, no registry or spec changes (unreferenced objects created before
    a refusal are GC-able garbage, same as today's interrupted-merge
    posture).
  - >-
    INDUCTION AT PUBLISH, O(DELTA). Trunk correctness is inductive: every
    trunk commit arrived via a governed merge (worktree_merged event), a
    recognized CLI bookkeeping shape, or a human-acknowledged exception.
    Prepush verifies the induction over the outgoing delta against
    events.jsonl plus DURABLE ack state; it never re-adjudicates the full
    range per attempt and never demands re-acknowledgment of previously
    acknowledged SHAs. A moving trunk costs a scan of the new commits only.
  - >-
    EVENTS ARE THE PROVENANCE LEDGER. The worktree_merged event data gains
    the lane's contributed commit range (explicit lane tip / range) as an
    ADDITIVE schema extension — consumers that predate the field are
    unaffected. events.jsonl remains append-only via appendEvent; no
    hand-edits, no retrofitting of historical events (publish derives ranges
    for pre-extension merges from the merge commit's parents instead).
  - >-
    BOOKKEEPING RECOGNIZED BY SHAPE, NOT ACTOR. CLI auto-commits classify by
    their conventional shape — `chore(caws): ` subject AND a path set
    confined to governed state files (.caws/specs, .caws/waivers,
    worktrees.json, events metadata) — never by who invoked the CLI. A
    hand-forged lookalike that touches non-governed paths is not bookkeeping.
  - >-
    TOOLCHAIN FAULTS DEGRADE TO ADVISORY. An unreadable events ledger, an
    underivable merge range, or a git failure never fabricates a refusal —
    matching the guard doctrine that a toolchain fault must not block. The
    ONLY refusal classes are (a) a positively unvetted direct-on-trunk
    commit and (b) an ERROR-severity foreign worktree AFTER liveness pruning
    via the agents substrate (ghost registrations — dead session, fully
    merged branch, closed spec — do not escalate).
  - >-
    DOCTRINE SYNC IN THE SAME CHANGE. caws-vnext-command-surface.md,
    AGENTS.md, and the caws-cli README's prepush descriptions are updated
    alongside the code so the doctrine doc never describes the old refusal
    semantics after the cutover.
acceptance:
  - id: A1
    given: >-
      A bound worktree whose branch contains only commits attributable to
      the lane (within the spec's scope and the lane's ownership chain).
    when: >-
      `caws worktree merge <name>` runs.
    then: >-
      the merge lands AND the appended worktree_merged event data records
      the lane's contributed commit range explicitly, so publish never needs
      to re-derive provenance from merge parents for post-extension merges.
  - id: A2
    given: >-
      A lane branch containing at least one commit NOT attributable to the
      lane (e.g. work committed in the wrong worktree, or unrelated upstream
      dirt swept into the branch).
    when: >-
      `caws worktree merge <name>` runs.
    then: >-
      it refuses BEFORE the CAS sequence, names the offending commit(s),
      and writes nothing: no ref update, no events, no registry/spec
      mutation. Remediation guidance names the offending commits and the
      lane they belong to (when derivable).
  - id: A3
    given: >-
      An outgoing range (origin/main..HEAD) in which every commit is covered
      by a worktree_merged event or a recognized bookkeeping shape — the
      normal multi-agent trunk-publish case.
    when: >-
      `caws prepush` runs from canonical main with no --ack flags.
    then: >-
      it exits 0 with the per-commit classification report as ADVISORY
      output. No acknowledgment is required for governed commits.
  - id: A4
    given: >-
      An outgoing range containing a direct-on-trunk commit that matches no
      worktree_merged event and no recognized bookkeeping shape.
    when: >-
      `caws prepush` runs.
    then: >-
      it refuses (exit 1) naming EXACTLY the unvetted commit(s); all
      governed commits in the same range are advisory, not co-refused.
  - id: A5
    given: >-
      An unvetted direct commit the operator has acknowledged, recorded in
      durable ack state, and a NEW commit landing on trunk afterwards (the
      observed moving-target case).
    when: >-
      prepush re-runs.
    then: >-
      the previously acknowledged SHA stays acknowledged; only the new
      unclassified commit(s) demand a decision. Ack state survives across
      invocations and sessions.
  - id: A6
    given: >-
      An operator passing a full 40-character SHA to --ack (the natural
      output of `git rev-list`).
    when: >-
      prepush classifies the range.
    then: >-
      the acknowledgment matches (prefix/normalized comparison against the
      stored 12-char form). A full-SHA ack is never silently ignored, and an
      unmatched ack produces a diagnostic naming it.
  - id: A7
    given: >-
      A registered worktree whose owner session is dead per the
      agents-liveness substrate and whose branch is fully merged into its
      base (the wt-merge-notes ghost shape).
    when: >-
      prepush evaluates foreign worktrees.
    then: >-
      it does NOT escalate to ERROR; the ghost is reported as advisory with
      remediation (`caws worktree destroy` / `agents prune` guidance). Only
      a genuinely live foreign worktree with unmerged outgoing commits can
      reach ERROR severity.
  - id: A8
    given: >-
      A lane whose ownership changed hands via authorized --takeover, so its
      branch carries commits from two sessions recorded in prior_owners.
    when: >-
      the merge-time provenance check runs.
    then: >-
      commits from BOTH sessions are attributable to the lane; the check
      consults the lane's full ownership chain, never a single session id.
non_functional: {}
contracts:
