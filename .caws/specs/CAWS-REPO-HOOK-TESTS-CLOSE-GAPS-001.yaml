id: CAWS-REPO-HOOK-TESTS-CLOSE-GAPS-001
title: 'Close the three mechanically-checkable gaps the hook suite declared: real lock contention, pre-push end to end, and prepare repairing a wrong core.hooksPath'
risk_tier: 3
mode: chore
lifecycle_state: active
worktree: wt-hook-test-gaps
created_at: '2026-09-16T06:00:28.191Z'
updated_at: '2026-09-16T06:00:55.374Z'
created_by_session: '0d83351d-d384-4100-8148-a3f40dbc6b7a'
blast_radius:
  modules:
    - '.husky/tests/run.sh — the hook suite''s own verification coverage'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'TODO: list the file(s) or directories this spec authorizes.'
    - .husky/tests/run.sh
    - .husky/README.md
  out: []
invariants:
  - 'A declared verification gap is an obligation, not a disclaimer: if the check is mechanically cheap, it gets written rather than documented away.'
  - 'A test that needs a wrong value to prove a repair must produce that wrong value in a redirected scratch location, never in shared repository state that concurrent sessions depend on.'
acceptance:
  - id: A1
    given: 'several OS processes starting at the same moment against one free lock'
    when: 'each calls caws_prepush_lock_acquire'
    then: >-
      exactly one acquires it and the rest are refused, proving mutual exclusion
      under real concurrency rather than sequential calls
  - id: A2
    given: 'the real .husky/pre-push with its four heavy stage commands stubbed on PATH'
    when: 'it runs to completion, and separately when one stage fails'
    then: >-
      it takes and releases the lock, runs all four stages in order, exits 0 on
      success and 1 on a failing stage
  - id: A3
    given: >-
      a git config whose core.hooksPath holds a wrong value, in a scratch GIT_DIR so
      the shared repository config is never touched
    when: 'the root prepare command runs against it'
    then: 'core.hooksPath reads .husky afterwards, proving repair and not merely idempotence'
non_functional: {}
contracts: []
