id: CAWS-SCANNER-SUBPROCESS-COST-001
title: 'Preserve secret advisories without per-line subprocess fanout'
mode: fix
lifecycle_state: draft
created_at: '2026-10-28T11:37:59.383Z'
updated_at: '2026-10-28T11:37:59.383Z'
created_by_session: '01a171b1-ff30-7782-9755-aa02c6c6a3ae'
blast_radius:
  modules:
    - 'Shared secret advisory scanner and installed hook pack identity'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/scan-secrets.sh'
    - 'packages/caws-cli/tests/hooks/bats/scan-secrets.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
invariants:
  - 'Preserve line order, category order, repeated advisory hits, redaction, input selection, shell option behavior and advisory-only authority; retain original callback deadline.'
acceptance:
  - id: A1
    given: 'Write/Edit content or an existing-file patch target with synthetic matching and near-miss patterns'
    when: 'the installed scanner executes including Bash 3.2 and nocasematch'
    then: 'advisory output matches the prior scanner semantics without exposing token values'
  - id: A2
    given: 'a clean or matching file ranging from one to 5301 lines'
    when: 'the scanner evaluates it'
    then: >-
      scanner regex evaluation does not launch per-line external grep processes and
      still finds a matching final line
  - id: A3
    given: 'the updated scanner package'
    when: 'pack checks and integration review run'
    then: >-
      the shared pack version and fingerprint identify the changed bytes while
      historical reference pins remain unchanged
non_functional: {}
contracts: []
