      empty output.
  - id: A10
    given: >-
      governed repositories with real linked worktrees s-wt and f-wt owned by
      different sessions, one of them with the s-wt admin directory removed, a git
      on PATH that exits 1 for every call, a project directory nested inside s-wt,
