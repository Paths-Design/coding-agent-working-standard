id: CAWS-DEFECT-REALPATH-PYTHON-ABSENT-FAIL-OPEN-01
title: 'Write guards compare unresolved paths when python3 is absent or fails: _realpath falls back to identity and worktree-write-guard admits foreign-worktree writes'
