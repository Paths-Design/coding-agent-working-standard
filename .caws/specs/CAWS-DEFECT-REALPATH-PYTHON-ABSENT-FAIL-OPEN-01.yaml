id: CAWS-DEFECT-REALPATH-PYTHON-ABSENT-FAIL-OPEN-01
title: 'Write guards compare unresolved paths when python3 is absent or fails: _realpath falls back to identity and worktree-write-guard admits foreign-worktree writes'
mode: fix
lifecycle_state: active
created_at: '2026-10-21T23:16:20.828Z'
updated_at: '2026-10-22T16:14:03.637Z'
created_by_session: 'c4c0f2e0-cb0c-4380-a9c4-7daeb8f35885'
blast_radius:
  modules:
    - 'hook-packs shared: lib/caws-state.sh _realpath and its write-guard consumers (worktree-write-guard.sh, bash-write-guard.sh)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/caws-state.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/worktree-write-guard.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/bash-write-guard.sh'
    - packages/caws-cli/tests/hooks/bats/guard-realpath-python-absent.bats
  out: []
invariants:
  - 'A write guard that cannot resolve a path fails CLOSED with exit 2 and a diagnostic. It never compares an unresolved string (same doctrine as worktree-write-guard.sh:42-46, CAWS-HOOK-SOURCE-GUARD-FAIL-SOFT-001). Both guards run set -euo pipefail and PreToolUse exit 1 is non-blocking, so a resolver failure must surface as exit 2 at every call site, never as an unhandled status 1.'
  - 'Runtime-established baseline, retained as evidence: run-01 (~/.claude/artifacts/c4c0f2e0-cb0c-4380-a9c4-7daeb8f35885/realpath-v2/run-01, fixture sha256 57baadbb) ran the SELECTED runtime 408c06a7 worktree-write-guard.sh (52fe31cd) directly. A Write into a foreign-owned worktree payload from a real linked worktree exits 2 BLOCKED with python3 present. The owner-self control exits 0. With a failing python3 shim and with python3 absent, it exits 0 with empty output. The target stayed absent throughout. HOOK_* was precomputed so parse-input never ran python3. Attribution to _realpath is by elimination, not instrumentation. Receipt gaps: argv/env are transcript-derived, and the mktemp paths, bats PATH and per-process env were not captured. Not exercised: the dispatcher, the native harness, a real harness write.'
  - 'Source trace (992a19d0 and selected runtime 408c06a7, identical lib/caws-state.sh sha256 2d27e94f): _realpath (caws-state.sh:205-215) prints its input unchanged when python3 is absent or exits nonzero. In any linked worktree, worktree-write-guard.sh:124-131 then sets PROJECT_DIR to the literal <canonical>/.git/.. (git --git-common-dir is absolute from a linked worktree), so the payload-ownership arm (:192), write-allowlist.sh:93/121 and the worktree-cwd claim arm (:300) never match, and control reaches IS_REGISTERED_WORKTREE (:338-353) and exit 0. The pre-repair outcome is established by the run-01 baseline below; A1 pins the repaired outcome.'
  - 'Repair contract (root-accepted out-parameter interface). caws_guard_realpath_into VAR PATH in lib/caws-state.sh runs python3 os.path.realpath and writes the result''s filesystem bytes plus one record line feed; a status sentinel keeps every byte and the interpreter''s own exit status; exactly that one line feed is removed and the remainder must be non-empty and absolute. Only then is VAR assigned (printf -v), byte for byte, including a trailing line feed that belongs to the path. Otherwise VAR is untouched, exactly one stderr line [caws-guard-realpath] cannot normalize: CLASS is written (invalid-out-parameter, empty-path, python3-unavailable, python3-exit-N, no-record-delimiter, empty-result, non-absolute-result) and the status is 2. _realpath and every other best-effort consumer stay byte-unchanged. No Bash path resolver is built.'
  - 'Path identity is compared as exact bytes. Each guard assigns every root, Git and normalized path it reaches through the out-parameter helpers (caws_guard_realpath_into, caws_physical_dir_into, caws_git_path_into, caws_resolve_canonical_dir_into), never through command substitution, which strips trailing line feeds. Each helper refuses an out-parameter under its own local prefix. Authority-sensitive callers refuse in the form helper VAR input || GUARD_normalize_refuse LABEL input on one line, exiting 2 and naming the input. worktree-write-guard passes the root and branch to node through the environment, never spliced into program text, strips the root prefix quoted, and counts git worktrees from NUL-terminated records, asking with a diagnosis (never counting zero) when an older git cannot represent the root.'
  - 'A value a transport cannot carry is refused naming that limit, before any allow. The command analysis transport cannot carry a carriage return, line feed or tab in a coordinate and the analyzer resolves the operating directory to its physical path, so bash-write-guard refuses an operating directory whose physical path holds one, after resolving the root and before its no-governance exit. An operand holding one is escalated by the existing ask_unrepresentable_target.'
  - 'Git is how both guards discover the canonical root and linked-worktree ownership. When git is unavailable that discovery is impossible, and it must not be read as no worktrees or no governance: each guard refuses with exit 2 and a git-unavailable diagnosis before deriving a root. No git-free resolver is built. Established pre-repair at 39d06b1a and 4ac64fbf: with python3 present and git absent from PATH, both guards admitted a foreign write into another session''s worktree with exit 0 and empty output, while the with-git controls blocked.'
  - 'Scope boundary. This closes admission when normalization or root discovery is unavailable, failing, malformed or byte-lossy; Python-success paths keep the exact bytes _realpath resolves. It does NOT retire the interpreter: the parent CAWS-NATIVE-RUNTIME-001 no-Python objective (Rust/TS) stays open, and so does sibling parse-input.sh:219-225 (deliberately fail-open when its python3 parser fails). Outside these four files and retained by the root coordinator: the caws_foreign_repo_root dirname walk, resolve_canonical_dir stdout callers in other guards, and the analysis transport coordinate limit. SHARED_PACK_VERSION and the shared pack fingerprint stay with the shell-analysis owner after this child merges; the native typed-engine caws-state.sh pin (stock-handlers.ts LIBRARIES) is the native integration owner obligation at import.'
  - 'A relative write target names a file only relative to the payload cwd. worktree-write-guard resolves it against that cwd when the payload names an existing directory and adjudicates the normalized target in every arm; without a cwd, a surface whose payload contract carries cwd (caws_payload_carries_cwd, shared with bash-write-guard) asks, and other surfaces resolve against the session project directory. A relative path is never matched as text against a payload pattern.'
  - 'A failed git discovery means not-a-repository only where no .git entry exists on the directory or any ancestor (caws_git_evidence_dir_into walks parents by string operations). Where one exists, git failed to answer (a broken or pruned worktree, a failing binary) and both write guards refuse naming the failure and the entry, the owner''s own write included; a directory outside every repository stays ungoverned.'
  - 'Node reads the worktree registry and the canonical scope claims in worktree-write-guard. When node is unavailable (absent from PATH and from the hook runtime discovery in runtime-paths.sh, which looks again in $HOME/.nvm and the standard bin directories), neither can be read, and that is not the same as no claim and no worktree: worktree-write-guard refuses with exit 2 and a node diagnosis after its registry check, so a directory without a registry stays ungoverned. bash-write-guard already refuses without node. Established pre-repair at 7d49da1d (run-34): a claimed canonical write from a foreign worktree and a base-branch write while worktrees are active both exit 0 with empty output. A node that is present but failing is outside this refusal; by source (not executed) the registry reads then fall back to the git worktree count and the claim check reaches its own ask or block.'
acceptance:
  - id: A1
    given: >-
      a fixture canonical repo with real linked worktrees s-wt (owner v2-session-s)
      and f-wt (owner v2-session-f) stamped in worktrees.json owner.session_id, and
      HOOK_* precomputed for a Write into f-wt/src/payload.ts from s-wt
    when: >-
      the shipped worktree-write-guard.sh adjudicates it with python3 present, with
      a python3 on PATH that exits 1, and with python3 absent from PATH, plus an
      owner-self control with python3 present
    then: >-
      python3 present exits 2 with BLOCKED naming f-wt. The owner-self control exits
      0. The failing and absent cases exit 2 with the matching [caws-guard-realpath]
      class on stderr instead of the run-01 baseline exit 0. In every case the
      target path stays absent.
  - id: A2
    given: 'caws_guard_realpath_into and the unchanged _realpath sourced from lib/caws-state.sh'
    when: >-
      each resolves a /tmp alias, a symlinked ancestor with a missing leaf, a
      link/.. path, a relative path, a path ending in a line feed and an alias of a
      root ending in a line feed with python3 present; and the helper is also called
      with an empty argument, with python3 absent, and with a python3 that exits 1
      or 7
    then: >-
      with python3 resolving, status 0 and the assigned bytes equal the exact path
      _realpath prints (its output captured byte for byte, minus its one record line
      feed), including a trailing line feed; empty argument, absent and failing
      interpreters return 2, leave the caller variable unchanged and print exactly
      one stderr line with class empty-path, python3-unavailable or python3-exit-N
      carrying the interpreter own status.
  - id: A3
    given: 'the shipped worktree-write-guard.sh and bash-write-guard.sh'
    when: >-
      a contract test scans them for command substitution of _realpath,
      caws_guard_realpath, abspath and resolve_canonical_dir and for every
      caws_guard_realpath_into, abspath_into and caws_resolve_canonical_dir_into
      call, and an identity-drop mutant replaces caws_guard_realpath_into with an
      assignment of _realpath output
    then: >-
      no normalization reaches either guard through command substitution, every
      out-parameter call is followed on its line by a _wwg/_bwg refusal that exits
      2, and under the identity-drop mutant the A1 and A4 failing/absent cases admit
      the foreign write with exit 0.
  - id: A4
    given: 'the A1 fixture with HOOK_TOOL_NAME=Bash and HOOK_COMMAND touching f-wt/src/payload.ts from s-wt'
    when: >-
      the shipped bash-write-guard.sh adjudicates it with python3 present, failing
      and absent, plus an owner-self control
    then: >-
      python3 present exits 2 with the foreign-worktree refusal, owner-self exits 0,
      failing and absent exit 2 with the [caws-guard-realpath] class, and the target
      path stays absent.
  - id: A5
    given: >-
      the A1 and A4 fixture and a python3 that forwards to the real interpreter
      except that one chosen realpath call exits 0 having written something other
      than one absolute path and its single record line feed
    when: >-
      each reachable normalization in worktree-write-guard (foreign payload,
      canonical-claim absolute and relative targets) and bash-write-guard (project
      root, static mutation target, Git metadata) is answered that way in turn, and
      the helper alone is answered with a lone line feed, two line feeds, a relative
      path, nothing, or a path without its delimiter
    then: >-
      every guard run exits 2 with the guard refusal naming the input and the target
      path stays absent; the helper returns 2 with class empty-result for a lone
      line feed, non-absolute-result for two line feeds or a relative path, and
      no-record-delimiter for nothing or a path without its delimiter.
  - id: A6
    given: >-
      governed repositories with identical layouts (registry, real linked worktrees
      s-wt owned by one session and f-wt by another) at an ordinary physical root,
      at a root whose physical path ends in a line feed, at roots containing an
      apostrophe or a bracket expression, on a branch containing an apostrophe, and
      with registries naming another base branch, each root expected byte string
      built by the fixture
    when: >-
      both write guards adjudicate a foreign write into f-wt from the canonical
      root, through an ordinary alias and from s-wt, a Bash mutation of the
      line-feed root target from an ordinary directory outside it, and a
      canonical-root base-branch Write, with git worktree list -z available and with
      a git that lacks it
    then: >-
      every ordinary-root control refuses or asks as before; worktree-write-guard
      gives each other root the control exact refusal or verdict (root bytes
      abstracted), hands scope contention exactly src/new.ts, reads the registry
      (s-wt, f-wt order) and counts git worktrees through NUL records, and asks
      naming the unrepresentable root when -z is unavailable; bash-write-guard
      refuses an operating directory whose physical path holds the line feed naming
      the analysis transport limit, and from outside the root escalates
      ask_unrepresentable_target (blocked when asking is impossible), never exit 0
      with empty output as at 39d06b1a.
  - id: A7
    given: >-
      caws_guard_realpath_into, caws_physical_dir_into, caws_git_path_into and
      caws_resolve_canonical_dir_into sourced from lib/caws-state.sh
    when: >-
      they are called with invalid out-parameter names, with a name under the helper
      own local prefix, with caller names shared with common words or another helper
      prefix, with a git path whose record ends after a line feed of its own, and
      with directories that cannot be entered or are not in a repository
    then: >-
      invalid and own-prefix names return 2 and leave the caller variable unchanged;
      every other name is assigned exactly; caws_git_path_into removes exactly one
      record line feed; caws_resolve_canonical_dir_into yields the line-feed
      canonical root from its linked worktree; a helper with no answer assigns
      nothing and returns 1.
  - id: A8
    given: >-
      a governed repository with real linked worktrees s-wt and f-wt owned by
      different sessions, and a tool farm carrying python3 and the core tools but no
      git
    when: >-
      worktree-write-guard adjudicates a Write and bash-write-guard a Bash mutation
      into f-wt from the canonical root and from s-wt with git absent, and the same
      writes with git present plus the owner writing its own worktree
    then: >-
      with git present the foreign write and mutation are refused with exit 2 by
      ownership and the owner write passes with exit 0; with git absent every run,
      including the owner write, exits 2 with a guard-attributed git-unavailable
      diagnosis naming git, and the target stays absent, where the pre-repair guards
      (39d06b1a, 4ac64fbf) exited 0 with empty output.
  - id: A9
    given: >-
      a governed repository with real linked worktrees s-wt (session rp-session-s)
      and f-wt (another session)
    when: >-
      worktree-write-guard adjudicates a Write from s-wt of the absolute foreign
      target, of ../f-wt/src/payload.ts with the payload cwd s-wt, of src/own.ts
      with cwd s-wt, of ../f-wt/src/payload.ts with the project directory at the
      canonical root and the cwd in s-wt, and of ../f-wt/src/payload.ts with no
      payload cwd on claude-code (default and bypassPermissions) and on zcode
    then: >-
      the absolute and both relative foreign spellings are refused with exit 2 by
      ownership, the own relative write exits 0, a missing cwd asks naming the
      relative path on claude-code (exit 2 when asking is impossible), and zcode
      resolves against the session project directory and refuses by ownership; at
      2ce7b7ef the relative foreign write and the missing-cwd write exited 0 with
      empty output.
  - id: A10
    given: >-
      governed repositories with real linked worktrees s-wt and f-wt owned by
      different sessions, one of them with the s-wt admin directory removed, a git
      on PATH that exits 1 for every call, a git that answers --git-dir but fails
      the guards exact rev-parse --git-common-dir query, a project directory nested
      inside s-wt, and a directory outside every repository
    when: >-
      both write guards adjudicate a foreign write and the owner own write from s-wt
      and from the nested directory with the failing git, a foreign write from the
      admin-loss s-wt with working git, a foreign-session write into s-wt with only
      the common-dir query failing, and a write in the non-repository directory with
      the failing git; and caws_resolve_canonical_dir_into resolves s-wt with that
      partial git and with a git naming a common directory that cannot be entered
    then: >-
      every run inside a repository exits 2 naming the failed git discovery and the
      .git entry found on the directory or an ancestor (the owner write included);
      the helper assigns nothing and returns 3 for the failed query and 2 for the
      unenterable common directory, and resolves s-wt to its canonical root with
      working git; the non-repository directory stays ungoverned with exit 0 and no
      git-failure diagnosis; at 8dbe29c1 the failing-git and admin-loss foreign
      writes, and at 821bdeef the common-dir-only failure in bash-write-guard,
      exited 0 with empty output.
  - id: A11
    given: >-
      a governed repository with real linked worktrees s-wt and f-wt owned by
      different sessions, the canonical path src/claimed.ts claimed by the active
      spec of f-wt, a tool farm carrying git, python3 and the core tools but no
      node, and the guard tree under test copied with only the hook runtime node
      discovery returning early (otherwise an installed node is found again)
    when: >-
      worktree-write-guard adjudicates a Write to src/claimed.ts from s-wt and from
      the claimant f-wt, and a base-branch Write to src/new.ts from the canonical
      root, with node and without it
    then: >-
      with node the s-wt write is refused 2 naming claimed:f-wt:src/claimed.ts, the
      claimant write exits 0 and the base-branch write is asked about; without node
      each of those writes, the claimant write included, is refused 2 with the node
      diagnosis and block JSON; a directory without a worktree registry still exits
      0 without node
