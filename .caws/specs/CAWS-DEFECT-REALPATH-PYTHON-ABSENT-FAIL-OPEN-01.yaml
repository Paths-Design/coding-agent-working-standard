invariants:
  - 'A write guard that cannot resolve a path fails CLOSED with exit 2 and a diagnostic. It never compares an unresolved string (same doctrine as worktree-write-guard.sh:42-46, CAWS-HOOK-SOURCE-GUARD-FAIL-SOFT-001). Both guards run set -euo pipefail and PreToolUse exit 1 is non-blocking, so a resolver failure must surface as exit 2 at every call site, never as an unhandled status 1.'
  - 'Runtime-established baseline, retained as evidence: run-01 (~/.claude/artifacts/c4c0f2e0-cb0c-4380-a9c4-7daeb8f35885/realpath-v2/run-01, fixture sha256 57baadbb) ran the SELECTED runtime 408c06a7 worktree-write-guard.sh (52fe31cd) directly. A Write into a foreign-owned worktree payload from a real linked worktree exits 2 BLOCKED with python3 present. The owner-self control exits 0. With a failing python3 shim and with python3 absent, it exits 0 with empty output. The target stayed absent throughout. HOOK_* was precomputed so parse-input never ran python3. Attribution to _realpath is by elimination, not instrumentation. Receipt gaps: argv/env are transcript-derived, and the mktemp paths, bats PATH and per-process env were not captured. Not exercised: the dispatcher, the native harness, a real harness write.'
  - 'Source trace (992a19d0 and selected runtime 408c06a7, identical lib/caws-state.sh sha256 2d27e94f): _realpath (caws-state.sh:205-215) prints its input unchanged when python3 is absent or exits nonzero. In any linked worktree, worktree-write-guard.sh:124-131 then sets PROJECT_DIR to the literal <canonical>/.git/.. (git --git-common-dir is absolute from a linked worktree), so the payload-ownership arm (:192), write-allowlist.sh:93/121 and the worktree-cwd claim arm (:300) never match, and control reaches IS_REGISTERED_WORKTREE (:338-353) and exit 0. The pre-repair outcome is established by the run-01 baseline below; A1 pins the repaired outcome.'
  - 'Repair contract (root-chosen checked guard normalization). caws_guard_realpath in lib/caws-state.sh runs the IDENTICAL python3 os.path.realpath program. It succeeds (status 0, the interpreter stdout byte-exact) only when python3 resolves, exits 0 and prints at least one byte other than a line feed, because callers strip trailing line feeds and would otherwise see an empty path. Otherwise it prints nothing on stdout, writes exactly one stderr line "[caws-guard-realpath] cannot normalize: <class>" (empty-path, python3-unavailable, python3-exit-<n>, empty-result) and returns 2. _realpath and every other best-effort consumer stay byte-unchanged. No Bash path resolver is built.'
  - 'Authority-sensitive callers (base 5ace5a52) refuse explicitly in the form X=$(caws_guard_realpath p) || <guard>_normalize_refuse, naming the raw input, never via local-assignment masking. worktree-write-guard.sh: git common dir, git dir, canonical root, spec-materialization target, allowlist target, operating directory and both canonical-claim targets. bash-write-guard.sh (handed off by the CAWS-SHELL-ANALYSIS-001 owner): project root, the static mutation target and both Git metadata coordinates; an absent metadata coordinate keeps its approval request. The dynamic-prefix normalization carries the same refusal but is unreachable at this base, because analysis tokens carry no lexically proven prefix and dynamic operands are held for approval first.'
  - 'Scope boundary. This closes admission when normalization is unavailable, failing or empty, while Python-success behavior is preserved. It does NOT retire the interpreter: the parent CAWS-NATIVE-RUNTIME-001 no-Python objective (Rust/TS) stays open, and so does sibling parse-input.sh:219-225 (deliberately fail-open when its python3 parser fails). SHARED_PACK_VERSION and the shared pack fingerprint (tests/init/pack-fingerprint.test.js) stay with the shell-analysis owner after this child merges; the native typed-engine caws-state.sh pin (stock-handlers.ts LIBRARIES) is the native integration owner obligation at import.'
acceptance:
  - id: A1
    given: >-
      a fixture canonical repo with real linked worktrees s-wt (owner v2-session-s)
      and f-wt (owner v2-session-f) stamped in worktrees.json owner.session_id, and
      HOOK_* precomputed for a Write into f-wt/src/payload.ts from s-wt
    when: >-
      the shipped worktree-write-guard.sh adjudicates it with python3 present, with
      a python3 on PATH that exits 1, and with python3 absent from PATH, plus an
      owner-self control with python3 present
    then: >-
      python3 present exits 2 with BLOCKED naming f-wt. The owner-self control exits
      0. The failing and absent cases exit 2 with the matching [caws-guard-realpath]
      class on stderr instead of the run-01 baseline exit 0. In every case the
      target path stays absent.
  - id: A2
    given: 'caws_guard_realpath and the unchanged _realpath sourced from lib/caws-state.sh'
    when: >-
      each resolves a /tmp alias, a symlinked ancestor with a missing leaf, a
      link/.. path, a relative path and a path ending in a line feed with python3
      present; and the helper is also called with an empty argument, with python3
      absent, with a python3 that exits 1, and with a python3 that exits 0 printing
      only a line feed, only line feeds, or nothing
    then: >-
      with python3 resolving, the helper stdout and status equal the interpreter
      (status 0) and the caller-observed value equals _realpath for every path.
      Empty argument, absent, failing and line-feed-only or empty success all return
      status 2 with no stdout byte and exactly one stderr line carrying class
      empty-path, python3-unavailable, python3-exit-1 or empty-result.
  - id: A3
    given: 'the shipped worktree-write-guard.sh and bash-write-guard.sh'
    when: >-
      a contract test scans every caws_guard_realpath and abspath command
      substitution and every _realpath reference, and a mutant replaces the helper
      body with print-input-and-return-0
    then: >-
      neither guard references _realpath, every substitution is followed by an
      explicit refusal that exits 2, and under the mutant the A1 and A4
      failing/absent cases turn red.
  - id: A4
    given: 'the A1 fixture with HOOK_TOOL_NAME=Bash and HOOK_COMMAND touching f-wt/src/payload.ts from s-wt'
    when: >-
      the shipped bash-write-guard.sh adjudicates it with python3 present, failing
      and absent, plus an owner-self control
    then: >-
      python3 present exits 2 with the foreign-worktree refusal, owner-self exits 0,
      failing and absent exit 2 with the [caws-guard-realpath] class, and the target
      path stays absent.
  - id: A5
    given: >-
      the A1 and A4 fixture and a python3 that forwards to the real interpreter
      except that one chosen realpath call exits 0 printing only line feeds or
      nothing
    when: >-
      each reachable normalization in worktree-write-guard (foreign payload,
      canonical-claim absolute and relative targets) and bash-write-guard (static
      mutation target, Git metadata) is answered that way in turn
    then: >-
      every such run exits 2 with the empty-result class and the guard refusal
      naming the input, and the target path stays absent. Against the pre-repair
      helper the first normalization of each guard admitted with exit 0 and empty
      output.
