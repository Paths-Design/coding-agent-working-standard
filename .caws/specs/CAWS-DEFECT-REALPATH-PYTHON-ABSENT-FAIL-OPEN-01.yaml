invariants:
  - 'Source trace (992a19d0 and selected runtime 408c06a7, identical lib/caws-state.sh sha256 2d27e94f): _realpath (caws-state.sh:205-215) prints its input unchanged when python3 is absent or exits nonzero. In any linked worktree, worktree-write-guard.sh:124-131 then sets PROJECT_DIR to the literal <canonical>/.git/.. (git --git-common-dir is absolute from a linked worktree), so the payload-ownership arm (:192), write-allowlist.sh:93/121 and the worktree-cwd claim arm (:300) never match, and control reaches IS_REGISTERED_WORKTREE (:338-353) and exit 0. Runtime confirmation is A1.'
  - 'A write guard that cannot resolve a path fails CLOSED with exit 2 and a diagnostic. It never compares an unresolved string (same doctrine as worktree-write-guard.sh:42-46, CAWS-HOOK-SOURCE-GUARD-FAIL-SOFT-001). Both guards run set -euo pipefail and PreToolUse exit 1 is non-blocking, so a resolver failure must surface as exit 2 at every call site, never as an unhandled status 1.'
  - 'Runtime-established baseline, retained as evidence: run-01 (~/.claude/artifacts/c4c0f2e0-cb0c-4380-a9c4-7daeb8f35885/realpath-v2/run-01, fixture sha256 57baadbb) ran the SELECTED runtime 408c06a7 worktree-write-guard.sh (52fe31cd) directly. A Write into a foreign-owned worktree payload from a real linked worktree exits 2 BLOCKED with python3 present. The owner-self control exits 0. With a failing python3 shim and with python3 absent, it exits 0 with empty output. The target stayed absent throughout. HOOK_* was precomputed so parse-input never ran python3. Attribution to _realpath is by elimination, not instrumentation. Receipt gaps: argv/env are transcript-derived, and the mktemp paths, bats PATH and per-process env were not captured. Not exercised: the dispatcher, the native harness, a real harness write.'
  - 'Repair contract (root-chosen checked guard normalization). A new caws_guard_realpath in lib/caws-state.sh runs the IDENTICAL python3 os.path.realpath program, so stdout is byte-identical whenever python3 resolves, exits 0 and prints non-empty output. Otherwise it prints nothing on stdout, writes exactly one stderr line "[caws-guard-realpath] cannot normalize: <class>" with class empty-path, python3-unavailable, python3-exit-<n> or empty-result, and returns 2. _realpath and every other best-effort consumer stay byte-unchanged. No Bash path resolver is built.'
  - 'Authority-sensitive callers handle refusal explicitly, in the form X=$(caws_guard_realpath p) || <guard>_normalize_refuse, never via local-assignment masking. worktree-write-guard.sh sites :124 :125 :128 :143 :182 :298 :304 :305 use the :47-52 refusal shape. bash-write-guard.sh (owned by CAWS-SHELL-ANALYSIS-001; edit only after that owner accepts the handoff) uses the :13-15 shape at :128, and abspath (:230-235) propagates the helper status to its main-shell callers :307 and :459.'
  - 'Scope boundary. This closes the admission that happens when normalization is unavailable while Python-success behavior is preserved. It does NOT retire the interpreter: the parent CAWS-NATIVE-RUNTIME-001 no-Python objective (Rust/TS) stays open, and so does sibling parse-input.sh:219-225 (deliberately fail-open when its python3 parser fails). Same-unit release metadata is the shared pack fingerprint (enforced by tests/init/pack-fingerprint.test.js) and SHARED_PACK_VERSION (read by hook-chain.ts:201 and doctor installed_pack_version_lag). Native typed-engine pins (stock-handlers.ts LIBRARIES caws-state.sh, service-image.ts) are the native integration owner obligation at import, not this unit.'
acceptance:
  - id: A1
    given: 'a fixture canonical repo whose linked worktree is owned by session S, plus a second worktree owned by session F'
    when: 'worktree-write-guard.sh adjudicates a Write into F worktree payload from S worktree with python3 absent from PATH, and again with a python3 on PATH that exits nonzero'
    then: 'both exit 2 with the block_foreign_worktree verdict, identical to the python3-present run. The pre-fix exit 0 is retained as the counterexample.'
  - id: A2
    given: 'a hostile path corpus (/tmp alias, symlinked ancestor with missing leaf, relative and absolute link targets, link/.., missing/../link, dangling leaf, ENOTDIR, //, trailing slash, non-UTF8 name, leading dash)'
    when: '_realpath resolves each with no python3'
    then: 'stdout bytes equal Python 3 os.path.realpath for every entry, and loops and chains over 40 links return status 2 with empty stdout.'
  - id: A3
    given: 'every _realpath and abspath call site in the shipped write guards'
    when: 'a contract test scans them'
    then: 'each carries an explicit fail-closed handler exiting 2. Replacing _realpath with identity turns the A1 fixture red.'
