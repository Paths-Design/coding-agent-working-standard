id: CAWS-RELEASE-PATH-INTEGRITY-001
title: 'Close pre-release review defects in the governed release and CI guard paths'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: release-path-integrity
created_at: '2026-09-08T19:43:23.119Z'
updated_at: '2026-09-08T19:44:08.772Z'
created_by_session: '5a87baf0-9065-4d43-93aa-aad9f00de463'
blast_radius:
  modules:
    - 'release publication path'
    - 'CI guard coverage'
    - 'mutation assertion surface'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'scripts/release-tag-publish.mjs'
    - 'scripts/release-tag-publish.test.mjs'
    - '.github/workflows/release.yml'
    - '.github/workflows/release-qualification.yml'
    - '.github/workflows/pr-checks.yml'
    - '.github/workflows/caws-gate.yml'
    - '.github/workflows/mutation.yml'
    - 'packages/caws-cli/scripts/assert-mutation-report.mjs'
    - 'packages/caws-cli/scripts/stryker-config.cjs'
    - 'packages/caws-cli/tests/ci'
    - 'docs/release-procedure.md'
    - 'package.json'
    - 'package-lock.json'
    - 'packages/caws-cli/package.json'
    - 'packages/caws-cli/CHANGELOG.md'
  out: []
invariants:
  - 'A governed check must fail closed: no path may report success while having verified nothing.'
  - 'A credential-isolation guarantee must be enforced by code, not asserted in a comment.'
  - 'A pushed release tag must never survive a run that did not publish the matching package.'
  - 'Consolidating or deleting a CI workflow must preserve every guard pattern it enforced.'
acceptance:
  - id: A1
    given: 'the publish step resolves OIDC trusted publishing'
    when: 'a registry credential is present in the ambient environment'
    then: 'the npm child process receives no credential and cannot silently fall back to token auth'
  - id: A2
    given: 'the CI shadow-file guard'
    when: 'a changed path matches duplicate-, backup-, or a .backup suffix'
    then: 'the check fails rather than passing clean'
  - id: A3
    given: 'a release tag push'
    when: 'release qualification runs'
    then: 'the per-file mutation floor is evaluated against the tagged commit before publication is reachable'
  - id: A4
    given: 'a release workflow failure occurring before the publish script runs'
    when: 'the job terminates'
    then: 'the pushed tag is removed from origin so no tag survives without a published package'
  - id: A5
    given: 'a mutation surface with no declared targets or an empty report'
    when: 'the assertion script runs'
    then: 'it fails loudly instead of exiting zero having checked nothing'
  - id: A6
    given: 'release documentation and CI step summaries'
    when: 'a maintainer follows them'
    then: 'Unreleased handling and the pre-script failure mode are documented, summary labels name the tools that actually ran, and the retired semantic-release entrypoint is absent'
  - id: A7
    given: 'the release candidate'
    when: 'version and changelog preparation completes'
    then: 'package.json, the workspace lockfile, and CHANGELOG.md agree on the candidate version and the release script validation passes'
non_functional: {}
contracts:
  - name: 'release-path-integrity'
    type: contract-test
    path: 'packages/caws-cli/tests/ci/release-path-integrity.test.js'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "release-tag-publish.test.mjs: e2e records the real publish child's env — with NODE_AUTH_TOKEN + npm_config__authToken ambient and no NPM_TOKEN, npm receives none; negative control (revert to env-merge) fails it. 12 node:test pass."
    recorded_at: "2026-09-08T22:43:26.714Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "release-path-integrity.test.js: executes the real pr-checks.yml step; 11 known-bad paths blocked incl. restored duplicate-/backup-/.backup; allowlist near-misses blocked; all tracked files pass (no false positives)."
    recorded_at: "2026-09-08T22:43:27.188Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "release.yml release job needs [qualification, mutation]; mutation.yml workflow_call input required:boolean default false, job if consults inputs.required. actionlint exit 0."
    recorded_at: "2026-09-08T22:43:27.642Z"
  - criterion_id: A4
    status: pass
    evidence_ref: "release-path-integrity.test.js: executes the real failure() step vs shimmed gh across 4 states — marker present (no delete), absent (delete), already-absent (tolerated), surviving (exit 1 + repair). Marker write proven by node:test."
    recorded_at: "2026-09-08T22:43:28.139Z"
  - criterion_id: A5
    status: pass
    evidence_ref: "mutation-contract.test.js: empty targets + empty report, empty targets + populated report, and absent targets key all fail; passing surface still PASSes. Negative control: removing the guard fails 3."
    recorded_at: "2026-09-08T22:43:28.604Z"
  - criterion_id: A6
    status: pass
    evidence_ref: "docs/release-procedure.md gains the pre-script failure row, Unreleased retitle, lockfile resync; caws-gate.yml summary names ci-governance-artifacts.mjs; semantic-release script+5 devDeps removed with prod closure unchanged (125 pkgs)."
    recorded_at: "2026-09-08T22:43:29.054Z"
  - criterion_id: A7
    status: pass
    evidence_ref: "package.json+lockfile at 12.2.0-rc.1; release dry-run exit 0 release.success, CHANGELOG section extracted as 10048 chars; audit:dependencies 0 vulns; smoke:fresh-install exit 0 (runtime-upgrade PASS 9 cases); full jest 215 suites/2652 tests."
    recorded_at: "2026-09-08T22:43:29.505Z"