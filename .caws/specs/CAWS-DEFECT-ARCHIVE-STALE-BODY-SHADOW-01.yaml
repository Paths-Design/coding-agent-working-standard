id: CAWS-DEFECT-ARCHIVE-STALE-BODY-SHADOW-01
title: 'a stale archived body permanently shadows the live spec: archive refuses to overwrite it and names no remedy'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'Closes ledger N11 (med-high, reproduced live in a consumer repo the same day). Ships caws specs archive --replace, which demotes a stale archived body to <id>.superseded-<timestamp>.yaml inside the archive transaction rather than discarding it; a collision refusal that now names --replace and prints both bodies'' updated_at with a stale/newer judgement; and a superseded-snapshot advisory on recover and show --archived. spec_archived gains an optional superseded_path. Falsification: two mutants (dropped register.ts forwarding, removed same-second collision suffix) reddened exactly the 5 predicted tests by name. Full suite 132/132 suites, 1906/1906 tests.'
created_at: '2026-08-12T08:37:24.633Z'
updated_at: '2026-08-12T09:08:28.145Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/specs-writer.ts'
    - 'packages/caws-cli/src/shell/commands/specs.ts'
    - 'packages/caws-cli/src/shell/register.ts'
    - 'packages/caws-cli/src/shell/command-metadata.ts'
    - 'packages/caws-cli/tests/shell/specs-archive-replace.test.js'
    - 'docs/command-reference.md'
    - packages/caws-cli/src/kernel/schemas/events/spec_archived.v1.json
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'a closed spec whose id already has a body in .caws/specs/.archive/'
    when: 'caws specs archive runs without --replace'
    then: 'it still refuses, and the refusal names --replace as the remedy and prints BOTH bodies'' updated_at so the operator can see which one is stale without a second investigation'
  - id: A2
    given: 'the same collision'
    when: 'caws specs archive <id> --replace runs'
    then: 'the existing archived body is MOVED to .caws/specs/.archive/<id>.superseded-<timestamp>.yaml byte-for-byte and the new body takes the canonical archive path — nothing is discarded'
  - id: A3
    given: 'an id archived with --replace'
    when: 'caws specs recover <id> runs'
    then: 'it returns the NEW body, not the superseded snapshot, so the governed read path stops asserting the opposite of the spec''s actual outcome'
  - id: A4
    given: 'an id with one or more superseded snapshots on disk'
    when: 'caws specs recover <id> or caws specs show <id> --archived runs'
    then: 'a non-blocking advisory names the superseded files, so a divergence that legitimately exists is visible rather than silent'
  - id: A5
    given: 'a closed spec with NO existing archived body'
    when: 'caws specs archive <id> --replace runs'
    then: 'it behaves exactly like a plain archive and creates no superseded file — the flag widens what archive can do without changing what it does normally'
non_functional: {}
contracts:
  - name: 'specs-archive-replace'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "3 tests: refusal names --replace + both updated_at + OLDER judgement; inverted-age case says NEWER and withholds 'very likely stale'; a body failing today's schema still reports its updated_at (regex read, not parser). Nothing moves on refusal — canonical file intact, archive dir unchanged."
    recorded_at: "2026-08-12T08:50:20.033Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "4 tests: byte-for-byte superseded copy at ARCREP-010.superseded-2026-08-12T09-00-00Z.yaml (no colons); spec_archived.superseded_path recorded; two same-second replaces both survive (falsified: removing the collision suffix reddens exactly this test); atomicity — a rejected new body leaves zero superseded files and the prior body intact."
    recorded_at: "2026-08-12T08:50:21.310Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "spawned CLI: before --replace, recover does NOT serve the new body; after, stdout contains 'Auto-closed by caws worktree merge' and NOT 'REGISTRY RECONCILIATION ONLY' — the read path stops asserting the opposite of the outcome. Falsified: dropping the register.ts forwarding reddens this test."
    recorded_at: "2026-08-12T08:50:33.620Z"
  - criterion_id: A4
    status: pass
    evidence_ref: "3 tests: recover and show --archived both emit the superseded advisory on stderr naming ARCREP-0xx.superseded-*; stdout stays free of 'caws advisory' (piped into editors); an id with no superseded snapshot emits nothing. Falsified: forwarding mutant reddens both advisory tests."
    recorded_at: "2026-08-12T08:50:34.871Z"
  - criterion_id: A5
    status: pass
    evidence_ref: "2 tests: --replace on a clean id yields archive dir == ['ARCREP-040.yaml'] and a spec_archived event with NO superseded_path property; spawned-CLI opt-forwarding proof exits 0, creates the superseded file, and prints 'was preserved at'."
    recorded_at: "2026-08-12T08:50:36.133Z"