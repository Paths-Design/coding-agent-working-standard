id: CAWS-NATIVE-CLAUDE-QUALIFICATION-001
title: 'Retain actual Claude native qualification observations'
mode: feature
lifecycle_state: active
created_at: '2026-11-07T13:03:24.729Z'
updated_at: '2026-11-07T13:03:24.729Z'
created_by_session: '01a19baf-4b34-7a83-9cf8-f109a22c539e'
blast_radius:
  modules:
    - 'Native harness qualification'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/scripts/qualify-native-claude.cjs'
    - 'packages/caws-cli/tests/ci/native-claude-capture.test.js'
    - 'packages/caws-cli/reports/'
  out: []
invariants:
  - 'Capture never grants native trust, acceptance, or global activation; original budgets and protected bytes remain unchanged'
acceptance:
  - id: A1
    given: 'pinned public host and candidate in an isolated profile'
    when: 'maintained prepare and observe run'
    then: 'real hook and tool results, sentinel bytes, output custody and rendering are retained with explicit missing proof'
  - id: A2
    given: 'malformed, mismatched, missing or uncertain evidence'
    when: 'the inspector evaluates it'
    then: 'the corresponding observation fails and final prose cannot substitute for a native event or effect'
observability:
  - 'Raw stdout stderr and per-attempt receipt with source identities, exact tool ids and independent filesystem snapshots'
rollback:
  - 'Leave private profile inactive; revert this logical source commit through ordinary history if necessary'
non_functional:
  security:
    - 'No credential reads or copies; no hook trust edits or permission bypass; retain fixtures on every outcome'
contracts:
  - name: 'claude-native-observation'
    type: behavior
