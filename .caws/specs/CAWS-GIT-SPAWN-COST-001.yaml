    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'GIVEN a process that invokes git more than once WHEN the second invocation runs THEN the binary path is resolved from cache with no filesystem probe and no subprocess, and the git actually executed is the same one bare ''git'' would have selected'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'GIVEN PATH contains no executable named git WHEN the resolver runs THEN it returns the bare name ''git'' and every call site behaves exactly as it does today'
  - id: A3
