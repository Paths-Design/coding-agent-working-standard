invariants:
  - 'Resolution NEVER changes which git runs: the resolver walks the same PATH in the same order execvp would, and falls back to the bare name ''git'' when no entry is executable, so behavior is identical on any machine where resolution fails.'
  - 'The resolved path is cached per PROCESS, never across processes. No cache file, no persisted state — a stale cached binary path is the one failure mode this must not create.'
  - 'A template-copied test repo is behaviorally identical to a git-init one: same branch, clean status, and rev-parse --show-toplevel resolving to the copy''s own path, not the template''s.'
  - 'CAWS_GIT_BINARY, when set, wins over PATH resolution and is used verbatim, so a caller can pin the binary without editing PATH.'
acceptance:
