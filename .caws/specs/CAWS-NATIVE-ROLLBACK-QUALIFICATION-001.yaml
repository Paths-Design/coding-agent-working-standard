blast_radius:
  modules:
    - 'Native installed entry and supported runtime rollback qualification'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/scripts/qualify-native-rollback.cjs'
    - 'packages/caws-cli/tests/tooling/qualify-native-rollback.test.js'
  out: []
invariants:
  - 'Qualification uses separate private machine and user homes and never mutates the selected global runtime or another session artifacts'
  - 'A successful setup or native launcher name never substitutes for verified selected generation and actual invocation outcomes'
acceptance:
  - id: A1
    given: 'a reviewed complete native image and prior compatibility package'
    when: 'isolated installation native invocation and supported rollback run'
    then: 'raw outcomes identify each selected generation and rollback preserves governance and refuses an unauthorized write'
  - id: A2
    given: 'missing or changed selected runtime identity or incorrect expected invocation outcome'
    when: 'qualification evaluates it'
    then: 'it fails without publishing a passing result or mutating the global runtime'
observability:
  - 'Retain exact source and tool pins, commands, stdout stderr exit status, generation selections and before-after state under the executing session artifact directory'
rollback:
  - 'Private qualification leaves machine selection unchanged; preserve failed attempts and remove no foreign evidence'
non_functional: {}
contracts: []
