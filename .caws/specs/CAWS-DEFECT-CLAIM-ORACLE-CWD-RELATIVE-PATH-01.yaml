invariants:
  - 'The oracle''s answer must not depend on how the caller SPELLS the path. The same file, same session, same owner must produce the same outcome whether the path is given cwd-relative, canonical-absolute, or worktree-absolute.'
  - 'The fix must not weaken block_claimed for a genuine canonical-root write by a non-owner. A canonical-checkout session writing a path claimed by someone else''s worktree must still block, and the repair must carry a regression control proving that.'
  - 'Fail closed on ambiguity where the payload contract promises a cwd. For surfaces whose PreToolUse payload carries cwd (claude-code, codex, opencode, qwen-code, kimi-code), an unresolvable cwd for a relative target is ask_uncertain, never a silent pass. For surfaces whose payload is not confirmed to carry cwd (zcode, dsh, unknown), the prior resolution stands: failing closed there would refuse every relative write, the false-refusal class the release stance ranks worse. Decided 2026-10-05; the unverified surfaces are tracked by CAWS-SURFACE-PAYLOAD-CWD-CONTRACT-01.'
acceptance:
  - id: A1
    given: 'session S owns worktree W and the path P is in the bound spec''s scope.in'
    when: 'the oracle is invoked with P spelled cwd-relative while S''s cwd is inside W'
    then: 'the outcome is pass (owner-self), identical to the outcome for the worktree-absolute spelling of P'
  - id: A2
    given: 'a canonical-checkout session that does NOT own worktree W'
    when: 'it targets a path claimed by W''s bound spec scope.in'
    then: 'the outcome is still block_claimed — the widening must not disarm the cross-lane guard'
  - id: A3
    given: 'the operating session''s cwd cannot be determined'
    when: 'the oracle classifies a relative path'
    then: 'it emits ask_uncertain or error_fail_closed rather than assuming the path is worktree-relative'
non_functional: {}
contracts:
