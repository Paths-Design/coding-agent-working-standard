id: CAWS-CLAUDE-MD-SHORTEN-001
title: 'Shorten root CLAUDE.md to the rules most tasks need; move the rest into the docs it names'
mode: doc
lifecycle_state: draft
created_at: '2026-10-28T00:05:43.172Z'
updated_at: '2026-10-28T00:05:43.172Z'
created_by_session: '14177db1-e780-48ce-8b34-d2661057b6f9'
blast_radius:
  modules:
    - 'Root agent doctrine (CLAUDE.md) and the four docs it points moved material to'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'CLAUDE.md'
    - 'docs/agents/scope-discipline.md'
    - 'docs/release-procedure.md'
    - 'CONTRIBUTING.md'
    - 'docs/architecture/repo-local-hook-policy.md'
  out: []
invariants:
  - 'No doctrine rule is deleted: a passage removed from CLAUDE.md is present in a destination doc CLAUDE.md names, or was already present in a named doc'
  - 'Paths claimed by the active guard-contract-docs lane (docs/guides/hook-packs.md, docs/guides/worktree-isolation.md) are not edited'
acceptance:
  - id: A1
    given: 'root CLAUDE.md at 598 lines (about 9k tokens per request per /usage)'
    when: 'the rewrite lands'
    then: 'CLAUDE.md is at most 250 lines and each removed passage is found by a distinctive-phrase grep in a destination doc that CLAUDE.md names'
  - id: A2
    given: 'the jest tests that read root CLAUDE.md (guard-copy-no-waiver-for-hook-blocks, agent-recovery-path-drift, agent-doc-examples)'
    when: 'they run against the rewritten file'
    then: 'all pass, with the Governed paths section still naming reprieve, policy.yaml spec edit and nothing-for-no-verify as the block lifts'
  - id: A3
    given: 'the installed caws CLI snapshot (12.2.0-rc.2)'
    when: 'each caws command and flag named in the rewritten CLAUDE.md is looked up in its --help'
    then: 'every one exists'
  - id: A4
    given: 'the five changed markdown files'
    when: 'prettier --check runs with the repo config'
    then: 'it reports no formatting issues'
non_functional: {}
contracts: []
