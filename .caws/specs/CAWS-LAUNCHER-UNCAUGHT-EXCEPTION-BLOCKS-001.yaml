acceptance:
  - id: A1
    given: 'a pre_tool_use invocation in which the launcher raises an exception type outside ValueError, OSError, KeyError, TypeError and AttributeError'
    when: 'the launcher or the bootstrap handles it'
    then: 'the process exits 2 and prints a block decision whose reason names the exception type, where it previously exited 1 and the harness ran the tool call'
  - id: A2
    given: 'the same fault on post_tool_use before dispatch'
    when: 'the launcher handles it'
    then: 'it exits 0 and reports the fault on stderr'
  - id: A3
    given: 'a handler chain that returns its own verdict'
    when: 'the launcher exits through SystemExit'
    then: 'the exit status and stdout are unchanged'
