id: CAWS-GUARD-FALSE-SIGNALS-001
title: 'Stop reminder names only owned lanes; classifier stops flagging curl -G and read-only git as risky'
mode: fix
lifecycle_state: active
worktree: guard-false-signals
created_at: '2026-11-22T02:50:24.425Z'
updated_at: '2026-11-22T03:26:46.051Z'
created_by_session: '7cd53bbd-9d23-4b4c-bc29-db8064455ac2'
blast_radius:
  modules:
    - 'Shared Stop worktree reminder (stop-worktree-check.sh)'
    - 'Shared command classifier: curl capability rule and git read-only allow-list (classify_command.py)'
    - 'Shared hook-pack version and recorded fingerprint'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/stop-worktree-check.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/classify_command.py'
    - 'packages/caws-cli/tests/hooks/stop-worktree-check-ownership.test.js'
    - 'packages/caws-cli/tests/hooks/guard-path-identity.test.js'
    - 'packages/caws-cli/tests/hooks/pytest/test_classify_readonly_signals.py'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/CHANGELOG.md'
    - packages/caws-cli/tests/hooks/bats/block-dangerous-readonly-signals.bats
  out: []
invariants:
  - 'Worktree ownership is decided by exact equality of the registry owner session id and the stopping session id, the rule the worktree claim oracle applies'
  - 'The git allow-list stays suppress-only and mutating git subcommands keep their prior classification'
  - 'A curl transfer with an explicit POST, PUT, PATCH or DELETE method, or with request data, no explicit method and no -G, remains classified HTTP_MUTATE; an explicit non-mutating method with data keeps the prior (non-mutation) classification'
acceptance:
  - id: A1
    given: 'a worktree registry with active lanes owned by the stopping session and by other sessions'
    when: 'stop-worktree-check.sh runs for the stopping session'
    then: 'the reminder names only the stopping session lanes and recommends caws worktree merge for them, reports other sessions lanes only as a count marked not theirs to merge or destroy, and never prints a foreign lane name, a destroy instruction for a foreign lane, or the claim that other agents cannot commit until all worktrees are destroyed'
  - id: A2
    given: 'active lanes in the registry and a Stop payload with no usable session id'
    when: 'stop-worktree-check.sh runs'
    then: 'it names no lane and prints no destroy instruction, and states that ownership could not be attributed and points to caws worktree list'
  - id: A3
    given: 'curl commands that send data with -G or --get and no explicit method, including short-flag clusters such as -sG'
    when: 'classify_command classifies them'
    then: 'none is classified HTTP_MUTATE, while curl -G -X POST, curl -X DELETE, curl -d and a clustered -sd data flag are all classified HTTP_MUTATE'
  - id: A4
    given: 'git grep, merge-base, ls-tree, for-each-ref, show-ref, check-attr and diff-tree invocations'
    when: 'classify_command classifies them'
    then: 'each is allowed with no advisory, while git grep with -O or --open-files-in-pager and git merge, push, fetch, apply and archive keep their prior ask classification'
  - id: A5
    given: 'the changed shared hook-pack templates'
    when: 'the pack fingerprint guard, the classifier pytest suite, the guard path identity suite and the new ownership suite run'
    then: 'all pass with SHARED_PACK_VERSION bumped and the recorded fingerprint updated, and no existing assertion is weakened beyond rewording the reminder text it observes'
observability:
  - 'Stop reminder stderr text for owned, foreign-only, identity-unavailable and empty registries'
  - 'Classifier JSON decision, reason, source and enforcement per command'
rollback:
  - 'Revert the slice commit; the prior pack version, fingerprint and handler text return with it'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Real stop-worktree-check.sh run against git fixtures at 72f3058b4: with own lanes mine-a, mine-b and foreign lanes theirs-1, theirs-2 stderr is \"REMINDER: this session owns 2 active worktree(s): mine-a, mine-b. ... caws worktree merge <name>. 2 other active worktree(s) belong to other sessions and are not yours to merge or destroy.\"; no theirs-* name, no \"caws worktree destroy\", no \"cannot commit to the base branch\". Sibling cases in the same file pin foreign-only (count, no names), exact-id ownership, inactive lanes excluded. Mutants killed: inverted owner test (5 fail), name-all-active (2 fail). Not verified: installed ~/.caws runtime 7e3b11ce and repo .caws/hooks copy still carry the old reminder until a runtime refresh."
    recorded_at: "2026-11-22T05:20:34.315Z"
    test_nodeid: "packages/caws-cli/tests/hooks/stop-worktree-check-ownership.test.js::names only the stopping session lanes and counts the rest without naming them"
    commit_sha: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
    test_verified_at: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
  - criterion_id: A2
    status: pass
    evidence_ref: "Real stop-worktree-check.sh at 72f3058b4 with registry lanes mine-a (owned) and theirs-1 and a Stop payload lacking session_id, run both with dispatcher-exported HOOK_* (HOOK_SESSION_ID=unknown) and with stdin-only parsing: stderr is \"REMINDER: 2 active worktree(s) are registered, but this session's identity is unavailable, so ownership could not be attributed. Check owners with caws worktree list ...\"; neither lane name and no \"caws worktree destroy\" appears. Mutant removing the identity-unavailable branch was killed (1 fail). Not verified: behavior under the installed machine runtime, which still runs the old handler."
    recorded_at: "2026-11-22T05:20:54.975Z"
    test_nodeid: "packages/caws-cli/tests/hooks/stop-worktree-check-ownership.test.js::without a usable session id no lane is named or attributed"
    commit_sha: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
    test_verified_at: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
  - criterion_id: A3
    status: pass
    evidence_ref: "classify_command.py at 72f3058b4: curl -s -G URL --data-urlencode ... | jq . (the command that armed a live rc latch Nov 21), -sG, --get -d, -G -d, per-transfer -G --next -G, and data after -- are allow; -G -X POST, -X DELETE, -XPUT, -sXPOST, -d, -sd, --data-raw, --data-urlencode, --data -G, --header -G -d, -G ... --next/-:/-s: -d, --no-get, and -G after an unlisted long option are ask/capability/confirm \"state mutation (HTTP_MUTATE)\". Parse cases were checked against real curl 8.7.1 --libcurl (POSTFIELDS \"-G\"; header \"-G\" + POSTFIELDS q=x; second transfer POSTFIELDS q=y; \"-- -v\" became a URL). Through the real block-dangerous.sh (tests/hooks/bats/block-dangerous-readonly-signals.bats): two curl -G calls write no warning or latch file; two body calls warn then arm. Mutant ignoring -G killed (4 pytest + 1 bats). Explicit non-mutating method with data (-X GET -d) keeps the prior non-mutation classification. Not covered: -F/--form, --json, -T (pre-existing), -K config files, curl options newer than 8.7.1 beyond the unlisted-option rule."
    recorded_at: "2026-11-22T05:21:23.749Z"
    test_nodeid: packages/caws-cli/tests/hooks/pytest/test_classify_readonly_signals.py
    commit_sha: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
    test_verified_at: "72f3058b41f36cdec763dc0f642f5a6cbe43856a"
  - criterion_id: A4
    status: pass
    evidence_ref: "Through the real block-dangerous.sh on an installed pack at 72f3058b4: git grep -n foo, merge-base, ls-tree -r, for-each-ref, show-ref --heads, check-attr -a, diff-tree --name-only exit 0 with no \"advisory\"/\"unknown git subcommand\" output and no warning or latch file; git grep -O vim prints \"caws advisory (non-blocking): git grep --open-files-in-pager (-O) launches an external program\". Classifier matrix (test_classify_readonly_signals.py, re-derived for A3 at the same sha): all seven read-only forms allow/pass; grep -O, -Ovim, -nO, --open-files-in-pager[=less], --open, --op, -e -- -Ovim (real git ran echo for -e -- -Oecho), -n -e p -O keep ask/legacy_family/advisory; -e -O and -f -O are allowed (git reads \"-O\" as the pattern/file); diff-tree --output keeps ask; merge, push, fetch, apply, archive keep \"unknown git subcommand: <sub>\" ask/advisory. Baseline main: all seven read-only forms were ask/advisory. Mutant shortening the -O abbreviation rule killed (1 fail)."
