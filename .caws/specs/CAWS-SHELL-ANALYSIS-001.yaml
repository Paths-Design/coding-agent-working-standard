invariants:
  - 'Analysis never executes submitted commands, expansions, scripts or redirections.'
  - 'Every possible shell-visible Git target and admitted execution-bearing argument satisfies the declared policy; unresolved syntax or values never become an allow proof.'
  - 'Literal data remains data; quotes, branch alternatives, assignment order and finite-loop state are preserved. Existing lifecycle release and foreign work remain preserved.'
  - 'Known incomplete native producer projections never confer command admission or lifecycle rewrite authority; the deployed runtime is retained until a qualified execution contract and isolated native canary exist.'
  - 'The landing includes the architecture cwd contract, hook setup, README exit semantics and command-analysis verification updates. These four documents distinguish implemented bounded analysis and packaged consumer behavior, the proposed CAWS execution boundary, and native adoption that requires separate final-launch, canary and rollback qualification; they are part of the landing, not deferred follow-up work.'
acceptance:
  - id: A1
    given: 'a declared supported Bash subset and exact command bytes'
    when: 'the analyzer inspects assignments, finite loops, quoting and nested read substitutions'
    then: 'benign independently adjudicated commands are admitted with a deterministic explanation and analysis performs no submitted side effects'
  - id: A2
    given: 'shell-visible Git redirects and execution-bearing option/script slots'
    when: 'quoted, variable, wrapped, mixed-lifecycle and hostile variants are analyzed'
    then: 'foreign Git targets and dangerous utility execution are denied; unprovable targets, syntax and parser limits return unresolved without permission'
  - id: A3
    given: 'the shipped parser, CLI and guard install'
    when: 'the real compiled CLI and installed worktree-pin guard receive exact hostile and benign payloads'
    then: 'byte custody is preserved, guard decisions agree with independently derived requirements and release/repoint operations remain reachable'
  - id: A4
    given: 'the 207 retained refusal incidents and provenance limits'
    when: 'their patterns are adjudicated and replayed without executing payloads'
    then: 'the report separates supported benign, dangerous and unresolved cases; retained private transcripts are not committed and historical native refusals are not misrepresented as CAWS failures'
  - id: A5
    given: 'the committed candidate and isolated package/runtime fixture'
    when: 'focused semantic and negative-control checks, doctor, gates and peer feedback are grounded'
    then: 'the module and installed consumer satisfy the scoped criteria, packaging carries the parser, rollback is demonstrated and native/default/global-adoption limits are stated'
  - id: A6
    given: >-
      The active bash-write guard receives exact shell source containing interpreter
      data, finite shell variables, genuine shell or interpreter writes, or an
      unavailable analysis backend
    when: >-
      The installed packaged guard projects bounded shell facts and applies its
      existing utility roles and ownership decisions
    then: >-
      A benign quoted Node heredoc and quoted search data produce no fabricated
      shell targets; real foreign writes and nested shell writes remain refused,
      finite targets reach the ownership oracle, and unsupported or malformed
      analysis cannot become an empty allow
  - id: A7
    given: >-
      Native execution envelopes may supply command aliases, shell and startup
      choices, or a working directory, and the stock lifecycle hook can emit
      updatedInput after guards
    when: >-
      The mandatory guard decodes the original transported envelope and a lifecycle
      command is considered for directory rerooting
    then: >-
      Supplied source, shell and startup conflicts remain unresolved; the decoded
      execution directory reaches downstream ownership checks; only a proven
      standalone literal merge or destroy invocation is rerooted, quoted mentions
      and compound neighbors are untouched, and rewritten lifecycle failures retain
      their status and diagnostics
  - id: A8
    given: >-
      The trusted launcher identifies the known incomplete Codex native hook
      projection, including native tool aliases and caller-added shell metadata
    when: 'The mandatory consumer or either CLI decoder processes that native envelope'
    then: >-
      The result is execution-contract unresolved without surrogate facts,
      admission, or lifecycle rewrite; caller fields and CLI shell flags cannot
      override it, while literal diagnostic analysis remains usable with declared
      context
  - id: A9
    given: >-
      A governed canonical root may contain LF, quotes or glob characters, with
      normal aliases and linked worktrees plus active registry entries
    when: >-
      The worktree guard decides branch-switch or cleanup safety and the opt-in Stop
      reminder reads activity through the canonical root
    then: >-
      Exact canonical path identity reaches registry reads without source
      interpolation; the hard guard preserves protective refusals and refuses
      unavailable authority while the reminder remains exit-zero and reports the
      same active worktrees, with unsupported resolution diagnosed rather than
      treated as an empty registry
  - id: A10
    given: >-
      Supported Bash copy or move invocations contain separately proven source and
      destination operands, or unresolved options, values, working directories or
      filesystem relations
    when: >-
      The bounded parser projects complete per-invocation roles and the copy guard
      plus mandatory write oracle evaluate the actual destination relation and
      move-source effects
    then: >-
      Multiple owned source files may be copied to an external artifact directory
      without fabricating a canonical destination from source bytes; real
      worktree-to-canonical destinations and foreign destination writes remain
      refused, foreign source reads retain existing policy, and incomplete roles,
      rewrites or symlink relations cannot grant admission; source fixture proof
      does not qualify installed runtime adoption
  - id: A11
    given: >-
      An authenticated host association and a fully owned executable, argv, physical
      cwd, environment, stdin, startup mode, effect profile and authority revision
    when: >-
      CAWS prepares and analyzes the invocation without submitted execution, then
      consumes admission under the authority fence
    then: >-
      The same owner launches exactly the admitted record once; unsupported
      profiles, authority revocation, altered fields, expiry, cancellation, replay
      and malformed or timed-out analysis produce zero user launches, with bounded
      cleanup and truthful partial outcomes
  - id: A12
    given: >-
      A pinned real native host using an isolated exclusive CAWS execution profile
      and the prior immutable profile for rollback
    when: >-
      Actual tool inventory, authenticated host association, useful benign and
      hostile native calls, restart and rollback are observed
    then: >-
      Every covered native execution route reaches the CAWS final-launch owner,
      benign computed data launches once with matching execution fields, hostile or
      alternate routes launch zero user commands, and rollback restores the prior
      observed selection and behavior; global adoption remains unqualified until its
      own checks pass
  - id: A13
    given: 'An existing lifecycle lock, its owning process and competing acquisition or recovery attempts'
    when: >-
      The owner is live or dead, metadata is unavailable, a reclaimer is
      interrupted, or an old handle is released after a successor exists
    then: >-
      Live and unknown owners remain protected; aged dead owners recover through a
      serialized single unlink; stale or repeated handles cannot remove or close
      successors, and the whole lock file meets the unchanged 80 percent mutation
      floor
observability:
  - 'Structured verdict, reason codes and source-positioned decision trace distinguish allowed, denied and unresolved facts without claiming a general process sandbox.'
rollback:
  - 'Revert the candidate through a governed lane; retain the previous immutable runtime generation and verify supported adapter rollback before machine adoption.'
non_functional:
  security:
    - 'Pin the parser dependency and reject malformed, partial, unsupported or over-budget ASTs; never infer permission from an omitted dynamic word.'
