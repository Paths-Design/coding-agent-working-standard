id: CLASSIFY-CREDENTIAL-READ-VERB-COVERAGE-001
title: 'the credential-read hard-deny covers only cat, leaving head/tail/cp and other unambiguous read channels admitted'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-cred-verbs
created_at: '2026-09-14T04:22:34.906Z'
updated_at: '2026-09-14T04:23:14.622Z'
created_by_session: 'session-c04418cd-a035-44a9-b26e-378d285ccad1'
blast_radius:
  modules:
    - 'packages/caws-cli/templates/hook-packs/shared/classify_command.py (DENY_SEGMENT_PATTERNS credential selector)'
    - 'packages/caws-cli/tests/hooks/pytest/test_classify_command.py (verb matrix + hazard negatives)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/classify_command.py
    - packages/caws-cli/tests/hooks/pytest/test_classify_command.py
  out:
    - packages/caws-cli/dist
invariants:
  - 'A credential read is catastrophic wherever it happens, not only through `cat`. The harm is that the content enters the model context and is transmitted to the provider, so `head .env` and `cp .env /tmp/x` disclose exactly as `cat .env` does — the second while also depositing the secret somewhere a later command can read at leisure.'
  - 'Only verbs whose operand is UNAMBIGUOUSLY a file are added: head, tail, less, more, base64, xxd, od, strings, cp. Pattern-taking tools (grep, rg, sed, awk) are deliberately excluded, because the credential name appears as a PATTERN there, not a path.'
  - 'That exclusion is load-bearing, not conservatism for its own sake. `git ls-files | grep -E "\.env"` is the security check whose false-positive hard-deny started this line of work; admitting grep to the credential selector would turn that check back into a session-killing deny and re-arm the trap.'
  - 'The new verbs are anchored to COMMAND POSITION (`(^|[|;&(])\s*<verb>`) while the pre-existing `cat` alternative stays unanchored. head/tail/less/more/od/strings are ordinary English words, and an unanchored alternation would match unquoted prose — `git commit -m add more .env handling` would hard-deny and latch. Quoted content is already stripped before these patterns run (verified: `echo "cat .env"` is allowed), so anchoring closes the unquoted residue.'
  - 'Anchoring can only ever ADD coverage, never remove it: every command this selector newly matches is admitted today. A command-position miss (for example `then head .env`) is therefore a residual false negative against the PREVIOUS baseline of allow, not a regression introduced here.'
  - 'The public-by-construction exclusions from CLASSIFY-CREDENTIAL-PUBLIC-FILE-EXCLUSION-001 apply unchanged to every newly covered verb: templates and *.pub files stay readable through head/cp/base64 as they do through cat.'
acceptance:
  - id: A1
    given: 'a credential file read through a newly covered verb (head .env, tail -n 5 .env, less .env, more .env, base64 .env, xxd .env, od -c .env, strings .env, cp .env /tmp/x)'
    when: 'the classifier runs'
    then: 'each denies as a credential read'
  - id: A2
    given: 'a conventionally-public file read through a newly covered verb (head .env.example, cp .env.example /tmp/x, base64 ~/.ssh/id_rsa.pub)'
    when: 'the classifier runs'
    then: 'none denies as a credential read — the exclusion is verb-independent'
  - id: A3
    given: 'the security-check forms `git ls-files | grep -E "\.env"` and `grep -rn "\.env" .gitignore`'
    when: 'the classifier runs'
    then: 'both are allowed — the exact regression this selector must never cause'
  - id: A4
    given: 'unquoted prose naming a read verb and a credential token (`git commit -m add more .env handling`)'
    when: 'the classifier runs'
    then: 'it does not deny as a credential read — command-position anchoring holds'
  - id: A5
    given: 'the pre-fix classifier against the A1 set'
    when: 'the new tests run before the selector change'
    then: 'they fail, demonstrating the gap is real rather than asserted'
  - id: A6
    given: 'a command naming a template alongside a real credential through a new verb (head .env.example .env.local)'
    when: 'the classifier runs'
    then: 'it still denies'
observability:
  - 'Each verb returns the same "credential file read" reason and regex source as cat, so the block message and the latch path are unchanged.'
rollback:
  - 'Revert the commit; the selector returns to cat-only and the newly covered verbs are admitted again. Rerun the classifier pytest tier plus caws doctor.'
non_functional:
  security:
    - 'Strictly additive on coverage: no command that denies today is admitted by this change, and the A3 negatives pin the one class the change must never capture. The residual (pattern-argument reads through grep/sed/awk) is stated in the invariants rather than silently dropped.'
  reliability:
    - 'One anchored alternation added to an existing pattern; no I/O, no new decision branch, and the classifier remains a pure function of command text.'
contracts:
  - name: 'credential-read-verb-coverage'
    type: contract-test
    path: 'packages/caws-cli/tests/hooks/pytest/test_classify_command.py'
    description: 'Every newly covered verb denies on a real credential and clears on a template; the grep security-check forms stay allowed; unquoted prose does not match; mixed commands still deny.'
