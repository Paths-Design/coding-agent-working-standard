id: CAWS-FIX-N5-MERGE-IDEMPOTENT-CLOSE-001
title: 'Idempotent close step in caws worktree merge for already-closed spec'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-08-02T20:58:03.182Z'
updated_at: '2026-08-02T20:58:35.195Z'
blast_radius:
  modules:
    - packages/caws-cli/src/store/worktrees-writer.ts
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
