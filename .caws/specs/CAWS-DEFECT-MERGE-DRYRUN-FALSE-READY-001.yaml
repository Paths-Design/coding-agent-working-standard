id: CAWS-DEFECT-MERGE-DRYRUN-FALSE-READY-001
title: 'merge --dry-run reports can_proceed:true for a merge that then fails on conflict'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: i-merge-dryrun
created_at: '2026-08-19T17:26:10.422Z'
updated_at: '2026-10-05T06:39:46.504Z'
blast_radius:
  modules:
    - 'caws-cli/store (worktrees-writer, mergeWorktree dry-run)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/worktrees-writer.ts'
    - 'packages/caws-cli/tests/store/worktree-merge-dry-run-conflict.test.js'
    - packages/caws-cli/tests/shell/release-runtime-contracts.test.js
  out: []
invariants:
  - 'A readiness check that cannot detect the most common failure mode must say what it does NOT check, rather than reporting an unqualified ready.'
acceptance:
  - id: A1
    given: 'a worktree branch that conflicts with its base'
    when: 'caws worktree merge <name> --dry-run runs'
    then: >-
      it does not report an unqualified ready: it either names the conflicting paths
      or states explicitly that conflict detection was not performed
  - id: A2
    given: 'a dry-run that reports ready'
    when: 'the real caws worktree merge runs immediately after, with no intervening base movement'
    then: 'the merge succeeds and lands the commit the preview described'
non_functional: {}
contracts: []
