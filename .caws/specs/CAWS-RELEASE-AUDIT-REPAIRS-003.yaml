invariants:
  - 'No lowered gate floors, fabricated evidence, publication, foreign ownership takeover, or weakened guarded-write enforcement'
  - 'Generated logs remain ignored and evidence is tied to observed commands and candidate bytes'
acceptance:
  - id: A1
    given: 'a fresh checkout'
    when: 'release qualification setup and checks run'
    then: 'root dependency audit resolves correctly, documentation prerequisites exist before tests, and all mutation sources have an explicit proof strategy'
  - id: A2
    given: 'committed branch work, staged changes and Git read failures'
    when: 'scope gates run'
    then: 'the caller change basis is recorded and out-of-scope work or unavailable evaluation cannot report pass'
  - id: A3
    given: 'a conflicting lane and a clean lane'
    when: 'merge dry-run executes'
    then: 'conflicts are reported, clean readiness is accurate, and refs and worktree bytes remain unchanged'
  - id: A4
    given: 'an unknown hook event and valid lifecycle failures'
    when: 'the installed adapter runs'
    then: 'invalid invocation fails and legitimate lifecycle degradation preserves its intended nonblocking behavior'
  - id: A5
    given: 'a fixture-owned sentinel and hostile nodeid'
    when: 'evidence runners execute or a deliberate shell execution control runs'
    then: 'safe execution preserves the sentinel and the unsafe control is detected'
  - id: A6
    given: 'Python caches and real renderer output'
    when: 'a candidate is packed and rendered turns validated'
    then: 'no bytecode enters the package and null summaries and lineage validate while invalid shapes remain rejected'
  - id: A7
    given: 'the candidate dependency graph'
    when: 'workspace and detached production audits run'
    then: 'findings are remediated without unsupported downgrades and any unresolved vulnerability blocks release readiness'
  - id: A8
    given: 'current implementation and registry observations'
    when: 'release guidance and notes are inspected'
    then: 'docs describe shipped commands and bounded goals, registry discrepancy is accounted for, and missing remote or native evidence is explicit'
  - id: A9
    given: 'repository agent instructions, contributor guidance and shipped agent templates'
    when: 'the coding-rigor standard is read and consumer docs are staged'
    then: >-
      each entry point carries acceptance, falsification, evidence and authorization
      requirements; the detailed guide is reachable through repo links and shipped
      consumer docs; documentation checks pass without claiming native adoption or
      release qualification
observability:
  - 'Retain commands, exit statuses, logs, fixture state and checksums under ignored canonical evidence storage'
rollback:
  - 'Revert each logical source commit before publication; do not alter registry versions or installed shared runtime'
non_functional: {}
