id: CAWS-RELEASE-RC3-RECONCILE-001
title: 'Reconcile the 12.2.0-rc.3 release lane with main and close its landing defects'
mode: fix
lifecycle_state: draft
created_at: '2026-11-12T00:15:41.501Z'
updated_at: '2026-11-12T00:15:41.501Z'
created_by_session: 'deaedad6-08fd-476d-aa81-63eb16583115'
blast_radius:
  modules:
    - 'release lane: native runtime identities, lifecycle lock, lifecycle outcome reporting, release qualification'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/'
    - 'packages/caws-native/'
    - 'scripts/'
    - '.github/workflows/'
    - 'docs/'
  out: []
invariants:
  - 'Where a native route and the shell handler on main disagree, the shell handler answers: the native route matches it or declines.'
  - 'A lifecycle refusal names what is in the way; an effect that landed is never reported as refused.'
acceptance:
  - id: A1
    given: 'shell handlers changed on main after the native code was reviewed'
    when: 'the merged runtime selects a handler'
    then: 'the native route answers only for its reviewed bytes and the shipped bytes run the shell handler, with the pack version and fingerprint recomputed'
  - id: A2
    given: 'the same payload sent to a native file-tool route and to the shell guard it replaces'
    when: 'both answer'
    then: 'a test compares them and each route that disagrees is fixed or declines'
  - id: A3
    given: 'a lifecycle lock whose reclaimer died, or one briefly held by a neighbor'
    when: 'a lifecycle command or a merge publication runs'
    then: 'the abandoned marker is cleared once aged with a dead owner, brief contention is waited out, and a refusal names the holder'
  - id: A4
    given: 'a lifecycle effect that landed followed by a failed hook verdict'
    when: 'the lifecycle command reports'
    then: 'it reports that the effect landed and must be inspected before any retry, not a refusal'
  - id: A5
    given: 'a tarball qualified by the release workflow'
    when: 'the release job publishes'
    then: 'it publishes that tarball by digest, and the upgrade qualifier performs a real guarded write whose refusal leaves the protected bytes unchanged'
non_functional: {}
contracts: []
