invariants:
  - >-
    HARNESS-AGNOSTIC CORE. The persistence format (agent-pid-<pid>.json), the
    read tiers (TS + shell), and the freshness/repo/start-time validation know
    NOTHING about process names or harness identity. They consume a record
    keyed by an integer PID and validate it. A new harness works the moment its
    adapter can name its agent ancestor — no core change required.
  - >-
    SURFACE ADAPTER OWNS THE ONLY HARNESS-SPECIFIC KNOWLEDGE. agent-surface.sh
    gains one column: CAWS_AGENT_PROCESS_NAMES — the basename(s) that identify
    the agent ancestor in the PID tree for that surface (zcode → zcode-cli;
    claude-code → claude; codex → codex; etc.). This is the SINGLE place a new
    harness's process name is registered, mirroring how CAWS_VENDOR_DIR /
    CAWS_PLATFORM_FLAG are already per-surface columns in the same case block.
  - >-
    NEVER NEWEST-WINS, NEVER CROSSES OWNERSHIP. The agent PID is a property of
    the CALLING process tree, not a last-writer-wins singleton. Session A's
    PID-walk lands on A's agent process, never B's, so A cannot read B's
    record. Two concurrent sessions have distinct agent PIDs and each reads
    only its own.
  - >-
    FAIL-OPEN. A missing record, an unfound agent ancestor (unknown surface or
    unsupported platform), a stale record, or a PID-reuse start-time mismatch
    falls through to the existing env→envelope→capsule chain. No new refusal
    modes are introduced; existing A3 ambiguity-refusal behavior is preserved
    when no agent-PID record matches.
  - >-
    PID-REUSE GUARDED BY START-TIME. The record stores the agent process's
    start time (started_at); the read side validates the live process at that
    PID still has a matching start time before trusting the record. This closes
    the residual PID-reuse window that a freshness floor alone leaves.
  - >-
    SHELL + TS PARITY. The shell resolver (lib/session-id.sh) and the TS
    resolver (resolve-session.ts) gain the agent-PID tier at the SAME
    precedence position — after env vars, before the durable-envelope scan
    (TS) / capsule fallback (shell). The byte-identical-parity discipline
    between the two resolvers is preserved.
  - >-
    SHARED_PACK_VERSION bumps alongside the shared-lib edits, and the shared
    entry in tests/init/pack-fingerprints.json is recomputed. The
    growth-doctrine header invariant (edit_stance present; parseManagedHeader
    resolves) holds on each edited hook after the edit.
acceptance:
  - id: A1
    given: >-
      A zcode agent session at the CANONICAL checkout (cwd = repoRoot, not
      inside any worktree), with NO per-surface session env var set (the
      verified ZCode reality), AND a fresh agent-pid-<pid>.json record written
      by the hook naming THIS session's id, AND ≥2 fresh durable envelopes in
      the repo (the multi-session norm).
    when: >-
      the agent runs a governed-write CLI command (e.g. `caws worktree merge`)
      and the TS resolver reaches identity resolution.
    then: >-
      resolveSession resolves to the agent-PID record's session_id via the new
      tier — BEFORE the ≥2-envelope scan — and does NOT refuse with
      SESSION_DURABLE_ENVELOPE_AMBIGUOUS. This is the canonical-checkout case
      CAWS-RESOLVER-CWD-OWNERSHIP-CORROBORATION-001 deliberately left open.
  - id: A2
    given: >-
      The same canonical-checkout zcode session, with the agent-PID record
      present.
    when: >-
      the bash-write-guard fires on a `git commit` and resolves
      CAWS_ORACLE_SESSION_ID via lib/session-id.sh.
    then: >-
      resolve_caws_session_id returns the agent-PID record's session_id via the
      new shell tier — BEFORE the capsule fallback — so the oracle compares
      against the correct owner and owner-self recognition works. (The oracle
      itself is unchanged.)
  - id: A3
    given: >-
      Two concurrent sessions (A, B) with distinct agent PIDs and distinct
      agent-pid records, both at canonical checkout.
    when: >-
      each resolves its session identity.
    then: >-
      each resolves to its OWN record (A→A, B→B), never the sibling's —
      because each PID-walk lands on its own agent process. No ownership
      crossing.
  - id: A4
    given: >-
      A record whose agent_pid has been reused by a DIFFERENT process (the OS
      recycled the PID after the agent exited) — the live process at that PID
      has a different start time than the record's started_at.
    when: >-
      the resolver reads the record.
    then: >-
      it treats the record as invalid (start-time mismatch) and falls through
      to the existing chain. It does NOT resolve to the reused PID's record.
  - id: A5
    given: >-
      An unknown surface or a platform where ps is unavailable, such that the
      PID-walk finds no agent ancestor.
    when: >-
      the resolver attempts the agent-PID tier.
    then: >-
      it fail-opens (returns no identity from this tier) and falls through to
      the existing chain. No refusal, no crash.
  - id: A6
    given: >-
      A caller inside a BOUND WORKTREE (covered by the prior cwd-ownership
      fix, 1aa014c3).
    when: >-
      the agent-PID tier is also present.
    then: >-
      the agent-PID tier resolves first (broader signal); the cwd-ownership
      path remains as a corroborator in the >=2-envelope branch. Worktree
      residents are unaffected — they still resolve, now one tier earlier.
