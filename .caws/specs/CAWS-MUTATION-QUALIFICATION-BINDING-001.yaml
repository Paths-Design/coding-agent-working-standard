id: CAWS-MUTATION-QUALIFICATION-BINDING-001
title: 'Bind ordinary mutation qualification to observed source and build inputs'
mode: fix
lifecycle_state: active
worktree: mutation-qualification-binding
created_at: '2026-10-22T05:50:50.804Z'
updated_at: '2026-10-22T05:51:09.375Z'
created_by_session: '01a157bd-8bb6-7fc1-9322-6120a73b5a72'
blast_radius:
  modules:
    - 'Mutation runner, report assertion and sandbox build topology'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/package.json'
    - 'packages/caws-cli/scripts/run-mutation.mjs'
    - 'packages/caws-cli/scripts/stryker-config.cjs'
    - 'packages/caws-cli/scripts/assert-mutation-report.mjs'
    - 'packages/caws-cli/tests/ci/mutation-contract.test.js'
    - 'packages/caws-cli/scripts/mutation-input-identity.mjs'
  out: []
invariants:
  - 'Preserve all mutation policy target/test sets, per-file floors, perTest coverage, incremental=false and concurrency=2; no production license ownership weakening.'
  - 'Offline score calculation remains explicit; supplied SHA is descriptive and does not attest Git or actual module loading.'
acceptance:
  - id: A1
    given: 'offline and bound report fixtures'
    when: 'report scoring is invoked'
    then: 'offline scoring remains available and bound qualification refuses mismatched or missing original source/test text and empty selected-test discovery.'
  - id: A2
    given: 'normal outer and sandbox builds under one mutation invocation'
    when: 'inputs, build associations or outcomes are missing stale changed or failed'
    then: 'qualification refuses and retains actual command outcomes and observed input/output identities.'
  - id: A3
    given: 'a staged package with nonportable license ownership records'
    when: 'the mutation sandbox is formed'
    then: 'copied markers and locks are excluded and sandbox staging resolves canonical repository inputs with symlink-parent refusal and bounded cleanup.'
  - id: A4
    given: 'candidate mechanics and hostile controls'
    when: 'serial focused checks run'
    then: 'declared source/test/floor/concurrency settings remain unchanged and stronger actual module-load and full mutation qualification remain explicitly unverified.'
observability:
  - 'Run-associated source/build/report identities, real child argv/cwd/status and retained failure paths'
rollback:
  - 'Revert the bounded source commit through normal governed history; retain raw failed and successful evidence.'
non_functional:
  security:
    - 'Reject uncertain sandbox ancestry and input/report mismatch without trusting report-supplied roots.'
contracts:
  - name: 'mutation-qualification'
    type: behavior
