id: CAWS-TS7-MODULE-RESOLUTION-001
title: 'Typecheck configs load under TypeScript 7 resolution modes'
mode: chore
lifecycle_state: active
worktree: ts7-module-resolution
created_at: '2026-11-11T04:18:20.864Z'
updated_at: '2026-11-11T04:18:35.938Z'
created_by_session: 'ffa00c0e-9de5-4f86-a2af-764bbae875b0'
blast_radius:
  modules:
    - 'packages/caws-cli typecheck and build configuration'
    - 'packages/caws-cli/src/shell/analysis parser type imports'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/tsconfig.vnext.json'
    - 'packages/caws-cli/tsconfig.vnext.test.json'
    - 'packages/caws-cli/tsconfig.kernel-test.json'
    - 'packages/caws-cli/tests/transcripts/tsconfig.json'
    - 'tsconfig.json'
    - 'packages/caws-cli/src/shell/analysis/parser-types.ts'
  out: []
invariants:
  - 'The installed compiler stays typescript ^5 and no dependency or lockfile entry changes'
  - 'Runtime loading of unbash is unchanged: load-parser.js keeps its native dynamic import'
  - 'No tsconfig strictness flag is removed or weakened'
acceptance:
  - id: A1
    given: 'the four caws-cli typecheck projects (tsconfig.vnext.json, tsconfig.vnext.test.json, tsconfig.kernel-test.json, tests/transcripts/tsconfig.json) at the lane head'
    when: 'a TypeScript 7.1 compiler (tsrs 0.24.0-ts7.1.0-beta and official typescript 7.1.0-beta) runs each with --noEmit and no command-line option overrides'
    then: 'every run exits 0 with zero diagnostics, and restoring the removed moduleResolution value makes the run fail with TS5108'
  - id: A2
    given: 'the same four projects at the lane head'
    when: 'the installed typescript 5.9 compiler runs the package typecheck script'
    then: 'it exits 0 with zero diagnostics'
  - id: A3
    given: 'parser-types.ts at the lane head'
    when: 'its unbash type import is resolved under a resolution mode that honours package exports'
    then: 'it resolves through an entry the unbash exports map declares, and restoring the unbash/dist/types specifier makes a TypeScript 7.1 run fail with TS2307'
  - id: A4
    given: 'the base revision and the lane head built with the installed typescript 5.9 compiler'
    when: 'tsc -p tsconfig.vnext.json emits into separate output directories'
    then: >-
      every emitted .js file is byte-identical, and the only differing declaration
      output is parser-types.d.ts (with its .d.ts.map), whose sole change is the
      unbash import specifier
  - id: A5
    given: 'the lane head'
    when: 'the jest projects that compile through these configs run (the kernel ts-jest project and the transcripts foundation test)'
    then: 'they pass with the same test counts as the base revision'
rollback:
  - 'Revert the lane merge commit, which returns the configs to moduleResolution Node and the deep unbash type import'
non_functional: {}
contracts:
  - name: 'typecheck-configs'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "At 39cb6b379, cwd packages/caws-cli: tsrs 0.24.0-ts7.1.0-beta and typescript 7.1.0-beta (installed outside the repo in ~/.cache/tsrs-trial) ran -p <cfg> --noEmit on tsconfig.vnext.json, tsconfig.vnext.test.json, tsconfig.kernel-test.json and tests/transcripts/tsconfig.json with no overrides: 8 runs, exit 0, zero output lines. Counterexample: --moduleResolution node10 gave TS5108 on both compilers. Not rederivable in-repo: no TypeScript 7 compiler is a repo dependency."
    recorded_at: "2026-11-11T09:15:55.018Z"
    commit_sha: "39cb6b379"
  - criterion_id: A2
    status: pass
    evidence_ref: "At 39cb6b379, cwd packages/caws-cli, installed typescript 5.9.2: npm run typecheck (tsc -p tsconfig.vnext.test.json, tsconfig.kernel-test.json, tests/transcripts/tsconfig.json --noEmit) exit 0 with no diagnostics. tsc -p tsconfig.vnext.json --noEmit also exit 0."
    recorded_at: "2026-11-11T09:15:56.328Z"
    commit_sha: "39cb6b379"
  - criterion_id: A3
    status: pass
    evidence_ref: "parser-types.ts:13 imports from 'unbash', whose package.json exports['.'].types is ./dist/parser.d.ts (which has export type * from ./types.ts). Counterexample run at the lane head with 'unbash/dist/types' temporarily restored: tsc 5.9.2, typescript 7.1.0-beta and tsrs each reported 11 errors including parser-types.ts(13,8) TS2307. Restored before commit."
    recorded_at: "2026-11-11T09:15:57.857Z"
    commit_sha: "39cb6b379"
  - criterion_id: A4
    status: pass
    evidence_ref: "tsc 5.9.2 -p tsconfig.vnext.json --outDir at base 296101840 and at the lane head, 1312 files each. diff -rq reported only shell/analysis/parser-types.d.ts and parser-types.d.ts.map. The .d.ts diff is one line: the specifier 'unbash/dist/types' became 'unbash'. Output trees live outside the repo in ~/.cache/tsrs-trial/emit-base and emit-head."
    recorded_at: "2026-11-11T09:15:59.888Z"
    commit_sha: "39cb6b379"
  - criterion_id: A5
