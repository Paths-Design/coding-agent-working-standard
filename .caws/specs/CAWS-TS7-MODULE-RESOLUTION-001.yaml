    evidence_ref: "At 39cb6b379: npx jest --selectProjects kernel passed 35 suites / 820 tests, and tests/transcripts/foundation.test.js passed 1/1. Comparison run on main 7d11512a7 (base plus 12 commits, none touching kernel or transcripts): 35 suites / 820 tests and 1/1. Also passed on the lane: native-test-preparation, command-analysis, hooks-inspection-prefix (1408 tests with foundation). The full jest suite was not run."
    recorded_at: "2026-11-11T09:16:01.510Z"
    commit_sha: "39cb6b379"
