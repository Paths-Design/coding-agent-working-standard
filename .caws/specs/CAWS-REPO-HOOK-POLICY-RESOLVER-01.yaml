  out: []
invariants:
  - 'A repo-tier policy can never remove, no-op or replace a handler on REPO_POLICY_FLOOR. Replacing a floor handler with a stub is observationally equivalent to disabling it, so the floor gates disabled and handlers alike.'
  - 'The floor binds the repo tier only. Machine state keeps its existing unrestricted power, because an operator changing their own machine is the sanctioned escape hatch; a committed team file that reaches every clone is not.'
  - 'A malformed, over-authority or floor-violating document yields zero applied entries, never a partial application. Ignoring a repo policy is always the stricter direction, so fail-closed costs nothing in enforcement.'
  - 'An absent policy file is {}, not an error: a repo that never opts in must resolve byte-identically to the stock chain.'
  - 'Repo entries resolve before machine entries, so an operator can locally silence a team extension but a committed team file cannot reach into an operator local addition.'
acceptance:
  - id: A1
    given: 'a repo hook-policy document naming a handler on REPO_POLICY_FLOOR under surfaces.<s>.disabled, or remapping that basename under surfaces.<s>.handlers'
    when: 'the validator runs over the document'
    then: 'both forms are rejected by the same floor check and no entry from the document is applied'
  - id: A2
    given: 'no .caws/hooks/hook-policy.json on disk'
    when: 'the loader runs'
    then: 'it returns an empty policy and the resolver output is byte-identical to the stock chain, so a repo that never opts in is unaffected'
  - id: A3
    given: 'a document that is unparseable JSON, carries an unknown top-level key, or declares one valid and one invalid entry'
    when: 'the validator runs'
    then: 'it fails closed and applies zero entries rather than the valid subset, so a partially-authored policy cannot silently half-apply'
  - id: A4
    given: 'a repo policy and a machine policy that both disable and extend the same event'
    when: 'the resolver merges them'
    then: 'the repo tier resolves first and the machine tier second, and a handler duplicated across the two tiers fails closed rather than being spliced twice'
  - id: A5
    given: 'a v1 document that declares the guards key while the resolver implements only surfaces'
    when: 'the validator runs'
    then: 'the document validates, because all three top-level keys are admitted in v1 so a later guards implementation cannot hard-block a repo pinned to this runtime'
non_functional:
  reliability:
    - 'Absent-file cost is a single stat; an absent policy must not add a parse or a subprocess to any dispatch.'
  security:
    - 'The floor and the fail-closed posture are the authority boundary: a repo-authored document must not be able to reduce the guard set below the handlers that make the policy reviewable and its staleness observable.'
contracts:
  - name: 'hook-policy-document'
    type: schema
    description: 'The v1 .caws/hooks/hook-policy.json document shape: version, surfaces (disabled/extensions/handlers/libraries/forks per surface, with a default surface), and guards. additionalProperties false throughout.'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "jest tests/init/repo-hook-policy.test.js, describe 'A1: a repo policy cannot remove or no-op a floor handler' — 8 arms. Both forms are rejected by the SAME floor check: 3 test.each arms over REPO_POLICY_FLOOR for surfaces.default.disabled, and 3 more for surfaces.default.handlers, because replace-with-a-stub is observationally equivalent to disable and gating only disabled would leave the bypass one key away. A membership arm pins the floor to exactly agent-register.sh, block-dangerous.sh, protected-paths.sh and asserts scope-guard.sh is NOT on it. A discrimination control disables and remaps a NON-floor guard expecting ok:true — without it every arm above would pass on an implementation that rejected all disabled/handlers entries outright. MUTATION-VERIFIED: negating the handlers-side floor check to 'if (false && ...)' turned exactly 4 tests red (the 3 remapping arms plus A3's all-or-nothing arm, whose fixture is a floor violation) and left the other 31 green, so the arms discriminate that branch rather than passing on ambient behavior. Full file 35/35; full suite 240 suites / 3036 tests; typecheck 0."
