id: CAWS-HOOKS-GUARD-CONFIG-VISIBILITY-PARITY-01
title: 'Make tier-2 guard config readable, and pin the two allow tables'' declared relationship'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-guard-visibility
created_at: '2026-09-19T02:41:51.054Z'
updated_at: '2026-09-19T02:42:00.129Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'caws hooks list renderer + shared allow-table parity check'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/hooks.ts'
    - 'packages/caws-cli/tests/shell/hooks-readonly.test.js'
    - 'packages/caws-cli/tests/hooks/guard-table-parity.test.js'
  out: []
invariants:
  - 'The tier-2 ''reason'' field is REQUIRED at authoring (>=12 chars, enforced by parseRepoHookPolicy) but is currently read by nothing — a required field with zero readers is theater, and it is the field the anti-abuse doctrine relies on a reviewer seeing. Rendering it is what makes the requirement load-bearing.'
  - 'The parity check must pin a DECLARED RELATIONSHIP, not equality. scope-guard.sh answers ''is this path scope-exempt?'' and write-allowlist.sh answers ''may I write here outside my worktree?'' — so tests/ and scripts/ are correctly scope-only, and .github/, .githooks/ and .gitignore are correctly write-only. Asserting equality would encode a false invariant and force a wrong fix.'
  - 'hooks list stays read-only and always exits 0: it is explanatory, never enforcing, and must remain usable against a repo the operator does not want to change.'
acceptance:
  - id: A1
    given: 'a repo whose hook-policy.json declares guards.scope-guard.sh.additional_allow_prefixes with a reason'
    when: 'caws hooks list runs'
    then: 'the prefix AND its reason are rendered, so the justification the parser demands is visible to a reviewer'
  - id: A2
    given: 'the same repo'
    when: 'caws hooks list --json runs'
    then: 'the tier-2 guard config appears in the JSON contract alongside the chain, keyed so a consumer can tell a configured entry from a shipped one'
  - id: A3
    given: 'the shipped scope-guard.sh and write-allowlist.sh allow tables'
    when: 'guard-table-parity.test.js runs'
    then: 'it asserts the declared shared set and each side''s declared extras, and FAILS when either table gains or loses an entry that the declaration does not account for'
  - id: A4
    given: 'a repo with no guards block'
    when: 'caws hooks list runs'
    then: 'it renders the chain exactly as before and says nothing about tier-2 config — opting out costs no output'
non_functional: {}
contracts:
  - name: 'hooks-list-guards'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "hooks-readonly.test.js arms 'A1: the prefix AND the reason the parser demanded are both rendered' and 'A1: a threshold renders its value AND that env still outranks it'. Run: cd packages/caws-cli && npx jest tests/shell/hooks-readonly.test.js -> 37/37 pass. Live artifact captured by spawning the built dist CLI against a fixture repo declaring guards['scope-guard.sh'].additional_allow_prefixes=[{prefix:'native/',reason:'The Rust core lives in native/; this repo has no src/ at all.'}]; stdout contained 'guard configuration (tier 2 - data a guard reads, not which run)' then '  scope-guard.sh' then '    allow-prefix native/ - The Rust core lives in native/; this repo has no src/ at all.'. The threshold arm pins both the value ('threshold loc = 2500') and the precedence note (/env overrides/i), because precedence is env > config > shipped default and a reader comparing the rendered number against observed behavior would otherwise conclude the config was ignored when an env var simply won. FALSIFICATION RUN: mutating the renderer from 'allow-prefix ${entry.prefix} - ${entry.reason}' to 'allow-prefix ${entry.prefix}' and rebuilding dist turned exactly one arm red with the diagnostic 'Expected substring: \"The Rust core lives in native/; this repo has no src/ at all.\"', proving the reason field itself is pinned and not merely the section heading."
    recorded_at: "2026-09-19T03:14:20.079Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-readonly.test.js
    commit_sha: "6d1d092e"
  - criterion_id: A2
    status: pass
    evidence_ref: "hooks-readonly.test.js arms 'A2: --json carries guards under its OWN key, not folded into the chain' and 'A2: the JSON ordering is deterministic, so a diff of two runs is signal'. Run: cd packages/caws-cli && npx jest tests/shell/hooks-readonly.test.js -> 37/37 pass. The first arm asserts the exact top-level guards array [{guard:'loc-delta-check.sh',prefixes:[],thresholds:[['delta',400]]},{guard:'scope-guard.sh',prefixes:[{prefix:'native/',reason:...}],thresholds:[]}] AND asserts the tier-1 views do NOT contain it: JSON.stringify(parsed.declared) and JSON.stringify(parsed.events) are both required not to contain 'native/', which is what pins the keying distinction between 'this guard was added or removed' (tier 1, surface-scoped) and 'this guard reads extra data' (tier 2, top-level). The second arm runs the CLI twice over one fixture and requires byte-identical stdout plus an explicitly sorted guard and threshold order, so a review diff of two runs is signal rather than JSON insertion-order noise."
    recorded_at: "2026-09-19T03:13:46.762Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-readonly.test.js
    commit_sha: "6d1d092e"
  - criterion_id: A3
    status: pass
    evidence_ref: "guard-table-parity.test.js, 6 arms, all passing. Run: cd packages/caws-cli && npx jest tests/hooks/guard-table-parity.test.js -> 6/6 pass. It parses ALLOW_PREFIXES out of templates/hook-packs/shared/scope-guard.sh and the admit case out of shared/lib/write-allowlist.sh, then asserts each equals SHARED_ENTRIES ['.caws/','<vendor>/','docs/','tmp/','.archive/'] plus that side's declared extras: SCOPE_GUARD_ONLY {tests/,scripts/} and WRITE_ALLOWLIST_ONLY {.gitignore,.tmp/,.githooks/,.github/}. toEqual on a sorted array means a gained OR lost entry on either side fails. Equality between the tables is deliberately NOT asserted - scope-guard answers 'is this path scope-exempt?' and write-allowlist answers 'may I write here outside my worktree?', so the asymmetries are correct and each carries a >=12-char reason mirroring the floor the policy parser imposes. Three further arms defend the assertion itself: the two declared-extras sets must be DISJOINT (a double-claimed entry would let both equality arms pass over a self-contradictory declaration), each parser must find >=5 entries including '.caws/' (both return [] on a regex miss, which would otherwise pass vacuously against an empty expectation), and the '.caws/worktrees/*) return 1' EXCLUSION must be present and must not be parsed as an admitted entry. That non-vacuity arm found a real parser defect while this was written: write-allowlist.sh has three 'case $file_path in' blocks (normalizer, return-1 exclusion, return-0 admit) and indexOf selected the normalizer, reporting 1 entry; the parser now selects the block by the property unique to it and throws naming itself if that selection is ambiguous."
    recorded_at: "2026-09-19T03:13:58.398Z"
    artifact_path: packages/caws-cli/tests/hooks/guard-table-parity.test.js
    commit_sha: "6d1d092e"
  - criterion_id: A4
    status: pass
    evidence_ref: "hooks-readonly.test.js arms 'A4: opting out of tier 2 costs NO output - byte-identical to no guards key', 'A4: a guard entry declaring nothing is not rendered as an empty heading', and the control 'the section is not unconditional: it appears only when tier 2 has content'. Run: cd packages/caws-cli && npx jest tests/shell/hooks-readonly.test.js -> 37/37 pass. The A4 claim is asserted as a DIFFERENCE, not as the absence of a marker string: the same fixture is rendered with the guards key absent entirely and with guards:{} and the two stdouts are required to be byte-identical, which a renderer emitting a differently-worded empty section would fail. FALSIFICATION RUN: mutating guardConfigRows to 'return null' unconditionally and rebuilding dist turned 5 arms red (both A1 arms, both A2 arms, and the non-vacuity control) while BOTH A4 arms stayed green - correctly, since they assert absence and a dead renderer also satisfies absence. That asymmetry is exactly why the 'not unconditional' control exists and is the only thing separating 'opting out costs no output' from 'the feature silently stopped working'. A related arm pins that an INVALID policy also renders no tier-2 rows and list still exits 0, because a malformed document applies zero entries and displaying its contents would advertise configuration no guard will apply."
    recorded_at: "2026-09-19T03:14:08.842Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-readonly.test.js
    commit_sha: "6d1d092e"