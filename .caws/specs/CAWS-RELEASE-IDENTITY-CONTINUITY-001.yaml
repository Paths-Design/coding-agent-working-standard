invariants:
  - 'A worktree owner or uncorroborated neighboring capsule is not proof of the invoking session'
acceptance:
  - id: A1
    given: 'a real Git project and a create command with no native identity source'
    when: 'the operator executes the exact continuation printed by successful creation'
    then: 'claim resolves the created identity across directories without a second mint or a takeover'
  - id: A2
    given: 'an owned worktree and no stable invoking identity'
    when: 'ordinary claim is requested'
    then: 'it refuses without minting a capsule or mutating ownership, and foreign-owner controls remain refused'
  - id: A3
    given: 'native identity context, explicit takeover intent and a path containing shell punctuation'
    when: 'create and claim execute through their documented command surfaces'
    then: >-
      native behavior remains supported, fallback output is safely quoted, and
      successful audited takeover exposes its minted continuation before ancillary
      failure; a metadata failure keeps its nonzero result without fabricating a
      lease or reversing ownership
  - id: A4
    given: 'an existing owned worktree with neighboring cached identities'
    when: 'ensure or another lifecycle command compares the invoking caller to the owner'
    then: >-
      only caller-carried identity or a process record with valid matching start
      identities on both sides admits; absent, null, or malformed correlation
      evidence and foreign callers refuse without minting, while successful ensure
      prints an executable identity-preserving continuation
observability:
  - 'Rendered create continuation command and claim refusal identify missing session context without claiming ownership'
rollback:
  - 'Revert the reviewed command and fixture change together; never alter existing ownership records'
non_functional:
  security:
    - 'Do not broaden candidate admission or permit a foreign takeover without explicit takeover intent'
