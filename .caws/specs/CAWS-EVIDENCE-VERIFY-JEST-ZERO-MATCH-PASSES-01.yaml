id: CAWS-EVIDENCE-VERIFY-JEST-ZERO-MATCH-PASSES-01
title: 'specs evidence --verify and verify-acs --run report a jest citation verified when its name pattern executed zero tests'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-23T18:11:47.762Z'
updated_at: '2026-09-23T18:11:47.762Z'
created_by_session: '24846b74-e4d2-4ea1-9974-a1f681aaad88'
blast_radius:
  modules:
    - 'caws-cli/store (evidence-rederive)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/evidence-rederive.ts'
    - 'packages/caws-cli/tests/shell/specs-evidence-verify.test.js'
    - 'packages/caws-cli/tests/shell/specs-verify-acs.test.js'
  out: []
invariants:
  - 'A jest citation re-derives as verified only when the run''s result shows the cited test executed and passed; a run in which the cited name selected zero tests is never verified.'
  - 'The node-runner zero-match guard (tapHasResultFor) is unchanged; the jest path gains the equivalent guard rather than a second definition of success.'
acceptance:
  - id: A1
    given: 'a jest test file whose test.each name is the template literal ''%s: x'', cited by that literal'
    when: 'caws specs evidence --ac A1 --status pass --test-nodeid <file>::''%s: x'' --verify runs'
    then: 'nothing is recorded and the refusal says the pattern executed zero tests (observed 2026-09-23: jest -t selected 0 of 15, all skipped, exit 0, and the verifier printed ''verified (passed)'')'
  - id: A2
    given: 'a cited jest test name that matches exactly one test which passes'
    when: 'caws specs verify-acs <id> --run runs'
    then: 'the criterion is verified, and the detail states that one test executed'
  - id: A3
    given: 'a cited jest name that the static finder resolves but that jest selects no test for'
    when: 'verify-acs --run runs'
    then: 'the outcome is refuted or not_rederived, never verified'
non_functional: {}
contracts:
  - name: 'ac-rederive-jest-executes-cited-test'
    type: behavior
