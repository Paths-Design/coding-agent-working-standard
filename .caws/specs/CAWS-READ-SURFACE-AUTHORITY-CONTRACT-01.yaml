id: CAWS-READ-SURFACE-AUTHORITY-CONTRACT-01
title: 'One contract declares what every CAWS read surface may assert about session, worktree, spec, ownership and liveness — and forbids asserting absence for a fact it has no writer for'
risk_tier: 3
mode: doc
lifecycle_state: active
worktree: wt-read-surface-contract
created_at: '2026-09-19T09:49:31.761Z'
updated_at: '2026-09-19T09:49:41.944Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'caws-cli read surfaces (status, doctor, agents, specs, worktree, claim, goal, working-tree, message)'
    - 'docs/architecture doctrine set'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'docs/architecture/read-surface-authority.v1.yaml'
    - 'docs/architecture/caws-vnext-command-surface.md'
  out: []
invariants:
  - 'Exactly one surface is named authoritative for each fact domain; every other surface that prints that fact is declared a derived reader of it. Two surfaces may not both claim authority over one fact.'
  - 'A surface may never assert the ABSENCE of a fact it has no writer for. Unsourced renders as unknown or is omitted; (no worktree) style assertions are prohibited because they are indistinguishable from a true negative.'
  - 'Identity domains do not collapse: a persisted status field is not a TTL classification, spec authorship is not spec binding, and current working directory is not a binding.'
  - 'The contract governs what surfaces MAY ASSERT. It confers no authority, changes no renderer, and cannot make a cache authoritative.'
acceptance:
  - id: A1
    given: 'the live command surface'
    when: 'the contract is read'
    then: 'every read surface is listed with its subject, authority_tier, and an explicit is_not clause, so no surface''s scope has to be inferred from its name'
  - id: A2
    given: 'a fact domain such as worktree ownership or liveness'
    when: 'the contract is read'
    then: 'exactly one surface is named authoritative for it and every other surface printing it is named a derived reader, with the authority source file identified'
  - id: A3
    given: 'a fact for which no writer exists, such as lease bound_worktree'
    when: 'a surface renders it'
    then: 'the contract requires unknown or omission and prohibits asserting absence, citing agents list (no worktree) as the worked example of the prohibited form'
  - id: A4
    given: 'the four non-collapse relations'
    when: 'the contract is read'
    then: 'persisted status versus TTL classification, authorship versus binding, and cwd versus binding are each stated as distinct domains that may not be conflated'
  - id: A5
    given: 'a surface that filters or paginates'
    when: 'the contract is read'
    then: 'it requires the surface to state what it withheld and how to see it, and requires human and --json output of one surface to carry the same facts'
  - id: A6
    given: 'the contract'
    when: 'its non_claims are read'
    then: 'it states that it changes no runtime behavior, grants no authority, and does not define gate or hook behavior, so it cannot be cited as permission for a renderer change that was never reviewed'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "read_surfaces enumerates 12 surfaces (status, doctor, agents list, agents show, specs list, specs show, worktree list, claim, goal show, working-tree check, scope show, message), each with subject, tier, asserts and a mandatory is_not clause. Structurally verified: every surface has is_not = True, and no asserts entry references a domain outside fact_domains. Surfaces were enumerated from the live caws --help groups, not from memory."
    recorded_at: "2026-09-19T09:52:41.769Z"
    commit_sha: "34211d38"
  - criterion_id: A2
    status: pass
    evidence_ref: "fact_domains declares 7 domains, each naming exactly one authority (verified: every domain has an authority key). authority_tiers separates authority (.caws/specs, .caws/worktrees.json, .caws/events.jsonl) from operational_cache (.caws/leases, agents.json, messages.jsonl) from derived_advisory (doctor, status panels, working-tree, scope contention). Each read surface then declares which tier it reads, so a joining dashboard cannot be mistaken for an origin of fact."
    recorded_at: "2026-09-19T09:52:42.984Z"
    commit_sha: "34211d38"
  - criterion_id: A3
    status: pass
    evidence_ref: "rendering_obligations.unsourced_fact states the rule, the rationale (an asserted absence is indistinguishable from an observed one, so it manufactures an undetectable false negative), and the worked example. The example is code-verified, not illustrative: agents.ts:635 renders ?? '(no worktree)' over :247 lease.bound_worktree ?? null, and the field has no writer because both producers (:286 agents register, :373 agents heartbeat) pass bound = null with no third caller. All four line citations were re-checked against the committed tree. The permitted forms cite how status already handles the identical absence (omit wt=, neutral spec=-)."
    recorded_at: "2026-09-19T09:52:44.146Z"
    commit_sha: "34211d38"
  - criterion_id: A4
    status: pass
    evidence_ref: "non_collapse_relations lists 6 relations. The four required by the acceptance criterion are present: persisted status vs TTL classification, authorship (created_by_session) vs binding, cwd vs binding, plus worktree ownership vs lease liveness. Each is also mirrored in the relevant domain's is_not field so a reader meets it wherever they enter the document. The status-vs-TTL relation is backed by an observation, not theory: agents show reported status=active for session 1aa3f0bd while agents list bucketed the same record as stale."
    recorded_at: "2026-09-19T09:52:45.379Z"
    commit_sha: "34211d38"
  - criterion_id: A5
    status: pass
    evidence_ref: "rendering_obligations carries 5 entries including completeness (a filtering surface must state what it withheld and the flag to see it, with a required form) and parity (human and --json of one surface must carry the same facts; --json may add machine detail but may never be the sole location of a fact). Both are backed by recorded non-conformances: agents list prints only the active bucket of 12 records with no hidden-count hint, and worktree list is the authoritative ownership surface with no machine-readable output at all."
    recorded_at: "2026-09-19T09:52:46.637Z"
    commit_sha: "34211d38"
  - criterion_id: A6
    status: pass
    evidence_ref: "non_claims carries 6 entries: changes no runtime behavior, grants no authority (naming a surface authority describes the artifact it reads and cannot make a cache authoritative), does not define gate/hook/reprieve/waiver behavior, does not define the mutation lattice (that is command-capability-taxonomy.md), does not settle whether a fact SHOULD be surfaced, and states that known_nonconformance is a verified snapshot rather than an exhaustive audit so absence from it is not evidence of conformance. This is what prevents the contract being cited as pre-approval for an unreviewed renderer change."
    recorded_at: "2026-09-19T09:52:47.970Z"
    commit_sha: "34211d38"