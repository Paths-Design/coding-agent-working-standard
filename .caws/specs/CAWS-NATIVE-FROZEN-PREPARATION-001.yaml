invariants:
  - 'Preparation uses exact admitted commit and tree identities and enumerated blobs; no implicit working-tree source, replace refs, hooks, filters or arbitrary commands.'
  - 'Source and tool pins are provenance only. The actual maintained operation must verify independent source standing and exclusive output authority.'
  - 'Input byte inventories and modes are complete; link graphs are explicit and closed; foreign and protected inputs remain unchanged.'
  - 'Preparation output and still-absent future build output are distinct. Exclusive no-follow custody rejects overlap and root substitution; uncertain partial outputs are retained without retry or adoption.'
  - 'Only the independently reviewed pinned Node preparation entry and fixed pinned read-only Git operations may launch. Node startup is closed before launch; Cargo, npm, compiler and native candidate execution are forbidden during preparation.'
  - 'Bootstrap inventories are optional identity data emitted by the existing normal installer, not source-export or write authority. Default behavior is unchanged; no observer manifest is stored inside either inventoried root; failed inventory never activates or automatically rolls back a retained release.'
acceptance:
  - id: A1
    given: 'admitted immutable source and pinned tool inputs with an authorized absent output'
    when: 'maintained preparation runs'
    then: 'exact frozen files and request identities are produced with fixed Git commands only and the build output remains absent'
  - id: A2
    given: 'malformed requests, startup injection, stale source standing or unauthorized output'
    when: 'maintained preparation is requested under the existing ordinary CLI caller-attribution contract'
    then: >-
      malformed requests and startup injection refuse before any child launch; only
      pinned closed bounded read-only Node/Git preflight may observe source and
      authority, and stale source or unauthorized output refuses before any
      mutation, writer, compiler or unapproved child with foreign bytes unchanged
  - id: A3
    given: 'changed pins, traversal, overlaps, symlink or root substitution and unrepresented files'
    when: 'preparation verifies and stages inputs'
    then: 'it refuses with accurate retained-uncertain state and does not overwrite protected data'
  - id: A4
    given: 'the supported entry and actual guard consumer'
    when: 'valid and hostile preparation requests are submitted'
    then: 'admitted effects match execution while opaque scripts and foreign writes remain refused'
  - id: A5
    given: >-
      The normal standalone CLI installer is explicitly asked for bootstrap
      inventory v1 of a retained private installation.
    when: >-
      It captures the complete CLI prefix and private probe Git view after final
      rename and chmod but before changing the command symlink.
    then: >-
      Its ordinary success JSON carries exact closed parent-consumable inventories
      with canonical entries, full modes, finite stable files and admitted relative
      bin links; protected credential paths or changed/special/unbounded members
      refuse before activation and retain any already-renamed unselected release,
      with the previous command unchanged.
observability:
  - 'Bounded receipts retain request/source/tree identities, Git command results, byte inventories and failure phase without claiming adoption.'
rollback:
  - 'No global runtime or CLI mutation. Preserve failed exclusive roots and use the original installed runtime until independent integration succeeds.'
non_functional:
  security:
    - 'No shell or dynamic source execution; reject startup injection, arbitrary executable selection, generic link following and self-authorizing receipts.'
