invariants:
  - 'A harness-plugin surface is reported wired only when the active profile composition actually carries its plugin ids; unobserved composition is reported unknown, never wired or unwired.'
  - 'Wiring observation is read-only: it never executes profile plugin code and never mutates the DSH profile.'
  - 'CAWS init and doctor never claim hook enforcement for DSH unless profile composition is observed and wired.'
acceptance:
  - id: A1
    given: 'a DSH session environment whose active profile lists @caws/dsh-bundle and whose bundle patch inserts caws-hooks, caws-session-log and caws-agents-lifecycle'
    when: 'caws init --agent-surface dsh --plan --json runs'
    then: 'the plan reports the hook plane wired with the three plugin ids and prescribes no repair'
  - id: A2
    given: 'a DSH session environment whose active profile does not compose the CAWS bundle'
    when: 'caws init --agent-surface dsh runs'
    then: 'the activation contract states hooks are NOT wired, names the profile and missing bundle, and prints the exact dsh plugin add plus restart repair instead of claiming hooks are installed'
  - id: A3
    given: 'a repo whose .dsh/AGENTS.md carries the dsh CAWS-MANAGED-HOOK header and a DSH profile environment that is unwired'
    when: 'caws doctor runs'
    then: 'doctor emits a warning doctor.hooks.harness_plugin_unwired naming the profile and repair, and emits nothing when no DSH profile is observable'
  - id: A4
    given: 'hostile profile inputs (missing profile dir, invalid package.json, bundle listed but unresolvable, bundle patch missing, patch omitting the CAWS ids)'
    when: 'wiring observation runs'
    then: 'each case yields a distinct classified verdict without throwing and none is classified wired'
  - id: A5
    given: 'the repo docs, CLAUDE.md, and the DSH hook-pack AGENTS.md template and installed copy'
    when: 'a reader follows the DSH setup description'
    then: 'they are told hooks load only through the profile-mounted harness plugin, how to verify composition and import with dsh --dump-config and --dump-config-schema, and the template equals the installed copy, with no claim that DSH executes .caws/hooks/dispatch directly without the bundle'
  - id: A6
    given: 'the reference @caws/dsh-bundle composed in a DSH 0.2.2-rc.1 profile in a .caws repo'
    when: 'a fresh DSH session starts, attempts a governed tool call and stops'
    then: 'retained evidence shows the CAWS hook plugins loaded and invoked and CAWS telemetry or lease artifacts appear (or an explicit recorded failure names the incompatibility), including a write-capable DSH tool mapped to the canonical write vocabulary and denied when out of scope, with exact commands, outputs and stated model-invocation limits'
observability:
  - 'Wiring verdicts and doctor finding data carry the resolved profile path, bundle list, observed plugin ids, and the unobserved reason.'
rollback:
  - 'Revert the worktree branch; this slice performs no state migration and no machine-profile mutation.'
non_functional:
  security:
    - 'Profile composition observation parses package.json and patch YAML only; it must not import or execute profile package modules.'
