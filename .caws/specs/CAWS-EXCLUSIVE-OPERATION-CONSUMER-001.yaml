    when: 'bounded stage and path-scoped commit run'
    then: 'only literal admitted paths commit and unrelated staged content survives'
  - id: A2
    given: 'owned live lane and verified borrowed fence'
    when: 'merge without close then explicit bridge and close run'
    then: 'existing governance checks and partial-publication outcomes remain observable without relocking or implicit event authority'
  - id: A3
    given: 'unsupported hooks/configuration or replaced fence owner/ref'
    when: 'an operational mutation is requested'
    then: 'refuse before unauthorized effects and never bypass hooks'
observability:
