id: CAWS-FIX-WORKTREE-MERGE-CWD-SELF-DESTRUCT-GUARD-001
title: 'Refuse caws worktree merge/destroy when the caller''s cwd is inside the target worktree'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-guard
created_at: '2026-08-02T21:54:03.197Z'
updated_at: '2026-08-02T21:54:49.076Z'
blast_radius:
  modules:
    - packages/caws-cli/src/store/worktrees-writer.ts
    - packages/caws-cli/src/shell/commands/worktree.ts
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/store/worktrees-writer.ts
    - packages/caws-cli/src/shell/commands/worktree.ts
    - packages/caws-cli/tests/store/worktree-merge-cwd-self-destruct-guard.test.js
    - .caws/specs/CAWS-FIX-WORKTREE-MERGE-CWD-SELF-DESTRUCT-GUARD-001.yaml
  out:
    - .caws/policy.yaml
    - .caws/events.jsonl
invariants:
  - 'destroyWorktree and mergeWorktree refuse to run their teardown when the caller process cwd is the target worktree path or a descendant of it. destroyWorktree deletes the worktree directory as its final step, and mergeWorktree calls destroyWorktree; running either from a shell whose cwd is inside that directory removes the ground under the caller process, leaving every subsequent shell spawn failing ENOENT. The guard reads the caller cwd once at CLI invocation, resolves it and the registry entry path through realpath to defeat symlinks and relative segments, and refuses with LIFECYCLE_PLAN_REJECTED naming the worktree and the cd-out remediation BEFORE any mutation.'
  - 'The guard fires only on the destructive path. caws worktree merge --dry-run does not destroy anything and is exempt (no teardown, no hazard). The guard compares directories only — a cwd equal to or nested under the worktree path is the refused condition; a cwd elsewhere (canonical root, a sibling worktree) proceeds normally.'
acceptance:
  - id: A1
    given: 'A worktree wt-a1 bound to an active spec, with a caller process whose cwd is inside the worktree directory (the worktree path itself, or a descendant).'
    when: 'caws worktree merge wt-a1 is invoked (real merge, not --dry-run).'
    then: 'mergeWorktree returns err with LIFECYCLE_PLAN_REJECTED naming wt-a1 and a remediation telling the operator to cd out of the worktree before merging; no git merge, no spec close, no worktree_merged event, no destroy — the worktree directory and registry entry are unchanged.'
  - id: A2
    given: 'A worktree wt-a2 with a caller process whose cwd is inside it.'
    when: 'caws worktree destroy wt-a2 is invoked.'
    then: 'destroyWorktree returns err with LIFECYCLE_PLAN_REJECTED naming wt-a2 and the cd-out remediation; the worktree directory and registry entry are unchanged.'
  - id: A3
    given: 'A worktree wt-a3 with a caller process whose cwd is the canonical repo root (NOT inside wt-a3).'
    when: 'caws worktree merge wt-a3 and caws worktree destroy wt-a3 are each invoked.'
    then: 'The cwd guard does NOT fire; the operations proceed normally (merge lands and destroys; a standalone destroy removes the worktree). The guard only blocks the self-inside-cwd case.'
  - id: A4
    given: 'A worktree wt-a4 with a caller process whose cwd is inside it.'
    when: 'caws worktree merge wt-a4 --dry-run is invoked.'
    then: 'The guard does NOT fire (dry runs perform no teardown); the dry-run readiness check proceeds and returns its normal outcome.'
non_functional:
  reliability:
    - 'The cwd resolution uses realpath on both paths so a symlinked or relatively-segmented cwd still trips the guard. If realpath cannot resolve a path (e.g. it does not exist), the guard falls back to the literal path rather than crashing, since a missing path cannot be a live cwd that would be destroyed.'
contracts:
  - name: 'teardown-cwd-self-destruct-guard'
    type: behavior
    path: 'packages/caws-cli/src/store/worktrees-writer.ts'
