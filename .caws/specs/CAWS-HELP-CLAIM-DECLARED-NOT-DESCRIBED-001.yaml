evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "MIGRATABLE_SOURCE_VERSIONS (src/store/migration-versions.ts) now holds the accepted set. Both --from options carry it as allowedValues, and both rejection messages read describeMigratableSourceVersions(), so help and guard cannot disagree. No user-facing string names a release number: 'only v10 is supported in v11.2' shipped in four of them while the package was at 12.2.0-rc.2. THIRD COPY FOUND ONLY BY INVOKING DIST: register.ts:868 carried a duplicate --from guard that shadowed the handler's check AND forwarded a hardcoded 'v10', so the handler's validation was unreachable and its message never reached a caller - fixing the handler alone changed nothing observable. That is the register.ts opt-forward class; a handler unit test goes green over it. The parse-layer copy is removed. Runtime after the fix: 'caws specs migrate: --from accepts v10; got \"v11\".' and 'caws events migrate: --from accepts v10; got \"v9\".'"
    recorded_at: "2026-09-17T01:41:33.455Z"
    test_nodeid: packages/caws-cli/tests/shell/help-claim-integrity.test.js
    commit_sha: "4ee762dfe8f1245b926db73d2a1f04dd9a0eee2a"
  - criterion_id: A2
    status: pass
    evidence_ref: "WORKTREE_PRUNE_STATES and WORKTREE_PHYSICAL_CLEANUP_STATES are exported from shell/commands/worktree.ts and both --state descriptions derive from them. cleanup-plan is the sharper case: worktree.ts:1502 REFUSES any class not in WORKTREE_PHYSICAL_CLEANUP_STATES, yet the help named four of the eleven as a hand-written 'for example' - an open set that mysteriously rejects. Built help now lists all eleven: destroy-ready, unbound-clean-candidate, dirty-refused, unmerged-refused, active-bound-refused, foreign-owned-refused, missing-directory-refused, not-git-worktree-refused, unknown-spec-refused, unregistered-physical-refused, git-observation-unavailable. The per-command tests assert the FULL list by equality, not containment, because a description dropping one class while keeping the phrase would still satisfy a per-name loop; a sibling test asserts the two sets differ so neither passes by coincidence. FILE-LEVEL NODEID ON PURPOSE: the two per-command tests are parameterised, so their titles are template literals and no literal title exists to cite - my first attempt cited the resolved string and --verify refuted it as test_not_found, which is the gate working."
    recorded_at: "2026-09-17T01:41:58.947Z"
    test_nodeid: packages/caws-cli/tests/shell/help-claim-integrity.test.js
    commit_sha: "4ee762dfe8f1245b926db73d2a1f04dd9a0eee2a"
  - criterion_id: A3
    status: pass
    evidence_ref: "The audit drove every exit-code claim against the built CLI before writing any test: specs validate (0 valid / 1 invalid / 1 unreadable), verify-acs (0 default with not_rederived present, 1 with --strict), working-tree check (0 no overlap), scope plan (0 with a refusal in the plan), specs prune-archive (genuinely a no-op, exit 0). All held - this criterion pins accuracy that already existed rather than repairing a defect. The scope plan pin needed two corrections of my own: it first asserted only exit 0, which its own comment said would be vacuous, and it was environment-dependent (a bound worktree rejects an out-of-scope path; an unbound checkout reports no_authority for every path). It now parses the summary counts and asserts reject+no_authority+invalid_path > 0, which is the claim's substance - exit 0 despite a decision the caller did not get - and is deterministic in both checkouts. NOT CLAIMED: working-tree check's exit-1-on-overlap arm is unpinned; it needs a second live session and no fixture here creates one."
    recorded_at: "2026-09-17T01:42:14.345Z"
    test_nodeid: "packages/caws-cli/tests/shell/help-claim-integrity.test.js::specs validate: 0 when valid, non-zero when invalid or unreadable"
