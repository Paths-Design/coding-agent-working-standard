  out: []
invariants:
  - 'A closed accepted-value set is declared once as an exported constant; help text and runtime validation both read it, so neither can name a set the other refuses'
  - 'No user-facing string (help description or error message) names a CAWS version number; version references go stale silently and nothing checks them'
acceptance:
  - id: A1
    given: '--from <version> on specs migrate and events migrate accepts exactly v10'
    when: 'a reader consults --help or triggers the rejection error'
    then: 'the accepted set and both error messages derive from one exported constant, and no user-facing string names a CAWS version'
  - id: A2
    given: 'worktree prune --state accepts a closed set already held in WORKTREE_PRUNE_STATES'
    when: 'a reader consults --help'
    then: 'the description''s value list derives from that exported constant rather than a hand-written example'
  - id: A3
    given: 'four help descriptions claim specific exit codes'
    when: 'the built CLI is invoked for each claimed condition'
    then: 'the observed exit code matches the claim'
  - id: A4
    given: 'help prose that names a CAWS version goes stale silently'
    when: 'the option surface is linted'
    then: 'no option description references a CAWS version number, and any option naming a closed accepted set carries allowedValues'
non_functional: {}
contracts: []
