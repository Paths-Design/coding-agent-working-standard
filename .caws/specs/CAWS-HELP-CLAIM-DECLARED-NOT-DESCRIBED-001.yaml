blast_radius:
  modules:
    - 'caws-cli shell command surface'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/command-metadata.ts'
    - 'packages/caws-cli/src/shell/commands/specs.ts'
    - 'packages/caws-cli/src/shell/commands/events.ts'
    - 'packages/caws-cli/src/shell/commands/worktree.ts'
    - 'packages/caws-cli/src/store/migration-versions.ts'
