invariants:
  - 'An install whose generation digest equals the current pointer digest never rewrites the pointer; previous_digest is changed only by an install that selects a different generation or by rollback.'
  - 'rollback never reports success while selecting the generation that is already current.'
acceptance:
  - id: A1
    given: 'a machine home with pointer {digest: D1, previous_digest: D0} and bin/caws-hook deleted (entry-only damage)'
    when: 'caws init adapters install runs again with the D1 package'
    then: 'bin/caws-hook is restored with the shipped bootstrap bytes AND the pointer bytes are identical to before the repair (previous_digest stays D0); counterexample that must fail: pointer becomes {D1, D1} (observed today in rollback-probe/s1.log step 4).'
  - id: A2
    given: 'the sequence D1/B1 install, older-package install D0/B0, older-package rollback (pointer D1, entry B0), then newer-package install'
    when: 'rollback runs'
    then: 'the pointer selects D0 and a guard fixture whose marker differs between D0 and D1 reports the D0 marker; counterexample that must fail: rollback exits 0 with the pointer still at D1 (observed in rollback-probe/s0-s2.log S2 step 5).'
  - id: A3
    given: 'an install that selects a different generation (D0 current, installing D1)'
    when: 'install runs'
    then: 'pointer becomes {D1, previous_digest: D0} exactly as before this fix (no regression of ordinary upgrade history).'
  - id: A4
    given: 'a mutant that restores previous_digest: prior.digest for same-target installs'
    when: 'the new tests run'
    then: 'the A1 and A2 tests fail with the observed {D1, D1} pointer.'
non_functional: {}
