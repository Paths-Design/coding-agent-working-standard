id: CAWS-QWEN-HOOK-TIMEOUT-001
title: 'Fix qwen-code hook timeout unit mismatch (ms vs s)'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-qwen-timeout
created_at: '2026-08-15T18:04:24.092Z'
updated_at: '2026-08-15T18:09:25.495Z'
blast_radius:
  modules:
    - packages/caws-cli/src/init (qwen-code hook wiring engine)
    - packages/caws-cli/templates/hook-packs/qwen-code (surface templates)
    - docs/architecture (hook-pack contract documentation)
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/init/hook-install.ts
    - packages/caws-cli/src/init/hook-packs/manifest-qwen-code.ts
    - packages/caws-cli/templates/hook-packs/qwen-code
    - packages/caws-cli/tests/init/qwen-config-merge.test.js
    - packages/caws-cli/tests/init/pack-fingerprints.json
    - packages/caws-cli/tests/hooks/bats/qwen-surface.bats
    - docs/architecture/hook-pack-shared-core.md
