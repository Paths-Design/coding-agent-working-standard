id: CAWS-DEFECT-SCOPE-SUPPORT-UNMERGEABLE-01
title: 'scope.support paths are editable but cannot be landed or removed'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'scope.support existed for repo-root deliverables a lane must EDIT but must not CLAIM -- README, package.json, CHANGELOG -- and amend-scope advisory actively recommends it for exactly that case. Two surfaces disagreed with the contract, and between them the feature could not be used end to end. (1) The merge-time lane-provenance guard read scope.in only, so a lane commit touching a support path was reported as outside spec scope. The failure mode is the expensive shape: caws scope show ADMITs the write, the commit succeeds, and only the merge refuses -- after the work is done. scope.in and scope.support differ in CLAIM, not in whether a lane''s own work belongs to it, so the admitted set is now their union; the candidate-lane remediation hint uses the same union so both halves of the diagnostic agree. (2) Removing the LAST entry from a scope sequence left a bare key header with nothing under it, which parses as null, and the schema rejected it as Expected array at /scope/support. Removing any other entry worked, so the bug only appeared on the final one, and the natural recovery shape -- move a path from support to in with --add X --remove-support X in one call -- hit it every time. An emptied block is now written as an explicit empty list, the counterpart of the inline-to-block normalization already performed in the adding direction; this applies to every key, and scope.out reached the same path and was equally broken. Hit live while merging wt-test-verdict, which is how it was found. Both halves falsified independently: reverting the union reddened exactly the support-merge test with the negative control still green; disabling the empty-list normalization reddened exactly the four emptying tests. The negative control matters more than the fixes here -- widening an admitted set is exactly the change that can silently disarm a guard, so a commit touching a path in NEITHER list is asserted to still be refused, by name, in the same suite. Full suite green at 139 suites / 1974 tests.'
created_at: '2026-08-12T17:54:47.558Z'
updated_at: '2026-08-12T19:56:30.764Z'
blast_radius:
  modules:
    - 'caws-cli worktree merge prerequisite check'
    - 'caws-cli scope amendment surface (amend-scope support flags)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/worktrees-writer.ts'
    - 'packages/caws-cli/src/store/specs-writer.ts'
    - packages/caws-cli/tests/store/scope-support-lifecycle.test.js
  out: []
invariants:
  - 'A path the scope surface admits for editing is a path the merge surface admits for landing.'
  - 'A removal command must be able to empty the list it removes from.'
acceptance:
  - id: A1
    given: 'a spec whose scope.support lists a repo-root path, and a lane branch with a commit touching only that path'
    when: 'caws worktree merge runs its prerequisite check'
    then: 'the commit is accepted, because scope.support is documented as editable-but-not-worktree-claimed and caws scope show already ADMITs it — today the merge refuses with ''contains commit outside spec scope'''
  - id: A2
    given: 'a spec whose scope.support holds exactly one entry'
    when: 'caws specs amend-scope --remove-support removes it'
    then: 'the amendment succeeds and scope.support becomes an empty array — today it fails with store.lifecycle.plan_rejected ''Expected array'' at /scope/support'
  - id: A3
    given: 'the amend-scope advisory that recommends --add-support for a repo-root deliverable'
    when: 'an agent follows that recommendation'
    then: 'the resulting branch is mergeable — the advisory must not steer agents into an unlandable state'
non_functional: {}
contracts:
  - name: 'scope-support-lifecycle'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "commit 5f7fd8c4: verifyLaneProvenance in worktrees-writer.ts now admits the union of scope.in and scope.support. Proven against a REAL git repo and the real merge writer, not a mock: a lane whose only commit edits a support path merges, and git show main:README.md confirms the edit actually landed on the base branch. Negative control in the same suite holds - a commit touching a path in NEITHER list is still refused and the diagnostic still names it - so the widening did not disarm the guard. Falsified by reverting the union to scope.in alone: exactly the one support-merge test reddened, control stayed green."
    recorded_at: "2026-08-12T19:37:14.765Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "commit 5f7fd8c4: patchScopeSequence now writes an emptied block as an explicit empty list instead of a valueless key header that parses as null. Four tests assert the on-disk result after a real round trip through the writer and loader: emptying support yields [], scope.in is undisturbed, scope.out reaches the same path and is equally fixed, and the add+remove-in-one-call shape an operator reaches for when moving a path from support to in now succeeds. Falsified by disabling the normalization: exactly those four reddened, the two A1 tests stayed green."
    recorded_at: "2026-08-12T19:39:21.232Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "commit 5f7fd8c4: the advisory text is unchanged and now correct by construction - the state it recommends is landable (A1) and reversible (A2), so following it no longer produces an unmergeable branch. This AC is discharged by removing the hazard the advisory pointed at rather than by rewording the advisory; asserting on the advisory prose would pin wording rather than the property. Regression check on the surfaces that own both halves: 11 suites / 72 tests across tests/store/worktree-merge*, tests/shell/worktree-merge*, tests/shell/specs-amend* all pass."
    recorded_at: "2026-08-12T19:41:20.364Z"