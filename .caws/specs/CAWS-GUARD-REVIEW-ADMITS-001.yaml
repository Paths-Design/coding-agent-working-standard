invariants:
  - 'A recognized write whose target belongs to another session''s worktree, an active claim or a different repository is refused'
  - 'The everyday, read and inline command corpora stay admitted'
acceptance:
  - id: A1
    given: 'a here-document whose unquoted delimiter lets the shell remove escapes, such as an escaped dollar'
    when: 'its text is run as a script or standard input'
    then: 'the text the shell would write is what is checked, or the command is held'
  - id: A2
    given: 'Git write commands spelled with clustered, abbreviated or unlisted options, such as clone -qb, init -qb, worktree add -fb, clone -qu, config --fil=, config --glob, push --repo=, send-pack and fsck --lost-found'
    when: 'they name a foreign repository'
    then: 'the guard exits 2, and clone -qb main from a sibling into this project exits 0'
  - id: A3
    given: 'a GIT_ variable assigned without export'
    when: 'Git runs'
    then: 'the guard checks the repository Git would really use, so a plain GIT_SHA or GIT_ROOT variable is admitted and an unexported GIT_DIR cannot hide a foreign directory'
  - id: A4
    given: 'inline Python or Node that builds a foreign path from the working directory, percent formatting, a changed directory, io.FileIO, a subprocess cwd, an executor or path.join'
    when: 'it writes there'
    then: 'the guard exits 2 naming the owner'
  - id: A5
    given: 'a directory reached through a link made earlier in the command, a brace list with an empty member, or the zsh forms chdir, noglob cd, clobbering redirection, a current-shell last pipeline member and a leading equals'
    when: 'a write follows into a foreign repository'
    then: 'the guard exits 2'
  - id: A6
    given: >-
      env -u of a GIT_ or pager variable, set -a around a sourced file, unset IFS or
      CDPATH, and ordinary GIT_TRACE and GIT_CONFIG_GLOBAL settings
    when: 'an agent runs them'
    then: >-
      each exits 0 unless it redirects Git, and env -u of any other name, including
      a session identity, stays held
  - id: A7
    given: 'the changed analyzer and shared pack'
    when: 'the analysis, guard and pack-fingerprint suites and the per-file mutation floor run'
    then: 'all pass with SHARED_PACK_VERSION bumped and no declared floor lowered'
non_functional: {}
contracts: []
