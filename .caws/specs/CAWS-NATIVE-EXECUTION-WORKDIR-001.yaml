invariants:
  - 'Session cwd and original tool/session/turn identifiers are preserved; only explicit host-resolved execution_workdir selects command directory and never grants ownership or scope'
  - 'Malformed, conflicting, missing-target and foreign authority coordinates fail closed; absent unsupported native transport is distinct from resolved context'
  - 'Existing context-git v1 remains limited to two fixed queries; only independently native-validated Bash pre/post host context may advertise a separate four-query execution-workdir profile, with no caller count override or deadline renewal'
  - 'Valid ungoverned command contexts retain inactive behavior; Git presence alone does not opt into CAWS. An ungoverned origin resolves the actual command target, while failed resolution cannot erase governed, adopted or unresolved authority.'
  - 'Only a fully decoded, fully settled nonzero Git exit may consume its fixed ordinal and continue within the validated-host four-query profile; ordinary two-query failure poisoning, fatal-error refusal, token and executable binding, pair cwd binding and the original absolute deadline remain unchanged.'
acceptance:
  - id: A1
    given: 'native Bash events with session cwd and host execution_workdir'
    when: 'CAWS resolves policy and relative target context'
    then: >-
      the actual physical command directory is selected with raw session identifiers
      preserved, and lifecycle or non-Bash coordinates remain unchanged
  - id: A2
    given: >-
      null, non-string, empty, relative, NUL, nonexistent, non-directory or
      conflicting explicit directories and foreign worktrees
    when: 'native Bash context is consumed'
    then: >-
      invalid supplied context refuses and owner, canonical, foreign-worktree and
      cross-repository checks retain their authority boundaries
  - id: A3
    given: 'the actual current native producer and authored upstream command-directory transport repair'
    when: 'ordinary native calls are exercised after coordinated installation'
    then: >-
      real emitted execution_workdir agrees with actual command cwd and CAWS policy
      decisions; synthetic fixtures alone cannot establish installed completion
  - id: A4
    given: 'ordinary two-query native context and validated-host four-query execution context'
    when: 'session governing authority is joined to actual command checkout'
    then: >-
      old third and new fifth queries refuse, native profile cannot be selected by
      aliases or payload flags, and active session authority cannot fall inactive or
      cross canonical repositories
