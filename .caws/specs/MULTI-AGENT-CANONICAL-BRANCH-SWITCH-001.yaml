    when: 'it reads the worktree-isolation rule'
    then: 'the rule states that git checkout -b in the canonical checkout switches the shared working tree and captures every peer''s CAWS lifecycle auto-commits onto that branch'
  - id: A2
    given: 'the same rule'
    when: 'an agent reads why this is worse than an ordinary misplaced commit'
    then: 'it names the canonical-only spec interaction - a governed worktree merge computes against main''s spec copy, so peer evidence recorded while canonical was parked is dropped at merge time'
  - id: A3
    given: 'an agent that needs an isolated branch anyway'
    when: 'it consults the doctrine'
    then: 'it is directed to caws worktree create, which confers write authority without moving the canonical HEAD'
