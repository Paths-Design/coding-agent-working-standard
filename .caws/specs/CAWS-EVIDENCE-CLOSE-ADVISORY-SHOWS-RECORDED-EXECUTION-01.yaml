invariants:
  - 'Close and merge still spawn no test runner; the advisory reports what was executed at record time as a recorded fact with its revision, never as a fresh execution.'
  - 'A recorded execution is written only by evidence --verify after the cited test actually ran and passed; a hand-edited spec cannot be distinguished from it, so the advisory labels it recorded, not re-derived.'
acceptance:
  - id: A1
    given: 'a criterion recorded with evidence --verify citing a jest test that executed and passed'
    when: 'the spec is closed or auto-closed by merge'
    then: >-
      the close advisory adds a recorded-execution section naming the criterion, its
      test target and the <sha> it passed at record time (test_verified_at), as a
      named subset of not_rederived — never counted as verified, because close did
      not re-run it (observed in 11 sessions: agents reconciled 'not_rederived N' at
      close against 'verified N' from --run)
  - id: A2
    given: 'a criterion recorded without --verify'
    when: 'the spec closes'
    then: 'the advisory is unchanged: not_rederived (not_run) for the test check'
  - id: A3
    given: >-
      a criterion recorded with evidence --verify (test passed, test_verified_at
      written) whose other citation no longer re-derives at close
    when: 'the spec closes'
    then: >-
      the criterion is reported refuted and is not listed as a recorded execution;
      any re-record of the criterion drops test_verified_at
non_functional: {}
