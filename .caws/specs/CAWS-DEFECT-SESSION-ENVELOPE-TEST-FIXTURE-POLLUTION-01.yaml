id: CAWS-DEFECT-SESSION-ENVELOPE-TEST-FIXTURE-POLLUTION-01
title: 'Test-fixture durable hook envelopes pollute the canonical .caws/sessions/ and widen resolver ambiguity'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: envelope-pollution
created_at: '2026-08-15T17:52:00.806Z'
updated_at: '2026-10-05T06:35:46.583Z'
blast_radius:
  modules:
    - 'packages/caws-cli/tests/hooks/bats (suites that drive real hook scripts against the repo)'
    - 'canonical .caws/sessions/ (one-time fixture-envelope removal)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/tests/hooks/bats/reprieve.bats
    - packages/caws-cli/tests/hooks/bats/bash-write-guard.bats
    - packages/caws-cli/tests/hooks/bats/
    - .caws/sessions/
    - packages/caws-cli/tests/hooks/bats/agent-register-quarantine.bats
    - packages/caws-cli/tests/hooks/bats/audit-jsonl.bats
    - packages/caws-cli/tests/hooks/pytest
  out:
    - >-
      The resolver's admission logic (freshness windows, candidate caps,
      caller disambiguation) is NOT modified here — that is
      SESSION-CANDIDATE-RESOLUTION-HARDENING-001. This spec stops the
      pollution at the source so the resolver never sees the fixtures.
invariants:
  - >-
    No test suite (bats, jest, pytest) or manual dogfood harness writes a
    durable hook envelope into the CANONICAL <repo>/.caws/sessions/. Suites
    that exercise real hook scripts (parse-input.sh, reprieve, write-guards)
    run against a temp repo root or redirect the session dir, so fixture
    session ids (my-session, s, s1, sess-a1-int, sess-a2-foreign, sess-a3-001,
    sess-a5-001, sess-a7-noreprieve, dogfood-manual) never appear as resolver
    candidates in a developer's real checkout.
  - >-
    Running the hooks test suites is side-effect-free on .caws/sessions/: a
    byte-identical snapshot before and after. A test that needs a durable
    envelope creates it inside its own temp fixture tree, never via the
    canonical repo path.
acceptance:
  - id: A1
    given: 'A clean canonical checkout with .caws/sessions/ snapshotted.'
    when: 'The full bats hooks suite runs (reprieve.bats, bash-write-guard.bats, parse-input.bats).'
    then: >-
      .caws/sessions/ is unchanged — no new fixture session dirs, no new
      .session-envelope.json files. The suites redirect session state to
      their temp fixtures.
  - id: A2
    given: >-
      the hook bats suites that resolve or record session identity (reprieve,
      bash-write-guard, parse-input, session-id-agent-pid)
    when: 'each runs'
    then: >-
      every session-state write lands under the suite temp dir, asserted inside the
      suite, so a later suite that regresses to the canonical .caws/sessions/ fails
non_functional: {}
contracts:
  - name: 'session-envelope-hygiene'
    type: behavior
