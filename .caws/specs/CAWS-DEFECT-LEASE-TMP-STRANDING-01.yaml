invariants:
  - >-
    CONTENT ATOMICITY IS UNTOUCHED: the sweep never alters the
    write-tmp-rename contract — it only removes files matching the EXACT
    sibling pattern <target>.tmp.<pid>.<counter> that are provably stale
    (older than the TTL AND their owner PID dead, or older than a hard
    age bound). Foreign files in the directory are never touched, and
    the sweep failures are silent best-effort (a sweep that cannot run
    must not block the write).
  - >-
    LOADER UNCHANGED: the loader already ignores non-.json entries; that
    behavior is pinned, not modified — stranded tmps were invisible, and
    the fix is cleanup + visibility, not a loader behavior change.
  - >-
    VISIBILITY: doctor gains a warning for stranded atomic-write tmp
    files in .caws/leases/ (age-named, repair = automatic next-write
    sweep or manual removal), so the class is observable in every repo
    instead of discovered by inspection.
non_functional:
  reliability:
    - >-
      The lease plane, already load-ignoring for tmp files, gains
      self-healing (sweep on next write) and observability (doctor
      finding) so a crash mid-rename degrades to a stale-file warning
      instead of permanent litter.
acceptance:
  - id: A1
    given: 'a leases directory containing a stranded <lease>.tmp.<pid>.<counter> file from a dead PID'
    when: 'the next lease write runs'
    then: 'the stranded tmp is removed and the write completes atomically as before; a live-owner tmp (young file, live PID) is left untouched'
  - id: A2
    given: 'a leases directory containing a stranded tmp'
    when: 'caws doctor runs'
    then: 'doctor.leases.stranded_tmp fires (warning) naming the file and age; a clean directory stays silent'
  - id: A3
    given: 'the exact sibling-pattern constraint'
    when: 'a foreign file (not matching <lease>.tmp.<pid>.<counter>) sits in the leases directory'
    then: 'neither the sweep nor the finding ever touches or names it'
contracts:
  - name: 'atomic-write-sweep'
    type: behavior
    description: >-
      writeFileAtomic sweeps stale sibling tmp files matching its own
      exact naming pattern before writing; dead-PID or hard-aged files
      only; failures are silent and never block the write.
evidence:
