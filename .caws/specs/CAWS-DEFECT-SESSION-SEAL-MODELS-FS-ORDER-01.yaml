acceptance:
  - id: A1
    given: 'a session dir whose turn-NNN.json files are returned by the filesystem in an order other than turn order'
    when: 'SessionEnd seals .meta.json'
    then: 'usage.models carries first-seen order across turns by ASCENDING TURN NUMBER, identical on every filesystem'
  - id: A2
    given: 'the sealer''s turn-file read in session-log.sh'
    when: 'the source is inspected'
    then: 'the iteration is explicitly ordered, with no bare find(1) traversal feeding the aggregation'
  - id: A3
    given: 'a shared hook-pack template change'
    when: 'the slice lands'
    then: 'SHARED_PACK_VERSION is bumped and the recorded fingerprint matches, so installed packs receive the fix'
  - id: A4
    given: 'the sealed usage totals'
    when: 'turn files are read in any order'
    then: 'requests/input/cache_read/cache_write/output are unchanged, confirming only models was order-sensitive'
