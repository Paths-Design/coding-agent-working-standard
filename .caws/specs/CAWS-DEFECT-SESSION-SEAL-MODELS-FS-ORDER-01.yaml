id: CAWS-DEFECT-SESSION-SEAL-MODELS-FS-ORDER-01
title: 'Seal session usage.models in turn order, not filesystem order'
risk_tier: 3
mode: fix
lifecycle_state: active
created_at: '2026-09-17T12:42:27.452Z'
updated_at: '2026-09-17T12:43:02.445Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'hook-packs/shared/session-log'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/session-log.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/pytest/test_session_log_renderer.py'
  out: []
invariants:
  - 'A sealed .meta.json is a function of the turn files'' CONTENT and turn numbers only — never of the order the filesystem happens to return directory entries in.'
  - 'The shell sealer and the Python renderer must agree on turn ordering; session_log_renderer.py already uses sorted(glob), so the shell path sorts too.'
acceptance:
  - id: A1
    given: 'a session dir whose turn-NNN.json files are returned by the filesystem in an order other than turn order'
    when: 'SessionEnd seals .meta.json'
    then: 'usage.models carries first-seen order across turns by ASCENDING TURN NUMBER, identical on every filesystem'
  - id: A2
    given: 'the sealer''s turn-file read in session-log.sh'
    when: 'the source is inspected'
    then: 'the iteration is explicitly ordered, with no bare find(1) traversal feeding the aggregation'
  - id: A3
    given: 'a shared hook-pack template change'
    when: 'the slice lands'
    then: 'SHARED_PACK_VERSION is bumped and the recorded fingerprint matches, so installed packs receive the fix'
  - id: A4
    given: 'the sealed usage totals'
    when: 'turn files are read in any order'
    then: 'requests/input/cache_read/cache_write/output are unchanged, confirming only models was order-sensitive'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Twelve turns, one distinct model each, created in DESCENDING turn order so creation, hash and turn order all differ. Pre-fix on APFS the sealer produced ['model-01','model-07','model-11','model-10','model-06','model-05','model-09','model-08','model-04','model-12','model-03','model-02'] -- neither creation nor lexical order, i.e. a pure filesystem artifact. Post-fix it produces model-01..model-12 in turn order. CI (ext4) exhibited the same class on the pre-existing sealing case: sealed ['claude-haiku-4-5','claude-opus-5'] where turn order gives ['claude-opus-5','claude-haiku-4-5']. Full pytest tier 302 passed exit 0 in the lane; 300 before the two new tests."
    recorded_at: "2026-09-17T12:54:22.514Z"
    test_nodeid: "packages/caws-cli/tests/hooks/pytest/test_session_log_renderer.py::TestSessionEndSealing::test_seals_models_in_turn_order_regardless_of_directory_order"
    commit_sha: "87be9215"
  - criterion_id: A2
    status: pass
    evidence_ref: "Structural drift guard: greps session-log.sh for a turn-*.json aggregation line and refuses a bare 'find -exec cat'. It went red pre-fix naming the offending line verbatim, and holds on every platform, unlike the behavioral test whose outcome depends on the filesystem's directory order. Live source now reads: find ... | LC_ALL=C sort | while IFS= read -r turn_file; do cat \"$turn_file\"; done | jq -s."
    recorded_at: "2026-09-17T12:54:35.324Z"
    test_nodeid: "packages/caws-cli/tests/hooks/pytest/test_session_log_renderer.py::TestSessionEndSealing::test_sealer_reads_turn_files_in_an_explicitly_ordered_traversal"
    commit_sha: "87be9215"