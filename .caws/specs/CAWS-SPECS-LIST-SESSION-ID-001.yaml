invariants:
  - 'Session filtering is read-only: specs list --session-id never mutates specs, bridges, the worktree registry, or the event log.'
  - 'Session identity comparison is prefix-normalized (a leading session- on either side is stripped) per CAWS-SESSION-RESOLVER-GUARD-DIVERGENCE-001; no other fuzzy matching is permitted.'
acceptance:
  - id: A1
    given: 'a repo where session S1 created a spec, holds a bridge claim on another, and owns a worktree bound to a third'
    when: 'caws specs list --session-id S1 runs'
    then: 'exactly those three specs are listed, each labeled with its relation (created, bridge, worktree <name>)'
  - id: A2
    given: 'specs stamped with both bare-uuid and session-prefixed forms of the same session id per CAWS-SESSION-RESOLVER-GUARD-DIVERGENCE-001'
    when: 'filtering by either form'
    then: 'both stampings match (prefix-normalized comparison)'
  - id: A3
    given: 'related specs in active+bound, active+unbound, draft, and archived states'
    when: 'the listing renders'
    then: 'each row shows its binding state and the state-appropriate action (continue in worktree / activate-or-deactivate / tee-up-or-retire-draft / no action for archived)'
  - id: A4
    given: 'the built CLI'
    when: 'caws specs list --help runs'
    then: '--session-id <id> appears with a description'
  - id: A5
    given: 'a session id matching no spec'
    when: 'caws specs list --session-id <id> runs'
    then: 'exit 0 with an explicit no-specs-for-session message naming the session id'
non_functional: {}
