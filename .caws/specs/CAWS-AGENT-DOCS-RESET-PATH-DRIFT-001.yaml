id: CAWS-AGENT-DOCS-RESET-PATH-DRIFT-001
title: 'Agent-facing recovery paths and guard remediation name the real reset scripts and the worktree ordering invariant'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-07-25T04:15:17.651Z'
updated_at: '2026-07-25T04:15:17.651Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'CLAUDE.md'
    - 'docs/agents/scope-discipline.md'
    - '.claude/hooks/README.md'
    - 'packages/caws-cli/templates/CLAUDE.md'
    - 'packages/caws-cli/templates/hook-packs/claude-code/README.md'
    - 'packages/caws-cli/templates/hook-packs/shared/hooks/scope-guard.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/src/init/hook-packs/pack-fingerprints.json'
    - 'packages/caws-cli/tests/docs/agent-recovery-path-drift.test.js'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'an agent-facing doc or shipped template names a strike/latch reset script'
    when: 'a test greps every such surface'
    then: 'no surface contains the string ''.claude/hooks/reset'', because the scripts live under the vendor hooks dir'
  - id: A2
    given: 'the scope-guard hard-block message is rendered'
    when: 'the bound-spec mode is union/unbound'
    then: 'the first fix option is to create or enter the bound worktree, not amend-scope'
  - id: A3
    given: 'the scope-guard emits a reset-strikes remediation'
    when: 'the message is built'
    then: 'it interpolates the resolved session id rather than a literal ''<uuid>'' placeholder'
  - id: A4
    given: 'CLAUDE.md documents the scope preflight'
    when: 'an agent reads the outcome template'
    then: 'NO AUTHORITY is enumerated alongside ADMIT and REFUSE with the worktree-before-code ordering rule as its remediation'
non_functional: {}
contracts:
  - name: 'guard-remediation-text'
    type: behavior
