id: CAWS-CHORE-PRETTIER-BASELINE-001
title: 'Repo-wide prettier baseline: stop unrelated reflow riding every commit; stop lint-staged reformatting governed spec YAML'
risk_tier: 2
mode: chore
lifecycle_state: active
worktree: wt-prettier-baseline
created_at: '2026-09-16T07:53:45.081Z'
updated_at: '2026-09-16T07:53:57.676Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'repo-wide formatting baseline'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.prettierignore'
    - 'docs'
    - 'scripts'
    - 'codemod'
    - 'packages/caws-cli'
    - 'packages/caws-cli/src/kernel'
    - '.claude'
    - '.github'
    - 'AGENTS.md'
    - 'README.md'
    - 'CHANGELOG.md'
    - 'CONTRIBUTING.md'
    - 'CODE_OF_CONDUCT.md'
    - 'COMMIT_CONVENTIONS.md'
    - 'MANUAL_RELEASE.md'
    - 'QWEN.md'
    - 'SECURITY.md'
    - 'jest.config.js'
  out: []
invariants:
  - 'The slice changes formatting only: no source file changes meaning, proven by the full CLI suite passing at the same counts as the pre-slice baseline.'
  - 'Governed CAWS state (.caws/) and every CAWS-MANAGED or @generated artifact is excluded from formatting and byte-identical after the slice, so no pack fingerprint shifts and no consumer re-propagation is forced.'
acceptance:
  - id: A1
    given: 'a repo where prettier reports 580 tracked files as unformatted'
    when: 'the baseline slice lands'
    then: 'prettier --list-different over tracked files reports zero, so a later commit touching one file no longer carries unrelated reflow'
  - id: A2
    given: 'the hook-pack fingerprint baseline and the generated-artifact checks'
    when: 'the baseline slice lands'
    then: 'every CAWS-MANAGED and @generated file is byte-identical to its pre-slice content and the pack fingerprint test passes unchanged'
  - id: A3
    given: 'lint-staged reformatting whatever is staged'
    when: 'a governed .caws/specs/*.yaml is staged after this slice'
    then: 'prettier reports it ignored, so the CLI remains the sole writer of spec YAML'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "At commit 32bd8e24: 'git ls-files -z | xargs -0 ./node_modules/.bin/prettier --list-different' returns 0 files, down from 580 at slice start. Measured on the COMMITTED state after lint-staged ran, and the working tree was clean afterwards — proving lint-staged found nothing further to reformat, which is the specific trap this slice closes (the Entry 42 commit carried 925 reflowed lines of a file it never edited). dist verified fresh against committed src via 'find packages/caws-cli/src -name *.ts -newer packages/caws-cli/dist/index.js' returning empty. IMPORTANT measurement note: use --list-different, not --check, over a raw git ls-files list — --check errors on 109 .sh/.py files for which no parser can be inferred, which is not a formatting failure."
    recorded_at: "2026-09-16T08:12:13.838Z"
    command: "git ls-files -z | xargs -0 ./node_modules/.bin/prettier --list-different | wc -l"
    exit_code: 0
