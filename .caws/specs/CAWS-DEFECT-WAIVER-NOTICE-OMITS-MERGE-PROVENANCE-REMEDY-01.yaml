id: CAWS-DEFECT-WAIVER-NOTICE-OMITS-MERGE-PROVENANCE-REMEDY-01
title: 'Waiver create notice and waiver/reprieve help route every non-gates-run block to reprieve, omitting the merge-time lane-provenance surface whose remedy is --add-support'
risk_tier: 3
mode: fix
lifecycle_state: draft
created_at: '2026-09-01T19:15:44.179Z'
updated_at: '2026-09-01T19:15:44.179Z'
blast_radius:
  modules:
    - 'packages/caws-cli/src/shell/commands/waiver.ts'
    - 'packages/caws-cli/src/shell/command-metadata.ts'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/waiver.ts'
    - 'packages/caws-cli/src/shell/command-metadata.ts'
    - 'packages/caws-cli/tests/shell/waiver-notice-merge-provenance.test.js'
    - 'packages/caws-cli/tests/store/scope-support-lifecycle.test.js'
    - 'packages/caws-cli/README.md'
    - 'docs/command-reference.md'
    - 'docs/api/cli.md'
  out: []
invariants:
  - 'NOT a waiver-plumbing change. The sole waiver consumer remains the caws gates run filter, and verifyLaneProvenance continues to ignore waivers, exactly as CAWS-DEFECT-WAIVER-SURFACE-UNCONSULTED-01 adjudicated. This slice repairs OPERATOR ROUTING only - what the copy tells a blocked operator to do - and changes no enforcement behavior.'
  - 'The operator-facing copy must not present the enforcement surfaces as an exhaustive taxonomy of any size. At least three are established (the gates-run waiver filter, PreToolUse hook guards, and merge-time lane provenance); the copy names the third and its remedy without asserting that the list is closed. Replacing a two-term claim with a three-term claim would recreate the same error one level later.'
  - 'The remedy named for a merge-time lane-provenance refusal is caws specs amend-scope <spec> --add-support <path>. A waiver and a reprieve both leave that refusal unchanged, so the copy must not route the operator to either for this class.'
  - 'Authority boundaries stay separate. Adding a scope.support entry must not lift a PreToolUse hook refusal, and granting a reprieve must not change merge readiness. The repair must not blur the distinctions CAWS-DEFECT-WAIVER-SURFACE-UNCONSULTED-01 was written to draw.'
acceptance:
  - id: A1
    given: 'a scratch repo whose policy declares gate scope_boundary and whose caws gates run reports a scope_boundary violation'
    when: 'the operator follows the routing the shipped copy names for a gate-run violation and creates a matching waiver'
    then: 'the waiver is created AND the caws gates run disposition actually changes for that violation, proving the existing gates-run routing is still live rather than merely still documented'
  - id: A2
    given: 'a session blocked by a real PreToolUse hook guard'
    when: 'the operator follows the routing the copy names for a hook block and runs caws reprieve grant'
    then: 'that hook guard is actually skipped for that session, proving the existing reprieve routing is still live at the hook rather than merely still documented'
  - id: A3
    given: 'a worktree whose branch history carries a commit touching a path outside laneScope, so caws worktree merge --dry-run refuses on lane provenance'
    when: 'the operator reads the refusal together with the waiver and reprieve operator copy'
    then: 'the routing they are given is caws specs amend-scope <spec> --add-support <path>, and neither the refusal nor the copy points them at caws reprieve or caws waiver for this class'
  - id: A4
    given: 'one fixed historical-scope-excursion fixture in which the SAME offending commit is present in base..branch throughout and only the governance mechanism is varied'
    when: 'merge readiness is evaluated three times, once after creating a matching waiver, once after granting a reprieve, and once after caws specs amend-scope --add-support for the offending path'
    then: 'the waiver leaves readiness unchanged, the reprieve leaves readiness unchanged, and only --add-support flips it to ready. The offending commit must be proven still present in base..branch in the third arm, so the flip is attributed to scope.support and not to the commit leaving the range'
  - id: A5
    given: 'the census of operator-facing surfaces carrying the waiver and reprieve routing, namely the waiver.ts create notice, the command-metadata.ts waiver group plus its create/list/revoke leaves plus the reprieve group description, README.md, docs/command-reference.md, and docs/api/cli.md'
    when: 'each is read after the change'
    then: 'every one carries the merge-provenance route and a re-run of the census finds no surface still presenting the routing as a closed choice. The census query and its positive control are recorded with the evidence so a later reader can re-run it rather than trust the count'
  - id: A6
    given: 'the repaired copy and a session blocked by a genuine PreToolUse hook refusal'
    when: 'the operator adds the blocked path to a spec scope.support'
    then: 'the hook refusal is UNCHANGED, because scope.support does not lift a hook guard. This is the boundary-preservation control: without it the taxonomy repair could blur the authority separation the predecessor spec was written to establish'
non_functional: {}
contracts: []
