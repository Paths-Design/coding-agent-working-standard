id: CAWS-AGENTS-SHOW-LIVENESS-CLASSIFY-01
title: 'caws agents show distinguishes the persisted lease status from the derived TTL liveness classification instead of returning one field that reads as both'
risk_tier: 2
mode: fix
lifecycle_state: active
