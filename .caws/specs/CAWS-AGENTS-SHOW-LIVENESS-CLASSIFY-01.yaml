    status: pass
    evidence_ref: "tests/shell/agents-show-liveness.test.js B1/B1b/B1c/B1d/B1e at 95abe29a. B1: a lease with status=active aged 9h past a 30m TTL yields payload.lease.status='active' AND payload.liveness.classification='stale' with source='derived' and agrees_with_persisted_status=false. B1b: the human form matches /persisted status:\\s+active/ and /derived liveness:\\s+stale/ and contains 'not persisted', so a reader can tell which value is on disk. B1d pins stopped, B1e pins the 'stopping' case where the literal comparison reads false with nothing wrong. Live CLI artifact on a real lease (e1516fbe, dist via Commander): 'persisted status: active' / 'derived liveness: stale (ttl 1800000ms, last_active 24838973ms ago)'. Baseline before the fix: 11 of 12 failed; only the not-found path passed."
    recorded_at: "2026-09-19T10:30:12.669Z"
    commit_sha: "95abe29a"
  - criterion_id: A2
    status: pass
    evidence_ref: "tests/shell/agents-show-liveness.test.js B2/B2b/B2c/B2d at 95abe29a, with a fixed injected now (T0) so show and list classify at literally the same instant. B2: the 9h-old lease is classification='stale' in show and appears in list's stale bucket and not its active bucket. The DISCRIMINATING pair is B2b/B2c: at age == ttl exactly the lease is active in both surfaces, at ttl+1ms it is stale in both -- the kernel rule is strictly 'age > ttl', so a local re-derivation written with >= passes every other test in the file and fails only there. Implementation calls callSummarizeActiveAgentsSafe({[session_id]: lease}, now, ttl) rather than comparing timestamps locally, so there is one implementation, not two that agree today. B2d pins the kernel's documented unparseable-timestamp rule (infinitely stale) with last_active_age_ms null rather than a fabricated number."
    recorded_at: "2026-09-19T10:30:14.126Z"
    commit_sha: "95abe29a"
  - criterion_id: A3
    status: pass
    evidence_ref: "tests/shell/agents-show-liveness.test.js B3 at 95abe29a plus a live CLI run through Commander on dist -- the latter matters because handler tests bypass Commander entirely and a flag can be accepted and silently ignored. B3: a 10m-old lease is classification='active' with ttl_ms=1800000 by default and classification='stale' with ttl_ms=300000 under staleTtlMs=300000; the human form contains '300000'. Live artifact, same real lease e1516fbe at the same instant, only the threshold changed: default -> 'derived liveness: stale (ttl 1800000ms, last_active 24838973ms ago)'; --stale-ttl-ms 86400000 -> 'derived liveness: active (ttl 86400000ms, last_active 24839149ms ago)'. The verdict flipping proves the flag reaches the classifier through register.ts opt-forwarding. 'caws agents show --help' lists the flag with its default."
    recorded_at: "2026-09-19T10:30:29.525Z"
    commit_sha: "95abe29a"
  - criterion_id: A4
    status: pass
    evidence_ref: "tests/shell/agents-show-liveness.test.js B4/B4b at 95abe29a. B4 derives its expectations FROM the JSON payload and asserts each appears in the human text -- persisted_status, classification, String(ttl_ms) and String(last_active_age_ms) -- so it cannot drift into asserting hardcoded strings that both renderings happen to share. It also asserts the record body is still reachable in the human form. B4b pins that a missing lease refuses identically in both: exit 1, {ok:false,error:'not_found'} in JSON and 'no lease for \"sess-absent\"' on stderr. Additional invariant test at the same revision: after showing a stale lease, the lease file is byte-identical (deep equal) with an unchanged mtime and status still 'active' -- the derived verdict is never written back, because persisting 'stale' would mean this session writing another session's lease file."
    recorded_at: "2026-09-19T10:30:31.130Z"
    commit_sha: "95abe29a"
  - criterion_id: A5
    status: pass
    evidence_ref: "docs/architecture/read-surface-authority.v1.yaml at 95abe29a: read_surfaces['agents show'].asserts is now [session_identity, liveness_classification] with a new derives: block naming 'kernel summarizeActiveAgents(last_active, now, ttl_ms), the same call agents list buckets with -- one rule, one implementation', and an is_not clause stating that the on-disk enum never holds 'stale' and that a fresh 'stopping' lease reads as derived-active without fault. The 'returns status=active for a session agents list buckets as stale' known_nonconformance entry is REMOVED because the code no longer collapses them. The sibling agents show parity entry was NARROWED rather than deleted -- it now names what remains true, that the record body is still a raw JSON dump while only three fields are labelled lines. Re-parsed with yaml.safe_load; known_nonconformance is 6 entries across 5 surfaces."
