invariants:
  - 'READ-ONLY, ALWAYS: divergence is computed with read-only git plumbing (rev-list --count, merge-base --is-ancestor). Neither surface checks out a ref, mutates a working tree, writes .caws/, or appends an event. caws status keeps its default-purity guarantee.'
  - 'DEGRADE, NEVER FAIL: a missing branch ref, a missing base ref, an unborn base, or any git failure renders an explicit unknown marker naming the reason. Divergence is never fabricated as 0/0, and a divergence failure never changes the exit code of worktree list or status.'
  - 'FRESHNESS IS DISCLOSED, NOT IMPLIED: the rendered counts are a point-in-time read of LOCAL refs shared across the worktrees. The surface states the reconcile command when the lane does not contain base, and never presents the number as a merge-time guarantee — the CAS in worktree merge is what reconciles.'
  - 'ONE COMPUTATION, TWO SURFACES: worktree list and status read the same store-layer function over the same (base, branch) pair, so the two surfaces can never disagree about how far a lane has diverged.'
acceptance:
  - id: A1
    given: >-
      a registered worktree wt-demo on branch wt-demo whose base main has advanced 3
      commits since the fork point, and wt-demo carries 2 commits of its own
    when: 'caws worktree list runs from the canonical checkout'
    then: >-
      the wt-demo row reports ahead=2 behind=3 (branch-only commits then base-only
      commits, matching git rev-list --left-right --count main...wt-demo), and exits
      0
  - id: A2
    given: >-
      a registered worktree wt-fresh whose branch ref was created at the current tip
      of main and has no commits of its own
    when: 'caws worktree list runs'
    then: >-
      the wt-fresh row reports ahead=0 behind=0 and is marked as containing base,
      distinguishing an up-to-date empty lane from a lane that merely has no commits
  - id: A3
    given: >-
      a registry entry whose branch ref does not exist (deleted branch, or the
      'unknown' placeholder a legacy record carries)
    when: 'caws worktree list runs'
    then: >-
      that row renders an explicit unknown divergence marker naming the unresolvable
      ref, every other row still renders its real counts, and the command exits 0
  - id: A4
    given: 'a session whose cwd is inside tracked worktree wt-demo, ahead 2 / behind 3 of main'
    when: 'caws status runs'
    then: >-
      the Current context block carries a lane line naming the worktree branch, its
      base, ahead=2, behind=3, and the reconcile command to run because the lane
      does not contain base; the byte-identical run mutates nothing under .caws/ and
      appends no event
  - id: A5
    given: 'a session whose cwd is the canonical checkout (no tracked worktree match)'
    when: 'caws status runs'
    then: >-
      no lane line is rendered at all — no placeholder, no zero-fill — and the rest
      of the dashboard is byte-identical to the pre-change baseline
  - id: A6
    given: 'a session inside tracked worktree wt-demo and the same repo state'
    when: 'caws status --json runs and caws worktree list runs'
    then: >-
      the JSON lane object's ahead/behind/contains_base equal the counts the
      worktree list row prints for wt-demo, proving both surfaces read one
      computation
non_functional: {}
