invariants:
  - 'A remediation command the CLI prints must be runnable at the moment it is printed, or must name the step that makes it runnable. The AC-evidence advisory fires after the close has landed, so a bare "caws specs evidence <id> --ac ..." is refused by the freeze — the advisory must name the reopen that precedes it.'
  - 'When AC evidence is missing at close, the gap is recorded in the spec closure_notes — a tracked, pushed, durable surface — not only printed to a terminal that no future reader will see.'
  - 'A merge may land work without closing the bound spec, so an operator can bracket evidence recording between the landing and the close. That path must be explicit, and its output must state that the spec remains active and name the close command.'
  - 'The freeze itself is not relaxed: evidence still records only on active or draft specs. This slice widens the window before the freeze, it does not permit evidence after close.'
acceptance:
  - id: A1
    given: 'A spec closing with an acceptance criterion that has no pass/waived evidence.'
    when: 'caws specs close runs and emits the warn-mode advisory.'
    then: 'The advisory names caws specs reopen <id> as the step that makes the prescribed caws specs evidence command runnable, so the remediation is achievable rather than refused by the freeze.'
  - id: A2
    given: 'The same close.'
    when: 'The close transaction writes the spec body.'
    then: 'The unsatisfied acceptance criterion ids are recorded in the spec closure_notes, so a future reader sees which criteria closed without evidence without needing the terminal output of the session that closed it.'
  - id: A3
    given: 'An operator who wants to record AC evidence after landing a branch but before the spec closes.'
    when: 'caws worktree merge <name> --no-close runs.'
    then: 'The merge lands and the bound spec remains active, the output states that the spec was NOT closed and names the caws specs close command, and no spec_closed event is appended.'
  - id: A4
    given: 'A merge run WITHOUT --no-close.'
    when: 'caws worktree merge <name> runs.'
    then: 'The auto-close behaviour is unchanged — the spec closes in the same transaction and spec_closed is appended, so the default path is not altered by this slice.'
  - id: A5
    given: 'A spec that is already closed.'
    when: 'caws specs evidence <id> --ac <ac> runs against it.'
    then: 'It is still refused with the frozen-spec diagnostic — the freeze is preserved, and this slice is proven not to have relaxed it.'
observability:
  - 'The unsatisfied-AC list is recorded in the spec''s closure_notes, so the gap survives the session that created it.'
rollback:
  - 'Revert the implementation commit; the advisory returns to print-only and merge auto-closes unconditionally.'
non_functional:
  security:
    - 'No spec content or evidence reference is emitted to a new surface; closure_notes is already tracked and pushed.'
contracts:
