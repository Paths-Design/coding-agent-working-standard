evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Two tests, one per renderer, because the surfaces have separate sources: render/init-hook-pack.ts (applied install) and commands/init.ts renderActionList (plan). The second is 'the plan upstream-only note names the version boundary', same file. Each asserts BOTH halves of the criterion — the text names 12.0.0 and 12.1.0, and does NOT match /re-baselines a ported body/ — because the two failure modes are opposite and both live: present-tense turns a resolved caveat into a permanent brake on a provably safe refresh, deletion tells a consumer holding a 12.0.0-absorbed baseline that refreshing is safe. Falsified in two passes, since both assertions share a test() and the first failure short-circuits: reverting both renderers to the pre-fix text reddened the positive half on each ('Expected substring: 12.0.0 and 12.1.0'), then a text carrying the version boundary AND the stale phrase reddened the negative half on each ('Expected pattern: not /re-baselines a ported body/'). Anti-vacuity: both tests first assert the upstream_only bucket is the section being rendered; downgrading the fixture to local_growth made the applied-install test fail on 'Template moved — no local edit recorded' rather than on the caveat, proving the assertions are not evaluated against output that never contained the section. Also pins that a plan holding refused paths exits 1 with 'Plan refused; resolve the refusal above before applying init.' — found by asserting exit 0 and being wrong; the non-zero exit is the contract that makes --plan usable as a gate. Full suite 239 suites / 2998 tests / exit 0."
