invariants:
  - 'Canonical project governance remains authority; heartbeats, caches, requests and telemetry confer none.'
  - 'Required enforcement cannot be allowed by missing checks, transport errors, stale decisions or advisory failure.'
  - 'Preserve independently supported consumer contracts and project overrides; migration evidence distinguishes implementation, installation and native execution.'
  - 'Machine-wide shared capacity must isolate canonical project and session state; no single repository may monopolize required enforcement.'
acceptance:
  - id: A1
    given: 'the inspected CAWS baseline and original user scope'
    when: 'the migration tracker and architecture are maintained'
    then: 'every first-party Python implementation and runtime feature has a destination, dependency, owner, status, falsifiable acceptance and concrete evidence or an explicit remaining obligation.'
  - id: A2
    given: 'supported hook inputs and current governance'
    when: 'the Rust client invokes the typed runtime'
    then: 'native decisions, refusals, context and provenance match independently derived consumer contracts without the first-party per-handler interpreter fan-out.'
  - id: A3
    given: 'concurrent starters, missing heartbeats, version changes, crashes and interrupted requests'
    when: 'runtime lifecycle transitions execute'
    then: 'startup is single-owner, in-flight work survives idle eligibility, stale authority cannot permit operations, and interrupted outcomes are explicit without unsafe replay.'
  - id: A4
    given: 'first-party production and developer Python implementations'
    when: 'the migration completes'
    then: 'comparable Rust or typed TypeScript implementations and consumers replace them, packaging requires no first-party Python execution, and preserved foreign scripts or historical fixtures are explicitly classified.'
  - id: A5
    given: 'supported harnesses, stock guards, CLI authority and project overrides'
    when: 'parity and installed native validation run'
    then: 'required refusals, lifecycle operations, output precedence, audit custody and extension behavior remain supported with per-feature evidence.'
  - id: A6
    given: 'declared workloads and machine conditions'
    when: 'baseline and candidate latency, memory, queueing and child-process behavior are measured'
    then: 'the tracker records reproducible cold and warm distributions, bounded overload behavior and demonstrated removal of stock orchestration fan-out.'
  - id: A7
    given: 'built packages and prior installed generations'
    when: 'installation, upgrade and rollback are exercised'
    then: 'runtime and protocol identity, trust/adoption, immutable generation recovery and consumer documentation are verified before replacing the shared machine runtime.'
  - id: A8
    given: >-
      at least thirteen simultaneous CAWS sessions across at least four
      repositories, including mixed harnesses and repeated session IDs in different
      repositories
    when: >-
      concurrent guard and rendering bursts, slow extensions, overload, heartbeat
      expiry and generation upgrades are exercised
    then: >-
      per-project and per-session measurements demonstrate bounded fair admission,
      isolated state, ordered owner-specific mutations, independent required
      enforcement capacity, no eviction of in-flight work and no unsafe replay or
      interruption of another generation.
observability:
  - 'Per-request runtime identity, stage timings, terminal outcome, interrupted state and separate transport delivery observation.'
rollback:
  - 'Retain old immutable runtime generation and existing governance bytes until replacement installation and native refusal/lifecycle proof; rollback via supported adapters command.'
non_functional:
  security:
    - 'Private authenticated local transport, bounded request sizes and deadlines, explicit client/session/project provenance and no stale-authority grant.'
