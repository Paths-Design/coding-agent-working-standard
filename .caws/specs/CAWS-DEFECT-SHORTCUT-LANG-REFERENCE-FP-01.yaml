  out: []
invariants:
  - 'A guard strikes on incomplete work, never on a reference to it.'
  - 'A narrowing that removes false positives must be proven not to remove true positives.'
acceptance:
  - id: A1
    given: 'a source line referencing a CAWS spec id that contains the token TODO, such as a comment reading CAWS-DEFECT-SPECS-CREATE-TODO-SCAFFOLD-01'
    when: 'the shortcut-language guard scans it'
    then: 'no strike is recorded — a spec id is an identifier, and CAWS itself mints ids containing TODO whenever a defect is about TODO scaffolding, so the guard strikes the very work that fixes it'
  - id: A2
    given: 'product code whose STRING VALUE is a placeholder marker, such as a constant defining the scaffold text the CLI writes'
    when: 'the guard scans it'
    then: 'no strike is recorded — the code is complete and the token is data it owns, not a stub left behind'
  - id: A3
    given: 'a genuine incomplete-work stub such as a bare TODO comment or a not-implemented throw in non-test source'
    when: 'the guard scans it'
    then: 'a strike IS still recorded — the narrowing must not disarm the guard, proven by a positive control rather than only by absence of false positives'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "At 457b9e5998a8b7884ad82bb47755f7dac7490e5b: shortcut-language-check.sh strips a marker joined by - or _ to an uppercase alphanumeric (either side) before the comment scan; a spec id carrying the marker no longer strikes and writes no strike file. Companion test 'id-shaped marker joins with a leading or trailing uppercase segment are identifiers'. Break-the-fix via SHORTCUT_GUARD_MUTATE_FROM/_TO: disabling id-stripping failed tests 18, 19, 40; each half alone failed 19. Shared pack 89->90 with refreshed pack-fingerprints.json; full caws-cli jest 273/273 suites, 3739 tests. Installed ~/.caws copy not updated until adapters reinstall."
