  out: []
invariants:
  - 'Reap never deletes a record for a still-live process younger than the 7-day hard cutoff'
  - 'Reap failures are silently swallowed and never block the hook (fail-open contract preserved)'
acceptance:
  - id: A1
    given: 'agent-pid-<pid>.json records exist across a range of mtimes'
    when: 'the write path''s rate-limited reap runs'
    then: 'records older than 7 days are deleted unconditionally, records 3-7 days old are deleted only when their recorded pid is confirmed dead via kill -0, and records under 3 days old are never touched'
  - id: A2
    given: 'orphaned .agent-pid-<pid>.tmp.<random> atomic-write remnants older than 60 minutes'
    when: 'the reap runs'
    then: 'they are deleted regardless of pid liveness'
  - id: A3
    given: 'the reap ran less than 60 minutes ago (marker file fresh)'
    when: '_write_agent_pid_record fires again'
    then: 'the reap is skipped (rate-limited, no repeated directory scans per hook call)'
non_functional: {}
contracts:
  - name: 'agent-pid-reap'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "npx bats tests/hooks/bats/parse-input.bats — 'reap: records under 3 days old are never touched', 'reap: 3-7 day band deletes only when the recorded pid is confirmed dead (kill -0)', 'reap: records past the 7-day hard cutoff are deleted unconditionally' — 3x repeated run, all green (11/11)"
    recorded_at: "2026-08-19T19:31:14.640Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "npx bats tests/hooks/bats/parse-input.bats — 'reap: orphaned .tmp atomic-write remnants older than 60 minutes are swept; fresh ones survive'"
    recorded_at: "2026-08-19T19:31:15.106Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "npx bats tests/hooks/bats/parse-input.bats — 'reap: rate-limited to once per hour via the marker file — a second call in the same window is a no-op'; full suite npx jest — 148 suites/1991 tests passed"
    recorded_at: "2026-08-19T19:31:15.562Z"