updated_at: '2026-10-25T18:44:21.584Z'
created_by_session: '01a17052-3ea7-79b1-86be-7296991f8fd0'
blast_radius:
  modules:
    - 'Session-scoped human reprieve reading, dispatcher consumption and runtime packaging'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/runtime/reprieve-reader.ts'
    - 'packages/caws-cli/src/runtime/reprieve-entry.ts'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/reprieve.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/reprieve-reader.cjs'
  out: []
  support:
    - packages/caws-cli/scripts/generate-runtime-assets.mjs
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/templates/hook-packs/shared/advisory_truncate.cjs
    - packages/caws-cli/templates/hook-packs/shared/lib/guard-config.cjs
    - packages/caws-cli/tests/runtime/reprieve-reader.test.js
    - packages/caws-cli/tests/runtime/generated-runtime-assets.test.js
    - packages/caws-cli/tests/adapter/reprieve-roundtrip.test.js
    - docs/internal/caws-runtime-modernization.md
invariants:
  - 'No actual reprieve grant, revoke, global runtime installation, registration or trust change occurs'
  - 'Malformed, unavailable, expired, revoked or mismatched reprieve data leaves guards executing and cannot create authority'
  - 'Session, handler, canonical repo reach, global shadowing, symlink refusal and compatible human-approved expiry behavior follow the inspected writer and legacy reader contracts'
  - 'Existing native admission pins, original30000ms deadline and full parent acceptance are not broadened or inferred from reader replacement'
acceptance:
  - id: A1
    given: 'legitimate private reprieve records and hostile session/handler/repo/expiry/revocation/filesystem controls'
    when: 'the existing shell function and actual dispatcher consume the typed reader'
    then: 'valid grants skip only the named matching guard and retain its required record while invalid or unavailable data leaves the guard running with globals reset'
  - id: A2
    given: 'the generated standalone reader and actual shell consumer'
    when: 'source generation, package installation and detached controls execute without Python available to the reader'
    then: 'the reader asset is shipped and consumed with exact provenance, expiry/reason transport and fail-closed error behavior, eliminating this embedded Python implementation'
  - id: A3
    given: 'committed source, retained legacy comparisons and raw component/dispatcher checks'
    when: 'policy checks, meaningful negative controls and independent peer review complete'
    then: 'earned reader evidence and remaining R19/parent/native-adoption obligations are recorded without claiming whole-dispatcher or Python retirement'
observability:
  - 'Raw expiry/binding outcomes, installed dispatcher guard effects and execution records, generated-asset pins and retained failures'
rollback:
  - 'Revert the owned source unit normally; selected shared runtime and actual reprieve records remain unchanged'
non_functional: {}
contracts:
  - name: 'reprieve-reader-compatibility'
    type: behavior
