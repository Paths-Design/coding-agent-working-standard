invariants:
  - 'An absolute write target owned by another session, claimed by an active worktree or in another repository is refused for Codex exactly as for other surfaces'
  - 'Codex receives no lifecycle rewrite fact, and caws hooks analyze never admits a Codex native envelope'
  - 'Shell, startup, alias and directory fields that conflict with the declared Bash subset stay refused'
  - 'The launcher restates a Codex Bash payload as session cwd plus execution_workdir only when the session header names a release that reports the command directory as hook cwd (0.166.0 or later); any other Codex command is refused with the remedy named'
  - 'The session anchor is the hook process directory, which no tool call can choose: a per-call directory cannot switch governance off or move it to another project'
acceptance:
  - id: A1
    given: >-
      a Codex PreToolUse Bash call through the launcher, from a host at 0.166.0 or
      later, with the session and command directories in one governed project
      including a linked worktree the session owns
    when: >-
      reads, relative and absolute writes the session may make, cp, and a plain git
      commit are judged by the whole installed chain
    then: 'every handler runs, the call exits 0 with no decision and no rewrite'
  - id: A2
    given: >-
      a governed session and a command directory that is foreign: another session's
      worktree, a governed or ungoverned sibling repository, or a directory outside
      any repository
    when: >-
      a relative or absolute write or a git commit targets another session's
      worktree, a claimed path or another repository
    then: >-
      it exits 2 naming the owner or repository, the target is unchanged, and reads
      in those directories still run
  - id: A3
    given: >-
      a host older than 0.166.0, or a session header that is missing, malformed,
      oversized, not a regular file or a 0.166 prerelease, and any caller-added
      workdir or lookalike field
    when: 'the write guard evaluates a relative write target or a Git write with no literal directory'
    then: >-
      the directory is unknown and the command is refused without an ownership
      conclusion, while reads and absolute targets keep their own verdicts; a
      tool_input.cwd is refused as unsupported-execution-context
  - id: A4
    given: 'codex native envelopes, native tool aliases and lifecycle commands'
    when: 'caws hooks analyze or the lifecycle rewrite consumes them'
    then: 'analyze stays execution-contract unresolved, aliases stay refused, and singleLifecycle is null'
  - id: A5
    given: 'real Codex commands recorded in this repository'
    when: 'they are replayed without execution through the last Codex-admitting guard and this guard'
    then: 'every newly refused command is listed with its cause and none is a read-only or absolute-target command the session may run'
  - id: A6
    given: 'the installed runtime built from the merged candidate'
    when: 'a live Codex session runs an inert read, a foreign write and a bound in-scope write with a governed commit'
    then: 'the read and commit run, the foreign write is refused with bytes unchanged, and hook-events records show the digest and verdicts'
observability:
  - 'bash-write-guard hook-events records per Codex call with runtime digest and exit status'
rollback:
  - 'Revert the merge and reinstall the CLI snapshot; the refusal returns'
non_functional: {}
contracts: []
