  out: []
invariants:
  - 'resolve_worktree_root is a path-shape match (/.caws/worktrees/<name>/ in ANY repository). A worktree root inferred from the target path or the hook cwd confers WORK_DIR ONLY when it is a linked worktree of the repository this session governs (the canonical checkout, also when the session is itself rooted inside one of its worktrees). A worktree of any other repository is a foreign write and takes the SCOPE-GUARD-FOREIGN-REPO-CONTAINMENT-001 hard block on the first attempt: no strike ramp, no strike file written into the foreign repository''s gitdir.'
  - 'Same-repository behavior is unchanged: a write into one of this repository''s own linked worktrees still adopts that worktree as WORK_DIR and evaluates the path worktree-relative through caws scope check, exactly as before. A session rooted inside a worktree editing a sibling worktree of the same repository is NOT foreign.'
  - 'Template change ships with a SHARED_PACK_VERSION bump and a new pack-fingerprints.json entry, or the fix never reaches installed hooks (HOOK-PACK-VERSION-FINGERPRINT-001).'
acceptance:
  - id: A1
    given: 'a session whose CAWS_PROJECT_DIR is repo A and a second directory B carrying B/.caws/worktrees/wt-x/src/f.ts, with a caws stub whose scope check would ADMIT'
    when: 'the installed scope-guard adjudicates an Edit to the absolute path of that file'
    then: 'it exits 2 with the containment block naming a DIFFERENT repository, emits no strike message, and does not consult the strike ramp'
  - id: A2
    given: 'the same session and a file under repo A''s own .caws/worktrees/wt-own/src/f.ts with a caws stub whose scope check REFUSES'
    when: 'the installed scope-guard adjudicates an Edit to that absolute path'
    then: 'the refusal names the worktree-relative path src/f.ts (the owned worktree was adopted as WORK_DIR) and no foreign-repository block is emitted'
  - id: A3
    given: 'the shared template tree after the fix'
    when: 'the pack-fingerprint jest test and the full scope-guard bats file run against a freshly built dist'
    then: 'the recorded shared fingerprint matches the live tree at the bumped SHARED_PACK_VERSION and every scope-guard bats test passes'
non_functional: {}
