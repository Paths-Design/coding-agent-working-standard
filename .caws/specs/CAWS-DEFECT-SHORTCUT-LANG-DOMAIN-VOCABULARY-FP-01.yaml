invariants:
  - 'A guard strikes on incomplete work, never on domain vocabulary that shares a marker word.'
  - 'A narrowing that removes false positives is proven not to remove true positives: every silent case is paired with a firing positive control that asserts the pattern class, quoted line, and a recorded strike.'
  - 'A silent case asserts no strike was recorded, not only that stdout is empty.'
acceptance:
  - id: A1
    given: 'non-test UI source using placeholder as vocabulary (an Omit<..., "placeholder"> union member, a placeholder?: prop, placeholder={placeholder}, CSS ::placeholder / :placeholder-shown, aria-placeholder, a bare JSDoc prop description, a descriptive comment such as ''The skeleton is a placeholder shown while loading'')'
    when: 'the shortcut-language guard scans the Write or Edit payload'
    then: 'no advisory is emitted and no strike is recorded'
  - id: A2
    given: 'non-test source using todo / XXX as vocabulary (type Todo, todos.filter, an XXX-XXX-XXXX input mask) or a string glob such as src/**/*.ts or src/*.ts'
    when: 'the guard scans it'
    then: 'no advisory is emitted and no strike is recorded — a glob''s /* does not open a comment'
  - id: A3
    given: 'genuine stub language in non-test source (// placeholder, This is just a placeholder, it''s a placeholder, placeholder implementation, placeholder for now, a JSDoc-fragment Edit reading ''* placeholder for now'', // TODO, // todo:, an uppercase "TODO" value, throw new Error("not implemented"), // coming soon)'
    when: 'the guard scans it'
    then: 'a strike-1 advisory IS emitted naming the pattern class and quoting the source line number and text, and the strike is recorded'
  - id: A4
    given: 'the shared pack template changed'
    when: 'the pack-fingerprint and install suites run'
    then: 'SHARED_PACK_VERSION is bumped with an appended fingerprint history entry so installed consumers receive the fix on caws init'
non_functional: {}
