invariants:
  - 'Guard and refusal text is the only surface read at the moment of a block. A discharge that exists but is not named there does not exist for the agent hitting it, so naming the sanctioned path in the refusal is the fix — documenting it elsewhere is not.'
  - 'A help description must not narrow a general mechanism to a subset it does not actually check. resolvePacks returns SHARED_PACK for diff and port, and overwriteSelects has no legacy gate, so calling these legacy-only is a claim the code does not make and it suppresses the non-destructive path.'
  - 'port and adopt are opposite outcomes and must never read as alternatives to each other: adopt KEEPS the local file and STOPS drift tracking, port LANDS reconciled content and RESUMES it. Text that lists them as two ways to quiet the same warning teaches an agent to stop tracking instead of to reconcile.'
  - 'This slice changes guidance and descriptions only. No flag gains or loses effect, no refusal becomes an apply, and the drift classification from CAWS-DEFECT-INIT-DRIFT-REFUSAL-UNCLASSIFIED-01 is unchanged.'
acceptance:
  - id: A1
    given: >-
      a managed hook refused as drift in any of the three classes (local_growth,
      upstream_only, unobserved)
    when: 'init renders the refusal, in both the plan preview and the applied-install output'
    then: >-
      the guidance names caws init port with its staging shape, and distinguishes it
      from --adopt by outcome: port lands reconciled content and RESUMES drift
      tracking, adopt keeps the local file and STOPS it. Before this change every
      refusal offered only destroy (--overwrite --force) or give up (--adopt), so
      the one path that preserves growth AND takes upstream was invisible at the
      only moment an agent reads
  - id: A2
    given: >-
      the COMMAND_SURFACE_METADATA descriptions for --overwrite, --force, --adopt,
      init diff and init port, which today all scope themselves to LEGACY packs
    when: 'caws init --help and caws init port --help are read off the built dist'
    then: >-
      no description claims a legacy-only scope that the code does not enforce.
      resolvePacks returns SHARED_PACK for diff and port and overwriteSelects has no
      legacy gate; disproved at runtime on 2026-09-16 when caws init --agent-surface
      dsh --overwrite .caws/hooks/reset-strikes.sh --force refreshed a current dsh
      v3 pack file and cleared two doctor findings
  - id: A3
    given: 'a CURRENT (non-legacy) shared-pack file with committed local growth, refused as local_growth'
    when: >-
      the advice the refusal now prints is followed end to end: reconcile into a
      staging file outside the hooks tree, then caws init port <path> --from
      <staging-file>
    then: >-
      the port lands the reconciled body keeping BOTH the local growth and the
      upstream lines taken, version-stamps it to the current pack, records a fresh
      baseline and audit-commits. The path REMAINS tracked as drift, because a
      reconciled body permanently differs from the template — this corrects the
      original wording of this criterion, which said the drift would clear and was
      wrong on the facts. Guidance naming a command that does not work on the reader
      pack would be worse than naming nothing, so the control is on the ADVICE, not
      the text
  - id: A4
    given: >-
      a pristine baseline written by the port path, which lands a RECONCILED body
      (template plus the repo growth) rather than a template
    when: >-
      the drift classifier from CAWS-DEFECT-INIT-DRIFT-REFUSAL-UNCLASSIFIED-01
      decomposes that path on a later run
    then: >-
      it reports local_growth, never upstream_only. Baselining the ported body made
      installed == baseline true for the one file shape guaranteed to hold local
      edits, so the classifier said "no local edit recorded" about reconciled work —
      the label that makes --overwrite --force look safe. The baseline must record
      the UPSTREAM body last synced to, so that installed minus baseline equals
      local growth by construction on BOTH write paths. This dissolves the ambiguity
      doctor pack_body_drift documents (the port path re-baselines the ported body)
      at its source instead of describing it forever. If the template is unreadable
      no baseline is written at all, because an absent baseline refuses as
      unobserved while a wrong one classifies confidently
  - id: A5
    given: >-
      the four surfaces that justified refusing a baseline-clean file by asserting,
      in the present tense, that the port path re-baselines a ported body: the
      HookPackDriftClass contract doc, the applied-install stale-copies section, the
      plan upstream-only note, and the doctor pack_body_drift finding
    when: >-
      A4 changes the port path to baseline the upstream template, making that
      assertion false of this version
    then: >-
      every one of the four states the caveat in the past tense and names the
      versions it is true of (12.0.0 and 12.1.0, where portHookFile and pristine
      baselines shipped in 8ca7ed21). That claim is the sole justification these
      surfaces give for refusing to call the file refreshable, so the two failure
      modes are asymmetric and both real: left in the present tense it turns a
      resolved caveat into a permanent brake on a safe refresh, and deleted outright
      it tells a consumer holding an absorbed baseline that refreshing is safe,
      which destroys growth this fix does not heal retroactively. The doctor
      narrowRepair additionally names caws init port <path> --from <staging-file>
      and states that re-porting clears an absorbed baseline, because it previously
      offered only --overwrite --force in the one surface a consumer reads when
      deciding whether to refresh — the same omission this spec exists to fix
non_functional: {}
