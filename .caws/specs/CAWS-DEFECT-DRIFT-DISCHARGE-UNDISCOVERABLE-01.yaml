    - 'packages/caws-cli/src/shell/commands/init.ts (plan refusal guidance; port handler)'
    - 'packages/caws-cli/src/shell/command-metadata.ts (discharge flag/subcommand descriptions)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/render/init-hook-pack.ts'
    - 'packages/caws-cli/src/shell/commands/init.ts'
