  - criterion_id: A2
    status: pass
    evidence_ref: "Reads 'caws init --help' and 'caws init port --help' by spawning the built dist in an isolated CAWS_HOME, not by calling a handler, so it cannot pass over a flag that Commander never forwards (the register.ts opt-forward false-confidence class). Asserts the absence of both false scopings ('Legacy packs only', 'LEGACY project-pack') AND the presence of the property that makes port the right choice ('non-destructive discharge') — omitting the false claim without stating the true one would leave the surface silent rather than correct. Falsified by reinstating 'LEGACY project-pack' in command-metadata.ts: the failure printed the real Commander banner 'Usage: caws init port [options] <path>', confirming the assertion reads live CLI output. The legacy claim was independently disproved at runtime on 2026-09-16 when 'caws init --agent-surface dsh --overwrite .caws/hooks/reset-strikes.sh --force' refreshed a CURRENT dsh v3 pack file in this repo."
    recorded_at: "2026-09-17T08:29:56.233Z"
    test_nodeid: "packages/caws-cli/tests/init/drift-discharge-discoverability.test.js::A2: no discharge surface claims a legacy-only scope the code does not enforce"
    commit_sha: "2bb4822614157483261061d0a589b6709166781b"
  - criterion_id: A3
    status: pass
    evidence_ref: "The positive control: it follows the advice the refusal prints, end to end, on a CURRENT shared-pack file with committed local growth — install, grow, commit, reconcile into a staging file outside the hooks tree, then spawn the real 'caws init port <path> --from <staging-file>' on dist. Asserts the landed body keeps BOTH the local growth and the upstream line taken (the property --overwrite --force cannot provide), and that the path REMAINS classified local_growth, because a reconciled body permanently differs from the template. This test is what caught the portHookFile baseline defect: it failed with driftClass 'upstream_only' against my own prior slice, which is why A4 exists. Its original then-clause said the drift would clear; that was wrong on the facts and the criterion text was amended to say so explicitly rather than quietly re-scoped."
    recorded_at: "2026-09-17T08:30:10.138Z"
    test_nodeid: "packages/caws-cli/tests/init/drift-discharge-discoverability.test.js::A3: following the printed advice actually discharges the drift"
    commit_sha: "2bb4822614157483261061d0a589b6709166781b"
  - criterion_id: A4
    status: pass
    evidence_ref: "Asserts the baseline a port writes is the UPSTREAM body: not equal to what landed, and containing neither the repo growth nor the reconciled upstream line — then that the classifier reports local_growth. Falsified by restoring the one-line prior behavior (writePristineBaseline(..., rendered)): A4 and A3 both went red with 'Expected: local_growth / Received: upstream_only', reproducing the defect on demand. Second oracle, independent of my own test: packages/caws-cli/tests/init/init-upgrade-retrofit.test.js 'A5: port validates, lands, records the baseline, and resumes drift tracking' previously asserted readPristineBaseline(...) === landed. That assertion contradicted its own test name and the three-way test above it — a baseline equal to what landed reports zero LOCAL GROWTH on a file that just had growth ported in — so the oracle was corrected from the requirement, not bent to match the code, and now pins threeWay.available plus localGrowthDiff containing the ported line. The unreadable-template arm writes no baseline, so the path classifies unobserved and refuses rather than classifying confidently from a wrong third point."
    recorded_at: "2026-09-17T08:30:26.135Z"
    test_nodeid: "packages/caws-cli/tests/init/drift-discharge-discoverability.test.js::A4: a port baselines the template, so reconciled work is never called upstream_only"
    commit_sha: "2bb4822614157483261061d0a589b6709166781b"
  - criterion_id: A5
    status: pass
    evidence_ref: "The cited test pins the doctor surface, which is the only one of the four that is machine-checkable: message contains '12.0.0' (version-scoped), does NOT match /the port path re-baselines/ (the present-tense form cannot return), and narrowRepair contains 'caws init port <path> --from <staging-file>'. Both new assertions falsified separately, because they share a test() and the first failure short-circuits: reverting the message alone gave 'Expected substring 12.0.0' against the old text verbatim; reverting only the repair phrasing gave 'Expected substring caws init port <path> --from <staging-file>'. This was worth adding precisely because the pre-existing assertions ('AMBIGUOUS', 'READ the deltas') both survived the rewrite unchanged, so the message could have regressed silently. NOT COVERED BY TEST: the other three surfaces (HookPackDriftClass doc comment, applied-install stale-copies section, plan upstream-only note) were corrected and verified by grep — 'no present-tense claims remain in src/' — but only the doctor one has an assertion. The doc comment is a comment and untestable; the two renderer sections are reachable by test and are not pinned. That is a real coverage gap in this criterion, stated rather than papered over."
