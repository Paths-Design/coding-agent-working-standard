id: CAWS-STOCK-ROUTE-PARSE-INPUT-DIGEST-001
title: 'Stock route: record the reviewed digest of parse-input.sh after its comment-only revision'
mode: fix
lifecycle_state: draft
created_at: '2026-10-23T06:01:02.579Z'
updated_at: '2026-10-23T06:01:02.579Z'
