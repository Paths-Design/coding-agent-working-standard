id: CAWS-DESIGN-GLOBAL-IDENTITY-HOME-001
title: 'Design: global per-harness identity home (~/.caws), surface registry, guard-plane boundary'
risk_tier: 3
mode: doc
lifecycle_state: active
worktree: wt-global-home
updated_at: '2026-09-04T01:10:08.733Z'
blast_radius:
  modules:
    - docs/architecture/caws-vnext-command-surface.md
  data_migration: true
operational_rollback_slo: 5m
scope:
  in:
    - docs/architecture/caws-vnext-command-surface.md
  out:
    - packages
    - .github/workflows
invariants:
  - >-
    ADAPTER DOCTRINE: a harness interfaces with CAWS by writing its own
    adapter that forwards its content into the CAWS shape. CAWS never
    carries per-harness shapes. The caws dispatch plane is the single
    shell-script home for the hooks that run; harness adapters translate
    their lifecycle/tool events into that shape (the hooks-caws and
    agents-lifecycle-caws plugins are the reference implementation for dsh).
  - >-
    GLOBAL = IDENTITY + SESSION MACHINERY PER HARNESS: session-id
    resolution and the agent-PID correlation store move to a governed
    per-harness global home (~/.caws/surfaces/<surface>/lib/ and
    ~/.caws/state/). PID correlation is machine-global by nature (PIDs
    are per-machine); identity resolution is machine/user state that
    caws init must never rewrite. A harness update with no CAWS fix is
    patched ONCE in the machine's own home by the agent who needs to
    unblock — no repo commit, no per-repo migration.
  - >-
    REPO-LOCAL STAYS REPO-LOCAL: specs, policy, worktrees.json,
    events.jsonl, sessions/ (turn logs — project-specific), leases/
    (per-project liveness), and the .caws/hooks dispatch + guard rows
    all remain repo-local. Dispatch is what lets a repo add or update
    its own hooks; the guard rows keep their per-repo enforcement
    posture.
  - >-
    GUARDS KEEP THEIR TEETH: the worktree guards and scope guards remain
    repo-local authority enforcement and are fed BY the global identity
    plane, never bypassed BY it. Cross-worktree takeover and
    cross-repo writes still require the governed mutators: caws claim
    --takeover (with prior_owners audit) and caws reprieve on hooks.
    Global identity never relaxes a refusal.
  - >-
    OVERRIDE TIERS: caws_source_lib gains a USER tier between the
    repo-local vendor override and the shared fallback:
    repo override -> ~/.caws/surfaces/<surface>/lib -> vendored shared
    default. The user tier is inert-by-default (absent until the machine
    owner creates it); removing the override restores true-to-caws
    behavior. Repo overrides keep winning (today's behavior preserved).
  - >-
    SURFACE REGISTRY SINGLE SOURCE: one registry (surfaces.json: id,
    per-session env var, hook mechanism, trust-gated flag, pin-map
    membership) generated into the TS union and shell case blocks at
    build time — the surface-type duplication drift becomes
    impossible-by-construction. The registry is part of the global home,
    not the repo.
  - >-
    GLOBAL HOME IS GOVERNED: ~/.caws carries managed-header-stamped lib
    files (the existing parser), a version stamp, and doctor coverage
    (global drift sweep). Machine-patched lib files are sanctioned
    growth (the repo --adopt doctrine, applied to the machine), never
    corruption. The PID record remains the trust ANCHOR above any
    hand-edited script: spoofing it still requires owning the PID.
  - >-
    CANONICAL MATERIALIZATION IS A GOVERNED CONCERN: governed merges
    advance the base through the object database and never touch the
    shared working tree, so the canonical checkout predictably lags HEAD
    (observed twice this cycle: stale templates served a v43 pack, and
    stale sources rebuilt the canonical dist). The global home does not
    have this problem (no shared working tree), but the CLI gains a
    doctor rule (doctor.canonical.working_tree_behind_head) and the
    global-home slices must never re-derive state from a possibly-stale
    working tree — read installed packs and templates from the built
    dist/registry, not the checkout.
  - >-
    LEGACY PURGE IS ARCHIVE-FIRST: the v10-era ~/.caws residue observed
    on this machine (working-spec.yaml, orphan events.jsonl, sessions/,
    specs/, state/) is archived (moved aside, recorded) — never
    blind-deleted — before the new home is stamped, so nothing from the
    pre-v11 era is silently lost.
acceptance:
  - id: A1
    given: 'the v10-era ~/.caws residue on this machine'
    when: 'the migration slice runs'
    then: 'every pre-existing entry is archived with a recorded manifest of what existed and where it moved, and the new governed ~/.caws structure (surfaces/<surface>/lib, state/, registry) is stamped in its place'
  - id: A2
    given: 'the surface registry (surfaces.json)'
    when: 'the CLI builds'
    then: 'the TS AgentSurface union and the shell pin/case blocks derive from the registry — adding a surface is one registry edit, and the duplication drift class cannot recur'
  - id: A3
    given: 'a per-harness global lib tier in caws_source_lib'
    when: 'a harness updates its event shape before CAWS has a fix'
    then: 'the machine owner patches ~/.caws/surfaces/<surface>/lib once, guards keep enforcing through the governed mutators (--takeover, reprieve), and repo overrides still win over the user tier'
  - id: A4
    given: 'the global home'
    when: 'caws doctor runs'
    then: 'global drift findings fire for unmanaged/unstamped ~/.caws state, machine-patched managed files are reported as sanctioned growth, and absent user tiers are silent'
non_functional:
  reliability:
    - >-
      The identity and session machinery that has produced every
      post-merge defect this cycle (env shadowing, the type-lie, capsule
      invention, orphaned lease tmp, silent trust-gate stripping) gains
      the same rigor as the governed repo-local core: managed headers,
      version stamps, doctor coverage, and inert-by-default overrides.
contracts: []
