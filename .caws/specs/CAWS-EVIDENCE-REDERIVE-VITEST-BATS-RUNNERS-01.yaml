id: CAWS-EVIDENCE-REDERIVE-VITEST-BATS-RUNNERS-01
title: 're-derivation detects vitest and cannot run bats, so criteria cited by those tests are runner_unavailable in every repo that uses them'
risk_tier: 2
mode: feature
lifecycle_state: draft
created_at: '2026-09-23T19:10:27.070Z'
updated_at: '2026-09-23T19:10:27.070Z'
created_by_session: '24846b74-e4d2-4ea1-9974-a1f681aaad88'
blast_radius:
  modules:
    - 'caws-cli/store (evidence-rederive)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/evidence-rederive.ts'
    - 'packages/caws-cli/tests/store/evidence-rederive.test.js'
  out: []
invariants:
  - 'An execution path for a runner ships only with a test that runs a real fixture through it and proves a zero-match selection is never verified.'
acceptance:
  - id: A1
    given: 'a vitest project citing one passing test by name'
    when: 'verify-acs --run runs'
    then: 'the criterion is verified and the detail says one test executed'
  - id: A2
    given: 'a .bats file citing one test by name'
    when: 'verify-acs --run runs'
    then: 'the named test is executed through the repo''s bats and verified or refuted by its result; a name selecting nothing is never verified'
non_functional: {}
contracts:
  - name: 'evidence-rederive-executes-vitest-and-bats'
    type: behavior
