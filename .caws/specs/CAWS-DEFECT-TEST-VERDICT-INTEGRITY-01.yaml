id: CAWS-DEFECT-TEST-VERDICT-INTEGRITY-01
title: 'test entry points must not report a verdict the run did not produce'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-test-verdict
created_at: '2026-08-12T17:22:47.279Z'
updated_at: '2026-08-12T17:22:56.376Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/scripts/run-tests.js'
    - 'packages/caws-cli/tests/shell/run-tests-exit-code.test.js'
    - 'packages/caws-cli/tests/shell/message-command.test.js'
  out: []
  support:
    - jest.config.js
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'run-tests.js spawns jest and jest is terminated by a signal (spawnSync returns status null)'
    when: 'run-tests.js computes its exit code'
    then: 'it exits non-zero and names the signal, instead of collapsing null to 0'
  - id: A2
    given: 'jest fails to spawn at all (spawnSync sets .error, status null)'
    when: 'run-tests.js computes its exit code'
    then: 'it exits non-zero and prints the spawn error'
  - id: A3
    given: 'a normal jest failure (status 1)'
    when: 'run-tests.js computes its exit code'
    then: 'it still exits 1 and cleanup failure never masks it'
  - id: A4
    given: 'a message is already waiting in the mailbox'
    when: 'caws message poll --wait runs'
    then: 'the test proves the retry sleep never ran by call-observation, not by wall-clock elapsed time'
  - id: A5
    given: 'a developer runs bare npx jest from the repo root'
    when: 'the run starts'
    then: 'it either runs the packages own working configuration or does not exist as an entry point at all — it never reports 125 spurious suite failures'
non_functional: {}
contracts:
  - name: 'run-tests-exit-code'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "commit d6228e5b: verdict maps status===null to 1 and names the signal; tests/shell/run-tests-exit-code.test.js pins it at the verdict unit AND through main for build/jest/cleanup. Premise proven at runtime not assumed: spawnSync of a self-SIGKILLing node child returns status=null signal=SIGKILL. Falsified by reverting the null branch to return 0 - exactly 4 tests reddened, by predicted name."
    recorded_at: "2026-08-12T17:44:50.299Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "commit d6228e5b: verdict returns 1 and prints result.error.message when spawnSync never launched the child. Pinned by \"verdict maps a failed spawn to non-zero and surfaces the spawn error message\" and \"jest failing to spawn exits non-zero and reports the spawn error\" in tests/shell/run-tests-exit-code.test.js."
    recorded_at: "2026-08-12T17:46:56.473Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "commit d6228e5b: jest-over-cleanup precedence preserved and now under test - \"an ordinary jest failure still exits with jest exit code\", \"a cleanup failure never masks a jest failure\" (jest 1 + cleanup 3 => 1), \"a cleanup failure decides the verdict only when jest passed\" (jest 0 + cleanup 3 => 3). End-to-end proof of the unchanged CLI entry: node scripts/run-tests.js tests/shell/run-tests-exit-code.test.js ran build then jest 14/14 then cleanup, exit 0."
    recorded_at: "2026-08-12T17:49:02.900Z"
  - criterion_id: A4
    status: pass
    evidence_ref: "commit 20c6e771: the wall-clock assertion Date.now()-t0 < 1500 is replaced by a jest.spyOn on dist/store/repo-root sleepSyncMs asserting the retry sleep never ran. Non-vacuity is proven by a positive control in the sibling empty-mailbox test, where the same spy asserts toHaveBeenCalled. 12/12 green in message-command.test.js."
    recorded_at: "2026-08-12T17:50:50.229Z"