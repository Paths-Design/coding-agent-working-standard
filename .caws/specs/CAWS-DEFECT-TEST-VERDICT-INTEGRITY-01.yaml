id: CAWS-DEFECT-TEST-VERDICT-INTEGRITY-01
title: 'test entry points must not report a verdict the run did not produce'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'Three defects that made this repo''s test verdicts untrustworthy, plus one found while landing. (1) run-tests.js -- what npm test / turbo run test / pr-checks.yml executes -- computed the jest verdict as jest.status || 0, and spawnSync sets status to null when the child is signal-killed (OOM on the 137-suite run, SIGSEGV, a CI timeout sending SIGTERM) or never spawned at all. A killed suite therefore reported green. All three steps now route through verdict(), which fails on null and names the signal or spawn error; main() is exported with the spawn function injectable so the real control flow is under test rather than a reimplementation of it. Falsified: reverting the null branch reddened exactly the 4 predicted tests, by name. Every other spawnSync call site in the repo already used status !== 0, which is fail-closed, so this was the unique instance -- and it was the one deciding CI. (2) Bare npx jest at the repo root reported 125 of 137 suites failed to run in 4.8s on a green tree: the root config still described the pre-absorption layout and declared a babel-jest transform needing @babel/preset-env, which is not a dependency of this repo. Nothing referenced the file, so its only effect was to turn a plausible command into a catastrophic false red. The root now lifts caws-cli''s two projects with an explicit rootDir; naming the package directory as a project was tried and rejected on evidence, because jest drops a nested projects key and silently breaks every kernel .test.ts. Root run is now 136 suites / 1946 tests green, reconciling exactly with the package-dir baseline. (3) message-command.test.js asserted elapsed wall-clock under 1500ms against a 2000ms window, which measures machine load rather than code and reddened under full-suite contention; replaced with call-observation on the retry sleep, with a positive control in the sibling test so the negative assertion cannot pass vacuously. (4) Found while merging, filed separately: this slice put jest.config.js in scope.support, caws scope show ADMITted it, but caws worktree merge refused the lane branch because its prerequisite check reads scope.in only. scope.support is documented as editable-but-not-claimed for exactly this kind of repo-root deliverable, so as it stands a support-scoped edit can be made and committed but never landed. Unblocked by amending jest.config.js into scope.in. A second defect surfaced in the same attempt: amend-scope --remove-support on the only support entry fails with store.lifecycle.plan_rejected Expected array at /scope/support.'
created_at: '2026-08-12T17:22:47.279Z'
updated_at: '2026-08-12T17:54:07.453Z'
