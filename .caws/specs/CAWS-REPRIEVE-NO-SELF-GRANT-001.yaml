invariants:
  - 'The party a guard constrains cannot be the party that lifts it: no code path lets a session running under any agent-session env var write its own reprieve record.'
  - 'The refusal is keyed on the UNION of every session var the resolver consults, never on CAWS_SESSION_ID alone — that var is fourth in precedence and typically unset for agents, so a check keyed on it permits the motivating self-grant.'
  - 'Evasion is self-punishing: the same vars that trigger the refusal are the ones session resolution needs, so clearing them to slip past the guard makes the grant fail for lack of a session id.'
  - 'This env-union check is an interim measure, not the durable gate. It raises cost, it does not make self-granting impossible, and it is superseded by CAWS-SESSION-IDENTITY-INVERSION-001.'
acceptance:
  - id: A1
    given: 'any recognized agent-session env var is set (CLAUDE_SESSION_ID, CLAUDE_CODE_SESSION_ID, CODEX_THREAD_ID, CAWS_SESSION_ID, HOOK_SESSION_ID, CURSOR_TRACE_ID)'
    when: 'caws reprieve grant runs'
    then: 'it refuses with ''agents cannot grant their own reprieves'' and writes no state file, because a guard weakened by the party it constrains is not a guard'
  - id: A2
    given: 'a Codex-shaped session where only CODEX_THREAD_ID is set and CAWS_SESSION_ID is absent'
    when: 'grant runs'
    then: 'it still refuses, because keying on CAWS_SESSION_ID alone would permit the exact self-grant event that motivated this slice'
  - id: A3
    given: 'no agent env var is set (a human shell)'
    when: 'grant runs'
    then: 'it proceeds normally, so the human path is not collateral damage'
  - id: A4
    given: 'an agent unsets every agent env var to evade the refusal'
    when: 'grant runs'
    then: 'session resolution fails and the grant is refused anyway, so evasion is self-punishing rather than free'
  - id: A5
    given: 'the refusal fires'
    when: 'the operator reads it'
    then: 'it names the exact command a human runs outside the agent session, so the blocked path terminates in a remedy rather than an incentive to hand-edit the state JSON'
non_functional: {}
contracts:
  - name: 'reprieve-grant-agent-refusal'
    type: behavior
