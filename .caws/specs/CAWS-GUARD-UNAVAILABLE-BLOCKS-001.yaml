  out: []
invariants:
  - 'On the enforcing PreToolUse chain, a handler that is missing, not executable, or exits with a status other than 0 or 2 without a control decision never lets a mutating tool call proceed.'
  - 'A refusal produced because a guard could not run names the guard, what it could not do, states that the agent''s command did not cause it, and gives a remedy the blocked party can execute or an explicit instruction to stop and hand the fault to the user.'
  - 'A guard-unavailable refusal records no strike and arms no latch.'
  - 'Read, Glob and Grep are never blocked by a guard-unavailable fault; the fault is reported on stderr.'
  - 'Chains other than the enforcing PreToolUse chain keep their existing exit semantics.'
  - 'A chain member with no refusal path (agent-heartbeat.sh, cwd-guard.sh, scan-secrets.sh, quiet-merge.sh) never refuses a call by being absent or crashing; its fault is reported on stderr.'
  - 'The payload''s event name never disarms the chain its dispatcher selected with --short-circuit-on-block.'
acceptance:
  - id: A1
    given: 'the enforcing PreToolUse chain and tool_name Bash, Write or Edit'
    when: 'a handler exits 1 with stderr text and no control JSON'
    then: 'run_handlers returns 2 and prints one block decision whose reason names the handler, its exit status, the stderr tail, says the command did not cause the fault, and tells the agent to stop and report it'
  - id: A2
    given: 'the enforcing PreToolUse chain and a mutating tool'
    when: 'a listed handler is missing or not executable'
    then: 'run_handlers returns 2 with a block decision naming the handler and its expected path'
  - id: A3
    given: 'the enforcing PreToolUse chain and tool_name Read, Glob or Grep'
    when: 'a handler exits 1 or is missing'
    then: 'run_handlers does not return 2, and stderr names the handler and the fault'
  - id: A4
    given: 'the enforcing PreToolUse chain with at least one handler and a payload that carries no tool name'
    when: 'the chain is dispatched'
    then: >-
      run_handlers returns 2 with a block decision saying the payload carried no
      tool name, because an unidentified tool is not provably read-only and every
      guard filters on the tool name
  - id: A5
    given: 'a chain invoked without the enforcing flag (PostToolUse, Stop)'
    when: 'a handler exits 1'
    then: 'the return status and output are unchanged from before this change'
  - id: A7
    given: 'a later handler in the chain'
    when: 'an earlier handler was unavailable on a mutating call'
    then: 'the block is returned without running handlers that could record a strike or latch'
  - id: A8
    given: 'the enforcing chain and a mutating tool'
    when: 'agent-heartbeat.sh, cwd-guard.sh, scan-secrets.sh or quiet-merge.sh is missing or exits 1'
    then: >-
      run_handlers does not return 2, stderr names the advisory handler and its
      fault, and the rest of the chain runs; shortcut-language-check.sh in the same
      state is refused as a guard
  - id: A9
    given: 'the enforcing chain, a mutating tool and a crashed guard'
    when: 'the payload names any event, including Stop, SessionEnd or PostToolUse'
    then: 'run_handlers returns 2 and later handlers do not run'
  - id: A10
    given: 'CAWS_HOOK_DRY_RUN=1 on the enforcing chain'
    when: 'a guard is missing, a guard exits 1, or the payload parser is missing'
    then: >-
      run_handlers returns 0 with no decision on stdout and a [DRY-RUN] line naming
      what would have blocked
  - id: A11
    given: 'a project directory with .caws that is not a git repository and a Write to a protected hook path'
    when: 'the PreToolUse dispatcher runs'
    then: >-
      worktree-write-guard reaches a verdict and protected-paths refuses the write
      with BLOCKED, with no guard-unavailable refusal
  - id: A12
    given: 'a guard that prints a block decision and exits 1'
    when: 'the enforcing chain runs'
    then: 'the guard''s own reason is returned unchanged with status 2'
non_functional: {}
