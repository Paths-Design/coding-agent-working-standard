    given: 'the shared pack template tree containing both classifier changes'
    when: 'pack-fingerprint.test.js recomputes the live fingerprint'
    then: 'the shared pack case passes: recorded version equals SHARED_PACK_VERSION and the recorded fingerprint equals the live one'
  - id: A2
    given: 'the recorded baselines for the seven surface packs'
    when: 'the same suite runs'
    then: 'all eight pack cases pass and no surface baseline is modified by this slice'
observability:
  - 'The bumped version is what the installed hook_pack_version header and doctor.hooks.installed_pack_version_lag both compare against, so the two classifier fixes become reportable as a version delta rather than only as content drift.'
rollback:
