invariants:
  - 'This is a RECURRENCE of HOOKPACK-SHARED-VERSION-STAMP-INTEGRITY-001, recorded as its own slice rather than folded backwards into two already-closed classifier specs. The two classifier slices (CLASSIFY-CREDENTIAL-PUBLIC-FILE-EXCLUSION-001 and CLASSIFY-CREDENTIAL-READ-VERB-COVERAGE-001) each edited templates/hook-packs/shared/classify_command.py and neither carried the version bump that the shared-pack change requires.'
  - 'The control worked. tests/init/pack-fingerprint.test.js (CAWS-TEST-HOOK-INSTALL-FINGERPRINT-001) went RED immediately, naming the shared pack. The guard behaved exactly as designed: a template change without a matching recorded fingerprint and version bump fails closed.'
  - 'The lesson is about the LEDGER, not the constant: the invariant belongs to the template change, so it must be discharged in the slice that makes the change. Splitting a template edit from its bump means the second slice is red on arrival and only a later actor notices.'
  - 'Every staleness signal in the guard plane keys on the version STAMP rather than file content, so an un-bumped template change moves the enforcement plane while every consumer of the signal believes nothing changed. This is why the bump is not bookkeeping.'
acceptance:
