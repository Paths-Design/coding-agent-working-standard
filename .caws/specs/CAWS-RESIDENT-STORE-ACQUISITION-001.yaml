invariants:
  - 'Only native original invocation evidence binds store acquisition; engine readiness alone grants no authority.'
  - 'Every acquisition attempt remains owned by the resident actor through frontend loss; no replay, unresolved-handle eviction or publication grant.'
  - 'Successful engine-write acknowledgement follows the actual frontend write; read controls and credits remain correlated and bounded.'
acceptance:
  - id: A1
    given: 'an active system OpenCode or ZCode Stop invocation with independently bound original project and database'
    when: 'its actual native store request executes through the existing resident owner'
    then: 'the project actor owns exactly one acquisition and complete settlement beyond frontend lifetime without changing renderer offer v1 framing or Codex eligibility.'
  - id: A2
    given: 'duplicate requests, wrong bindings, bounded capacity, pending renderer work, cancellation or frontend disconnect'
    when: 'acquisition admission and row exchange execute'
    then: 'FIFO barriers and request-owned cancellation preserve existing work and return explicit bounded failures without SQL replay, false write delivery or unresolved cleanup eviction.'
  - id: A3
    given: 'the committed integrated candidate and isolated native runtime artifacts'
    when: 'focused actual frontend-to-actor SQL tests and meaningful dropped-retention or premature-acknowledgement controls execute'
    then: 'source, commands, exits and surviving resident observations establish the owned acquisition contract with independent feedback while publication, ordinary reader consumption and machine adoption remain unqualified.'
