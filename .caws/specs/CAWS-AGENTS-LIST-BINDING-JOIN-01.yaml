id: CAWS-AGENTS-LIST-BINDING-JOIN-01
title: 'caws agents list joins the worktree registry instead of asserting (no worktree) for every session, and renders unknown when the registry cannot be read'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-agents-binding-join
created_at: '2026-09-19T10:04:32.439Z'
updated_at: '2026-09-19T10:04:41.306Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'caws-cli agents list renderer and JSON view'
    - 'docs/architecture read-surface authority contract'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/agents.ts'
    - 'packages/caws-cli/tests/shell/agents-binding-join.test.js'
    - 'docs/architecture/read-surface-authority.v1.yaml'
  out: []
invariants:
  - 'The binding is JOINED from .caws/worktrees.json at render time and never copied into the lease. A lease is operational cache; writing authority into it creates a second copy that can disagree with the authority, which is the failure class the read-surface contract exists to prevent.'
  - 'Three outcomes are distinguished and never collapsed: the registry could not be read (unknown), the registry was read and the session owns nothing (observed absence, honest to state), and the session owns one or more worktrees (name them).'
  - 'A session may own MORE THAN ONE worktree. The rendering must not silently show only the first.'
  - 'The contract file is updated in the same slice: agents list declares the joined domains it now asserts, and its known_nonconformance entry is removed only because the defect is gone, never to make the list look clean.'
acceptance:
  - id: A1
    given: 'a session that owns two worktrees in .caws/worktrees.json'
    when: 'caws agents list runs'
    then: 'both worktree names and both bound spec ids are shown for that session, proving the join is by owner identity and is not truncated to the first match'
  - id: A2
    given: 'a readable registry in which a session owns no worktree'
    when: 'caws agents list runs'
    then: 'it states the absence plainly, because with the registry read the absence is OBSERVED rather than asserted from a field that has no writer'
  - id: A3
    given: 'an unreadable or malformed .caws/worktrees.json'
    when: 'caws agents list runs'
    then: 'the binding columns render unknown, the command still lists sessions and exits successfully, and it never prints an absence it could not source'
  - id: A4
    given: 'the JSON output of caws agents list'
    when: 'it is compared with the human output for the same session'
    then: 'both carry the same binding facts, satisfying the parity obligation, and no always-null field remains in the payload'
  - id: A5
    given: 'the read-surface authority contract'
    when: 'it is read after this change'
    then: 'agents list declares the joined fact domains with worktrees.json named as their authority, and the (no worktree) known_nonconformance entry is removed because the code no longer does it'
non_functional: {}
contracts:
  - name: 'read-surface-unsourced-fact'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "tests/shell/agents-binding-join.test.js A1 + A1b + A1c, run at 2eb69a0a: a registry with wt-a(SPEC-A) and wt-b(SPEC-B) both owned by sess-two renders 'sess-two  wt-a,wt-b  SPEC-A,SPEC-B' -- both names, both spec ids, index-aligned columns. A1b proves the join keys on owner.session_id and does not cross-attribute between two owners; A1c proves a record without specId renders its name with (no spec) rather than being dropped. Baseline before the fix: these three failed, printing '(no worktree)  (no spec)'."
    recorded_at: "2026-09-19T10:16:49.036Z"
    commit_sha: "2eb69a0a"
  - criterion_id: A2
    status: pass
    evidence_ref: "tests/shell/agents-binding-join.test.js A2 + A2b, run at 2eb69a0a: with worktrees.json readable and the session owning nothing, the line reads 'sess-none  (no worktree)  (no spec)' and contains no 'unknown'. The distinction is load-bearing: loadWorktrees returns ok({}) for a MISSING registry too, so an empty or absent registry is READ, and the absence is observed rather than asserted. Cross-check: the out-of-scope tests/shell/agents-work-state.test.js:140, which asserts exactly /sess-without\\s+\\(no worktree\\)\\s+\\(no spec\\)\\s*$/, stays green unmodified -- the join does not regress the case the old renderer got right by accident."
    recorded_at: "2026-09-19T10:17:00.267Z"
    commit_sha: "2eb69a0a"
  - criterion_id: A3
    status: pass
    evidence_ref: "tests/shell/agents-binding-join.test.js A3 + A3b, run at 2eb69a0a: worktrees.json containing '{ this is not json' (parse failure) and '[\"wt-a\"]' (valid JSON, wrong shape -> REGISTRY_NOT_OBJECT) both render 'unknown  unknown'; exit code is 0 and the session is still listed. The asserted negatives are the point: the line must NOT contain '(no worktree)' or '(no spec)', because with the registry unreadable that absence cannot be sourced."
    recorded_at: "2026-09-19T10:17:01.600Z"
    commit_sha: "2eb69a0a"
  - criterion_id: A4
    status: pass
    evidence_ref: "tests/shell/agents-binding-join.test.js A4 + A4b + A4c, run at 2eb69a0a: --json emits worktree_bindings {source: '.caws/worktrees.json', resolution, by_session}. A4 asserts by_session['sess-json'] deep-equals [{worktree:'wt-j1',spec_id:'SPEC-J1'},{worktree:'wt-j2',spec_id:null}] -- the same two facts the text columns carry -- and that a session owning nothing gets an explicit [] rather than a missing key. A4b asserts resolution:'unreadable' with by_session UNDEFINED, not {}: an empty map would assert that every listed session owns nothing, the exact claim the unreadable registry denies us. A4c pins that by_session keys track the sessions actually emitted. No always-null field remains in the agents list payload; the join replaced the '?? null' read. Live runtime artifact on this repo at the same instant: new build printed 'wt-agents-binding-join  CAWS-AGENTS-LIST-BINDING-JOIN-01' while the installed PATH snapshot printed '(no worktree)  (no spec)' for the same session."
    recorded_at: "2026-09-19T10:17:14.452Z"
    commit_sha: "2eb69a0a"