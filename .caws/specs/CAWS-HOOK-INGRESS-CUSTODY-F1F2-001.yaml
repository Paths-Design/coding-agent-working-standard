invariants:
  - 'No environment value inherited by a dispatcher or handler is ever trusted toward a main or subagent custody verdict; an inherited value can only make custody uncertain'
  - 'The bytes handed to the nine guard handlers stay identical across slots and equal to the current re-serialized payload; guard execution and their refusal semantics are unchanged'
