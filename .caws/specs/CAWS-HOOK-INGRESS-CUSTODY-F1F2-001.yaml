acceptance:
  - id: A1
    given: 'the real dispatch/pre_tool_use.sh under env -i with recorder slots'
    when: 'stdin carries a raw NUL inside the agent_id key (c3) or a 0xFF byte inside a string (c5)'
    then: 'the heartbeat classifies uncertain and no mail offer is made, where at 7195f14f both read main'
  - id: A2
    given: 'subagent bytes on stdin and a preset HOOK_INPUT_JSON naming session spoof-s (c9)'
    when: 'the dispatcher runs'
    then: 'the heartbeat classifies subagent, HOOK_SESSION_ID is the stdin session, and every handler receives the stdin payload, not the preset'
  - id: A3
    given: 'an inherited HOOK_TOOL_NAME, set or empty, with HOOK_SESSION_ID parent-s (c8, c14, c15)'
    when: 'the dispatcher runs'
    then: 'it exits 0, every handler receives the real payload bytes, and custody is subagent for subagent bytes and main for a main object'
  - id: A4
    given: 'main, subagent, spilled and 40 KiB inline payloads (c1, c2, c10, c11)'
    when: 'the dispatcher runs'
    then: 'custody, HOOK_COMMAND, handler stdin sha per slot and zero TMPDIR residue are unchanged from 7195f14f'
  - id: A5
    given: 'a TMPDIR where the raw capture cannot be created or unlinked'
    when: 'the dispatcher runs'
    then: 'parsing proceeds, the dispatcher exits 0, the heartbeat classifies uncertain and the failure is named on stderr'
  - id: A6
    given: 'agent-heartbeat.sh invoked directly with HOOK_TOOL_NAME preset and subagent bytes on stdin'
    when: 'it runs'
    then: 'it classifies subagent exactly as at 7195f14f'
  - id: A7
    given: 'the rewritten heartbeat-actor-custody.test.js and the new dispatch-ingress.bats'
    when: 'each control row is negated in turn'
    then: 'the corresponding test fails, with TAP or jest output retained'
