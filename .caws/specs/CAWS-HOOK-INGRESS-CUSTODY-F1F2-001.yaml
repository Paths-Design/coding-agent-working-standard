    then: >-
      setup: parsing proceeds on the untouched stdin,
      HOOK_INGRESS_CAPTURE=setup_failed is exported, the heartbeat classifies
      uncertain and the absence is named on stderr; payload lost: no handler runs,
      pre_tool_use emits a block decision naming the phase and exits 2, every other
      event writes the diagnostic and exits 1, and no stage remains; custody: every
      guard parses the complete captured payload from the parser descriptor,
      HOOK_INGRESS_CAPTURE=custody_failed is exported and the heartbeat classifies
      uncertain; unlink: the failure is named on stderr, the EXIT cleanup retries
      it, and parsing and custody proceed on the open descriptors; in no phase does
      an inherited environment value or descriptor produce a main or subagent
      verdict
