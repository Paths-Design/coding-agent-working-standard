invariants:
  - 'CAWS-NATIVE-RUNTIME-001 retains the full A1-A8 migration obligation, its active owned lane and retained runtime artifacts; this component does not assert full migration or parity.'
  - 'Normal launcher/registration selection and this machine''s installed generation remain unchanged; native execution requires explicit invocation until full parity and separate adoption.'
  - 'Ambient values cannot delegate the shared guard''s PID escalation; an eligible native handoff uses an explicit descriptor and retains process/latch verification, refusal and receipt custody.'
  - 'R32 shared-backend identity/reset/caller-death cleanup and R33 persistent selected-service lifetime remain open and block native installation; ordinary request-group cleanup is preserved.'
acceptance:
  - id: A1
    given: 'the committed additive one-shot source and current main integration'
    when: 'the CLI builds and strict runtime typing, full runtime Jest, Rust format/Clippy/Cargo and shared validation/Git-helper checks execute'
    then: 'the actual selected tests pass with assertions over shell proof context, opaque native bytes, deadlines, cancellation, bounded delivery, policy validation and explicit Git execution context; no full-package or performance claim is inferred.'
  - id: A2
    given: 'private homes and exclusively owned fixture callers using the selected stock Codex guard'
    when: 'substitution warning/latch and containment qualification plus hostile direct-guard descriptor controls execute'
    then: 'first warnings and repeated-risk blocks retain matching state, valid owned callers actually receive SIGTERM with matching native receipt and protective handoff, mismatched identities remain unsignaled, siblings progress, prohibited markers stay absent and omitted/corrupted evidence is rejected.'
  - id: A3
    given: 'the component source and canonical migration governance'
    when: 'default CLI/installer selection, shared consumer changes, source identities and retained parent state are inspected'
    then: 'native selection remains explicit, the identified shared guard/validation/store repairs have their focused consumer evidence, the original migration spec remains active with all eight acceptance obligations and its lane/artifacts retained, and known resident/service/harness/retirement gaps remain explicit without installation or full-parity claims.'
observability:
  - 'Retain exact source revision and dirty state, commands/exits, selected source/build/runtime identities, raw native channels/journals, actual caller wait status, latch state, sibling progress and hostile oracle results in ignored storage outside the disposable component lane.'
rollback:
  - 'Keep the shared machine runtime unchanged. Source rollback uses a separately governed forward revert; preserve canonical governance and original migration evidence.'
non_functional:
  security:
    - 'No worker lease, heartbeat, ambient variable or PID/token file grants project authority or ownership of a process; required refusal and owned cancellation remain fail-closed.'
contracts:
  - name: 'native-hook-protocol'
    type: schema
  - name: 'bounded-one-shot-consumer-behavior'
    type: contract-test
