id: CAWS-PREPUSH-TEST-BUDGET-MARGINAL-01
title: 'pre-push stage [5/5] times out nondeterministically: a 900s budget over a suite that needs ~425s alone but exceeds it after stages 1-4'
risk_tier: 3
mode: fix
lifecycle_state: draft
created_at: '2026-09-19T21:19:50.541Z'
updated_at: '2026-09-19T21:19:50.541Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'pre-push git hook stage budgeting (.husky/pre-push)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.husky/pre-push'
    - '.husky/tests/run.sh'
  out: []
invariants:
  - 'A quality gate must fail for a reason about the code, never about the machine. A stage that times out nondeterministically on an unchanged tree teaches the agent that red is noise, which is the precondition for waving through a real failure.'
  - 'The remedy must not be raising the budget alone. An unbounded gate trades a flaky refusal for an unbounded push latency, and the measured cause is stage interaction, not suite size -- the suite is 425s against a 900s budget in isolation.'
  - '--no-verify must never become the de facto remedy. git skips the WHOLE hook, so a stage-5 timeout would silently drop typecheck, lint, audit and build as well; the hook already documents this and the repo bans the flag.'
  - 'ROOT CAUSE (established 2026-09-19, not hypothesis): .npmrc sets workspaces=true, so root ''npm run <script>'' resolves to the WORKSPACE script and shadows root''s ''turbo run <script>''. Stages [1/5] typecheck, [4/5] build and [5/5] test therefore bypass turbo entirely and are never cache-replayed; only [2/5] lint, which calls ''npx turbo run lint'' explicitly, benefits. Evidence: the npm-test log contains zero turbo markers and shows ''node scripts/run-tests.js'' directly, while ''turbo run test --dry'' reports cache.status MISS with an empty local cache after a full green run.'
  - 'A cached test verdict is a governance claim, not merely a speed optimization: a cache HIT means the suite did NOT run for that push. Routing a stage through turbo is admissible only if the task inputs cover everything that can change the outcome. The test task inputs are PACKAGE-relative (''.caws/**'' resolves to packages/caws-cli/.caws, a stale May-27 fixture), so the repo-root .caws/hooks pack that tests exercise is NOT in the hash -- enabling the cache without widening inputs would let a hook-pack change replay a stale pass.'
acceptance:
  - id: A1
    given: 'an unchanged tree whose suite passes 3530/3530 in ~425s standalone'
    when: 'the pre-push hook runs its five stages in order, repeatedly'
    then: 'stage [5/5] completes within budget every time -- no run reports ''test suite timed out after 15m'''
  - id: A2
    given: 'the measured profile (sys 371s vs user 426s -- spawn/syscall bound)'
    when: 'the cause of the post-stage-1-4 slowdown is isolated'
    then: 'the fix addresses that cause (stage ordering, process/memory reclamation between stages, or a measured budget derived from observed worst case) rather than only enlarging the number'
  - id: A3
    given: 'three recorded runs of the same commit 27567642 -- two timeouts and one pass'
    when: 'the fix is in place'
    then: 'a repeat-run harness demonstrates the stage passing across consecutive invocations, so the evidence is repetition rather than a single green run'
  - id: A4
    given: 'an unchanged tree whose suite has already passed once in this session'
    when: 'git push runs the pre-push hook'
    then: 'stage [5/5] completes by cache replay in seconds rather than re-running ~425s of jest'
non_functional: {}
contracts: []
