  - id: A2
    given: 'ordered create, untrack, destroy and recreate events and historical waiver uses'
    when: 'doctor evaluates history'
    then: 'intentional dispositions are accounted for and new orphan lifecycles, invalid uses and unknown evidence remain visible'
  - id: A3
    given: 'unbound specs with unmet acceptance or recorded holds'
    when: 'a repair plan is rendered'
    then: 'unresolved obligations are shown and no mutation or closure is implied'
  - id: A4
    given: 'mixed floor and transferable machine entries and uncertain hook baselines'
    when: 'reconciliation is previewed'
    then: 'every entry has an explicit disposition, origins and effective chains are observable and no state changes'
  - id: A5
    given: 'a reviewed reconciliation plan'
    when: 'selective application or recovery runs'
    then: 'only admitted keys migrate, floor and unselected entries remain, stale plans refuse, and partial writes have a recoverable journal'
  - id: A6
    given: 'committed changes and synthetic adversarial fixtures'
    when: 'scoped build, type checks, regression controls, doctor and gates run'
    then: 'checks establish the measured behavior without modifying Sterling or machine activation'
