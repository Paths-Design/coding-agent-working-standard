blast_radius:
  modules:
    - 'Staged native hook entry, immutable generation installation and registration compatibility'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-native/src/installed_entry.rs'
    - 'packages/caws-native/tests/installed_entry.rs'
    - 'packages/caws-native/Cargo.toml'
    - 'packages/caws-cli/src/init/native-runtime-entry.ts'
    - 'packages/caws-cli/tests/adapter/native-runtime-entry.test.js'
    - 'packages/caws-cli/tests/adapter/native-entry-registration.test.js'
    - 'packages/caws-cli/src/init/machine-runtime-state.ts'
    - 'packages/caws-cli/src/init/native-hook-identification.ts'
    - 'packages/caws-cli/src/init/machine-adapter-policy.ts'
    - 'packages/caws-cli/src/init/system-runtime.ts'
    - 'packages/caws-cli/src/runtime/selection.ts'
    - 'packages/caws-cli/src/runtime/describe-entry.ts'
