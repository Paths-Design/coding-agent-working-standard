invariants:
  - 'Existing Python-readable bin/caws-hook and legacy registrations remain intact during staged installation; no native failure triggers legacy fallback'
  - 'Selected native image identities derive from one verified generation manifest; per-generation metadata contains no self-referential runtime digest'
  - 'Resident acquisition main and worker ownership, frozen guard sources and unrelated machine configuration remain untouched'
acceptance:
  - id: A1
    given: 'a staged generation and actual native registration'
    when: 'the installed entry consumes hook bytes'
    then: 'the actual native and typed-engine path produces observed outputs with original caller context and no caller-selected image override'
  - id: A2
    given: 'malformed invocation or configuration and each supported lifecycle event'
    when: 'the installed entry refuses before dispatch'
    then: 'argument errors exit 2, PreToolUse configuration failure blocks, and other lifecycle configuration faults remain diagnostic and released'
  - id: A3
    given: 'changed entry or generation, interrupted activation and tampered image'
    when: 'upgrade, selection race, rollback or repeat-install executes'
    then: 'one actual selected image is observed, rollback history survives and no failed native dispatch falls back to legacy'
  - id: A4
    given: 'legacy registration and scoped native matcher coverage'
    when: 'actual project and user registration precedence is evaluated'
    then: 'supported matching commands neither duplicate nor skip governance, and unsupported coverage is explicitly refused'
  - id: A5
    given: 'final committed source and exact packaged image'
    when: 'private integrated controls and independent review run'
    then: 'commands, statuses, artifacts and identities are retained, remaining compatibility limits are explicit, and no machine adoption is inferred'
  - id: A6
    given: >-
      A configured native or legacy system surface and absent, disabled, restricted,
      mixed, conditional or tampered registration controls
    when: >-
      Read-only system observation and the shared init/configure validator inspect
      the same private configuration
    then: >-
      Valid transports agree, unsupported registration is diagnosed without changing
      configuration, and absent or disabled surfaces remain inactive
  - id: A7
    given: 'A supported Claude Code PreToolUse CAWS registration using either native or legacy transport'
    when: 'Configure creates or reviews new and existing managed handlers'
    then: >-
      New and absent-field handlers require onFailure block, existing block is
      idempotent, explicit continue or invalid policy refuses before writes, foreign
      handlers stay unchanged, and other events and harnesses gain no unsupported
      field
observability:
  - 'Raw commands and entry stdout/stderr/status, selected engine/handler execution witness, pointer/manifest/images before-after hashes and retained upgrade/rollback state'
rollback:
  - 'Revert owned source normally; retain both transport entries and verified prior generations; no selected-machine installation in this slice'
