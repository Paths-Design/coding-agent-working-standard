invariants:
  - 'First matching adapter owns a row even when it emits no events; refusal and failure never fall through.'
  - 'Every result preserves raw occurrence, source, adapter revision, member path and interpretation context; labels confer no authority.'
  - 'Adapter state is isolated per source and harness; incomplete or failed projections never replace a committed checkpoint.'
  - 'DSH embedded decoding is an explicit dependency; OpenCode contributes no row adapter and noise remains separate from dispatch.'
acceptance:
  - id: A1
    given: 'the historical module order and an explicit DSH profile'
    when: 'default and injected registries dispatch overlapping or empty-producing rows'
    then: 'selected ownership and concatenated noise declarations match independent historical factory observations without fallback after a match'
  - id: A2
    given: 'lossless decoded occurrences and recognized, absent, empty or unknown surfaces'
    when: 'registry dispatch normalizes tool and non-tool events'
    then: 'source bytes, numeric values, adapter revisions, member paths and historical tool attribution are retained without inventing authority'
  - id: A3
    given: 'interleaved harness rows, zero emissions, partial input, refusal or adapter failure'
    when: 'a source-bound checkpoint is advanced'
    then: 'only complete successful matched rows replace the selected state slot and partial or failed work leaves prior state reusable'
  - id: A4
    given: 'the committed component and independently retained controls'
    when: 'strict compilation, Node18 and Node22 focused tests, adversarial controls, doctor and gates run'
    then: 'the bounded registry contract is demonstrated with concrete artifacts and renderer, cache, installed and cutover limitations remain explicit'
observability:
  - 'Registry results expose disposition, selected adapter, exact occurrence envelopes, tentative status and commit permission; qualification retains raw producer and output artifacts outside source.'
rollback:
  - 'Revert the bounded registry source and tests through a governed follow-up; no machine registration or selected runtime is changed.'
non_functional:
  security:
    - 'No transcript bytes execute as code; no decoder or surface label grants action, filesystem or native authority.'
contracts:
  - name: 'native-transcript-registry'
    type: behavior
