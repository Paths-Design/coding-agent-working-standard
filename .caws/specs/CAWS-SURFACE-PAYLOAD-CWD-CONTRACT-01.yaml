id: CAWS-SURFACE-PAYLOAD-CWD-CONTRACT-01
title: 'Confirm whether zcode and dsh PreToolUse payloads carry cwd, then extend the bash-write-guard fail-closed set to them'
mode: fix
lifecycle_state: draft
created_at: '2026-10-05T07:33:07.921Z'
updated_at: '2026-10-05T09:28:23.249Z'
created_by_session: '3fda9a6f-2c79-4f6a-8ee2-bcb6e0b090e1'
blast_radius:
  modules:
    - 'hook-packs: per-surface payload cwd contract'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/bash-write-guard.sh'
    - 'packages/caws-cli/templates/hook-packs/zcode'
    - 'packages/caws-cli/src/init/hook-packs'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks'
    - docs/architecture/hook-pack-shared-core.md
  out: []
invariants:
  - 'A surface joins the cwd fail-closed set only with evidence that its payload carries cwd: a captured live payload or the harness documentation, cited in the change.'
acceptance:
  - id: A1
    given: 'zcode (templates/hook-packs/zcode/hooks/caws-bridge.sh passes stdin through) and dsh (external adapter)'
    when: 'a live payload or harness doc is examined'
    then: 'each is recorded as carrying cwd or not, with the evidence cited'
  - id: A2
    given: 'a surface confirmed to carry cwd'
    when: 'added to the fail-closed set'
    then: 'a relative target with an unresolvable cwd on that surface asks, and the prior-behavior control for it is retired'
  - id: A3
    given: 'a surface confirmed NOT to carry cwd'
    when: 'the change lands'
    then: 'its adapter is made to send cwd, or the carve-out stays with the reason recorded'
  - id: A4
    given: >-
      Codex hooks documentation (developers.openai.com/codex/hooks, redirected to
      learn.chatgpt.com/docs/hooks, read 2026-10-05) lists cwd (string) among the
      common PreToolUse input fields and states permissionDecision ask is parsed but
      not supported; no live Codex payload has been captured
    when: 'a relative-path Bash write runs in a real Codex session after the CLI and runtime are activated'
    then: >-
      the captured payload shows cwd present and naming the session directory, the
      write is adjudicated against it with no cwd-unresolved deny, and the
      hook-pack-shared-core.md codex row is updated from assumed to the evidence
      actually held
  - id: A5
    given: >-
      Codex's shell tool can take a per-call workdir, and no parser or
      bash-write-guard reads tool_input.workdir (grep: zero matches in shared and
      codex parse-input.sh and bash-write-guard.sh), while the payload cwd is the
      session cwd
    when: 'a Codex Bash call runs with a workdir that differs from the session cwd and writes a relative target'
    then: >-
      it is recorded whether Codex puts workdir in tool_input; if it does, the guard
      resolves the relative target against that workdir (as opencode's plugin does)
      and a test pins it; if it does not, the gap is recorded as not reachable
non_functional: {}
contracts: []
