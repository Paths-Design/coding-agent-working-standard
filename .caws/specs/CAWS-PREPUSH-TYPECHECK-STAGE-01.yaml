    status: pass
    evidence_ref: "pre-push now runs 'npm run typecheck -w @paths.design/caws-cli' as stage [1/5], the same invocation .github/workflows/release-qualification.yml runs. Verified green both from canonical root and from a linked worktree root (exit 0, 0 'error TS' lines) — the worktree case matters because node_modules there is a symlink to canonical and most pushes originate from a lane. Placed first rather than in CI's exact slot because it is the cheapest stage; it still precedes lint as CI does."
    recorded_at: "2026-09-17T12:23:19.293Z"
    artifact_path: .husky/pre-push
    commit_sha: "10df026b"
  - criterion_id: A2
    status: pass
    evidence_ref: "bash .husky/tests/run.sh => 41 passed, 0 failed. T8c logged 'npm run,npx turbo,npm audit,npm run,npm test,' (five stages, ordered); T8d 'held=5 free=0'; T8c2 pinned the first invocation verbatim as 'npm run typecheck -w @paths.design/caws-cli lock=held'. T8c2 exists because T8c cuts to two fields, where typecheck and build are both 'npm run' and indistinguishable — and it asserts the -w flag specifically, since a bare npm run typecheck would log identically while resolving against the workspaces and checking nothing."
    recorded_at: "2026-09-17T12:23:20.808Z"
    artifact_path: .husky/tests/run.sh
    commit_sha: "10df026b"
  - criterion_id: A3
    status: pass
    evidence_ref: "T8f2 'a failing typecheck refuses the push and names itself' PASSED: with CAWS_STAGE_FAIL='run typecheck' the hook exits 1, prints 'refusing the push' AND 'typecheck failed'. T8f3 is its non-vacuity control and also passed: the build stage still appears in the log, proving the failure was matched to typecheck alone rather than to every 'npm run'. This required changing the stub from equality on $1 to a prefix match on the full argument string — the old form could not distinguish typecheck from build, so CAWS_STAGE_FAIL='run' would have failed both and proven neither."
    recorded_at: "2026-09-17T12:23:32.428Z"
