  out: []
invariants:
  - 'The pre-push hook''s stated contract is that a push cannot fail in CI for something reproducible locally; every CI step it omits is a way for main to accept a commit that CI will reject.'
  - 'Root .npmrc sets workspaces=true, so a bare npm run <name> resolves against the workspaces and never reaches a root script. Any stage added here must target the workspace explicitly, as CI does.'
acceptance:
  - id: A1
    given: >-
      the pre-push hook ran lint, audit, build and test but never typecheck, while
      Release Qualification runs npm run typecheck -w @paths.design/caws-cli as its
      step before lint
    when: 'a push is attempted with a type error in a test file'
    then: >-
      the hook runs typecheck as its FIRST stage using the workspace-targeted form
      CI uses, and refuses the push. ts-jest does not gate on diagnostics, so this
      class is invisible to the test stage; it is why main accepted
      red-qualification commits for two days with no local signal
  - id: A2
    given: >-
      the T8 end-to-end test in .husky/tests/run.sh stubs the heavy stage commands
      and asserts the stage sequence and lock custody
    when: 'the suite runs after the new stage lands'
    then: >-
      T8 asserts five stages in order with the lock held across all five, and pins
      the first logged invocation as npm run typecheck -w @paths.design/caws-cli —
      the workspace flag specifically, since a bare npm run typecheck would silently
      resolve against the workspaces and never reach the intended script
  - id: A3
    given: 'T8 already proves a failing stage refuses the push, but only for the audit stage'
    when: 'the typecheck stage is the one that fails'
    then: >-
      pre-push exits 1 and prints 'refusing the push', proving the new stage's exit
      code is actually inspected rather than run-and-ignored
  - id: A4
    given: '.husky/README.md line 118 states ''All four stages write to the shared turbo cache'''
    when: 'the stage count changes'
    then: >-
      the README reflects the real stage list, so the documented contract does not
      contradict the executable one
non_functional: {}
