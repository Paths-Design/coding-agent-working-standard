  - 'The scope-guard cross-repo refusal message names only the boundaries bash-write-guard actually enforces, and states the residual interpreter gap honestly instead of claiming it is closed.'
  - 'Existing bash-write-guard behavior is unchanged everywhere else: allowlist priority, claim-oracle escalation, caws-message exemption, fd-redirect and quoted-argument handling.'
acceptance:
