invariants:
  - 'A Bash mutation whose target resolves inside a DIFFERENT git repository blocks at the same boundary as a foreign Write/Edit — for targets named on the command line (sed -i, cp, mv, rm, tee, redirects, git path-restore) and for interpreter-mediated writes (python/node) whose payload names the target as a path literal (inline -c/-e code, heredoc bodies, or the named script file content).'
