invariants:
  - >-
    Bridge is an AUTHORITY binding, not a scope expansion (doctrine invariant
    12): a bridge confers the bound spec's scope.in as the session's admission
    surface exactly as a worktree binding does — nothing wider. A governed
    write outside scope.in still fails normally; a bridge to a non-active spec
    confers nothing.
  - >-
    Worktree bindings WIN over bridge bindings (subordination): when the
    cwd resolves inside a spec-bound worktree, that binding is authoritative
    and the bridge is not consulted for scope admission. A bridge claim
    against a spec that has a live worktree binding REFUSES (A2) with a typed
    diagnostic naming the worktree owner — one authority holder per spec.
  - >-
    Bridge does not invent identity: the session_id comes from the same
    resolveSession surface claim uses today (env tiers, capsules, mint with
    allowMint on the acquire path). Foreign-owner semantics match worktree
    claim: a bridge held by a different session refuses without --takeover;
    --takeover writes a prior_owners audit on the bridge entry and appends
    bridge_claim_taken_over inside the same lifecycle transaction.
  - >-
    State home is `.caws/claims/bridge.json` — a flat map keyed by spec id,
    `{ [specId]: { session_id, platform, acquired_at, last_seen } }` — written
    ONLY through the store's atomic writer inside a lifecycle transaction
    paired with its audit event (claim_bridged on acquire, claim_released on
    release, bridge_claim_taken_over on takeover). No hand edits; no lease
    writes; no heartbeat events (doctrine invariants 1, 10).
  - >-
    Retire is read-side-then-prune: a bridge to a closed/archived/missing spec
    confers NO authority (scope admission ignores it; claim --spec refuses
    non-active specs with the reopen/recover handoffs), and `caws worktree
    prune` gains a bridge-ghost candidate class (bindings whose spec is no
    longer active) — dry-run default, --apply removes the dead entries. Disk
    removal of a RETIRED binding is hygiene, not an authority transition, so
    prune appends no event; the audit trail is the spec_closed/spec_archived
    event that retired it.
  - >-
    Kernel schemas ship FIRST (additionalProperties: false payloads; the
    CLAUDE.md lesson): claim_bridged {spec_id, session_id, platform?},
    bridge_claim_taken_over {spec_id, prior_owner{session_id,platform?,last_seen?},
    new_owner{session_id,platform?}, reason?}, claim_released {spec_id,
    session_id}. claim_bridged and bridge_claim_taken_over are
    REQUIRES_SPEC_ID class; claim_released is OPTIONAL_SPEC_ID.
acceptance:
  - id: A1
    given: >-
      A v11 repo with an ACTIVE spec BR-001, no worktree bound to it, and a
      session (resolvable identity, not inside any worktree).
    when: >-
      The session runs `caws claim --spec BR-001`.
    then: >-
      bridge.json records the session↔spec binding; one claim_bridged event
      appends in the same lifecycle transaction; the command prints the
      binding and the handoff that scope admission now flows from it; a
      subsequent `caws scope show <in-scope-path>` resolves mode
      authoritative via the bridge (bindingState bridged) and ADMITs an
      in-scope path / REFUSEs an out-of-scope path exactly as a worktree
      binding would.
  - id: A2
    given: >-
      A live worktree binding exists for spec BR-002 owned by session W.
    when: >-
      A different non-worktree session runs `caws claim --spec BR-002`.
    then: >-
      Refusal (exit 1) with a typed diagnostic naming the worktree binding
      and owner W (subordination: one authority holder per spec); no
      bridge.json entry; no event appended.
  - id: A3
    given: >-
      A bridge binding for spec BR-003 held by session A (acquired per A1).
    when: >-
      A different session B runs `caws claim --spec BR-003` (no flags), then
      `caws claim --spec BR-003 --takeover`.
    then: >-
      The bare attempt refuses with the foreign-owner soft-block (owner,
      platform, acquired_at, and the session-log pointer discipline). The
      --takeover attempt rewrites the binding to B, appends
      bridge_claim_taken_over with prior_owner A in the same transaction, and
      the bridge entry carries a prior_owners audit array.
  - id: A4
    given: >-
      A bridge binding for spec BR-004 held by the acting session.
    when: >-
      The session runs `caws claim --release --spec BR-004`, and separately a
      second bridge (BR-005) is released via bare `caws claim --release`.
    then: >-
      The named release removes exactly the BR-004 binding and appends
      claim_released; the bare release removes every bridge the session owns
      (BR-005) and appends one claim_released per removed binding; releasing
      a binding the session does NOT own refuses.
  - id: A5
    given: >-
      A bridge binding whose spec has since been closed (and a second whose
      spec was archived).
    when: >-
      `caws scope show <in-scope-path>` runs for the bridged session, and
      `caws worktree prune` (dry-run, then --apply).
    then: >-
      Scope does NOT treat the retired bridge as authority (no admission from
      a dead spec); prune lists both as bridge-ghost candidates with the
      retire reason; --apply removes them from bridge.json; prune appends no
      events (retired-binding hygiene).
  - id: A6
    given: >-
      A repo with one active bridge binding (per A1) and one worktree binding.
    when: >-
      `caws status` runs.
    then: >-
      The status surfaces the bridge binding (spec, session, acquired_at) in
      the Current-context/claim surface alongside worktree ownership —
      observe is side-effect-free (status byte-stability invariant holds).
  - id: A7
    given: >-
      Any bridge mutation path.
    when: >-
      Two concurrent bridge mutations target the same spec.
    then: >-
      They serialize on the lifecycle lock (the store's withLifecycleLock
      discipline); a partial write (bridge.json without the event, or the
      event without the state) is never observable (transactional pairing).
non_functional:
  reliability:
    - >-
      Closes the last v11.2 authority gap: sessions in worktree-impractical
      contexts (read-only checkouts, certain CI, monorepo sub-projects) gain
      governed authority without forking the ownership model. Fully
      reversible: deleting bridge.json (or claim --release) returns the repo
      to worktree-only authority with zero migration.
  security:
    - >-
      One authority holder per spec enforced at acquire (worktree binding
      subordination + foreign-bridge refusal). Fail closed: an unreadable
      bridge.json refuses bridge acquire/release rather than guessing. No
      path widens scope beyond the bound spec's scope.in.
contracts:
  - name: bridge-binding-lifecycle-v1
    type: behavior
    path: packages/caws-cli/src/shell/commands/claim.ts
    description: >-
      The bridge binding satisfies the seven-slot lifecycle spine (doctrine
      invariant 13): acquire (claim --spec + claim_bridged event), observe
      (status, side-effect-free), refuse (worktree-binding subordination;
      foreign owner without --takeover), takeover (claim --spec --takeover +
      prior_owners audit + bridge_claim_taken_over), release (claim --release
      named or bare + claim_released), retire (non-active spec confers
      nothing read-side; worktree prune bridge-ghost class cleans disk),
      prune (dry-run default, --apply, no event for retired entries).
  - name: bridge-store-v1
    type: contract-test
    path: packages/caws-cli/tests/store/bridge-store.test.js
  - name: claim-bridge-command-v1
    type: contract-test
    path: packages/caws-cli/tests/shell/claim-bridge.test.js
