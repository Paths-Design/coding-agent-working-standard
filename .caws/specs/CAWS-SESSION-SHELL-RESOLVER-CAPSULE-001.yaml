id: CAWS-SESSION-SHELL-RESOLVER-CAPSULE-001
title: 'Shell session resolver reads the durable capsule so it stops returning unknown'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-shell-resolver
created_at: '2026-07-31T07:28:25.026Z'
updated_at: '2026-07-31T07:28:25.973Z'
blast_radius:
  modules:
    - packages/caws-cli/templates/hook-packs/shared/lib/session-id.sh
    - packages/caws-cli/src/init/hook-packs
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/lib/session-id.sh
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/tests/hooks/bats/session-id-capsule.bats
    - .caws/specs/CAWS-SESSION-SHELL-RESOLVER-CAPSULE-001.yaml
  out: []
invariants:
  - >-
    resolve_caws_session_id (lib/session-id.sh) and the TS resolver
    (resolve-session.ts) agree on the current session id by CONSTRUCTION, not by
    a fallback. The shell resolver was env-only and returned "unknown" in any
    subshell carrying no identity env var (the agent-Bash case), so the
    write-guards (worktree-write-guard, bash-write-guard) treated the owner's own
    edits as foreign and blocked/reverted them. The fix: the shell resolver
    consults the SAME disk-backed tier the TS resolver's tier-3 does — the
    durable capsule at .caws/sessions/caws-*.json — when the env chain misses.
    This is completing the shell resolver to match the canonical identity model,
    NOT a parallel fallback; there is one identity model across shell + TS.
  - >-
    No shadow/legacy path. The disk read is the shell mirror of an existing,
    authoritative TS tier (resolve-session.ts readCapsule, tier 3) — the same
    file caws worktree create records as the owner. It is not a bolt-on that
    limps alongside a "real" implementation; it IS the shell half of the real
    implementation. A future agent extending session identity extends THIS path,
    not a parallel one.
  - >-
    Purity preserved where it matters: the resolver still takes a payload-id
    override first (the harness-stamped stdin session_id wins), then the env
    chain, THEN the capsule read as the final non-unknown tier. It remains a
    pure function (prints one id, no side effects, no exports) so callers can
    compose it. The capsule read is bounded (one glob, first match) and
    fail-opens to "unknown" only if NO capsule exists.
acceptance:
  - id: A1
    given: >-
      A process with no identity env vars (the agent-Bash case) whose repo has a
      durable capsule at .caws/sessions/caws-<id>.json (e.g. the one caws worktree
      create recorded as the owner).
    when: >-
      resolve_caws_session_id is called with no payload id.
    then: >-
      It returns the capsule's session_id (e.g. caws-9fa0572228cf), NOT
      "unknown" — matching the TS resolver's tier-3 and the recorded worktree
      owner. The write-guards then admit the owner's own edits.
  - id: A2
    given: >-
      A process with an env identity var set (e.g. CLAUDE_SESSION_ID).
    when: >-
      resolve_caws_session_id is called.
    then: >-
      The env var still wins (unchanged precedence); the capsule read is only the
      final tier, never overriding an env signal.
  - id: A3
    given: >-
      A repo with NO capsule (fresh init, no worktree created / no mint yet).
    when: >-
      resolve_caws_session_id is called with no env vars.
    then: >-
      It returns "unknown" (unchanged) — the capsule read fail-opens, never
      inventing an id.
  - id: A4
    given: >-
      The full bats suite (the write-guards' existing tests + the new
      session-id-capsule tests).
    when: >-
      npm run test:bats runs.
    then: >-
      All tests pass — the existing guard behavior is unchanged when an env var
      IS set; the new tests cover the capsule tier.
non_functional: {}
contracts:
  - name: 'session-shell-resolver'
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/session-id.sh'
