    when: '''cp -R src dest'' is sent through the launcher'
    then: 'exit 2 and stderr carries the worktree-guard line naming the copy-role reason and the instruction to name regular-file sources'
  - id: A4
    given: 'a cp command whose analysis reports more than one issue'
    when: 'worktree-guard refuses it'
    then: 'stderr names every reported issue, not only the first'
  - id: A5
    given: 'the kimi-surface and qwen-surface bats files'
    when: 'the ''still rewrites under claude-code'' cases run with a payload that carries cwd'
