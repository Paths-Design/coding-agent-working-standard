acceptance:
  - id: A1
    given: 'the rc.2 source baseline and unreleased changes'
    when: 'the release candidate is prepared'
    then: 'package version and workspace lock agree on 12.2.0-rc.3 and the matching changelog contains the release changes'
  - id: A2
    given: 'the committed release candidate'
    when: 'checks and independent review are inspected'
    then: 'required evidence is recorded and the publication decision identifies every unresolved requirement before any release tag is pushed'
  - id: A3
    given: >-
      the token-class schema has no required field and the baseline typecheck
      rejects the test property access
    when: 'the document pin uses a type-compatible absence assertion'
    then: >-
      typechecking and the existing valid and hostile turn-log contract fixtures
      pass without changing the producer schema
  - id: A4
    given: >-
      the committed workspace lockfile contains Handlebars 4.7.9 through ts-jest and
      the registry audit reports a critical finding
    when: 'the compatible patched transitive release is selected'
    then: >-
      the lockfile uses Handlebars 4.7.10 without changing direct dependency ranges
      and the workspace audit reports zero findings
  - id: A5
    given: 'The committed integrated rc.3 candidate and its complete declared five-surface mutation policy'
    when: >-
      Current CI and local qualification execute with exact source, test, build and
      dependency identity retained
    then: >-
      Required tests, audit, typecheck, lint, documentation, coverage and every
      declared per-file mutation floor pass, including the complete sixteen-file
      execution and nine-file analysis campaigns without exclusions or reduced
      floors
  - id: A6
    given: 'The exact built rc.3 tarball retained with its SHA256 and installed consumer identity'
    when: >-
      One complete detached ten-case installed upgrade qualification runs with
      existing deadlines on the required platform matrix
    then: >-
      The run exits zero with all ten cases, raw command statuses and streams,
      governance before-after bytes, lifecycle rendering, corrupt-snapshot refusal,
      rollback and clean detached-consumer dependency audit retained for that
      artifact
  - id: A7
    given: >-
      The exact qualified rc.3 package and selected runtime registered through
      normal native trust on each supported harness
    when: >-
      Actual native sessions start, perform an admitted owned-lane operation,
      attempt a protected write, stop and render the user and tool record
    then: >-
      Retained authentic payloads and host events join the package, runtime, host
      and caller identities, distinguish session cwd from tool workdir, show a
      delivered refusal within unchanged deadlines with protected bytes unchanged,
      and preserve actual Start, Stop and semantic rendered output for each
      supported harness
observability:
  - 'Retain raw local check output and remote run URLs with exact candidate identities outside tracked source'
rollback:
