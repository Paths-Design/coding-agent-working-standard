id: CAWS-RELEASE-RC3-001
title: 'Prepare and qualify caws-cli 12.2.0-rc.3 before tag publication'
mode: chore
lifecycle_state: draft
created_at: '2026-10-18T21:40:25.174Z'
updated_at: '2026-10-18T21:40:25.174Z'
created_by_session: '01a150f0-0f54-78f1-902e-92e66137ba34'
blast_radius:
  modules:
    - 'CLI release metadata and publication qualification'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/package.json'
    - 'packages/caws-cli/CHANGELOG.md'
    - 'package-lock.json'
  out: []
invariants:
  - 'Publish only a fresh version whose package, lockfile, changelog and tag agree'
  - 'Do not push a release tag while required qualification or native delivery evidence is missing or failed'
acceptance:
  - id: A1
    given: 'the rc.2 source baseline and unreleased changes'
    when: 'the release candidate is prepared'
    then: 'package version and workspace lock agree on 12.2.0-rc.3 and the matching changelog contains the release changes'
  - id: A2
    given: 'the committed release candidate'
    when: 'checks and independent review are inspected'
    then: 'required evidence is recorded and the publication decision identifies every unresolved requirement before any release tag is pushed'
observability:
  - 'Retain raw local check output and remote run URLs with exact candidate identities outside tracked source'
rollback:
  - 'Before publication preserve the candidate and withhold the tag if qualification fails; after an npm publish attempt preserve tag provenance and inspect registry identity before recovery'
non_functional: {}
contracts: []
