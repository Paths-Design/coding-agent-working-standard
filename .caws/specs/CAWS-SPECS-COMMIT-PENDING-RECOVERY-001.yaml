    description: 'Covers A1 (dirty spec committed, sha reported, exit 0), A2 (clean no-op, exit 0, no empty commit), A3 (refusal surfaces reason, exit 1, foreign staged content untouched), A4 (lifecycle remediation names the recovery command).'
