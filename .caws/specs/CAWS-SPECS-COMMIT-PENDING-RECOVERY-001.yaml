invariants:
  - 'A lifecycle command whose audit commit did not land names a sanctioned recovery command (caws specs commit <id>) in its remediation, not a raw git invocation the calling harness may be unable to run.'
  - 'caws specs commit stages and commits ONLY the named spec YAML path (pathspec-scoped, never -A, never --no-verify, pre-commit hooks respected), reusing the same autoCommit discipline as lifecycle writers.'
  - 'The command is idempotent: an already-committed (clean) spec is a reported no-op, not an empty commit.'
  - 'Exit code reflects the recovery operation itself: 0 when the pending audit state is resolved (committed or already clean), 1 when the commit is refused, 2 for context/composition failures.'
  - 'Foreign staged content is never swept in: only the spec YAML pathspec is committed, matching CAWS-AUTOCOMMIT-INTEGRITY-001.'
acceptance:
  - id: A1
    given: 'a lifecycle command reported the spec YAML applied but its audit commit refused'
    when: 'caws specs commit <id> runs'
    then: 'the spec YAML is committed via the path-scoped autoCommit path and the command exits 0 with the commit sha reported'
  - id: A2
    given: 'the spec YAML is already committed (working tree matches HEAD)'
    when: 'caws specs commit <id> runs'
    then: 'the command reports a no-op (already committed), creates no empty commit, and exits 0'
  - id: A3
    given: 'the underlying git commit fails (contention exhausted or hook refusal)'
    when: 'caws specs commit <id> runs'
    then: 'the refusal reason is surfaced and the command exits 1 without staging any foreign path'
  - id: A4
    given: 'a lifecycle command hits refused_dirty'
    when: 'its stderr remediation is read'
    then: 'it names `caws specs commit <id>` as the sanctioned recovery path'
observability:
  - 'The command prints the commit sha on success, an explicit no-op line when already clean, and the autoCommit refusal reason on failure.'
rollback:
  - 'Revert the implementation commit; the remediation text returns to "commit it manually" and no recovery command exists.'
non_functional:
  reliability:
    - 'The recovery path composes the existing autoCommit primitive; no new git strategy, no bypass of hooks or of the pathscope discipline.'
contracts:
