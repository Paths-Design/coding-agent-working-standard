id: CAWS-DEFECT-WRITE-GUARD-RELATIVE-PATH-UNRESOLVED-CWD-01
title: 'worktree-write-guard resolves a relative file_path against a guessed root when the cwd is unresolvable, the same fail-open CLAIM-ORACLE-CWD fixed for Bash'
mode: fix
lifecycle_state: draft
created_at: '2026-10-05T07:18:17.990Z'
updated_at: '2026-10-05T07:18:17.990Z'
