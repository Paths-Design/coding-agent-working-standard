    when: 'The predicate and actual relevant guards inspect original commands'
    then: 'Unsupported syntax declines projection conservatively with the declared status, visible executable shell operations are retained, and raw interpreter writes and outer mutations retain specific guard refusals and unchanged simulated sentinels without blanket Node or ownership admission.'
  - id: A3
