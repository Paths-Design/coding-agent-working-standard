invariants:
  - >-
    `caws agents prune --status legacy --older-than-ms <ms>` selects leases purely
    by last_active age (now - last_active > retentionMs), REGARDLESS of the
    lease.status field. This reaches the status-less legacy records (v10/early-v11
    shape: {session_id, last_active, platform, ...} with no status/pid) that the
    existing stopped/stale/dead modes all skip — those require a status field
    (stopped) or active/stopping + pid (dead/stale), so a record with status
    absent falls through every mode and is unreachable, forcing a hand-edit of
    agents.json.
  - >-
    Dry-run by default (like every prune mode); --apply to delete. Never invoked
    by hooks. Operational cache only (agents.json is never authority), so pruning
    is safe — it removes stale liveness display state, not ownership.
  - >-
    A lease with an unparseable/absent last_active is NOT pruned by legacy mode
    (no reference timestamp to age from) — it is skipped, matching the stopped
    mode's behavior. A lease that is genuinely fresh (age <= retentionMs) is
    protected.
acceptance:
  - id: A1
    given: >-
      A lease record with NO status field and NO pid (legacy shape), whose
      last_active is older than the retention threshold.
    when: >-
      `caws agents prune --status legacy --older-than-ms <ms>` runs.
    then: >-
      The legacy lease is selected as a prune candidate (dry-run lists it;
      --apply deletes it). The existing stopped/stale modes would have skipped
      it.
  - id: A2
    given: >-
      A mix of legacy (status-less) leases and current (status-bearing) leases,
      all older than the retention threshold.
    when: >-
      `caws agents prune --status legacy --older-than-ms <ms> --apply` runs.
    then: >-
      Both classes older than the threshold are pruned (legacy mode is
      status-agnostic); fresh leases (age <= threshold) are protected.
  - id: A3
    given: >-
      A legacy lease with an unparseable or absent last_active.
    when: >-
      `caws agents prune --status legacy` runs.
    then: >-
      It is skipped (no reference timestamp) — not pruned, matching the stopped
      mode's handling of unparseable timestamps.
