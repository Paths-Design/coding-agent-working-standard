id: CAWS-LIFECYCLE-CROSS-REPO-CONTAINMENT-01
title: 'Governed lifecycle mutations are contained to the calling session''s repo: specs create/close and worktree create/merge refuse a foreign repo, escapable only by a human-granted reprieve'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-19T05:28:55.787Z'
updated_at: '2026-09-19T05:29:08.233Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'caws-cli shell lifecycle commands (specs, worktree)'
    - 'machine session state (~/.caws/state/sessions/<id>/origin.json)'
    - 'reprieve grant vocabulary'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/shell/session/session-origin.ts
    - packages/caws-cli/src/shell/commands/specs.ts
    - packages/caws-cli/src/shell/commands/worktree.ts
    - packages/caws-cli/src/shell/commands/reprieve.ts
    - packages/caws-cli/tests/shell/lifecycle-cross-repo-containment.test.js
    - packages/caws-cli/tests/shell/session-origin-record.test.js
  out: []
invariants:
  - 'A governed lifecycle mutation (specs create, specs close, worktree create, worktree merge) executes only against the repo the calling agent session is rooted in; a foreign repo is refused BEFORE any file write or event append.'
  - 'The session root is recorded once, on first governed lifecycle use, and a later invocation from a different repo never silently rewrites it — the record is the authority, the current cwd is not.'
  - 'Containment applies only to harness-identified agent sessions. A caller with no harness session identity (human terminal, CI) is never contained: a guard that cannot tell who is calling must not refuse everyone.'
  - 'Root comparison is over CANONICAL roots (git --git-common-dir), so every linked worktree of a repo is the same root as its canonical checkout and is never read as foreign.'
  - 'The only escape is a human-granted, expiring reprieve naming the lifecycle plane. No self-service CLI flag may lift it: the entity with the incentive to cross the boundary must not be able to author its own authorization.'
acceptance:
  - id: A1
    given: 'a harness-identified agent session whose recorded origin is repo A'
    when: 'it runs caws specs create from inside a SIBLING repo B'
    then: >-
      the command refuses before any write, names both the recorded origin and the
      target root, and repo B gains no spec file and no event
  - id: A2
    given: 'the same session with recorded origin repo A'
    when: 'it runs the same governed lifecycle commands from inside repo A'
    then: >-
      every one is admitted unchanged, proving containment is a cross-repo refusal
      and not a general lifecycle brake
  - id: A3
    given: 'the same session with recorded origin repo A'
    when: >-
      it runs a governed lifecycle command from inside a LINKED WORKTREE of repo A,
      whose cwd is not the origin path
    then: >-
      it is admitted, because the comparison resolves both sides to the canonical
      root via git --git-common-dir rather than comparing cwd strings
non_functional: {}
contracts:
  - name: 'session-origin-record'
    type: schema
  - name: 'lifecycle-containment-refusal'
    type: behavior
  - name: 'lifecycle-reprieve-escape'
    type: behavior
