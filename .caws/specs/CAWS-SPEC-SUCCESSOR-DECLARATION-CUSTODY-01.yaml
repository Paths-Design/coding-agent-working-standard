id: CAWS-SPEC-SUCCESSOR-DECLARATION-CUSTODY-01
title: >-
  Structured successor declaration on specs: schema, semantic resolution,
  close-gate, and read-only migration reporter
risk_tier: 1
mode: feature
lifecycle_state: closed
resolution: superseded
superseded_by: CAWS-SPEC-SUCCESSOR-DECLARATION-CUSTODY-02
closure_notes: >-
  Merged at 266fbc72 (caws worktree merge successor-custody). PARTIAL
  CLOSURE — the auto-close stub this replaces implied full completion; it
  did not.

  SHIPPED AND PROVEN. Schema: optional `successors` array on spec.v1.json
  and on spec_closed.v1.json, both additive in place (additionalProperties
  stays false), validated against the real 269-spec corpus with zero
  failures. Kernel: intra-spec semantics (7 rule codes) and spec/successors.ts
  — an injected-corpus resolver with the closed outcome vocabulary AUTHORED |
  UNAUTHORED | MALFORMED_ID | AMBIGUOUS_ID | REGISTRY_UNAVAILABLE. CLI: the
  close gate in closeSpec, placed before any byte patching, plus the event
  projection. 39 kernel tests; kernel suite 572/572; CLI suite 903/904 (the
  one failure is pre-existing env leakage in
  resolver-guard-divergence.test.js, unrelated to this slice).

  RUNTIME EVIDENCE, not just green tests. Against a scratch repo driving the
  built CLI: (1) a spec declaring an unauthored `required` successor VALIDATES
  (`specs validate` => valid) while `specs close` REFUSES it with exit 1 —
  the two layers disagreeing on identical bytes is the layering invariant
  demonstrated live; (2) the refusal left the spec file byte-identical and
  the events log length unchanged; (3) after authoring the target, the same
  close SUCCEEDED against a target in `active` state — custody, not
  completion; (4) the emitted spec_closed event carried the declaration
  verbatim including rationale, with no target standing copied in.

  RESOLUTION IS `superseded`, NOT `completed`. A structured `required`
  successor establishes CUSTODY of the remaining work; it does not make unmet
  acceptance criteria on this spec retroactively complete. The auto-close
  wrote `completed`, and an earlier correction fixed only the prose — leaving
  the machine-readable field contradicting the notes, which is exactly the
  "reports success while doing nothing" class this repo's release stance
  names as most dangerous. `superseded_by` now points at -02.

  ACCEPTANCE TRANSFER MATRIX (this spec's 19 criteria):
    MET HERE (16): A1-A8 schema + intra-spec semantics; A10-A14 resolver
      outcomes and close-gate behavior; A15 the two layers disagreeing on
      identical bytes; A16 `specs validate` needing no repository index —
      both proven live against a scratch repo, not only by unit test; A17
      REGISTRY_UNAVAILABLE refusing rather than downgrading.
    TRANSFERRED TO -02 (3):
      A9  round-trip byte-identity across activate/close/archive/
          amend-scope/clear-binding. Currently an inference from reading
          specs-writer.ts's raw-byte patching, NOT a runtime fact.
      A11 older-reader fixture pinning the additionalProperties boundary.
      A19 the read-only migration reporter and its no-write proof.
    ALSO TRANSFERRED: docs/api/schema.md (discharged under
      CAWS-WORKTREE-MERGE-LOCKFREE-CAS-001 A9, which absorbed the doc
      obligation when it touched the same file).

  The three transferred criteria are the ONLY unmet work; -02 carries them
  under its own acceptance set. Nothing else from this spec is outstanding.
successors:
