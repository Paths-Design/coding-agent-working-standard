invariants:
  - >-
    TWO AXES, NEVER CONFLATED. A `successors` entry records a SOURCE-SIDE
    DECISION (`disposition`: what the closing spec decided about the
    obligation). It MUST NOT store TARGET STANDING (whether the target is
    active, closed, completed, abandoned). Target standing is DERIVED at query
    time from the target spec's own `lifecycle_state` + `resolution`. Storing
    it would let the stored copy drift from the target's real state — the
    precise failure this slice exists to prevent. A schema property named for
    target standing, or a validator that persists resolved standing back into
    the source spec, violates this invariant.
  - >-
    UNRESOLVABLE IS NOT A DISPOSITION. The closed source-side vocabulary is
    exactly `required` | `declined` | `absorbed`. These are decisions a human
    made. "The target does not exist" is a QUERY RESULT about the target, not
    a decision by the source, and must be reported as a distinct outcome
    (unresolved reference) rather than admitted as a fourth disposition value.
    Widening the enum to absorb a target-state condition collapses the two
    axes and violates the invariant above.
  - >-
    MIGRATION NEVER AUTHORS. The migration reporter is READ-ONLY. It classifies
    legacy `closure_notes` prose and reports; it MUST NOT rewrite closure prose,
    synthesize a `successors:` block, guess a target id from malformed text, or
    mutate any spec file. Sterling's census found 17 of 46 controlled closure-note
    declarations (37%) are malformed prose such as
    "Successor: ALG-001a-HARDEN-01 (not yet created) will take this atom" —
    heuristic conversion of those would INVENT governance intent that no human
    recorded. A reporter that writes is a defect, not a convenience.
  - >-
    ADDITIVE SCHEMA CHANGE, NOT A SCHEMA FORK. `successors` is an OPTIONAL
    top-level array added in place to `spec.v1.json`; `additionalProperties`
    stays `false` and no `required` entry is added. Every existing spec that
    omits the field continues to validate byte-unchanged. This follows the
    established precedent (`scope.support` in 04e03ae7, kernel 1.2.0, "No
    breaking changes"; `prior_worktree` on spec_closed.v1.json in 297e7a8a)
    and the written policy at docs/api/schema.md:753, which reserves breaking-
    change ceremony for field REMOVAL and enum NARROWING. Compatibility is
    carried by the `@paths.design/caws-kernel` package semver — the `$id` is
    never resolved over the network (validate-shape.ts:8 imports the schema
    from local disk), so there is no floating-schema consumer to break.
  - >-
    ROUND-TRIP PRESERVATION IS LOAD-BEARING AND MUST BE PINNED BY TEST. Every
    routine lifecycle mutation in specs-writer.ts (activate, close, archive,
    amend-scope, clear-binding, retire-draft) operates by surgical raw-byte
    patching (`setTopLevelScalar` / `insertTopLevelScalarAfter`), never by a
    parse -> object -> `yaml.dump` rebuild. That discipline is WHY a
    `successors:` block survives untouched today. It is an unstated property
    of the current implementation, not a guaranteed contract — so this slice
    must add tests that FAIL if any writer is ever converted to an
    object-rebuild that silently drops the field.
  - >-
    THE SINGLE-FILE VALIDATOR STAYS PORTABLE AND DETERMINISTIC. Referential
    resolution MUST NOT be pushed down into `validateSpecSemantics`, and no
    filesystem access or repository walk may be introduced there. Today
    `parseAndValidateSpec` (spec/index.ts:44-48) is a pure three-layer
    pipeline — parse, shape, semantics — with no filesystem seam; that purity
    is the property being protected. If resolution were threaded into the
    semantic layer, `caws specs validate <file>` would silently become
    repository-dependent, returning different verdicts for identical bytes
    depending on ambient `.caws` state. Responsibilities partition as:
      - JSON Schema:            structural shape and field grammar.
      - validateSpecSemantics:  intra-spec rules only — disposition-specific
                                required/forbidden fields, self-reference,
                                duplicate targets, source-axis consistency.
      - SuccessorResolver:      exact-id lookup against live + archived specs.
                                A separate, repository-aware layer.
      - closeSpec preflight:    injects the resolver and refuses unresolved
                                governed obligations.
    A change that gives the semantic layer a filesystem dependency violates
    this invariant regardless of how the resolution result is plumbed.
  - >-
    THE RESOLVER IS AN EXISTENCE ORACLE, NOT A GRAPH AUTHORITY. This slice
    builds CAWS's FIRST cross-spec resolver, and the risk is that it silently
    accretes into a general dependency-graph engine without a stated boundary.
    Its scope is exactly: exact-id existence lookup, and live-vs-archive
    ambiguity detection. Explicitly OUT: dependency ordering, cycle analysis
    beyond direct self-reference, any requirement that a successor complete,
    retroactive mutation of prior specs, and heuristic prose inference
    anywhere in the blocking path. General `supersedes`/`superseded_by` graph
    integrity (deferred at validate-semantics.ts:16-19) MAY reuse this
    substrate in a later slice; it must not be absorbed into this one.
  - >-
    RESOLUTION IS A CLOSED RESULT VOCABULARY, DISJOINT FROM DISPOSITION.
    The resolver returns exactly one of `AUTHORED` | `UNAUTHORED` |
    `MALFORMED_ID` | `AMBIGUOUS_ID` | `REGISTRY_UNAVAILABLE`. Target
    lifecycle_state and resolution MAY accompany `AUTHORED` as evidence, but
    MUST NOT be encoded as source dispositions — that is the two-axis
    invariant restated at the resolver boundary. `REGISTRY_UNAVAILABLE` is
    distinct from `UNAUTHORED` on purpose: "I cannot tell" and "it does not
    exist" are different facts and must never collapse into one another.
  - >-
    THE EVENT IS THE AUDIT RECORD. When a spec carrying successor declarations
    closes, the `spec_closed` event payload preserves the structured
    declaration exactly as authored (same ids, same dispositions, same
    rationale text). A close that records the declaration only in the YAML,
    or that flattens it into a prose string in the event, breaks the audit
    trail this slice exists to establish. `events.jsonl` is written only via
    the store's `appendEvent`; this slice introduces no direct write.
  - >-
    THE CLOSE GATE REFUSES HONESTLY OR NOT AT ALL. A spec with an unresolved
    `required` successor MUST be refused at close with a typed, actionable
    diagnostic naming the unresolved id. Per repo release doctrine, a command
    that reports success while leaving the obligation undischarged is the most
    dangerous failure class: it trains agents to stop trusting the guard. The
    refusal must be a real refusal (non-zero, no state written), never a
    warning printed over a completed close.
acceptance:
  - id: A1
    given: >-
      a spec author who needs to record that this spec's work continues in
      another spec
    when: they add a `successors:` array entry with `target_spec_id` and
      `disposition` and validate the spec
    then: >-
      the spec validates and the obligation is expressed as structured data
      with NO use of `closure_notes` prose. Asserted by a kernel shape test
      over a fixture spec carrying a `successors` block.
  - id: A2
    given: a `successors` entry whose `target_spec_id` does not match the
      canonical CAWS spec-id grammar `^[A-Z][A-Z0-9]*(-[A-Z0-9]+)*-\d+[a-z]*$`
    when: the spec is validated
    then: >-
      validation FAILS with a schema diagnostic. Specifically, the malformed
      prose forms observed in Sterling's census — "ALG-001a-HARDEN-01 (not yet
      created) will take this atom", "a multi-seed-evidence slice that executes
      the seam across a seed", "retiring test_p11_p21_promotion_proposal.py and"
      — are STRUCTURALLY UNREPRESENTABLE, not merely flagged. Asserted by a
      table-driven negative test over those exact three strings.
  - id: A3
    given: 'a `successors` entry with `disposition: declined`'
    when: the spec is validated with an absent or empty `rationale`
    then: >-
      validation FAILS. `declined` records a human decision not to pursue a
      successor, and an undocumented decline is indistinguishable from an
      oversight. Asserted by both an absent-key case and an empty-string case.
  - id: A4
    given: 'a `successors` entry with `disposition: absorbed`'
    when: the spec is validated with an absent `absorbed_by`, or an
      `absorbed_by` that does not resolve to an existing spec
    then: >-
      validation FAILS in both cases with distinguishable diagnostics — schema
      shape for the absent key, semantic resolution for the unresolvable id.
      Asserted by two separate tests so a single fix cannot mask both.
  - id: A5
    given: >-
      an active spec carrying `disposition: required` whose `target_spec_id`
      names a spec that was never authored
    when: '`caws specs close` is invoked on it'
    then: >-
      the close is REFUSED, non-zero, with a typed diagnostic naming the
      unresolved id. No YAML mutation and no `spec_closed` event are written —
      verified by asserting the spec file bytes are unchanged AND the events
      log length is unchanged, not merely by the exit code.
  - id: A6
    given: >-
      an active spec carrying `disposition: required` whose target resolves to
      a real spec
    when: '`caws specs close` is invoked'
    then: >-
      the close SUCCEEDS for a target in EVERY lifecycle state — draft,
      active, closed, and archived — asserted as four separate cases. The
      gate's invariant is CUSTODY, NOT COMPLETION: an authored target in any
      state proves the obligation was made governable. Requiring the target
      be closed first would invert the ordinary sequence (predecessor closes
      -> successor becomes active owner of the remaining obligation ->
      successor later completes, is superseded, or is abandoned).
  - id: A7
    given: >-
      a `required` successor whose target resolves to a spec that is closed
      with `resolution: abandoned`
    when: the predecessor is closed
    then: >-
      the close SUCCEEDS. A terminally abandoned target is a GOVERNED OUTCOME,
      not a lost obligation — someone decided, and the decision is on record.
      The target's standing IS surfaced in the resolution result as evidence,
      but does not gate the predecessor's close. This case is the sharpest
      test of custody-not-completion and must be asserted explicitly rather
      than folded into A6.
  - id: A8
    given: an `absorbed` entry whose `absorbed_by` resolves to an authored
      spec that is still active
    when: the predecessor is closed
    then: >-
      the close SUCCEEDS. `absorbed_by` is held to the same custody bar as
      `target_spec_id`: it must resolve to an authored spec, but that spec
      need not already be terminal.
  - id: A9
    given: a spec carrying two successor entries of differing disposition
    when: it closes successfully
    then: >-
      the emitted `spec_closed` event payload preserves the COMPLETE
      declaration array semantically byte-for-byte — every entry, in order,
      with `disposition`, `rationale`, and `absorbed_by` intact — not merely
      the target ids. Asserted by reading the appended event back off
      `events.jsonl` and deep-comparing the whole array to the authored
      block, NOT by asserting the writer was called. A projection that keeps
      ids and drops rationale passes a naive test and fails this one.
  - id: A10
    given: the full corpus of existing specs in this repo, none of which carry
      a `successors` field
    when: they are validated against the amended schema
    then: >-
      every one validates unchanged. Asserted by a test that walks
      `.caws/specs/*.yaml` and validates each, so the additive-change claim is
      proven against the real corpus rather than a synthetic fixture.
  - id: A11
    given: a spec file carrying a `successors:` block
    when: it is put through each routine lifecycle mutation
      (activate, close, archive, amend-scope, clear-binding)
    then: >-
      the `successors:` block round-trips byte-identically in every case, and
      running the same mutation twice produces byte-identical output
      (deterministic serialization). Asserted per-writer, so a future
      conversion of ANY single writer to an object-rebuild fails the suite.
  - id: A12
    given: a repository whose specs carry legacy successor intent in
      `closure_notes` prose
    when: the read-only migration reporter runs
    then: >-
      it classifies each spec as `STRUCTURED_CANDIDATE`,
      `MALFORMED_LEGACY_DECLARATION`, `AMBIGUOUS_LEGACY_DECLARATION`, or
      `NO_DECLARATION`, and writes NOTHING. Asserted by capturing a hash of
      every spec file plus the events-log length before and after the run and
      requiring both unchanged — an assertion that fails if the reporter ever
      gains a write path.
  - id: A13
    given: a CLI consumer pinned to a kernel release predating this change
    when: it validates a spec carrying `successors`
    then: >-
      it rejects the spec via `additionalProperties: false`, and this is
      documented as the declared minimum-compatible-release boundary rather
      than claimed as backward compatibility. Asserted by an older-reader
      fixture test that compiles the PRE-amendment schema and confirms the
      rejection, so the compatibility posture is a tested fact and not a
      README assertion.
  - id: A14
    given: the docs surface for the spec schema
    when: this slice lands
    then: >-
      docs/api/schema.md documents the `successors` field, the closed
      disposition vocabulary, and states explicitly that TARGET STANDING IS
      DERIVED AT QUERY TIME AND NEVER STORED. The doc carries present-tense
      what/how/why only, with no status barnacles.
  - id: A15
    given: >-
      a standalone spec FILE, valid in shape and intra-spec semantics, whose
      `required` successor names a target that does not exist in any
      repository
    when: it is put through `parseAndValidateSpec` and then through the
      repository-aware close preflight
    then: >-
      the two layers DISAGREE, and that is correct: shape + semantic
      validation PASS (the file is well-formed and internally consistent),
      while the close preflight REFUSES (the obligation is unresolved). This
      is the load-bearing test for the layering invariant — a single test
      asserting both verdicts on the same bytes, so any future collapse of
      resolution into the semantic layer fails it.
  - id: A16
    given: a spec file on disk and no `.caws` repository context whatsoever
    when: '`caws specs validate <file>` is invoked'
    then: >-
      it succeeds without requiring a repository index, performs no
      `.caws/specs` walk, and returns the same verdict it returns from inside
      a repository. Asserted for identical bytes in both ambient conditions,
      comparing the full diagnostic output — not merely the exit code — so a
      silently repository-dependent verdict is caught.
  - id: A17
    given: a spec with a `required` successor, in a context where the spec
      corpus cannot be read (unreadable directory or corrupt index)
    when: '`caws specs close` is invoked'
    then: >-
      the close is REFUSED with a `REGISTRY_UNAVAILABLE`-derived diagnostic
      distinguishable from the `UNAUTHORED` refusal in A5. It MUST NOT
      silently downgrade to local-only validation and admit the close.
      "Cannot determine" and "does not exist" are different facts; conflating
      them would let an unreadable corpus wave through the exact obligation
      this slice governs.
  - id: A18
    given: a `successors` array declaring the same `target_spec_id` twice
    when: the spec is validated
    then: >-
      validation FAILS at the intra-spec semantic layer (no repository access
      needed to detect this). Rejection is preferred over canonical
      deduplication: two declarations for one target mean the author's intent
      is ambiguous, and silently collapsing them would pick one rationale and
      discard the other.
  - id: A19
    given: successor entries that reference the declaring spec itself —
      `target_spec_id` equal to the source spec id, `absorbed_by` equal to
      the source spec id, and `absorbed_by` equal to the entry's own
      `target_spec_id`
    when: each is validated
    then: >-
      all three FAIL at the intra-spec semantic layer, with no repository
      access. A spec cannot be its own successor, cannot absorb its own
      obligation, and an entry cannot be absorbed by the very target it
      declares — the last would make the declaration self-satisfying. This
      mirrors the existing self-reference guard at
      validate-semantics.ts:139-151 and is the ONLY cycle analysis in scope.
non_functional:
  reliability:
    - >-
      The close gate's target-resolution step reads sibling spec files. It must
      degrade honestly: an unreadable or malformed sibling yields a typed
      diagnostic distinguishing "cannot determine" from "does not exist", and
      MUST NOT silently admit the close. Fail-closed, and say which.
    - >-
      Resolution is deterministic and exact-id only. No fuzzy matching, no
      prefix matching, no case-insensitive fallback — an id either resolves or
      it does not. Sterling's census is the evidence that inference over spec
      identifiers manufactures false governance conclusions.
    - >-
      Validation cost stays bounded as the corpus grows. Resolution over a
      2,500-spec corpus (Sterling's real size) must not require an O(n^2) walk
      per close; build an index once per invocation.
  security:
    - >-
      Successor declarations are governance authority records. Rationale text
      is persisted verbatim into the hash-chained `events.jsonl` and MUST NOT
      be interpreted, expanded, shell-evaluated, or path-resolved at any point.
      It is opaque data end to end.
    - >-
      The close gate is a REFUSAL surface, and this slice must not create an
      escape from it. A successor obligation cannot be discharged by editing
      the spec YAML by hand to delete the entry without an audit record; the
      governed edit path must be the easy path. Silent removal of a `required`
      declaration is the bypass class to watch for in review.
    - >-
      The migration reporter reads specs across the repository. It must not
      follow paths outside `.caws/specs/`, and must not emit file contents
      beyond the classification and the id it matched.
observability:
  - >-
    Every close refused for an unresolved `required` successor emits a typed
    diagnostic carrying the source spec id, the unresolved target id, and the
    disposition — sufficient to act on without re-reading the YAML. The
    diagnostic code is stable and greppable.
  - >-
    The migration reporter's output is machine-readable (one classification per
    spec, `--json` shaped) so a consuming repo can triage 2,500 specs without
    parsing prose. Counts per classification are reported so the operator sees
    the shape of the corpus, not just a list.
  - >-
    The jest output for A5 (refusal), A7 (event fidelity), and A9 (round-trip)
    is the primary closure evidence, quoted with concrete asserted values —
    the actual refusal message, the deep-compared event payload, the byte
    comparison — not a pass count.
rollback:
  - >-
    Revert the implementation commits (schema, kernel types + semantics, CLI
    writer/command, migration reporter, tests, docs). No data migration is
    introduced: no existing spec file is rewritten and no event is rewritten,
    so revert is a pure code revert with no state to undo.
  - >-
    A spec authored WITH a `successors` block during the window before a revert
    would fail validation afterward (the field becomes unknown again under
    `additionalProperties: false`). This is the one recovery obligation:
    identify such specs via grep for `^successors:` under `.caws/specs/` and
    move the declaration back to `closure_notes` prose before completing the
    revert. Operational rollback SLO 30m covers this manual step.
  - >-
    A `spec_closed` event already appended with a structured declaration stays
    valid on revert only if the event schema amendment is reverted LAST, or
    left in place. The events log is append-only and hash-chained — it is never
    rewritten to accommodate a rollback. Prefer leaving the event-schema
    addition in place over rewriting history.
contracts:
  - name: spec-successors-schema
    type: schema
    path: packages/caws-kernel/src/schemas/spec.v1.json
    description: >-
      An optional top-level `successors` array. Each entry requires
      `target_spec_id` (canonical spec-id grammar) and `disposition`
      (`required` | `declined` | `absorbed`), with optional `rationale` and
      `absorbed_by` (canonical grammar). `additionalProperties: false` at the
      entry level. Target standing is absent from the shape by construction.
  - name: successor-intra-spec-semantics
    type: behavior
    path: packages/caws-kernel/src/spec/validate-semantics.ts
    description: >-
      INTRA-SPEC RULES ONLY, no filesystem access. Disposition-specific
      required/forbidden fields (`declined` requires rationale; `absorbed`
      requires `absorbed_by`), self-reference rejection, duplicate-target
      rejection, and source-axis consistency. This layer never resolves a
      target against the corpus — see successor-close-gate.
  - name: successor-close-gate
    type: behavior
    path: packages/caws-cli/src/store/specs-writer.ts
    description: >-
      The repository-aware close preflight. Injects a SuccessorResolver
      (exact-id lookup over live + archived specs, returning AUTHORED |
      UNAUTHORED | MALFORMED_ID | AMBIGUOUS_ID | REGISTRY_UNAVAILABLE) and
      refuses the close on any unresolved governed obligation, writing no
      state. Resolution tests EXISTENCE (custody), never target lifecycle
      standing (completion). The resolver is injected, not imported into the
      kernel's pure validation pipeline.
