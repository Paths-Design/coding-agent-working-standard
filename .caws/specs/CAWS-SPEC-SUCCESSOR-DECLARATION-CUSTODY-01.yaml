# THE VERSIONING DECISION, AND WHY THE HANDOFF'S RECOMMENDATION WAS REVERSED.
#   The handoff recommended a new spec.v2.json, reasoning that because no v2 of
#   any CAWS schema exists, there is "no additive-amendment precedent to appeal
#   to." That inference runs backwards. The absence of a v2 is evidence that
#   ADDITIVE AMENDMENT IN PLACE IS the established practice — every schema in
#   this repo has absorbed additive change under its .v1 name:
#     - scope.support added to spec.v1.json (04e03ae7); commit states "No
#       migration; existing specs unchanged"; shipped as a MINOR kernel bump
#       (1.1.x -> 1.2.0) with CHANGELOG framing "No breaking changes".
#     - prior_worktree added to spec_closed.v1.json (297e7a8a), shipped as fix:.
#     - spec_archived.v1.json gained an entire oneOf tombstone shape (377a5058).
#   Written policy agrees: docs/api/schema.md:753 reserves breaking-change
#   ceremony for field REMOVAL and enum NARROWING.
#
#   The "older validator" objection is also weaker here than in the general
#   case. validate-shape.ts:8 imports the schema from local disk
#   (`import specSchema from '../schemas/spec.v1.json'`) into a module-level
#   Ajv singleton with NO loadSchema option — the $id is never resolved over
#   the network. There is no floating-schema consumer. "Older reader" means
#   "older npm package", which the ordinary minimum-compatible-release
#   declaration covers. A spec.v2.json would fork the schema, the loader, and
#   every fixture to buy what semver already provides.
#
#   DECISION: amend spec.v1.json in place, additive and optional. A11 pins the
#   compatibility boundary as a TESTED fact against a pre-amendment fixture,
#   which is what the handoff's item 10 was actually asking for.
#
# WHERE THE REAL WORK IS. The handoff frames this as a schema gap. The schema
#   is the small half. validate-semantics.ts:16-19 explicitly defers
#   "supersedes/superseded_by must form a valid graph" as out of scope, and the
#   only referential check that exists today is a self-reference guard
#   (validate-semantics.ts:139-151). CAWS HAS NO CROSS-SPEC REFERENTIAL
#   VALIDATION AT ALL. A4/A5/A6 require building that layer from nothing —
#   corpus indexing, exact-id resolution, and a refusal path wired into close.
#   Estimate accordingly; the JSON Schema edit is an afternoon, the resolution
#   layer is the slice.
#
# ROUND-TRIP IS ALREADY SAFE, WHICH IS EXACTLY WHY A9 EXISTS. specs-writer.ts
#   mutates specs by surgical raw-byte patching (setTopLevelScalar /
#   insertTopLevelScalarAfter), never parse -> object -> yaml.dump. So a
#   successors: block already survives every routine mutation. That is an
#   emergent property of the current implementation, not a contract — the one
#   object-rebuild path (specs-migration.ts:380, yaml.dump) is the v10->v11
#   migrator only. A9 converts the emergent property into a pinned one.
#
# OWNERSHIP BOUNDARY (from the handoff, upheld). CAWS owns the structured
