id: CAWS-DEFECT-ARCHIVE-BATCH-DROPS-NARROW-REPAIR-01
title: 'specs archive batch mode prints each failure reason but drops its narrowRepair, so the --replace remedy for a stale archived body is never shown'
mode: fix
lifecycle_state: active
worktree: archive-batch-remedy
created_at: '2026-10-04T23:45:37.201Z'
updated_at: '2026-10-05T04:59:57.665Z'
created_by_session: '@darianrosebrook'
blast_radius:
  modules:
    - 'caws-cli shell: specs archive / prune-drafts batch failure rendering'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/specs.ts'
    - 'packages/caws-cli/tests/shell/specs-archive-batch.test.js'
    - packages/caws-cli/src/store/specs-writer.ts
    - packages/caws-cli/tests/shell/specs-prune-drafts.test.js
  out: []
invariants:
  - 'Every refusal a batch command reports carries the same remedy the single-item command would print'
acceptance:
  - id: A1
    given: 'a closed spec whose id already has an older archived body'
    when: 'caws specs archive --status closed --apply runs'
    then: 'the failed line for that spec is followed by the narrowRepair text naming caws specs archive <id> --replace'
  - id: A2
    given: 'the same batch run with --json'
    when: 'it emits the failure'
    then: 'the failed entry carries the narrowRepair remedy as a field'
  - id: A3
    given: 'archiveClosedSpecs (store) fails one selected spec whose diagnostic carries a narrowRepair'
    when: 'the batch outcome is returned'
    then: 'the failed entry for that spec carries the narrowRepair text, so no renderer can lose it'
  - id: A4
    given: >-
      specs prune-drafts --apply where one candidate fails retirement with a
      diagnostic carrying a narrowRepair
    when: 'the batch output and --json are rendered'
    then: 'the failed line and JSON entry carry that remedy, matching archive'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "renderer prints next: caws specs archive <id> --replace under the failed line (specs.ts runSpecsArchiveCommand)"
    recorded_at: "2026-10-05T05:30:47.996Z"
    test_nodeid: "packages/caws-cli/tests/shell/specs-archive-batch.test.js::A1: a stale-shadow failure prints the --replace remedy under its failed line"
    commit_sha: b45f1cbfd8edb6ec8204325d7a78ee610e00fac4
    test_verified_at: b45f1cbfd8edb6ec8204325d7a78ee610e00fac4
  - criterion_id: A2
    status: pass
    evidence_ref: "--json failed[0].narrowRepair carries the --replace command"
    recorded_at: "2026-10-05T05:30:54.942Z"
    test_nodeid: "packages/caws-cli/tests/shell/specs-archive-batch.test.js::A2: --json failed entry carries narrowRepair as a field"
    commit_sha: b45f1cbfd8edb6ec8204325d7a78ee610e00fac4
    test_verified_at: b45f1cbfd8edb6ec8204325d7a78ee610e00fac4
