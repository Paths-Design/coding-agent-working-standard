invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'an agent-facing doc contains a caws evidence record example'
    when: 'its --data payload is validated against the kernel event schema'
    then: 'it validates, because a documented command that fails when run teaches the agent the wrong system'
  - id: A2
    given: 'guard remediation text tells an agent how to take worktree ownership'
    when: 'the printed command is run verbatim'
    then: 'it is a shape the CLI accepts (cd into the worktree, then bare caws claim --takeover), not a silently-ignored positional'
  - id: A3
    given: 'a shipped template enumerates the command groups or the --agent-surface enum'
    when: 'the doc generator runs in --check mode'
    then: 'it fails if the enumeration drifts from COMMAND_SURFACE_METADATA and KNOWN_SURFACES'
  - id: A4
    given: 'any guard builds a reset-strikes command'
    when: 'the message is rendered'
    then: 'it interpolates CAWS_HOOKS_DIR and names a path that exists'
non_functional: {}
contracts:
  - name: 'agent-doc-example-executability'
    type: behavior
