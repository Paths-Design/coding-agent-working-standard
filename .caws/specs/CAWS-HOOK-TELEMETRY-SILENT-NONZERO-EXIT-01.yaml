blast_radius:
  modules:
    - 'hook-packs/shared/dispatch'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'TODO: list the file(s) or directories this spec authorizes.'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'a PostToolUse handler that exits nonzero with empty stdout and stderr'
    when: 'the invocation is recorded in hook-events.jsonl'
    then: 'the row carries enough to distinguish a genuine handler failure from harness teardown (e.g. a signal/termination marker), rather than an undifferentiated exit_code'
  - id: A2
    given: 'exit_code 141 (SIGPIPE) across an entire handler chain'
    when: 'an operator audits the session'
    then: 'it is labelled as chain teardown, not reported as seven independent handler failures'
  - id: A3
    given: 'a genuine advisory-handler failure'
    when: 'it occurs'
    then: 'it is surfaced somewhere an operator or agent can see, since an advisory that fails silently is indistinguishable from an advisory with no finding'
non_functional: {}
contracts: []
