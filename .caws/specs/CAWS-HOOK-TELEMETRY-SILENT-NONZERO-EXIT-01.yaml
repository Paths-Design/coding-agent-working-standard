id: CAWS-HOOK-TELEMETRY-SILENT-NONZERO-EXIT-01
title: 'Hook telemetry records nonzero handler exits with no diagnostic'
risk_tier: 3
mode: fix
lifecycle_state: draft
created_at: '2026-09-17T13:14:49.469Z'
updated_at: '2026-09-17T13:14:49.469Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'hook-packs/shared/dispatch'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'TODO: list the file(s) or directories this spec authorizes.'
  out: []
invariants:
  - 'A hook-execution row must let an operator distinguish ''the handler ran and found nothing'', ''the handler failed'', and ''the harness tore the chain down'' — three states that currently all appear as a bare exit_code.'
  - 'Evidence: session 1ee72137, 2243 naming-check.sh invocations — 2161 exit 0, 70 exit 141 (SIGPIPE, identical count across all seven PostToolUse handlers, i.e. chain-wide), 17-18 exit 1. Every nonzero row had empty stdout AND stderr. The blocking plane was unaffected: bash-write-guard.sh exit 2 x14 and worktree-guard.sh exit 2 x2 carried full remediation text.'
acceptance:
  - id: A1
    given: 'a PostToolUse handler that exits nonzero with empty stdout and stderr'
    when: 'the invocation is recorded in hook-events.jsonl'
    then: 'the row carries enough to distinguish a genuine handler failure from harness teardown (e.g. a signal/termination marker), rather than an undifferentiated exit_code'
  - id: A2
    given: 'exit_code 141 (SIGPIPE) across an entire handler chain'
    when: 'an operator audits the session'
    then: 'it is labelled as chain teardown, not reported as seven independent handler failures'
  - id: A3
    given: 'a genuine advisory-handler failure'
    when: 'it occurs'
    then: 'it is surfaced somewhere an operator or agent can see, since an advisory that fails silently is indistinguishable from an advisory with no finding'
non_functional: {}
contracts: []
