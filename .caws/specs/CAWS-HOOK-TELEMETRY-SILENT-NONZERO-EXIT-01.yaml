id: CAWS-HOOK-TELEMETRY-SILENT-NONZERO-EXIT-01
title: 'Hook telemetry records nonzero handler exits with no diagnostic'
risk_tier: 3
mode: fix
lifecycle_state: draft
created_at: '2026-09-17T13:14:49.469Z'
updated_at: '2026-09-17T13:14:49.469Z'
