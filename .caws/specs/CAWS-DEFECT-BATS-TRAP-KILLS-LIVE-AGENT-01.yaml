invariants:
  - 'Under the test-harness attestation the danger-latch kill plane can never resolve a live agent-surface process as its target.'
  - 'The attestation is only honored from a marker inside .caws/hooks/, a path protected-paths.sh refuses agent writes to.'
acceptance:
  - id: A1
    given: 'a repo with no .caws/hooks/.test-harness marker, on the claude-code surface'
    when: 'agent-surface.sh resolves the kill plane'
    then: >-
      CAWS_TRAP_KILL defaults to 1 and CAWS_AGENT_PROCESS_NAMES defaults to 'claude'
      — production escalation behavior is unchanged by this slice
  - id: A2
    given: 'a fixture repo carrying .caws/hooks/.test-harness, on the claude-code surface'
    when: 'agent-surface.sh resolves the kill plane'
    then: >-
      CAWS_TRAP_KILL defaults to 0 and CAWS_AGENT_PROCESS_NAMES resolves empty, so
      trap_resolve_agent_identity holds every kill
  - id: A3
    given: 'a fixture repo carrying the .test-harness marker'
    when: >-
      a caller presets CAWS_AGENT_PROCESS_NAMES to a live agent-surface name such as
      'claude' or 'codex', with CAWS_TRAP_KILL=1
    then: >-
      the live name is filtered out of the resolved target list, so no live agent
      process can be aimed at even by an explicit preset; a sacrificial non-surface
      name such as python3 is preserved
  - id: A4
    given: 'the per-surface case arms in agent-surface.sh'
    when: 'a drift test enumerates every arm''s default CAWS_AGENT_PROCESS_NAMES value'
    then: >-
      each value is a member of the live-name set the attestation filters, so adding
      a surface without extending that set fails the suite rather than silently
      re-opening the hazard
  - id: A5
    given: 'helpers.bash installing a hook pack into a mktemp fixture repo'
    when: 'caws_install_pack_once completes'
    then: >-
      the .test-harness marker exists under the fixture .caws/hooks/, and the
      run_guard helpers pass a synthetic CAWS_TEST_SESSION_ID so guards never
      resolve the live session identity of whoever runs the suite
