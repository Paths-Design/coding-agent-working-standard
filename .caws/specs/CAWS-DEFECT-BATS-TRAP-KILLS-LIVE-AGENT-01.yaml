id: CAWS-DEFECT-BATS-TRAP-KILLS-LIVE-AGENT-01
title: 'bats hook-guard suite can SIGTERM the live agent session running it'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-17T11:39:49.977Z'
updated_at: '2026-09-17T11:39:49.977Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'hook-packs/shared/lib'
    - 'tests/hooks/bats'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/agent-surface.sh'
    - 'packages/caws-cli/tests/hooks/bats/helpers.bash'
    - 'packages/caws-cli/tests/hooks/bats/agent-surface.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
invariants:
  - 'Under the test-harness attestation the danger-latch kill plane can never resolve a live agent-surface process as its target.'
  - 'The attestation is only honored from a marker inside .caws/hooks/, a path protected-paths.sh refuses agent writes to.'
acceptance:
  - id: A1
    given: 'a repo with no .caws/hooks/.test-harness marker, on the claude-code surface'
    when: 'agent-surface.sh resolves the kill plane'
    then: >-
      CAWS_TRAP_KILL defaults to 1 and CAWS_AGENT_PROCESS_NAMES defaults to 'claude'
      — production escalation behavior is unchanged by this slice
  - id: A2
    given: 'a fixture repo carrying .caws/hooks/.test-harness, on the claude-code surface'
    when: 'agent-surface.sh resolves the kill plane'
    then: >-
      CAWS_TRAP_KILL defaults to 0 and CAWS_AGENT_PROCESS_NAMES resolves empty, so
      trap_resolve_agent_identity holds every kill
non_functional: {}
contracts:
  - name: 'hook-test-harness-attestation'
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/agent-surface.sh'
