id: CAWS-REFUSAL-REMEDY-CENSUS-01
title: 'Census every refusal remedy in the guards and CLI and execute each in its refusing fixture (failure-lineage Entry 44 follow-up)'
mode: fix
lifecycle_state: draft
created_at: '2026-10-05T08:27:12.837Z'
updated_at: '2026-10-05T08:27:12.837Z'
created_by_session: '3fda9a6f-2c79-4f6a-8ee2-bcb6e0b090e1'
blast_radius:
  modules:
    - 'shared hook pack refusal text (block-dangerous, worktree-guard, bash-write-guard, scope-guard, protected-paths, classify_command) and CLI narrowRepair strings'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks'
    - 'packages/caws-cli/tests/ci'
  out: []
invariants:
  - 'Every refusal that names a remedy has a test that produces the refusal, executes the remedy literally in that state through the agent pipeline (classifier and write guards, not only git), and asserts the refused action or its named substitute completes.'
  - 'A remedy names only a surface that governs the block: no waiver for a hook, no reprieve for merge readiness, no owning worktree for a path no lane owns.'
acceptance:
  - id: A1
    given: 'the shared guards and CLI refusal sites'
    when: 'censused by a recorded grep with a positive control'
    then: 'every refusal string and its remedy is listed with the case it was written for and every case it is printed on'
  - id: A2
    given: 'each listed remedy'
    when: 'executed literally in the refusing fixture'
    then: 'it completes, or the remedy is rewritten (branching per refused case) until it does'
  - id: A3
    given: 'an ask converted to a block where ask cannot be answered (bash-write-guard prints ''(approval unavailable or automatically satisfied (mode=bypassPermissions); blocked)'')'
    when: 'rendered'
    then: 'it names the route that remains (ask the user to run the command, or the governed alternative) instead of ending at ''blocked'''
non_functional: {}
contracts: []
