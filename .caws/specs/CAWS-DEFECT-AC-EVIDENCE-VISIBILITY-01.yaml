invariants:
  - 'An advisory the close gate computes must reach the operator on EVERY path that closes a spec. closeSpec already folds evidence advisories into the success outcome warnings; both the direct path (caws specs close) and the composed path (caws worktree merge auto-close) must print them.'
  - 'A composed lifecycle command must not swallow the warnings of the writer it composes: mergeWorktree carries closeSpec warnings through to its own success data rather than discarding them at the composition boundary.'
  - 'The spec evidence: block remains the SINGLE closure authority with a SINGLE writer (recordSpecEvidence via caws specs evidence). This slice does not add a second writer; caws evidence record --type ac is refused and redirected instead of being taught to dual-write.'
  - 'Help text describes the behavior the code actually implements. While the AC-evidence gate is in warn mode, no CLI surface may state that it refuses a close.'
acceptance:
  - id: A1
    given: 'An active spec with a declared acceptance criterion that has no entry in its evidence: block.'
    when: 'caws specs close <id> --resolution completed --reason "..." runs.'
    then: 'The close succeeds (exit 0) and stderr carries the warn-mode advisory naming the unsatisfied criterion id and the exact caws specs evidence remediation command.'
  - id: A2
    given: 'A worktree bound to an active spec whose declared acceptance criteria lack satisfying evidence.'
    when: 'caws worktree merge <name> runs and auto-closes the bound spec.'
    then: 'The merge succeeds (exit 0), mergeWorktree success data carries the closeSpec evidence warnings, and the command prints them to stderr alongside its other non-blocking warnings.'
  - id: A3
    given: 'A spec whose evidence: block already satisfies every declared acceptance criterion (status pass or waived).'
    when: 'caws specs close or caws worktree merge closes it.'
    then: 'No evidence advisory is printed — the advisory is emitted only for genuinely unsatisfied criteria, so it cannot be dismissed as constant noise.'
  - id: A4
    given: 'An agent reaching for the audit-event route to record acceptance-criterion evidence.'
    when: 'caws evidence record --type ac --spec <id> --data ... runs.'
    then: 'The command refuses with a non-zero exit, appends NO event, and names caws specs evidence <id> --ac <ac> --status <s> as the governed replacement, explaining that only that command writes the closure authority the gate reads.'
  - id: A5
    given: 'A reader consulting caws specs evidence --help or the evidence leaf description.'
    when: 'The AC-evidence close gate is in warn mode.'
    then: 'The description states the gate warns and does not refuse the close, so no reader infers that a closed spec had its acceptance criteria checked.'
non_functional:
  reliability:
    - 'The advisory is emitted on stderr and never changes the exit code of a close or merge that otherwise succeeded — warn mode must not become a soft block.'
contracts:
  - name: 'close-gate-advisory'
    type: behavior
