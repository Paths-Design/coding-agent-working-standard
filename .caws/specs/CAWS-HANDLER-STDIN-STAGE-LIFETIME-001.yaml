  out: []
invariants:
  - 'run_handlers deletes only paths its own mktemp created; it never removes an inherited HOOK_PAYLOAD_FILE or any CAWS_TEMP_FILES entry'
  - 'Each handler reads the exact HOOK_INPUT_JSON bytes from its own file offset, with nothing appended'
  - 'No interpreter is spawned per handler and no payload is exported into the environment'
acceptance:
  - id: A1
    given: 'An inline HOOK_INPUT_JSON over 32768 characters and no HOOK_PAYLOAD_FILE'
    when: >-
      run_handlers runs a reading handler, a handler that exits without reading, and
      a second reading handler
    then: >-
      Both readers receive the payload byte for byte from regular-file stdin, no
      broken-pipe text reaches stderr, the chain exits 0, and no
      caws-handler-stdin-* file remains in TMPDIR
  - id: A2
    given: >-
      That staged inline payload, including a TMPDIR that stops accepting removals
      after the stage directory is created
    when: >-
      A handler lists TMPDIR and every regular file under it while it runs, or the
      dispatcher is sent TERM or KILL while a handler runs
    then: >-
      No caws-handler-stdin-* payload file exists during the handler or after the
      dispatcher is gone. An empty owned stage directory that cannot be removed may
      remain only when stderr names its path. Not claimed: a signal while mktemp -d
      runs can leave one empty directory; a KILL between the payload write and its
      unlink can leave the payload file; a payload whose unlink fails (A7) remains a
      reported failure of this criterion, never a pass
  - id: A3
    given: >-
      An inherited HOOK_PAYLOAD_FILE, and a caller CAWS_TEMP_FILES naming a file
      run_handlers did not create
    when: 'run_handlers runs on the spill path and on the staged inline path'
    then: >-
      Handlers read the inherited payload file, and neither that file nor the
      CAWS_TEMP_FILES entry is deleted
  - id: A4
    given: 'A staged-size inline payload and a stage mktemp that fails'
    when: 'run_handlers runs a reading handler'
    then: 'The handler receives the payload byte for byte through the pipe fallback and no stage file remains'
  - id: A5
    given: 'Inline payloads of exactly 32768 and 32769 characters'
    when: 'run_handlers runs a reading handler on each'
    then: >-
      The 32768-character payload arrives through a pipe and the 32769-character
      payload through a regular file, each byte for byte, and no stage file remains
  - id: A6
    given: 'The cleanup comment above _write_payload_file in parse-input.sh'
    when: 'It describes how the payload file is removed'
    then: >-
      It names the EXIT trap, states that the trap runs on TERM, INT and HUP but not
      on KILL, and states that no shipped dispatcher consumes CAWS_TEMP_FILES
  - id: A7
    given: >-
      A staged inline payload whose unlink inside its private stage directory fails:
      either persistently (every attempt refused) or transiently (only the first
      attempt refused)
    when: 'run_handlers runs a reading handler'
    then: >-
      In both cases the handler still runs and receives the payload byte for byte
      and the chain exits 0. Under a persistent failure the payload remains and
      stderr names it before and after the handler, with one refused attempt before
      the handler and at least one after. Under a transient failure the retry after
      the handler removes the payload and stderr names it exactly once. Nothing
      run_handlers did not create is removed
non_functional: {}
