id: CAWS-SESSION-LOG-QWEN-001
title: 'Session log renderer: handle Qwen Code transcripts'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-session-log-qwen
created_at: '2026-08-04T17:14:03.173Z'
updated_at: '2026-08-04T17:17:10.734Z'
blast_radius:
  modules:
    - shared hook pack session-log surface (renderer + session-log.sh templates)
    - installed .caws/hooks session-log copies in this repo
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/session_log_renderer.py
    - packages/caws-cli/templates/hook-packs/shared/session-log.sh
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/tests/init/pack-fingerprints.json
    - packages/caws-cli/tests/hooks/**
    - .caws/hooks/session-log.sh
    - .caws/hooks/session_log_renderer.py
  out: []
invariants:
  - Claude-shaped transcripts keep rendering byte-equivalently — the qwen path is additive shape detection, never a rewrite of the claude parse branches.
  - Qwen tool runtime ids normalize to canonical harness names at the parse boundary so downstream tool branches, noise filters, and artifact detection stay surface-neutral.
  - The renderer stays fail-open on malformed rows — a decode error skips the row, never aborts the render.
acceptance:
  - id: A1
    given: a real Qwen Code transcript (chats/<session-id>.jsonl, probed shape on 0.21.4)
    when: the renderer parses it
    then: human turns become turns with commands, edited files, and agent runs captured; qwen system telemetry rows and @-mention context-injection wrapper rows produce no phantom turns
  - id: A2
    given: the session-log.sh hook script
    when: a qwen session fires PostToolUse with runtime tool ids (write_file/edit/exit_plan_mode) or Stop/SessionStart without a payload transcript path
    then: the plan-file render trigger and the chats/ transcript fallback candidates resolve the qwen store correctly
  - id: A3
    given: the shared pack templates changed
    when: the pack fingerprint and version are re-recorded and the init/hooks test suites run
    then: pack-fingerprint passes at the new version and the existing claude render tests stay green
non_functional: {}
contracts:
  - name: 'qwen-session-render'
    type: behavior
