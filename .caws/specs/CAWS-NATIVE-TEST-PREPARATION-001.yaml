    when: 'ordinary package tests prepare their dependencies'
    then: 'the declared TypeScript helpers and feature-off native binary are built from current source before Jest runs.'
  - id: A2
    given: 'prerequisite compilation or spawning fails or is interrupted'
    when: 'the test runner executes'
    then: 'it returns failure before running Jest and preserves the original diagnostic.'
  - id: A3
    given: 'PR and release qualification start from a clean hosted checkout'
    when: 'CI prepares tests'
    then: 'pinned Rust and locked Cargo dependencies precede offline test compilation, native and helper source changes invalidate test caches, and a mandatory macOS job executes actual context custody tests.'
