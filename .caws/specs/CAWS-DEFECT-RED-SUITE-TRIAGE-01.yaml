invariants:
  - 'Closure-notes enforcement is unchanged for ACTIVE specs: closing an active spec without --reason/--closure-notes/--notes/--note is still refused at both the shell and store layers with the existing messages (specs-close-requires-closure-notes and specs-close-closure-notes stay green).'
  - 'State refusals win over the notes guard: an already-closed, archived, or missing spec produces the lifecycle-state diagnostic (never the notes-required error), regardless of whether notes were passed.'
  - 'reset-danger-latch resolves its search root from the hooks install location / canonical git root, never from the operator cwd: agent-surface.shs CAWS_PROJECT_DIR="." fallback is treated as unset.'
  - 'The kimi-code/qwen-code updatedInput opt-outs and all other reset-danger-latch modes (--current/--all, warn-marker clearing, audit logging) are behavior-identical.'
acceptance:
  - id: A1
    given: 'An already-closed spec and a caller who passes no closure-notes alias.'
    when: 'caws specs close <id> runs (shell or store layer).'
    then: 'The refusal is the state-aware one ("already closed; close is a no-op") naming caws specs reopen / show / archive / recover; exit 1; no mutation. specs-close-handoff and specs-reopen suites pass.'
  - id: A2
    given: 'A reset-danger-latch install-shaped fixture with an armed latch, invoked from a foreign cwd with CAWS_PROJECT_DIR resolved to the "." fallback.'
    when: 'reset-danger-latch.sh --session <id> --reason <r> runs.'
    then: 'The latch is found and cleared ("Cleared danger latch"), and the nothing-found path names the absolute directories searched. agent-recovery-path-drift suite passes.'
  - id: A3
    given: 'docs/api/cli.md as shipped.'
    when: 'The cli-api-reference-coverage test compares COMMAND_SURFACE_METADATA leaves against documented headings.'
    then: 'Every visible leaf — including caws specs evidence and caws specs reopen — has a heading; the suite passes.'
non_functional:
  reliability:
    - 'A2 follows the header-comment philosophy already in the script (PROJECT_DIR derived from SCRIPT_DIR); the fix normalizes the "." fallback rather than introducing a new resolution path.'
