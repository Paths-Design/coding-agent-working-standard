    evidence_ref: "Commit abccdb1e on wt-identity-posture, docs/failure-lineage.md (+70/-5, one file). A1 has three clauses; all three verified by reading the landed text. (1) POSTURE RECORDED WITH ITS REASON: new section \"Forgeable attribution is the posture, not the gap\" states there is deliberately no CAWS affordance for user identity, that harder-to-forge-but-not-impossible is the accepted resting point, and that CAWS makes no claim to stop a misbehaving agent — reserving blocking for the class where redirection is itself the exploit. The rejection of the interactive-credential remedy is stated with the mechanism of harm: a prompt the agent can trigger is a prompt it can learn to trigger at a moment of its own choosing, i.e. the Entry 42 dynamic at larger scale, and it would leave git authorship untouched. (2) ENTRY 40 CROSS-REFERENCE: Entry 43 contained no prior Entry 40 reference to correct (verified by grep over the Entry 43 span), so the link is added as new material at depth 1 of the three-depth list, and it does NOT claim the @ prefix acted as a tell — Entry 40 records both forgeries as carrying the @ (\"copying the handle the way one copies a template field\") with detection being \"one line of the ledger read by one human\", and its shipped fix named accurately as an argument-position blocklist that authenticates nobody. (3) LEGIBILITY NOT DIFFICULTY is named as the direction, with the concrete candidate (persist the resolver-computed \"source: caws_env\" provenance, which is dropped at the record boundary where actor keeps only kind/id/session_id/platform) and an explicit marker that nothing implements it. MECHANISM RE-DERIVED THIS TURN, replacing the prior open question: resolve-session.ts tier 1.7 reads CAWS_SESSION_ID (source comment line 1102, \"the generic CAWS escape hatch\"); shell/session/actor.ts buildActor sets id = opts.id ?? opts.session.identity.session_id, copying it verbatim; shell/commands/message.ts:130 calls buildActor({session, kind:\"agent\"}) with no id override. Runtime probe from this agent process: CAWS_SESSION_ID=@probe-not-a-real-user caws status printed \"session: @probe-not-a-real-user:none (source: caws_env)\". Git-authorship claim re-derived: git config user.name=darianrosebrook, user.email=hello@darianrosebrook.com, and git log on main shows 28181741 merge(worktree) and c01b9663 chore(caws): evidence — both agent-written — authored darianrosebrook <hello@darianrosebrook.com>. NOT COVERED: no message was sent under a forged identity (deliberately — that act is the forgery under discussion), so the send path is closed by source reading plus the maintainer transcript, not by execution; the source: caws_env proposal is unimplemented and unspecced; no gate or test enforces any claim in this section; and whether other resolver tiers (1.5, 1.6, durable-envelope) can also be driven to an arbitrary handle was not probed — only 1.7 was."
