invariants:
  - 'The three verbs are strictly read-only: no file under .caws/ is created, modified or deleted by any of them, including compile --check.'
  - 'hooks list never reimplements handler selection; it shells the launcher''s --describe so what it prints is provably what executes.'
  - 'A repo with no hook-policy.json is valid, not an error: validate exits 0 and list renders the stock chain.'
acceptance:
  - id: A1
    given: 'a repo whose hook-policy.json declares an extension and a handler override for an event'
    when: 'caws hooks list --event <e> --json runs'
    then: 'every row carries a tier of stock, repo-policy or machine-policy, and the emitted sequence equals what caws-hook <surface> <e> --describe reports for the same repo, so the listing cannot drift from the selection that actually executes'
  - id: A2
    given: 'a hook-policy.json that is malformed JSON, violates the schema, or disables a REPO_POLICY_FLOOR handler'
    when: 'caws hooks validate runs'
    then: 'it exits non-zero, names .caws/hooks/hook-policy.json and the specific violation, and applies nothing — while a valid file and an ABSENT file both exit 0'
  - id: A3
    given: 'an on-disk dispatch/<event>.chain whose content differs from what the current policy and pack version would compile'
    when: 'caws hooks compile --check runs'
    then: 'it exits non-zero and names each stale event, exits 0 when every event agrees, and in neither case writes any file'
  - id: A4
    given: 'any of the three verbs run against a repo'
    when: 'the command completes'
    then: 'a recursive hash of .caws/ taken before and after is unchanged, proving read-only by observation rather than by inspection of the code'
  - id: A5
    given: 'the new hooks group registered through Commander'
    when: 'the BUILT dist CLI is invoked (not the handler function directly)'
    then: 'caws hooks --help lists list, validate and compile, and each declared flag reaches its handler — because handler-level tests bypass Commander and have previously stayed green over dead routing and a parent option shadowing a leaf option'
non_functional: {}
contracts:
  - name: 'hooks-readonly-surface'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "npx jest tests/shell/hooks-readonly.test.js -> 28/28 pass at 6a3eabfd (landed bb56785b). 'hooks list' shells the launcher rather than reimplementing selection; the suite drives a REAL launcher process (a stub python script at $CAWS_HOME/bin/caws-hook emitting a caws.hook_selection.v1 document), reached through the production path because machineHome() already reads CAWS_HOME — no test-only seam was added to the command. Arms: rows carry the tier the launcher reported (repo-policy and machine-policy both rendered, and a REPO_POLICY_FLOOR handler is marked [floor]); a launcher that OMITS tier renders 'unknown', never the string 'undefined', and names 'caws init adapters install'; no machine runtime at all is reported as unavailable while list still exits 0; --json emits caws.hooks_list.v1 with surface=codex, which also proves --surface reached the handler. The missing-tier arm is not hypothetical: the installed ~/.caws runtime on this machine predates Step 3's tier field, so the first live run of 'caws hooks list --event pre_tool_use' printed '(undefined)' on all ten rows — that was the defect this arm now pins. NOT CLAIMED: the remediation it prints was not executed, so 'caws init adapters install' restoring tier reporting is reasoned from the Step-3 template change, not observed end to end."
    recorded_at: "2026-09-18T23:25:29.639Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-readonly.test.js
    commit_sha: "6a3eabfd"
  - criterion_id: A2
    status: pass
    evidence_ref: "npx jest tests/shell/hooks-readonly.test.js -> 28/28 pass at 6a3eabfd. validate arms, all driven through the BUILT dist CLI: malformed JSON exits 1, prints REJECTED and 'Nothing was applied' (the document is read all-or-nothing; a partially applied guard policy is how a guard silently stops running); disabling protected-paths.sh — a REPO_POLICY_FLOOR handler — exits 1 and names the handler, because a policy that can authorize its own amendment is not a policy; an ABSENT policy exits 0 with 'absent', since a repo that never opts in is governed by the stock chain and is not in an error state; a well-formed policy exits 0; --json carries the same verdict as the exit code (caws.hooks_validate.v1 with valid:false, present:true and a string error). DISCRIMINATION CONTROL: disabling quiet-merge.sh, a NON-floor handler, exits 0 — without that arm a validator that rejected every 'disabled' entry would look correct. Additionally, a policy naming a project-wired surface is WARNED rather than rejected: the document is legal but only surfaces.default can reach the compiled chain, because all five project-wired surfaces exec the same dispatcher. NOT CLAIMED: the floor enforcement itself lives in parseRepoHookPolicy (landed under CAWS-REPO-HOOK-POLICY-RESOLVER-01 and covered by its own 35 arms); these arms prove the CLI surfaces that refusal, not that the floor logic is complete."
    recorded_at: "2026-09-18T23:25:41.758Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-readonly.test.js
    commit_sha: "6a3eabfd"
  - criterion_id: A3
    status: pass
    evidence_ref: "npx jest tests/shell/hooks-readonly.test.js tests/init/hook-chain.test.js -> 51/51 pass at 6a3eabfd. compile --check arms: a policy with no compiled sidecar exits 1 naming the event and 'no compiled chain on disk'; a sidecar compiled against pack 1 is named as a pack lag ('compiled against pack 1, shipping N'); an invalid policy exits 1 rather than compiling against a partial document; --json reports wrote:false; compile WITHOUT --check refuses with exit 1 and writes nothing, because a verb that half-exists is worse than one plainly not there yet. A repo with no policy AND no sidecar is FRESH, not stale — compiling a sidecar that merely restates the dispatcher's own stock array would add a file to keep in sync for no behavioral gain. Staleness is decided on BYTES, not the header: the arm named 'THE DANGEROUS CASE' constructs two chains whose parsed headers are EQUAL (asserted) but whose bodies differ — the stock chain moving under an unchanged policy, i.e. a pack upgrade that added or reordered a guard — and pins that it reports stale. A header comparison would call that fresh and the repo would keep running a chain that no longer matches what ships. The stock chain is read out of the installed dispatcher via extractMachineHandlers rather than kept as a second copy, so a hand-modified dispatcher surfaces as an explicit failure instead of being silently compiled against. NOT CLAIMED: no arm exercises a chain whose staleness arises from a REAL pack upgrade; the pack-lag case is synthesised by writing pack=1."
    recorded_at: "2026-09-18T23:25:56.233Z"
    artifact_path: packages/caws-cli/src/init/hook-chain.ts
    commit_sha: "6a3eabfd"