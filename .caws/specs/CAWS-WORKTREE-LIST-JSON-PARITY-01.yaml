id: CAWS-WORKTREE-LIST-JSON-PARITY-01
title: 'caws worktree list gains --json so the authoritative ownership and binding surface is machine-readable, at parity with its human rendering'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-worktree-list-json
created_at: '2026-09-19T10:39:20.061Z'
updated_at: '2026-09-19T10:39:31.447Z'
