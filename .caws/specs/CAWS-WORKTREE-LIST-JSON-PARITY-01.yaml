  out: []
invariants:
  - 'Parity is bidirectional. Every fact the human rendering states must appear in --json for the same entry, and the JSON must not be the only place a fact lives. --json may add machine detail the human form abbreviates (the full owner session id where the row prints an eight-character prefix), but abbreviation is not omission.'
  - 'An unresolvable ref must never serialize as ahead=0 behind=0. That reads as ''this lane is current'' -- the one answer that is actively wrong -- so it carries null counts and an explicit unknown_reason, matching what the human rendering already refuses to flatten.'
  - 'worktree list is the AUTHORITY surface for worktree ownership and spec binding. Its payload is sourced from worktrees.json alone and must not blend in lease-derived liveness, because a lease is operational cache and cannot confer or vacate ownership.'
  - 'Divergence counts are a point-in-time read of LOCAL refs that a peer landing work invalidates. The payload timestamps them so a consumer cannot mistake a cached response for a current one.'
acceptance:
  - id: A1
    given: 'a registry with worktrees bound to specs and owned by sessions'
    when: 'caws worktree list --json runs'
    then: 'each entry carries name, branch, base_branch, spec_id, owner, path and a divergence object, and the payload parses as JSON with no human prose mixed into stdout'
  - id: A2
    given: 'the same registry rendered both ways'
    when: 'the human rows and the JSON entries are compared field by field'
    then: 'every fact on a row is present in that entry, and the row''s eight-character owner is a prefix of the JSON''s full session id rather than a fact the JSON lacks'
  - id: A3
    given: 'a worktree whose branch or base ref does not resolve'
    when: 'caws worktree list --json runs'
    then: 'that entry reports ahead and behind as null with a non-empty unknown_reason, and never reports zero counts that would read as an up-to-date lane'
  - id: A4
    given: 'a repository with no registered worktrees'
    when: 'caws worktree list --json runs'
    then: 'it emits an empty worktrees array with zero counts and exits 0, because an empty registry is a successful read and not an error'
  - id: A5
    given: 'the footer guidance the human form prints when lanes are behind base'
    when: 'the JSON payload is inspected'
    then: 'it carries the same behind-base count so a machine reader receives the signal the human reader is given, satisfying parity in the direction that is easy to forget'
  - id: A6
    given: 'the read-surface authority contract'
    when: 'it is read after this change'
    then: 'worktree list declares its --json rendering and the parity known_nonconformance entry naming its missing machine surface is removed because the gap is closed'
non_functional: {}
contracts:
  - name: 'read-surface-unsourced-fact'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "tests/shell/worktree-list-json.test.js C1 + C1b at 94d7c62a, over a three-lane fixture repo with real git branches. C1 asserts the payload parses, carries ok/source/computed_at (a parseable ISO date) and one entry per registry row, and that the wt-behind entry deep-equals divergence {ahead:1, behind:2, contains_base:false, unknown_reason:null} with branch, base_branch, spec_id, owner.session_id and path populated. It also asserts stdout contains no prose ('Reconcile now' absent) -- a stray footer line is the usual way a --json flag is half-implemented and would break every consumer. C1b pins that an unbound/unowned row emits spec_id null and owner null rather than the human form's '(unbound)'/'unowned' rendering strings. Live CLI artifact on this repo through Commander on dist: source '.caws/worktrees.json', computed_at 2026-09-19T10:42:13.400Z, two entries with full session ids and divergence ahead 0 behind 1968 / ahead 0 behind 1. Baseline before the change: 10 of 10 tests failed."
    recorded_at: "2026-09-19T10:46:18.969Z"
    commit_sha: "94d7c62a"
  - criterion_id: A2
    status: pass
    evidence_ref: "tests/shell/worktree-list-json.test.js C2 + C2b at 94d7c62a. C2 iterates the JSON entries and, for each, locates the human row starting with that name and asserts the row contains the entry's branch, base_branch, spec_id (or '(unbound)') and path -- so the test is driven FROM the payload rather than from hardcoded strings both forms happen to share. C2b pins the abbreviation rule: the row prints 'owner=11112222' while the payload carries the full '11112222-3333-4444-5555-666677778888', and the test asserts the row value is a prefix of the payload value and that the payload id is longer than 8 characters. Parity is additionally STRUCTURAL rather than merely tested: runWorktreeListCommand now computes one WorktreeListRow[] that both renderings read, so a fact cannot exist in one form and be absent from the other."
    recorded_at: "2026-09-19T10:46:20.381Z"
    commit_sha: "94d7c62a"