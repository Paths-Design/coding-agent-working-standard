invariants:
  - 'The set of runners re-derivation can execute is exported once; the dispatch switch and the --help description both derive from it, so implementing a new runner cannot leave the help stale.'
  - 'No command named in a shipped template''s removed-commands list may be registered on the live command surface; a test enforces this against COMMAND_SURFACE_METADATA.'
acceptance:
  - id: A1
    given: 'the shipped templates list removed v10 commands'
    when: 'a command in that list is registered on the live surface'
    then: 'a test fails naming it, and verify-acs is absent from both removed-lists'
  - id: A2
    given: '--runner accepts pytest|jest|vitest|cargo|go but only pytest and jest can execute'
    when: 'a reader consults --help or the generated command reference'
    then: 'the executable and detected-only sets are named separately and both the help text and the dispatch switch derive from one exported constant'
  - id: A3
    given: 'jest is resolved from the repo node_modules/.bin but pytest is invoked as ambient python3 -m pytest'
    when: 'a reader consults the --run description'
    then: 'it states the pytest mechanism accurately instead of claiming both are repo-resolved'
  - id: A4
    given: 'global agent doctrine instructs recording evidence with --verify'
    when: 'an agent reads the repo agent docs'
    then: 'AGENTS.md documents caws specs evidence --verify'
non_functional: {}
contracts:
  - name: 'command-surface-help'
    type: behavior
