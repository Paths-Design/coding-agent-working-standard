scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh'
    - 'packages/caws-cli/src/runtime/stock-handlers.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/bats/block-dangerous-classifier-failure.bats'
    - 'packages/caws-cli/CHANGELOG.md'
  out: []
invariants:
  - 'A command the classifier could not judge never runs unreviewed'
  - 'A fault in the classifier itself is not the agent''s doing: it adds no strike and arms no latch, and the refusal names the fault'
acceptance:
  - id: A1
    given: 'python3 or classify_command.py is unavailable to the guard'
    when: 'a Bash command is checked'
    then: 'the command is refused with text naming the missing classifier, no danger-latch sentinel is written, and a second command is refused the same way'
  - id: A2
    given: 'the classifier process exits with an error, including a traceback containing quotes'
    when: 'a Bash command is checked'
    then: 'the command is refused with the classifier''s error text, no sentinel is written, and the text says the command did not cause it'
  - id: A3
    given: 'the classifier returns a decision the guard does not recognize'
    when: 'a Bash command is checked'
    then: 'the command is refused naming the unrecognized decision and no sentinel is written'
  - id: A4
    given: 'a catastrophic deny or a second capability-risk command in a later batch'
    when: 'it is checked'
    then: 'the latch is armed exactly as before this change'
  - id: A5
    given: >-
      a command the classifier ran on but could not finish analyzing (source
      classifier_error returned by the classifier, such as nesting past its budget)
    when: 'it is checked for the first time, and again in a later batch'
    then: >-
      the first is refused without a latch, with the way to restate it and a notice
      that a repeat arms the latch; the second arms the latch naming the repeated
      classification; a classifier process crash in between does not count as the
      repeat
rollback:
  - 'Revert the merge commit; shared pack returns to 134'
non_functional: {}
contracts: []
