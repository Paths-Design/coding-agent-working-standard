invariants:
  - 'A machine-adapter configuration error may refuse an action the agent can change; it may never refuse the agent''s exit. Blocking stop on a condition only the operator can fix leaves the session unable to act and unable to leave.'
  - 'Every refusal prints a remediation that runs. If a prerequisite step exists, the refusal names the prerequisite, not the step that will itself refuse.'
  - 'The top-level handler''s decision is event-dependent. The launcher already fails open loudly for an unresolvable git root; configuration errors get the same treatment on exit-class events.'
acceptance:
  - id: A1
    given: 'a repo with legacy .caws/hooks and no migrated machine project entry'
    when: 'the claude-code stop event dispatches through caws-hook'
    then: 'the adapter does NOT emit decision=block, the session can end its turn, and the unmigrated condition is reported on stderr instead'
  - id: A2
    given: 'the same unmigrated repo'
    when: 'the pre_tool_use event dispatches'
    then: 'the adapter still refuses the tool call, so the guard retains its force on the event the agent can act on'
  - id: A3
    given: 'a machine whose configure plan is dirty'
    when: 'an operator runs the exact command printed by the adapter''s block reason'
    then: 'that command succeeds or its refusal names the step the operator must run FIRST, never a step that itself refuses'
  - id: A4
    given: 'any launcher error class reaching the top-level handler'
    when: 'the event is stop or session_end'
    then: 'the handler emits a non-blocking advisory, and a test pins that no configuration error can produce a stop-blocking decision'
non_functional: {}
contracts:
  - name: 'machine-adapter-refusal'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "caws-hook.py's top-level handler now consults ENFORCING_EVENTS={'pre_tool_use'} before emitting a decision, so a configuration error on stop exits 0 with the diagnostic on stderr. Pinned by tests/adapter/system-runtime.test.js 'the same configuration error does NOT block the session from stopping': status 0, stdout carries no decision key, stderr contains 'one-time system migration'. It failed first on the unfixed code with status 2. Mutants M1 (re-adding stop to ENFORCING_EVENTS) and M4 (suppressing the stderr print, which made stderr the empty string) each killed this arm. Run: cd packages/caws-cli && npx jest tests/adapter/system-runtime.test.js gives 21/21; full suite 3327/3327 across 247 suites."
    recorded_at: "2026-09-19T03:02:58.071Z"
    commit_sha: fa64d64b
  - criterion_id: A2
    status: pass
    evidence_ref: "Enforcement survived the fix: pre_tool_use still fails closed on the same fixture. Pinned by tests/adapter/system-runtime.test.js 'an unclassifiable machine configuration still refuses the tool call' (status 2, decision=block, reason names the migration) and by the PRE-EXISTING 'an unparseable policy is refused by the LAUNCHER, before any handler runs', which I did not author. That pre-existing test is the load-bearing one: mutant M3 (ENFORCING_EVENTS=set(), i.e. block nothing) killed BOTH, proving the change cannot be a disguised disabling of the guard. The enforcement arm also passed on the unfixed code, which is what makes the stop-arm failure attributable to the event rather than to a benign fixture. Run: cd packages/caws-cli && npx jest tests/adapter/system-runtime.test.js gives 21/21."
    recorded_at: "2026-09-19T03:03:08.151Z"
    commit_sha: fa64d64b
  - criterion_id: A3
    status: pass
    evidence_ref: "Three dead-end remediations fixed, each so the chain terminates. (1) The adapter's block named 'adapters migrate' only; migrate carries its own precondition and refuses naming 'adapters configure'. The launcher message now names both in order -- pinned by 'the refusal names a remediation that terminates, not one that refuses next', which failed first on the unfixed code (received string contained migrate but not configure). (2) migrate's own refusal named only the prerequisite, dead-ending at a command that was never the goal; it now appends 'then re-run: caws init adapters migrate' -- pinned by 'the prerequisite refusal also names the step that finishes the migration'. (3) The 'System surface settings and native registration disagree' refusal told operators to run configure, which is the step that already ran and reported OK; the stale step is the pinned CLI snapshot upstream. It now carries the full upgrade order and had NO test before this slice. Run: npx jest tests/adapter/system-registration.test.js gives 16/16; tests/adapter/ gives 115/115."
    recorded_at: "2026-09-19T03:03:18.306Z"
    commit_sha: c3cac1a0
  - criterion_id: A4
    status: pass
    evidence_ref: "The carve-out is keyed on the error CLASS, not on one message, and is pinned as such. 'the carve-out is by error CLASS, not by one error message' drives a second, unrelated configuration fault (a migrated project entry whose surface policy is not an object, raising 'Malformed system project surface' from a different branch) and asserts the same disposition: status 2 on pre_tool_use, status 0 with stderr diagnostic on stop. 'session teardown and compaction are exits too' covers session_end and pre_compact. IMPORTANT SCOPE LIMIT, discovered by four pre-existing tests I broke: the event rule alone was too coarse and also converted a malformed handler RESULT into silent success ('Codex malformed Stop JSON ... is not silently converted to informational success'). _DISPATCHED now partitions the classes -- pre-dispatch errors are configuration and carved out, post-dispatch errors are a guard's unreadable answer and still block on every event including stop. Mutant M6 (never setting _DISPATCHED) killed all four Codex tests. This means a session CAN still be blocked at stop by a persistently malformed handler result; that residual is unbounded and is NOT fixed here. Run: full suite 3327/3327 across 247 suites."
    recorded_at: "2026-09-19T03:03:29.081Z"
    commit_sha: "73f7eac1"