invariants:
  - 'Completed authority revocations serialize with final authority validation and spawn through the canonical lifecycle lock.'
  - 'A live lifecycle lock holder cannot be stolen due to elapsed time and an obsolete handle cannot unlink a successor lock.'
  - 'Rollback must occur inside the same critical section as the authority write it compensates.'
acceptance:
  - id: A1
    given: 'a live aged lifecycle lock and an obsolete handle'
    when: 'competing acquisition and prior-handle release execute'
    then: 'the live holder is retained and the successor remains locked'
  - id: A2
    given: 'an authority fence is held'
    when: 'real bridge release or takeover attempts commit'
    then: 'the mutation refuses without changes and a completed release is visible after reacquisition'
  - id: A3
    given: 'a worktree takeover whose audit fails'
    when: 'rollback and a later successful transition execute'
    then: 'rollback cannot overwrite the later committed authority'
  - id: A4
    given: 'bind and scope amendment derive plans before locking'
    when: 'source authority changes before acquiring the fence'
    then: 'stale authority plans cannot overwrite committed state'
observability:
  - 'Focused hostile-path tests retain refusal rules and authority bytes.'
rollback:
  - 'Revert the owned source change through an ordinary follow-up commit.'
