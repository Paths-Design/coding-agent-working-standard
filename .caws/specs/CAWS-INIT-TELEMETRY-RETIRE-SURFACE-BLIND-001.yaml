id: CAWS-INIT-TELEMETRY-RETIRE-SURFACE-BLIND-001
title: 'Telemetry-row retirement is surface-blind and strips telemetry from non-covered surfaces sharing the project dispatchers'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-telemetry-surface-blind
created_at: '2026-09-16T05:28:15.983Z'
updated_at: '2026-09-16T05:55:09.793Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'caws-cli telemetry retirement + doctor advisory'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/init/hook-install.ts'
    - 'packages/caws-cli/src/shell/commands/init.ts'
    - 'packages/caws-cli/src/kernel/doctor/inspect.ts'
    - 'packages/caws-cli/src/store/doctor-snapshot.ts'
    - 'packages/caws-cli/tests/init/adapter-covered-telemetry-cut.test.js'
    - packages/caws-cli/src/kernel/doctor/types.ts
    - CLAUDE.md
    - packages/caws-cli/src/store/types.ts
  out: []
invariants:
  - 'A repair a guard prescribes must never remove capability that another installed surface still depends on; a remediation that disarms a live guard plane is worse than the drift it discharges.'
  - 'Dual-writer is a claim about two writers over the SAME state, not about two surfaces that each write their own session''s state; the distinction decides whether retirement is correct.'
acceptance:
  - id: A1
    given: 'a repo where an adapter-covered surface (dsh) and a non-covered surface that routes through .caws/hooks/dispatch (qwen-code, zcode or opencode) both have packs installed'
    when: 'caws init runs for the covered surface'
    then: 'the shared telemetry rows are retained, because the non-covered surface''s dispatchers still invoke them and its telemetry is not owned by any harness adapter'
  - id: A2
    given: 'the same mixed-surface repo'
    when: 'caws doctor evaluates doctor.hooks.stale_telemetry_pack'
    then: 'the finding does not fire, because the rows are not stale while a non-covered surface depends on them'
  - id: A3
    given: 'a repo where ONLY adapter-covered surfaces are installed'
    when: 'caws init runs for the covered surface'
    then: 'the managed shared telemetry rows are still retired, preserving the existing CAWS-HARNESS-TELEMETRY-ADAPTER-001 behavior for the single-surface case'
  - id: A4
    given: 'a file at a telemetry dest path without a hook_pack shared managed header'
    when: 'retirement runs under any surface configuration'
    then: 'the file is never touched, preserving the unmanaged-growth guarantee'
non_functional: {}
contracts:
  - name: 'telemetry-retirement-scope'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Mixed-surface repo (dsh marker + qwen-code pack, both written from the REAL manifests via resolveHookPack so the fixture cannot drift from what init installs): planTelemetryRetirement returns retire=[] and retained=all four TELEMETRY_ROW_DEST_PATHS with retainedFor=['qwen-code'], and retireStaleTelemetryRows leaves every row BYTE-IDENTICAL on disk (asserted by content compare, not existsSync, so a truncating bug cannot pass). Runtime artifact from a real spawned CLI on a dsh+opencode repo: 'Telemetry rows (adapter-covered surface owns this plane): / would retire: none / kept, still installed by opencode (4): / - .caws/hooks/agent-heartbeat.sh / - .caws/hooks/agent-stop.sh / - .caws/hooks/session-log.sh / - .caws/hooks/session_log_renderer.py'. NON-VACUOUS: mutating the guard to 'if (false && claimedRows.has(relPath))' (pre-fix surface-blind behavior) turns this test RED."
    recorded_at: "2026-09-16T06:03:18.092Z"
    test_nodeid: "CAWS-INIT-TELEMETRY-RETIRE-SURFACE-BLIND-001: retirement is surface-aware > A1: a co-installed non-covered surface keeps every telemetry row"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: "5785158d"
  - criterion_id: A2
    status: pass
    evidence_ref: "Real CLI 'doctor --repair-plan --json' (CAWS_HOME pinned to a temp dir so a developer's configured surfaces cannot change the verdict) over two fixtures. items[].source_rule contains 'doctor.hooks.stale_telemetry_pack' for the dsh-only repo and does NOT contain it for the dsh+zcode repo. The firing half is asserted DELIBERATELY as a contrast so the passing half cannot succeed because doctor went quiet for an unrelated reason (empty plan, crash, changed JSON shape). Doctor reads the claim through observeTelemetryRowClaimants exported from hook-install, the same single-source pattern as observeSharedPackBodyDrift, so the advisory cannot prescribe a repair the installer would not perform. NON-VACUOUS: replacing the new gate clause with 'true' in inspect.ts turns this test RED and leaves all other 20 green, proving it pins the doctor path specifically."
    recorded_at: "2026-09-16T06:03:28.674Z"
    test_nodeid: "CAWS-INIT-TELEMETRY-RETIRE-SURFACE-BLIND-001: retirement is surface-aware > A2: doctor stops calling the rows stale once a surface claims them"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: "5785158d"
  - criterion_id: A3
    status: pass
    evidence_ref: "Single-covered-surface repo (dsh marker only): planTelemetryRetirement returns retire=all four TELEMETRY_ROW_DEST_PATHS, retained=[] and retainedFor=[] (the reason is never asserted without an effect), and retireStaleTelemetryRows removes all four from disk. This preserves the original CAWS-HARNESS-TELEMETRY-ADAPTER-001 behavior, i.e. the fix narrows retirement without disabling it. NON-VACUOUS: mutating the guard to 'if (true || claimedRows.has(relPath))' (never retire anything) turns this test RED."
    recorded_at: "2026-09-16T06:03:40.510Z"
    test_nodeid: "CAWS-INIT-TELEMETRY-RETIRE-SURFACE-BLIND-001: retirement is surface-aware > A3: a repo with only adapter-covered surfaces still retires every row"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: "5785158d"