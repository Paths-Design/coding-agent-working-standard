    evidence_ref: "Commit 4861e372 on wt-turns-left, docs/failure-lineage.md (+45/-0, one file). New section \"The axis is turns, not hardness\" placed immediately before Doctrine. A1 clauses verified by reading the landed text: (1) TURNS-LEFT AXIS carried as a six-row table ordering every control the document touches (Entry 42 contract gate, Specimen A guards, strike/opaque-payload, reply_to binding, latch to process termination, keychain/sudo) by refuses / explains / turns-left / result, with the stated reasoning that both specimens routed by reframing and reframing requires a next turn. The table makes the two holds legible as opposite mechanisms: reply_to holds WITH a turn left because it binds an already-existing artifact, termination holds because no turn exists. (2) KEYCHAIN REJECTION recorded with its actual reason — worst cell in the table, hard enough to block AND verbose enough to explain AND names the credential the agent then needs, maximum incitement with the turn still available — attributed to the maintainer position that a harder block is reliably a more inciting puzzle. Not framed as cost or complexity. (3) STRIKE CALIBRATION recorded as deliberate: opaque-payload blocks the offending call and nothing after it, a slap on the wrist not a handcuff, with the reason that escalation buys a stronger refusal in the register the table shows gets routed. (4) GENERIC TRAP stated once: a control keying on observing a marker admits whatever it cannot observe, absence reads as innocence, durable form demands positive evidence; explicitly turned back on process-derived identity (a check asking for a known harness ancestor rather than a live registration admits a detached process). INVARIANT 1 verified: no trigger mechanics, thresholds, command shapes, env var names, or avoidance-relevant operational detail for any live control appear in the section — the termination row is described by effect and turn count only. NOT COVERED: the turns-left axis is an explanatory frame fitted to the controls already in this document, not a tested prediction — no control was built or modified to test it, and the table has one data point in the zero-turn row. The detached-process caveat on ancestry checks is reasoning from how setsid/nohup reparent, NOT an executed probe against any CAWS guard. Nothing in the section is enforced by a gate or test."
