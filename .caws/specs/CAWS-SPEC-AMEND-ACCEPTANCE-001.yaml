invariants:
  - 'Amending an acceptance criterion invalidates, never preserves, the closure evidence recorded against its previous text — a rewritten claim cannot silently retain the old claim''s pass or waiver.'
  - 'AC amendment is a claim rewrite, so it is a draft/active operation: a closed spec admits only the full scaffold discharge, and an archived spec is a tombstone.'
  - 'One criterion per invocation: --set-ac/--add-ac/--remove-ac are mutually exclusive and --given/--when/--then bind to exactly the named criterion, so no flag combination can leave ambiguity about which text replaced which.'
  - 'An accepted amendment lands spec bytes, evidence block, and event in one lifecycle transaction; a refused one writes nothing at all.'
