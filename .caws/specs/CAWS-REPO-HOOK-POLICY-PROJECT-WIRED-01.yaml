    evidence_ref: "npx jest tests/init/pack-fingerprint.test.js -> 14/14 pass at canonical main after rebuild. SHARED_PACK_VERSION 82 -> 83 in manifest-shared.ts; recorded shared fingerprint 415cdb787ff835987f9e9ea178183b8eb37562a6087d18890cd8cc1501601bc7. This AC is backed by a real RED-then-GREEN transition rather than an assertion that never fired. The slice's own merge (20bf0fb5) combined two concurrent shared-pack changes — this slice's dispatcher/local-chain work at v83, and CAWS-QUARANTINE-MESSAGE-NAMES-THIS-SURFACE-01's block-dangerous.sh edit which landed at 7786590a WITHOUT bumping SHARED_PACK_VERSION or recomputing the hash. The fingerprint is content-addressed over the whole pack, so no branch had ever hashed the union and the guard went red at main with 'Expected 562ae20c / Received 415cdb78'. Reconciled at d2ad73d5 (v83 has not shipped, so it legitimately covers both changes and no second bump is owed). The guard therefore demonstrably fails when a shared-template change is not reconciled, which is precisely the property A5 asserts. It also served as a byte-exactness oracle for the mutation testing: after mutating and restoring two template files, the fingerprint matching again proves the restoration was byte-exact. NOT CLAIMED: no installed consumer pack was upgraded to v83 and observed receiving the change; the proof is that the version and hash are reconciled, not that a downstream install was exercised."
