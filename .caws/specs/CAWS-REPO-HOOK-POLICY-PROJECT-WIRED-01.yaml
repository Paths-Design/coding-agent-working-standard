  out: []
invariants:
  - 'An absent .chain sidecar costs one stat and leaves the stock HANDLERS array in force, so a repo that never opts in is byte-identically unaffected.'
  - 'A malformed .chain line fails CLOSED with a block decision and exit 2; a sidecar that cannot be trusted must never silently degrade to a partial chain.'
  - 'The compiled sidecar is never sourced or evaluated as shell — it is parsed with builtins only, because sourcing a generated file would make the guard plane arbitrarily programmable from a committed artifact.'
acceptance:
  - id: A1
    given: 'a project-wired surface whose repo has no dispatch/<event>.chain sidecar'
    when: 'the dispatcher runs'
    then: 'it executes the stock HANDLERS array unchanged, and a missing local-chain.sh lib degrades to that same stock array rather than failing'
  - id: A2
    given: 'a committed dispatch/<event>.chain listing a handler sequence and an override target'
    when: 'the dispatcher runs'
    then: 'the compiled sequence replaces the stock array and the override target is the file actually executed'
  - id: A3
    given: 'a .chain file containing a malformed line, an absolute or traversing override target, or a non-.sh handler token'
    when: 'the dispatcher runs'
    then: 'it emits a block decision and exits 2, applying no part of the sidecar'
  - id: A4
    given: 'a dispatcher carrying the new local-chain trailer and an installed dispatcher predating it'
    when: 'extractMachineHandlers parses either'
    then: 'both are admitted as known scaffolding, so an upgrade does not make every installed dispatcher unreviewable'
  - id: A5
    given: 'a shared-template change in this slice'
    when: 'the pack fingerprint guard runs'
    then: 'SHARED_PACK_VERSION is bumped and the recorded shared fingerprint matches, so installed packs actually receive the change'
non_functional:
  reliability:
    - 'Absent-sidecar cost is a single stat per dispatch; the sidecar is parsed with shell builtins only and never sourced.'
  security:
    - 'A compiled chain is data, not code: sourcing it would make the guard plane arbitrarily programmable from a committed artifact.'
contracts:
  - name: 'compiled-chain-sidecar'
    type: schema
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "npx bats tests/hooks/bats/local-chain.bats -> 18/18 ok at f90dee2a (landed 6e8c7d7e). Stock-path preservation: arm 1 'an ABSENT sidecar returns non-zero so the caller keeps its stock array'; arm 12 'a chain for ANOTHER event does not leak into this one'; e2e arm 15 'WITHOUT a chain the same marker never runs' (discrimination control for arm 14). System-level corroboration: full bats plane 323 ok / 0 not ok with no .chain present anywhere, so every pre-existing guard verdict is unchanged. Missing-lib clause: e2e arm 17 moves lib/local-chain.sh aside WITH a valid chain present, so the lib is the only variable; asserts exit 0, override marker absent, and no 'local-chain.sh: No such file' on the stream. MUTATION-CHECKED: replacing the dispatcher's [[ -f ]] test with 'if true' leaves exit-0 and marker-absent GREEN (sourcing a missing file under set -uo pipefail continues; declare -F alone delivers the degradation) but FAILS the silence assertion, because bash then prints 'No such file or directory' on every tool call. NOT CLAIMED: the per-dispatch cost of the added stat was never measured."
    recorded_at: "2026-09-18T22:44:27.720Z"
    artifact_path: packages/caws-cli/tests/hooks/bats/local-chain.bats
