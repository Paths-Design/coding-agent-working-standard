  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/local-chain.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/run-handlers.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/dispatch'
