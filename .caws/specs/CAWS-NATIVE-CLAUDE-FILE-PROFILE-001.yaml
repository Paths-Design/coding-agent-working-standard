invariants:
  - 'Keep ownership, scope, protected-path, exact-source admission, original deadlines and all existing acceptance floors intact.'
  - 'A declared default Claude file-tool profile must not silently execute whole compatibility dispatch or first-party handler subprocesses.'
  - 'Native authority is the forward contract; legacy lookup decisions and compatibility execution confer no authority. Preserve user-owned extension source and data; any executed extension requires an explicit supported native contract.'
acceptance:
  - id: A1
    given: 'a default system Claude Write or Edit callback'
    when: 'the native producer and runtime normalize and admit it'
    then: 'the exact operation, cwd, caller and strike context, and original deadline remain bound without converting the surface to Codex.'
  - id: A2
    given: >-
      the native file-tool implementation, authenticated original invocation facts
      and canonical CAWS project state, all pinned to the installed candidate
      generation
    when: 'the admitted native profile authorizes a file operation and reaches final egress'
    then: >-
      validated native canonical observations and current canonical policy, spec,
      binding and ownership determine the decision; compiled protections and final
      fresh revalidation enforce that contract without legacy PATH lookup, private
      shell-environment emulation, compatibility dispatch or first-party handler
      interpreters; missing or ambiguous authority refuses
  - id: A3
    given: >-
      missing malformed stale or mismatched native context, invalid implementation
      identity, ambiguous canonical authority or an unsupported native extension
      contract
    when: 'the default native file-tool profile is requested'
    then: >-
      it refuses before authorization or payload effects and never borrows legacy
      enforcement or silently selects another authority; completed operational
      effects and uncertain publications remain retained without replay
  - id: A4
    given: 'a genuine trusted public Claude session resumed in its owned lane'
    when: 'it performs an owned write and read followed by a protected write'
    then: 'correlated observations prove the compiled file route, same actual owner, timely refusal, unchanged protected bytes and mode, and joined lifecycle and semantic rendering; other callbacks and the full seven-harness cutover remain parent obligations.'
observability:
  - 'Retain profile and selected handler identity, fallback falsifiers, unchanged protected bytes, original deadline, failure receipts and actual execution identity.'
rollback:
  - 'Use normal source reversions and retain failed artifacts; this slice performs no global runtime activation.'
non_functional:
  security:
    - 'Bind native context to the actual call; never relabel Claude as Codex, manufacture session environment, modify trust storage, or bypass guards.'
contracts:
  - name: 'claude-native-file-tool'
    type: behavior
