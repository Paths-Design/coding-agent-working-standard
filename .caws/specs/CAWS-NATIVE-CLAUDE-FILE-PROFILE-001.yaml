invariants:
  - 'Keep ownership, scope, protected-path, exact-source admission, original deadlines and all existing acceptance floors intact.'
  - 'A declared default Claude file-tool profile must not silently execute whole compatibility dispatch or first-party handler subprocesses.'
  - 'Preserve supported custom extensions and preserve unrelated source and unfinished qualification work.'
acceptance:
  - id: A1
    given: 'a default system Claude Write or Edit callback'
    when: 'the native producer and runtime normalize and admit it'
    then: 'the exact operation, cwd, caller and strike context, and original deadline remain bound without converting the surface to Codex.'
  - id: A2
    given: >-
      the complete unchanged first-party Claude file callback handler set, with
      literal original PATH node resolving to the selected installed Node and exact
      supported startup controls
    when: 'the admitted profile is composed'
    then: >-
      every active stock guard preserves baseline decisions and effects through
      compiled implementations with no whole compatibility dispatch or first-party
      handler subprocess; the proven node selection makes runtime-paths startup
      normalization a no-op, while full startup PATH construction outside this
      domain remains an unresolved parent release obligation
  - id: A3
    given: 'missing malformed stale or mismatched context, invalid source identity, or unsupported controls'
    when: 'a declared default Claude file profile is requested'
    then: 'it refuses before effects without borrowing compatibility enforcement, while supported explicit extensions retain their declared behavior.'
  - id: A4
    given: 'a genuine trusted public Claude session resumed in its owned lane'
    when: 'it performs an owned write and read followed by a protected write'
    then: 'correlated observations prove the compiled file route, same actual owner, timely refusal, unchanged protected bytes and mode, and joined lifecycle and semantic rendering; other callbacks and the full seven-harness cutover remain parent obligations.'
observability:
  - 'Retain profile and selected handler identity, fallback falsifiers, unchanged protected bytes, original deadline, failure receipts and actual execution identity.'
rollback:
  - 'Use normal source reversions and retain failed artifacts; this slice performs no global runtime activation.'
non_functional:
  security:
    - 'Bind native context to the actual call; never relabel Claude as Codex, manufacture session environment, modify trust storage, or bypass guards.'
contracts:
  - name: 'claude-native-file-tool'
    type: behavior
