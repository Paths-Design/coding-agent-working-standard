blast_radius:
  modules:
    - 'Shared heredoc shell projection helper and focused Bash write guard regression suite'
    - 'Shared hook pack version and fingerprint metadata'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/heredoc.sh'
    - 'packages/caws-cli/tests/hooks/bats/bash-write-guard-heredoc.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
invariants:
  - 'Preserve genuine session identity, actual caller context, native hooks, trust, policy and guard enforcement; introduce no guard exception.'
  - 'Retain the original raw command for interpreter-write checks; body projection affects only outer-shell target analysis.'
  - 'Preserve the existing helper API and all unlisted base-library bytes; no typed Bash profile fallback or shadow legacy copy. Parent owns immutable retained43 distribution and explicit base-library refresh API.'
acceptance:
  - id: A1
    given: 'One complete single direct node command with a wholly single-quoted or double-quoted heredoc delimiter and matching terminator'
    when: 'Outer-shell mutation targets are projected'
    then: 'The literal body is excluded from outer-shell targets so JavaScript arrows and literal greater-than characters are data, while the header, delimiter, line count and before/after shell text are preserved.'
  - id: A2
    given: 'Unquoted or expanded heredocs, shell command substitutions, Bash or unknown commands, unsupported wrappers or options, or multiple, ambiguous or unterminated forms'
    when: 'Heredoc projection is requested'
    then: 'Conservative treatment is retained and no global Node safelist conceals executable shell content.'
  - id: A3
    given: 'Actual Node writes and hostile shell-write counterparts before or after a literal Node heredoc'
    when: 'The guard examines the original raw command and projected outer-shell text'
    then: 'Actual interpreter writes remain visible and shell-write and worktree policy enforcement remains effective, demonstrated by meaningful hostile counterparts.'
  - id: A4
    given: 'The existing helper API, current strict callers and retained43 callers plus existing cat and tee contracts'
    when: 'The bounded helper change receives focused compatibility, regression and pack-fingerprint checks'
    then: 'The helper API and conservative contracts remain compatible without changing unlisted library bytes, and installed native host full-workflow qualification remains a separate Root obligation.'
observability:
  - 'Retain native command, revision, exit and raw focused-check output; installed native host workflow qualification remains a separate Root obligation.'
rollback:
  - 'Revert only the bounded helper correction, focused tests and corresponding pack metadata through an ordinary governed source commit if hostile controls fail.'
non_functional:
  security:
    - 'No global Node safelist; preserve conservative treatment of expansion, command substitution, unsupported or ambiguous shell forms and real interpreter writes.'
contracts:
  - name: 'heredoc-projection-api'
    type: api
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/heredoc.sh'
  - name: 'literal-node-hostile-controls'
    type: contract-test
    path: 'packages/caws-cli/tests/hooks/bats/bash-write-guard-heredoc.bats'
