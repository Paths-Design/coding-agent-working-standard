    status: pass
    evidence_ref: "npm run typecheck (tsc -p tsconfig.vnext.test.json && tsc -p tsconfig.kernel-test.json) now exits 0 with 0 'error TS' lines, re-run in the lane after the fix. Baseline was 76 errors (67 in evidence-rederive.test.ts, 9 in doctor-legacy-spec-schema.test.ts). Exit code captured without a pipe, since a trailing | tail reports the pipe's status and hides the verdict."
