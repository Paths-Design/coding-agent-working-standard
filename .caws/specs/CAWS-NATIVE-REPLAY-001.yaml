  - 'Selected code is operator-chosen reviewed code; capability controls are not an arbitrary JavaScript sandbox and observed admitted-build escapes must be repaired.'
  - 'Reports contain hashes and offsets rather than raw corpus commands or reasons.'
acceptance:
  - id: A1
    given: 'a captured command corpus and declared operator-chosen reviewed compiled classifier build'
    when: 'the replay entry streams and samples it'
    then: 'it consumes the selected actual classifier and retains full admitted source closure identity, deterministic census/sample semantics and redacted reports without executing captured commands'
  - id: A2
    given: 'admitted disposable classifier fixtures attempting initialization and invocation effects or failing to terminate'
    when: 'the runner executes its supported reviewed-build profile'
    then: 'actual direct effect controls produce explicit refusal without sentinels and deadline failures retain terminal child state and fail the replay'
  - id: A3
    given: 'the first-party replay runner and boundary tests'
    when: 'typed replacements are checked against original semantics and deliberate negative controls'
    then: 'both Python files are removed without hidden Python fallback and independent hostile oracles remain effective with explicit limits'
observability:
  - 'Redacted corpus digest, byte offsets, sample manifest, complete build file identities, classification/refusal rows and terminal child receipts'
rollback:
  - 'Revert the replacement source commit through ordinary governed Git; do not change machine installation.'
