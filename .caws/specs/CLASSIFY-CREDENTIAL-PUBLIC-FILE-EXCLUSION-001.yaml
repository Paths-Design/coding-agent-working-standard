invariants:
  - 'Credential reads belong in the catastrophic, latch-arming class, and this slice does NOT move them out of it. An agent that reads a secret does not merely read it: the content enters the model context and is transmitted to the model provider. There is no un-send, so the disclosure is irreversible in exactly the way mkfs and force-push are. A hard deny plus latch is the correct response to a real credential read.'
  - 'Because the class is justified, PATTERN PRECISION is the entire corrective surface. The defect is not that credential reads are treated as irreversible; it is that the selector matches files that are public BY CONSTRUCTION, where no disclosure can occur.'
  - 'A file is excluded only when its conventional role is publication, not merely when its name looks similar. `.env.example`, `.env.sample`, `.env.template`, `.env.dist`, `.env.defaults` are committed templates whose values are placeholders; `*.pub` files are public keys whose purpose is distribution. Nothing else is excluded — `.env`, `.env.local`, `.env.production`, `.ssh/config` and `known_hosts` remain denied, because a conservative deny there is cheap and an exfiltration is not.'
  - 'The exclusion is a NEGATIVE LOOKAHEAD on the credential file selector, not a pre-filter that short-circuits the rule: a command naming BOTH a template and a real credential file must still deny. `cat .env.example .env.local` denies.'
  - 'The classifier stays pure: no file is opened, no content is inspected. The selector is evaluated against command text only. This bounds the fix to what the name proves, and is why a committed template that wrongly contains real values is NOT covered here.'
acceptance:
  - id: A1
    given: 'a command reading a real credential file (cat .env, cat .env.local, cat .env.production, cat ~/.ssh/id_rsa, cat ~/.aws/credentials)'
    when: 'the classifier runs'
    then: 'it denies as before, with the catastrophic sink unchanged'
  - id: A2
    given: 'a command reading a conventionally-public file (cat .env.example, .env.sample, .env.template, .env.dist, ~/.ssh/id_rsa.pub, ~/.ssh/id_ed25519.pub)'
    when: 'the classifier runs'
    then: 'it does not deny for credential-read: the command clears or is governed by an unrelated rule'
  - id: A3
    given: 'a command naming both a template and a real credential file (cat .env.example .env.local)'
    when: 'the classifier runs'
    then: 'it still denies — the exclusion must not become an escape hatch'
  - id: A4
    given: 'the pre-fix classifier against the A2 command set'
    when: 'the new tests run before the pattern change'
    then: 'they fail, demonstrating the defect is real rather than asserted'
  - id: A5
    given: 'the unrelated system-credential rule (/etc/passwd, /etc/shadow)'
    when: 'the exclusion is applied'
    then: 'that rule is unchanged — the exclusion is scoped to the .env/.ssh/.aws selector only'
observability:
  - 'The decision and reason are returned by classify_command as before; a previously-denied public file now reports its new verdict, and the block message for a real credential read is unchanged.'
rollback:
  - 'Revert the commit; the selector returns to matching every .env* and .ssh/* path, restoring the false positive. Rerun the classifier pytest tier plus caws doctor.'
non_functional:
  security:
    - 'The fix trades no recall on real credentials for precision: every real secret path still denies, and the mixed-command case is pinned by A3. The residual (a template that genuinely contains committed secrets) is explicitly out of scope and named in the invariants rather than silently dropped.'
  reliability:
    - 'One regex alternation plus a negative lookahead; no I/O, no new branch in the decision path, and the classifier remains a pure function of command text. A malformed command cannot make the lookahead throw.'
