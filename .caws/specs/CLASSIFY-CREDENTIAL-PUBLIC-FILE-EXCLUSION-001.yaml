id: CLASSIFY-CREDENTIAL-PUBLIC-FILE-EXCLUSION-001
title: 'the credential-read hard-deny matches conventionally-public files (.env.example, *.pub), killing sessions over content that cannot be exfiltrated'
risk_tier: 2
mode: fix
lifecycle_state: active
