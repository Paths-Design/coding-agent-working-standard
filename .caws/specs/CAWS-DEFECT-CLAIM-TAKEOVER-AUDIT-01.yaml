id: CAWS-DEFECT-CLAIM-TAKEOVER-AUDIT-01
title: 'claim --takeover writes the highest-authority mutation in the control plane with no audit event'
risk_tier: 2
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'Closes ledger N10. caws claim --takeover now emits claim_taken_over, and the ownership transfer plus its audit append are ONE transaction via the new applyTakeoverWithAudit store function: prior registry bytes are captured for compensation, and a rolled-back append refuses the takeover rather than leaving ownership moved with no record. The event means a TRANSFER — same-session refresh, foreign claim without --takeover, phantom-root refusal, and --plan all append nothing. Falsification: removing the compensation reddened exactly the one predicted test. A follow-up commit fixed my own narrowRepair, which named ''caws claim --takeover'' without the required cd; the repo''s agent-recovery-path-drift guard caught it. Full suite 133/133 suites, 1917/1917 tests.'
created_at: '2026-08-12T08:36:13.534Z'
updated_at: '2026-08-12T09:54:46.947Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/claim.ts'
    - 'packages/caws-cli/src/store/worktrees-writer.ts'
    - 'packages/caws-cli/tests/shell/claim-takeover-event.test.js'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'a worktree owned by a foreign session'
    when: 'caws claim --takeover runs and succeeds'
    then: 'a claim_taken_over event is appended naming the worktree, the prior owner session id and last_seen, and the new owner session id'
  - id: A2
    given: 'the same takeover'
    when: 'the audit append fails'
    then: 'the ownership mutation does not land either — the registry write and the event append are one transaction, so a reader can never find ownership transferred with no record of who transferred it'
  - id: A3
    given: 'a claim by the session that already owns the worktree'
    when: 'caws claim runs with no --takeover'
    then: 'no claim_taken_over event is appended, so the event means an authority TRANSFER and not merely a heartbeat refresh'
  - id: A4
    given: 'a takeover refused by the phantom-root guard'
    when: 'caws claim --takeover runs from a transient cd'
    then: 'no claim_taken_over event is appended — a refused takeover must leave no audit implying it happened'
non_functional: {}
contracts:
  - name: 'claim-takeover-audit'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "3 tests: event carries worktree_name/prior_owner.session_id+last_seen/new_owner.session_id and spec_id, actor.id == new owner; chain integrity — seq extends and prev_hash equals the preceding event_hash; last_seen is the registry last_heartbeat, explicit null (key present) when the entry has none."
    recorded_at: "2026-08-12T09:19:11.996Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "3 tests: corrupt events.jsonl -> applyTakeoverWithAudit returns !ok, owner stays peer-session, and unmodelled entry fields (branch, specId) survive because compensation restores prior BYTES; refusal names the prior owner; CONTROL test proves the same call succeeds on a healthy chain, so the rollback assertions are not passing on a malformed patch. Falsified: removing the compensation reddens exactly the rollback test."
    recorded_at: "2026-08-12T09:19:13.230Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "2 tests: same-session claim without --takeover appends zero claim_taken_over events (kernel emits a null patch, so the emission site is never reached); foreign claim without --takeover exits 1, appends nothing, and leaves owner == peer-session."
    recorded_at: "2026-08-12T09:19:23.034Z"
  - criterion_id: A4
    status: pass
    evidence_ref: "2 tests: phantom-root refusal (CLAUDE_PROJECT_DIR outside the worktree) exits 1 with 'phantom' and appends nothing — the emission sits AFTER that guard by construction; --plan previews without appending and leaves ownership unchanged. Both assert owner == peer-session so 'no event' is not confused with 'no transfer'."
    recorded_at: "2026-08-12T09:19:24.264Z"