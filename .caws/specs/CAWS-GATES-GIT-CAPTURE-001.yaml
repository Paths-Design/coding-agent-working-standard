  out: []
invariants:
  - 'Capture remains finite at 64 MiB; full index hashing, all source deltas, and Git failure propagation remain intact.'
acceptance:
  - id: A1
    given: 'a real Git index larger than 1 MiB with committed and staged source changes'
    when: 'readGateChanges evaluates the stable repository'
    then: 'the full index fingerprint and exact combined source delta are returned without truncation.'
  - id: A2
    given: 'unavailable Git inputs or invalid base references'
    when: 'local gate Git helpers evaluate them'
    then: 'errors propagate rather than yielding an empty successful result.'
observability:
  - 'Raw baseline, falsifier, focused checks, gates and executable byte comparison retained outside tracked source.'
rollback:
  - 'Revert the isolated source commit through ordinary reviewed Git workflow.'
non_functional:
  security:
    - 'Git output remains bounded and acquisition failures are fail-closed.'
contracts:
  - name: 'gate-change-basis'
    type: behavior
