id: CAWS-LAUNCHER-READS-REPO-HOOK-POLICY-01
title: 'Machine launcher honors the repo-local hook-policy tier'
risk_tier: 2
mode: feature
lifecycle_state: active
created_at: '2026-09-18T21:40:22.394Z'
updated_at: '2026-09-18T21:40:45.668Z'
created_by_session: 'e625532a-0d29-4254-9cde-8e8c07b6db8d'
blast_radius:
  modules:
    - 'caws-cli/hook-packs/runtime/caws-hook'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/runtime/caws-hook.py'
    - 'packages/caws-cli/tests/hooks/pytest/test_machine_hook_selection.py'
  out: []
invariants:
  - 'The repo tier resolves before the machine tier, so an operator can locally silence a team extension but a committed team file cannot reach into an operator''s local additions.'
acceptance:
  - id: A1
    given: 'a repo with no .caws/hooks/hook-policy.json'
    when: 'the launcher selects handlers for an event'
    then: 'the selection is byte-identical to the selection made before this change, so a repo that never opts in is unaffected'
  - id: A2
    given: 'a committed hook-policy.json that disables a non-floor guard and splices an extension before an anchor'
    when: 'the launcher selects handlers'
    then: 'the disabled guard is absent and the extension runs at the declared position, without any machine-state entry'
  - id: A3
    given: 'a hook-policy.json that is malformed, over-authority, or names a REPO_POLICY_FLOOR handler under disabled or handlers'
    when: 'the launcher selects handlers'
    then: 'it raises, the existing __main__ handler emits a block decision and exits 2, and the policy file is named in the diagnostic'
  - id: A4
    given: 'both a repo policy and machine state carrying entries for the same event'
    when: 'the launcher resolves the chain'
    then: 'repo disable/extensions apply first and machine second, and a handler present in both tiers fails closed rather than being spliced twice'
  - id: A5
    given: 'any selection'
    when: 'describe_selection reports it'
    then: 'each handler carries a tier of stock, repo-policy or machine-policy, so what is shown is provably what executes'
non_functional:
  reliability:
    - 'An absent policy file costs a single stat; it must not add a parse or a subprocess to any dispatch.'
  security:
    - 'The floor and the fail-closed posture are the authority boundary: a repo-authored document must not reduce the guard set below the handlers that keep the policy reviewable.'
contracts:
  - name: 'repo-hook-policy-tier-1-selection'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "pytest tests/hooks/pytest/test_machine_hook_selection.py::test_absent_policy_leaves_the_stock_chain_and_every_tier_reads_stock — the no-opt-in regression lock, run against a REAL installed machine runtime (setUp installs it via dist/init/machine-adapters into a temp CAWS_HOME and git repo, then invokes bin/caws-hook <surface> pre_tool_use --system --describe). With the machine tier emptied and no .caws/hooks/hook-policy.json on disk, the described chain equals system-policy.json events.pre_tool_use element-for-element and every handler reports tier 'stock'. Whole file 27 passed; full pytest plane 350 passed exit 0."
    recorded_at: "2026-09-18T21:57:05.228Z"
    test_nodeid: packages/caws-cli/tests/hooks/pytest/test_machine_hook_selection.py
    exit_code: 0
    commit_sha: "57f2471d"
  - criterion_id: A2
    status: pass
    evidence_ref: "pytest tests/hooks/pytest/test_machine_hook_selection.py::test_a_committed_policy_disables_and_splices_with_no_machine_entry — machine state is emptied first so the effect is attributable to the committed file alone. The policy disables a non-floor stock guard and splices marker.sh before a named anchor. Asserted: the disabled guard is absent, marker.sh is present, its INDEX is exactly one before the anchor (position, not mere membership — a guard spliced into the wrong place adjudicates against different state than the one it must precede), its tier is 'repo-policy', and its resolved path is the repo's own marker.sh. Companion arm test_a_named_surface_merges_over_default_rather_than_replacing_it proves default and a named surface merge per key; test_a_policy_for_a_different_surface_does_not_apply_here proves surface scoping actually scopes."
    recorded_at: "2026-09-18T21:58:09.743Z"
    test_nodeid: packages/caws-cli/tests/hooks/pytest/test_machine_hook_selection.py
    exit_code: 0
    commit_sha: "57f2471d"
  - criterion_id: A3
    status: pass
    evidence_ref: "pytest tests/hooks/pytest/test_machine_hook_selection.py::test_a_floor_handler_cannot_be_disabled_or_replaced_by_the_repo_tier plus ::test_a_malformed_or_over_authority_policy_fails_closed plus ::test_unparseable_json_fails_closed_rather_than_resolving_to_stock. The floor arm drives BOTH forms (disabled and handlers) against protected-paths.sh and requires exit != 0 with 'repo-policy floor' AND 'hook-policy.json' in stderr. The malformed arm drives six documents — unknown top-level key, wrong version, absolute target, traversing target, sub-12-char reason, and a bootstrap-cycle library override of agent-surface.sh — each requiring a non-zero exit, its specific diagnostic, and the policy file named. The unparseable arm covers the dangerous near-miss: treating a broken document as 'absent' would silently drop a team's whole guard configuration and report success. Discrimination control ::test_a_non_floor_guard_may_still_be_disabled proves the floor arm is not passing on an implementation that refuses every disabled entry."
    recorded_at: "2026-09-18T22:00:06.761Z"
    test_nodeid: packages/caws-cli/tests/hooks/pytest/test_machine_hook_selection.py
    exit_code: 0
    commit_sha: "57f2471d"
  - criterion_id: A4
    status: pass
    evidence_ref: "pytest tests/hooks/pytest/test_machine_hook_selection.py::test_repo_resolves_before_machine_and_a_cross_tier_duplicate_fails_closed — with the same handler declared in BOTH tiers the launcher exits non-zero naming it, rather than splicing it twice (a guard that runs twice returns two verdicts for one call). With distinct handlers the chain is asserted as an exact sequence, stock + repo entry + machine entry, and the two entries report tier 'repo-policy' and 'machine-policy' respectively — which is what pins the ORDER rather than just co-presence. ::test_the_machine_tier_may_still_disable_a_floor_handler proves the floor binds the repo tier only, so the operator escape hatch survives."
    recorded_at: "2026-09-18T22:02:23.223Z"
    test_nodeid: packages/caws-cli/tests/hooks/pytest/test_machine_hook_selection.py
    exit_code: 0
    commit_sha: "57f2471d"
  - criterion_id: A5
    status: pass
    evidence_ref: "pytest tests/hooks/pytest/test_machine_hook_selection.py::test_a_guards_key_validates_but_does_not_affect_the_chain — a document carrying a populated guards key validates and leaves the resolved chain exactly equal to stock, so the key is admitted in v1 without being consumed. This is the forward-compatibility decision that cannot be deferred: runtime validators assert EXACT key sets, so introducing guards later would hard-block every repo pinned to an older runtime. Tier reporting itself is covered across the arms above, every one of which asserts the tier field; the anchor-absent diagnostic is pinned per tier by ::test_missing_anchor_is_a_visible_failure_before_execution and ::test_a_repo_tier_missing_anchor_is_attributed_to_the_repo_tier."
    recorded_at: "2026-09-18T22:05:20.619Z"
