id: CAWS-REPO-GIT-HOOKS-DEAD-HOOKSPATH-001
title: 'Restore this repo''s git hooks: fix core.hooksPath and rewrite the hooks onto the v11 surface'
risk_tier: 3
mode: fix
lifecycle_state: closed
resolution: completed
closure_notes: 'Rewrote the repo''s git hooks into the tracked .husky tree and corrected core.hooksPath from .husky/_ (which held only an exit-0 shim, so git found no hook by any name) to .husky. Code landed on main as fbdce732. commit-msg is new and tracked: dual-shape registry read, no filter on the status field v11 never persists, fails CLOSED on a malformed registry, lanes named from map keys. pre-commit drops ps-based message sniffing and the removed .caws/working-spec.yaml gate; pre-push drops a --no-verify loop that could never fire. post-commit dropped (called the removed caws provenance). NOT covered: the fail-closed path on a corrupt registry is verified by construction only, not executed, because inducing it would mean mutating the shared live registry; pre-commit guards 2 and 3 (policy/code separation, change_budget) are logic-reviewed but not execution-tested, since staging a governed file or a spec YAML was not safe here. Hooks are branch-dependent by construction: a checkout on a branch predating fbdce732 gets the old hooks and no commit-msg.'
created_at: '2026-09-16T04:58:52.855Z'
updated_at: '2026-09-16T05:07:48.472Z'
created_by_session: '0d83351d-d384-4100-8148-a3f40dbc6b7a'
blast_radius:
  modules:
    - '.husky (repo-local git hook tree; the only hooks git executes once core.hooksPath is corrected)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.husky/commit-msg'
    - '.husky/pre-commit'
    - '.husky/pre-push'
    - '.husky/_/husky.sh'
    - '.husky/README.md'
  out: []
invariants:
  - 'A hook that cannot decide safely must fail CLOSED (non-zero), never exit 0 on a parse or lookup failure.'
  - 'Hooks read the v11 flat-map .caws/worktrees.json shape and must not filter on a per-record status field, which v11 never persists.'
  - 'Hooks must not invoke a caws subcommand that does not exist in the v11 surface, and must not gate on .caws/working-spec.yaml, .caws/parallel.json or .caws/sessions.json.'
  - 'The base-branch commit restriction admits exactly merge(worktree):, wip(checkpoint):, chore(caws): and true git merge commits; every other message on the base branch with active lanes is refused.'
acceptance:
  - id: A1
    given: 'core.hooksPath and the .husky tree after this change'
    when: 'git hook run commit-msg / pre-commit / pre-push is invoked'
    then: 'git finds each hook instead of reporting ''cannot find a hook named <name>'''
  - id: A2
    given: 'the base branch main with one or more registered worktrees whose baseBranch is main'
    when: 'a commit message not matching merge(worktree): / wip(checkpoint): / chore(caws): is validated'
    then: 'the commit-msg hook exits non-zero and names the allowed prefixes'
  - id: A3
    given: 'the same base-branch and worktree state'
    when: 'a merge(worktree): or wip(checkpoint): or chore(caws): message is validated'
    then: 'the commit-msg hook exits 0'
  - id: A4
    given: 'a v11 flat-map .caws/worktrees.json whose records carry no status field'
    when: 'a hook counts lanes for the current base branch'
    then: 'the count matches the number of registered records with that baseBranch and is not forced to zero'
  - id: A5
    given: 'the rewritten hooks'
    when: 'their text is searched for removed v11 surfaces'
    then: 'no reference remains to caws parallel, caws waivers, caws provenance, caws validate <working-spec>, .caws/working-spec.yaml, .caws/parallel.json or .caws/sessions.json'
