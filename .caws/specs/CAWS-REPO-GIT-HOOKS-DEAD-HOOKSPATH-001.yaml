  out: []
invariants:
  - 'A hook that cannot decide safely must fail CLOSED (non-zero), never exit 0 on a parse or lookup failure.'
  - 'Hooks read the v11 flat-map .caws/worktrees.json shape and must not filter on a per-record status field, which v11 never persists.'
  - 'Hooks must not invoke a caws subcommand that does not exist in the v11 surface, and must not gate on .caws/working-spec.yaml, .caws/parallel.json or .caws/sessions.json.'
  - 'The base-branch commit restriction admits exactly merge(worktree):, wip(checkpoint):, chore(caws): and true git merge commits; every other message on the base branch with active lanes is refused.'
acceptance:
  - id: A1
    given: 'core.hooksPath and the .husky tree after this change'
    when: 'git hook run commit-msg / pre-commit / pre-push is invoked'
    then: 'git finds each hook instead of reporting ''cannot find a hook named <name>'''
  - id: A2
    given: 'the base branch main with one or more registered worktrees whose baseBranch is main'
    when: 'a commit message not matching merge(worktree): / wip(checkpoint): / chore(caws): is validated'
    then: 'the commit-msg hook exits non-zero and names the allowed prefixes'
  - id: A3
    given: 'the same base-branch and worktree state'
    when: 'a merge(worktree): or wip(checkpoint): or chore(caws): message is validated'
    then: 'the commit-msg hook exits 0'
  - id: A4
    given: 'a v11 flat-map .caws/worktrees.json whose records carry no status field'
    when: 'a hook counts lanes for the current base branch'
    then: 'the count matches the number of registered records with that baseBranch and is not forced to zero'
  - id: A5
    given: 'the rewritten hooks'
    when: 'their text is searched for removed v11 surfaces'
    then: 'no reference remains to caws parallel, caws waivers, caws provenance, caws validate <working-spec>, .caws/working-spec.yaml, .caws/parallel.json or .caws/sessions.json'
