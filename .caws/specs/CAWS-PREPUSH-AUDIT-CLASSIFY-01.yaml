id: CAWS-PREPUSH-AUDIT-CLASSIFY-01
title: 'pre-push distinguishes an audit FINDING from an unreachable advisory service, so a registry outage stops manufacturing a --no-verify incentive'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-prepush-audit
created_at: '2026-09-19T17:34:24.700Z'
updated_at: '2026-09-19T17:34:51.858Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'repo-local git hooks (.husky/pre-push)'
    - 'hook test harness (.husky/tests/run.sh)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.husky/pre-push'
    - '.husky/tests/run.sh'
  out: []
invariants:
  - 'A real finding always refuses. The unreachable branch may never absorb a case where an advisory report was actually obtained; presence of the report is the discriminator, and when a report exists npm''s own exit code decides.'
  - 'Classification falls toward refusing. Only positive evidence of a transport failure (no report AND an explicit endpoint/network error) selects the non-refusing branch; any other unclassifiable non-zero exit refuses. An unknown failure is not an outage.'
  - 'The unreachable branch must state what it did NOT verify. Announcing ''the advisory service is unreachable'' while implying the dependency tree was checked would be a worse lie than the collapsed message it replaces.'
  - 'Softening this one stage is what keeps the other four hard. A permanently-stuck audit leaves --no-verify as the only lever, and that disables typecheck, lint, build and the full test suite too. The trade is deliberate: an announced unverified audit beats a wholesale bypass of every gate.'
  - 'The hook keeps its no-environment-variable-escape-hatch property. Classification is derived from what npm actually returned, never from a caller-supplied flag, because a gate that can be told to stand down is not a gate.'
acceptance:
  - id: A1
    given: 'npm audit returns an advisory report containing at least one critical vulnerability'
    when: 'the pre-push audit stage runs'
    then: 'the push is refused and the message names it as a security finding, because a real finding must always block'
  - id: A2
    given: 'npm audit cannot obtain a report at all and says so (the retired quick-audit endpoint returning 400, or any transport failure)'
    when: 'the pre-push audit stage runs'
    then: 'the stage reports the advisory service as unreachable, states explicitly that this is NOT a vulnerability finding and that nothing was verified, and does not refuse the push'
  - id: A3
    given: 'npm audit exits non-zero with neither an advisory report nor evidence of a transport failure'
    when: 'the pre-push audit stage runs'
    then: 'the push is refused, because an unclassifiable failure must fall toward refusing rather than be absorbed by the unreachable branch'
  - id: A4
    given: 'npm audit exits zero'
    when: 'the pre-push audit stage runs'
    then: 'the stage passes silently and the remaining stages still run, so the classification cannot have broken the ordinary path'
  - id: A5
    given: 'the four classification outcomes'
    when: 'the hook test suite runs'
    then: 'each is exercised against the real .husky/pre-push file with a stubbed npm, and the refusing cases are what stop the unreachable case from passing vacuously'
non_functional: {}
contracts:
  - name: 'prepush-audit-classification'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "T10b/T10b2: a stubbed advisory report carrying critical:1 makes pre-push exit 1 and print 'audit FOUND vulnerabilities at or above critical' plus 'This is a security finding, not an outage.' The assertion matches hook-authored text; an earlier version matched the fixture's own JSON and was vacuous."
    recorded_at: "2026-09-19T17:40:09.341Z"
    commit_sha: "104cb215"
  - criterion_id: A2
    status: pass
    evidence_ref: "T10c/T10c2/T10c3/T10c4: the REAL 400 payload captured from the live retired quick-audit endpoint (message/uri/headers/statusCode, no auditReportVersion) plus npm's 'audit endpoint returned an error' stderr makes pre-push exit 0 and print 'audit SKIPPED', 'could not be reached', 'This is NOT a vulnerability finding', 'nothing was verified' and 'UNVERIFIED dependency tree'. Baseline failed all four."
    recorded_at: "2026-09-19T17:40:14.795Z"
    commit_sha: "104cb215"
  - criterion_id: A3
    status: pass
    evidence_ref: "T10d: exit 1 with empty stdout and an unrecognised stderr refuses (exit 1). Mutation-verified: removing the transport-error guard so the unreachable branch became the catch-all killed T10d (49 -> 47 passed), so the assertion discriminates rather than passing inertly."
    recorded_at: "2026-09-19T17:40:16.934Z"
    commit_sha: "104cb215"