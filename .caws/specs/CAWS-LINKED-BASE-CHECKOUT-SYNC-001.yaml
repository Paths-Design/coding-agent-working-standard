blast_radius:
  modules:
    - 'worktree merge checkout consistency'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/worktrees-writer.ts'
    - 'packages/caws-cli/src/shell/commands/worktree.ts'
    - 'packages/caws-cli/src/kernel/schemas/events/worktree_merged.v1.json'
    - 'packages/caws-cli/tests/store/worktree-merge-canonical-consistency.test.js'
    - 'packages/caws-cli/tests/shell/worktree-merge-canonical-consistency.test.js'
  out: []
invariants:
  - 'A landed base ref is followed by safe refresh of every observed checkout on that base without overwriting local edits.'
  - 'Checkout discovery and refresh failures remain explicit after the durable merge; canonical compatibility fields remain readable.'
acceptance:
  - id: A1
    given: 'a base branch checked out in a linked workspace'
    when: 'compare-and-swap merge succeeds'
    then: >-
      its source index and working files reflect the merged base while source
      payload and branch identity in a different canonical checkout remain
      unchanged; existing governance autocommits retain their contract
  - id: A2
    given: 'local edits in a base checkout'
    when: 'safe refresh follows merge'
    then: 'unrelated edits survive and overlapping edits remain untouched with explicit stale path and repair diagnostics'
  - id: A3
    given: >-
      checkout discovery is unavailable before ref publication or a checkout refresh
      fails after publication
    when: 'merge executes'
    then: >-
      failed discovery refuses without advancing the base; post-publication refresh
      failure reports the landed merge and affected checkout explicitly
observability:
  - 'Real Git store and shell tests compare branch refs index blobs working bytes and retained dirty paths.'
rollback:
  - 'Revert this source and regression tests through a normal follow-up commit.'
non_functional:
  security:
    - 'Never force reset or restore checkout files to hide stale state.'
contracts:
  - name: 'linked-base-checkout-sync'
    type: behavior
