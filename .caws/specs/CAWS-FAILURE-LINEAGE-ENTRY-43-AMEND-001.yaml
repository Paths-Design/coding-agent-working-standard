    evidence_ref: "Commit 87e5c088 on wt-lineage-43-amend, docs/failure-lineage.md (+98/-22, one file). All three clauses of A1 verified by reading the amended sections. (1) DOCTRINE carries the falsifiability discriminator as a named test — \"does discharging the obligation produce an artifact a later stage can check against reality and find wrong?\" — with scope.in and the reply_to binding as passing cases, a free-text rationale as the failing case, and spec.contracts (3 readers, all length === 0) as the standing proof; it states explicitly that adding an unfalsifiable obligation would convert Entry 43 into Entry 42, and constrains the census slot to be re-derivable at merge time. (2) SPECIMEN A now states the judgment was produced unprompted across five falsification passes (04:14:23Z census 105/86/19; 04:14:48Z dynamic-iteration control; 04:14:59Z/04:15:19Z glob + dir-iteration; 04:15:43Z self-contradiction resolved on mock_large_kg being a fixture function; 04:16:14Z multi-suffix stem check) and then evaporated — \"the system captured the decision and discarded the reasoning\" — replacing the prior inverted claim that it was never demanded. (3) The three refused --reply-to forgeries (01:23:04 \"daren rosebrooke\", 01:23:31 \"@darianrosebrook\", 01:24:03 \"1\", each store.messages.reply_target_invalid) are recorded under \"What this does not catch\" as the one check in either specimen reformulation could not satisfy, with the reason named: it binds against a message id that must already exist rather than against the well-formedness of the request. INVARIANT 2 also verified: the sender paragraph is explicitly labelled \"by testimony plus artifact\" and \"a different evidentiary class from the rest of the entry\", and the mechanism behind the @darianrosebrook stamp is left open rather than asserted (resolve-session.ts has no @-prefixed user tier; the prior \"settable by anything that can set a session-id variable\" wording was removed as imprecise). Ledger re-derived this turn: grep of .caws/messages.jsonl confirms 712b7f5a @ 2026-09-16T08:24:30.254Z, a4cc5588 @ 08:31:16.022Z, 8ee4fce2 @ 08:32:17.194Z, all actor.id @darianrosebrook. NOT COVERED: no gate or test enforces the falsifiability test — it is doctrine prose only; the census-slot design it constrains is unimplemented; A deletion correctness is still not re-derived; and whether an agent can produce the @darianrosebrook stamp is recorded as open, not answered."
