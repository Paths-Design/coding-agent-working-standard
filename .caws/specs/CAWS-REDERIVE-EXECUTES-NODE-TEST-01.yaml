id: CAWS-REDERIVE-EXECUTES-NODE-TEST-01
title: 'verify-acs executes node --test citations, and a name that matches nothing is missing, not verified'
risk_tier: 1
mode: feature
lifecycle_state: active
created_at: '2026-09-18T23:11:14.859Z'
updated_at: '2026-09-18T23:11:31.400Z'
created_by_session: '1aa3f0bd-7f1f-4ee7-be67-f8f9ee019fbb'
blast_radius:
  modules:
    - 'evidence-rederive'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/evidence-rederive.ts'
    - 'packages/caws-cli/tests/store/evidence-rederive.test.js'
    - 'packages/caws-cli/tests/shell/specs-verify-acs.test.js'
  out: []
invariants:
  - 'A located-but-unexecuted citation is never verified: node --test''s exit code alone must not decide the outcome, because it is 0 for a name pattern that matches nothing.'
  - 'Detection order is stable for existing projects: a repo already detected as pytest, vitest, jest, cargo, or go must keep that runner after node detection is added.'
acceptance:
  - id: A1
    given: 'a repo whose package.json test script runs ''node --test'''
    when: 'detectTestRunner walks to it'
    then: 'it returns the node runner rather than unknown, so cited node ids stop reporting runner_unavailable'
  - id: A2
    given: 'a cited test name that exists nowhere in the file'
    when: 're-derivation runs it under --run'
    then: 'the outcome is missing, NOT passed — node --test exits 0 with ''# pass 1'' for a name pattern matching nothing, because the file itself is counted as the passing subtest'
  - id: A3
    given: 'a cited test name that exists and passes'
    when: 're-derivation runs it under --run'
    then: 'the outcome is passed, established from a TAP ''ok N - <name>'' line for the CITED name, not from the exit code alone'
  - id: A4
    given: 'a cited test name that exists and fails'
    when: 're-derivation runs it under --run'
    then: 'the outcome is failed, so the criterion is refuted rather than not_rederived'
  - id: A5
    given: 'no --run (exists mode)'
    when: 'a node citation is planned'
    then: 'the outcome is not_run, never passed — a located-but-unexecuted test is not verified'
  - id: A6
    given: 'a repo with jest.config.js AND a node --test script'
    when: 'detection runs'
    then: 'jest still wins, so adding node detection cannot silently re-route an existing jest project'
observability:
  - 'Every node-runner outcome carries a detail string naming what was observed (the TAP line found, the counters, or the reason the citation was not located), so a not_rederived or missing verdict can be read back without re-running.'
rollback:
  - 'Revert the implementation commit; detection falls back to unknown and node citations report runner_unavailable again, which is the pre-change behavior and verifies nothing rather than verifying wrongly.'
non_functional:
  security:
    - 'The runner is invoked as the node binary with an argv array and never through a shell; the cited test name reaches --test-name-pattern only after regex escaping, so a crafted test name cannot inject an argument or a pattern.'
contracts:
  - name: 'rederive-node-runner'
    type: behavior
evidence:
  - criterion_id: A2
    status: pass
    evidence_ref: "The test asserts node's REAL behaviour first — it spawns node --test --test-name-pattern=ghost and asserts the output carries \"# pass 1\" and \"ok 1 - tests/sample.test.js\" — and only then asserts the outcome is missing and notToBe passed. The cited name is written into the fixture as a COMMENT so the cheap fileContains pre-check passes and the runner is actually reached; without that the test would pass for the wrong reason. Mutation M1 (making tapHasResultFor always true) kills exactly this test and nothing else."
    recorded_at: "2026-09-18T23:30:03.689Z"
    test_nodeid: "packages/caws-cli/tests/store/evidence-rederive.test.js::a name absent from the run exits 0 with \"# pass 1\" and is still missing, never passed"
    artifact_path: packages/caws-cli/tests/store/evidence-rederive.test.js
    commit_sha: "0063b034"
  - criterion_id: A1
    status: pass
    evidence_ref: "Four shapes in one test: a bare \"node --test tests/\" script detects node; \"node scripts/build.js --test\" does NOT (the flag belongs to the script); \"node --test-name-pattern=x foo.js\" does NOT (a reporter flag alone runs nothing); and \"npm run build && node --test tests/*.test.js\" DOES, which is how a real test script is written. Mutation M4 (replacing the structured regex with the substring /node[\\s\\S]*--test/) kills it on the second shape."
    recorded_at: "2026-09-18T23:30:18.590Z"
    test_nodeid: "packages/caws-cli/tests/store/evidence-rederive.test.js::a script invoking node --test is detected; a script merely passing --test to a program is not"
    artifact_path: packages/caws-cli/tests/store/evidence-rederive.test.js
    commit_sha: "6d6f37cc"
  - criterion_id: A3
    status: pass
    evidence_ref: "Spawns the REAL node runner against the REAL fixture package and asserts outcome passed. Paired with A2: passed is reached only after a TAP result line for the cited name is found, so this criterion and A2 together pin that the exit code is necessary but not sufficient."
    recorded_at: "2026-09-18T23:30:22.680Z"
    test_nodeid: "packages/caws-cli/tests/store/evidence-rederive.test.js::a cited name that exists and passes -> passed"
    artifact_path: packages/caws-cli/tests/store/evidence-rederive.test.js
    commit_sha: "6d6f37cc"
  - criterion_id: A4
    status: pass
    evidence_ref: "A real failing test in the fixture yields outcome failed with a detail containing \"node --test exit\", which the kernel maps to refuted rather than not_rederived — the distinction between \"the citation is wrong\" and \"I could not check\"."
    recorded_at: "2026-09-18T23:30:27.592Z"
    test_nodeid: "packages/caws-cli/tests/store/evidence-rederive.test.js::a cited name that exists and fails -> failed, so the criterion is refuted"
    artifact_path: packages/caws-cli/tests/store/evidence-rederive.test.js
    commit_sha: "6d6f37cc"
  - criterion_id: A5
    status: pass
    evidence_ref: "With runTests false the outcome is not_run and notToBe passed, and the recording spy shows ZERO spawns — existence mode locates the citation without executing it. This is the ancestral bug the module names: a check that was found but never executed is not verified."
    recorded_at: "2026-09-18T23:30:44.024Z"
    test_nodeid: "packages/caws-cli/tests/store/evidence-rederive.test.js::without --run a located node citation is not_run, never passed"
    artifact_path: packages/caws-cli/tests/store/evidence-rederive.test.js
    commit_sha: "1312c6f0"