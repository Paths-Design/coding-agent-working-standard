id: CAWS-ADAPTER-BOOTSTRAP-TRAPS-SESSION-03
title: 'Bootstrap-scope adapter faults trap the session, and the bootstrap cannot be upgraded to fix it'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-bootstrap-trap
created_at: '2026-09-19T04:47:30.710Z'
updated_at: '2026-09-19T04:51:11.596Z'
created_by_session: '34188473-6516-4d12-a4e5-df7ff5132232'
blast_radius:
  modules:
    - 'caws-cli machine adapter runtime'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/runtime/bootstrap.py'
    - 'packages/caws-cli/src/init/machine-adapters.ts'
    - 'packages/caws-cli/tests/adapter/runtime-bootstrap.test.js'
    - packages/caws-cli/tests/adapter/machine-runtime.test.js
  out: []
invariants:
  - 'A refusal is legitimate only when the blocked party can answer it: withholding a write is answerable, withholding the session''s exit is not.'
  - 'The partition is pre- versus post-dispatch, not event alone: an error raised before any handler ran is a configuration fault and must not be reported as a handler''s decision.'
  - 'An upgrade path that cannot distinguish upstream drift from local modification will refuse correct fixes; the two cases must be told apart by content, not by inequality alone.'
acceptance:
  - id: A1
    given: 'the machine runtime pointer, manifest or driver fails integrity or cannot be read'
    when: 'the bootstrap handles the resulting error on a non-enforcing event such as stop'
    then: 'it exits 0 without emitting a block decision, so the session can still end'
  - id: A2
    given: 'the same bootstrap-scope fault'
    when: 'the event is pre_tool_use'
    then: 'it still emits a block decision and exits 2, because refusing a write is answerable while refusing an exit is not'
  - id: A3
    given: 'an installed bin/caws-hook that matches a previously shipped upstream bootstrap'
    when: 'the template bootstrap changes and adapters install runs'
    then: 'it is recognized as upstream drift and replaced, not refused as local growth'
  - id: A4
    given: 'an installed bin/caws-hook that a user genuinely modified'
    when: 'adapters install runs'
    then: 'it is still refused, and the message distinguishes that case from upstream drift'
non_functional: {}
contracts:
  - name: 'machine-adapter-refusal'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "bootstrap.py now exits 0 without emitting a decision when a bootstrap-scope fault (malformed pointer, absent pointer, manifest/driver integrity failure) coincides with a non-enforcing event. Pinned by 'stop is an exit too...' plus the session_end and pre_compact rows of the same test.each, and by 'a bootstrap-scope fault refuses the tool call but never the session exit' in packages/caws-cli/tests/adapter/machine-runtime.test.js. Observed failing before the fix with status 2 and stdout {\"decision\": \"block\", \"reason\": \"CAWS machine adapter: Malformed machine runtime pointer\"}; after the fix status 0, stdout empty, stderr still carrying 'CAWS machine adapter' so the degradation stays loud. Re-run: cd packages/caws-cli && npx jest tests/adapter/machine-runtime.test.js — 36/36, exit 0."
    recorded_at: "2026-09-19T05:04:59.444Z"
    commit_sha: bd76c4c8
  - criterion_id: A2
    status: pass
    evidence_ref: "pre_tool_use remains in ENFORCING_EVENTS, so the same bootstrap-scope fault still emits {\"decision\":\"block\"} and exits 2. This is the non-vacuity anchor: it is asserted BEFORE the stop assertion inside 'a bootstrap-scope fault refuses the tool call but never the session exit', and it already passed on the unfixed code, so the stop result cannot be explained by the bootstrap simply having stopped enforcing. 'the carve-out is by event, not by one error message' repeats the pair over an OSError (absent pointer) rather than the ValueError (malformed pointer) to show the partition is by event class, not by message text. The pre-existing final assertion of 'quiet outside governed repositories...' independently pins pre_tool_use exit 2 with the pointer deleted."
    recorded_at: "2026-09-19T05:05:18.318Z"
    commit_sha: bd76c4c8
  - criterion_id: A3
    status: pass
    evidence_ref: "needsBootstrap now consults everShippedBootstrap before refusing: every retained runtime manifest records the bootstrap.py sha it shipped with, so an installed launcher matching any of them is upstream drift and is replaced. Pinned by 'a bootstrap CAWS shipped is replaced when upstream moves, not refused as local growth' — install, mutate templates/hook-packs/runtime/bootstrap.py, reinstall, then assert the on-disk bin/caws-hook contains the upstream marker and differs from the originally shipped bytes. It failed before the fix (the reinstall threw 'Machine launcher modified'), which is exactly the condition that would have blocked shipping the A1/A2 fix to any already-installed machine. A corrupt snapshot directory is skipped rather than thrown, so one bad directory cannot freeze the upgrade path."
    recorded_at: "2026-09-19T05:05:31.903Z"
    commit_sha: bd76c4c8
  - criterion_id: A4
    status: pass
    evidence_ref: "A launcher whose bytes match no bootstrap CAWS ever published is still refused, and the message now names that discriminator instead of asserting drift: 'Machine launcher modified: bin/caws-hook matches no bootstrap CAWS has shipped, so it carries local growth. Reconcile or remove it before updating, or rollback.' Pinned by 'a launcher the user actually edited is still refused, and the reason says which case it is', which appends local growth AND moves the template in the same fixture so the two causes are simultaneously present and only the real edit decides. The pre-existing 'failed activation preserves the previous executable runtime; conflicting install and launcher drift are refused' and 'an interrupted first installation can be retried without overwriting an unmanaged launcher' both still pass, so the refusal was narrowed, not removed."
    recorded_at: "2026-09-19T05:05:43.823Z"
    commit_sha: bd76c4c8