invariants:
  - 'Every mutating verb is all-or-nothing: a verb that refuses leaves .caws/ byte-identical, so a half-written guard policy is unrepresentable.'
  - 'A verb that REDUCES enforcement (disable, replace) refuses without a recorded human justification, and that justification is persisted in the committed document rather than in a session-scoped store — it propagates to every clone and has no expiry, unlike a reprieve.'
  - 'No mutating verb can remove a REPO_POLICY_FLOOR handler by any route, including replacing it with a no-op, because replace-with-a-no-op is observationally identical to disable.'
  - 'compile never writes a sidecar that local-chain.sh would refuse; the renderer throws first, so a compile cannot manufacture an outage on every tool call from a file the agent may not edit.'
acceptance:
  - id: A1
    given: 'a repo with no hook-policy.json'
    when: 'caws hooks add rg-replace-guard.sh --event pre_tool_use --before scope-guard.sh runs'
    then: 'the file is created containing that extension under surfaces.default, caws hooks validate exits 0 on it, and the handler appears in the resolved chain immediately before its anchor'
  - id: A2
    given: 'caws hooks disable <handler> --event <e> or caws hooks replace <stock> --with <rel> invoked WITHOUT --reason'
    when: 'the command runs'
    then: 'it refuses with exit 1, writes nothing, and names --reason — and when a reason IS supplied it is persisted in the document and echoed back by caws hooks list'
  - id: A3
    given: 'a REPO_POLICY_FLOOR handler such as protected-paths.sh'
    when: 'caws hooks disable or caws hooks replace targets it, even with a valid --reason and --approver'
    then: 'both refuse with exit 1 and write nothing, because a policy that can authorize its own amendment is not a policy'
  - id: A4
    given: 'a policy declaring an extension and an override'
    when: 'caws hooks compile runs'
    then: 'it writes dispatch/<event>.chain for every installed dispatcher, a following caws hooks compile --check exits 0, and the emitted file parses under the real local-chain.sh rather than merely matching a regex'
  - id: A5
    given: 'any mutating verb that fails partway — an unwritable target, an invalid resulting document, or a chain the renderer refuses'
    when: 'the command exits non-zero'
    then: 'a recursive content hash of .caws/ is unchanged from before the invocation'
  - id: A6
    given: 'a handler previously added, disabled or replaced'
    when: 'caws hooks restore <handler> --event <e> runs'
    then: 'the corresponding entry is removed from the document, the resolved chain returns to what it was before that verb, and the document remains valid'
non_functional: {}
contracts:
  - name: 'hooks-policy-writer'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Verified by running 'npx jest tests/shell/hooks-mutating.test.js' from packages/caws-cli at merge commit 1365b83b. Arms 'a repo with no policy gets one, and the handler lands before its anchor' (asserts the created document byte-for-byte via toEqual, then runs caws hooks validate against it and requires exit 0) and 'the compiled chain puts the handler immediately before its anchor' (compiles, then asserts names[indexOf('marker.sh')+1] === 'scope-guard.sh', i.e. position rather than membership). Both spawn the built dist CLI, not the handler function."
    recorded_at: "2026-09-19T00:01:07.978Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-mutating.test.js
    commit_sha: "1365b83b59da556d159ad8be7856d191e9b275a6"
  - criterion_id: A2
    status: pass
    evidence_ref: "Verified by 'npx jest tests/shell/hooks-mutating.test.js' at 1365b83b. Refusal half: the parameterised arm '%s without --reason refuses and writes nothing' covers disable and replace, each asserting exit 1, output naming --reason, and — via expectNoWrite — a sha256 of the whole .caws/ tree unchanged; it also asserts the policy file was never created. Persistence half: 'a supplied reason is persisted in the document and echoed by list' reads the written JSON (disabled.pre_tool_use === [{handler, reason}]) and then asserts both the human and --json output of caws hooks list carry that reason. The launcher side is pinned separately by pytest test_the_object_spelling_requires_a_substantive_reason. NOTE the schema change this required: 'disabled' previously admitted only bare strings and had nowhere to persist a reason, so both validators (repo-hook-policy.ts and caws-hook.py) were extended to admit {handler, reason}."
    recorded_at: "2026-09-19T00:01:22.044Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-mutating.test.js
    commit_sha: "1365b83b59da556d159ad8be7856d191e9b275a6"
  - criterion_id: A3
    status: pass
    evidence_ref: "Verified by 'npx jest tests/shell/hooks-mutating.test.js' at 1365b83b. Describe block 'A3: no verb can stop a floor handler from running' runs test.each over all three REPO_POLICY_FLOOR handlers for BOTH disable (with a valid --reason) and replace (with a valid --reason AND --approver), plus a third route the spec did not name: 'add --path may not install a floor NAME as a repo-local file'. All eight arms assert exit 1, 'repo-policy floor' in the output, and an unchanged .caws/ tree hash. The discrimination control 'a NON-floor guard is still disablable' fails if the build refuses every disable. Launcher parity: pytest test_the_object_spelling_cannot_smuggle_a_floor_handler_past_the_check, proven non-vacuous by mutating the floor loop to iterate raw values instead of extracted names (arm went red, file restored and sha256-verified)."
    recorded_at: "2026-09-19T00:01:23.257Z"
    artifact_path: packages/caws-cli/tests/shell/hooks-mutating.test.js
    commit_sha: "1365b83b59da556d159ad8be7856d191e9b275a6"