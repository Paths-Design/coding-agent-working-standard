  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/store/worktrees-writer.ts'
    - 'packages/caws-cli/src/shell/commands/worktree.ts'
    - 'packages/caws-cli/tests/shell/worktree-merge-split-state.test.js'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'a merge whose git merge landed but whose spec-close transaction rolled back'
    when: 'caws worktree merge reports the partial failure'
    then: 'the exact recovery commands are printed WITHOUT requiring --data — today recovery_instruction lives in the diagnostic''s data block, which renderDiagnostics hides unless --data is passed, so the operator is told what broke and nothing about what to do'
  - id: A2
    given: 'the same failure'
    when: 'the operator reads the message'
    then: 'it states which surfaces moved and which did not — git merged, spec still active, worktree still registered — so the split state is legible without inspecting three files'
  - id: A3
    given: 'a merge that succeeds normally'
    when: 'it completes'
    then: 'no recovery text is printed, so the remediation stays a signal rather than constant noise'
non_functional: {}
contracts:
  - name: 'merge-partial-failure-recovery'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "commit f350364f: worktree-merge-split-state.test.js 'a rolled-back spec close prints the ordered recovery commands on stderr' asserts both recovery commands and the real merge SHA appear in the DEFAULT stderr rendering (no --data). Falsified: inverting the destroy-step guard reddens this test plus the --no-close test, exactly as predicted."
