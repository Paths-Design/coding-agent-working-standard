id: CAWS-DEFECT-WORKTREE-DESTROY-ARCHIVED-SPEC-AUDIT-COMMIT-01
title: 'worktree destroy audit-commit git-adds the bound spec at the live path, missing archived specs'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: destroy-archived-audit
created_at: '2026-08-15T17:51:59.734Z'
updated_at: '2026-10-05T03:35:09.014Z'
blast_radius:
  modules:
    - 'packages/caws-cli/src/store/git-autocommit.ts (vanished-path handling in the trackable filter)'
    - 'packages/caws-cli/src/store/worktrees-writer.ts (destroy transition audit path set)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/store/git-autocommit.ts
    - packages/caws-cli/src/store/worktrees-writer.ts
    - packages/caws-cli/tests/store/worktree-destroy-archived-spec-commit.test.js
  out:
    - >-
      The merge path (worktree merge auto-close) is NOT modified — at merge
      time the bound spec still lives at the live .caws/specs/<id>.yaml path,
      so that audit set is correct today. Only the destroy transition's path
      composition and autoCommit's tolerance for vanished paths change.
invariants:
  - >-
    A destroy of a worktree whose bound spec is ARCHIVED
    (.caws/specs/.archive/<id>.yaml) composes its audit set from paths that
    actually changed in THIS transition: the registry entry
    (.caws/worktrees.json) is gitignored and already dropped, and the archived
    spec YAML is included only at its real .archive/ path and only if the
    destroy mutated it. When nothing tracked changed, destroy reports the
    clean committed no-op (kind committed, sha '') — never a failure.
  - 'autoCommit never feeds `git add` an UNTRACKED path that does not exist on disk: it is dropped exactly like a gitignored path, because `git add -- <nonexistent untracked>` fails fatally and turns a clean transition into refused_dirty. A path still TRACKED in the index but absent on disk is a deletion or move the transition itself made (archive, retire, restore), so it stays in the set and git add stages the removal. Vanished paths are never force-added or recreated.'
acceptance:
  - id: A1
    given: >-
      A registered worktree whose bound spec was archived by its own merge
      (spec YAML at .caws/specs/.archive/<id>.yaml, no live copy), owned by
      the caller, clean tree, merged branch.
    when: 'caws worktree destroy <name> runs.'
    then: >-
      The transition completes with a landed audit commit or the clean
      committed no-op — never the surface observed on wt-merge-notes
      2026-08-15: "the transition was applied but NOT committed ... git add
      failed: fatal: pathspec '.caws/specs/<id>.yaml' did not match any files".
  - id: A2
    given: 'autoCommit input.paths containing at least one path absent on disk.'
    when: 'autoCommit runs.'
    then: >-
      The absent path is dropped (same tier as the gitignored filter) and the
      remaining existing tracked paths stage and commit; the outcome kind is
      committed, not refused_dirty carrying "git add failed: fatal:
      pathspec".
  - id: A3
    given: 'autoCommit input.paths in which EVERY path is absent or gitignored.'
    when: 'autoCommit runs.'
    then: >-
      The outcome is the committed no-op (kind committed, sha ''), matching
      the existing all-ignored contract — absence and ignorement are the same
      "nothing tracked to commit" condition.
non_functional: {}
contracts:
  - name: 'worktree-destroy-audit-commit'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Three destroy cases on temp repos at 964491b8b90b5404f8a126d9ebc46ddd9d997351: archived+gitignored body and archived+tracked body both return audit_commit {kind:'committed', sha:''} with HEAD unchanged and an empty index; a live spec lands a real commit whose git show --name-only is exactly the live spec path. Break-the-fix (both source edits reverted) reproduced the 2026-08-15 surface: git add failed: fatal: pathspec '.caws/specs/<id>.yaml' did not match any files, refused_dirty. Not reproduced on the original wt-merge-notes lane."
    recorded_at: "2026-10-05T04:55:08.145Z"
    test_nodeid: "packages/caws-cli/tests/store/worktree-destroy-archived-spec-commit.test.js::A1: destroy of a worktree bound to an archived spec"
    commit_sha: "964491b8b90b5404f8a126d9ebc46ddd9d997351"
    test_verified_at: "964491b8b90b5404f8a126d9ebc46ddd9d997351"
  - criterion_id: A2
    status: pass
    evidence_ref: "At 964491b8b90b5404f8a126d9ebc46ddd9d997351: an absent untracked path is dropped and the existing changed path commits alone (commit contains only tracked.txt; no gone/ dir created); an existing non-ignored archived-style body is staged and committed; a TRACKED path deleted on disk is kept so the commit records 'D tracked.txt' (the archive/retire/restore contract; dropping it broke 7 tests in specs-writer-archive-move, specs-restore, specs-prune-drafts on the first attempt). Break-the-fix restored the fatal pathspec failure."
    recorded_at: "2026-10-05T04:55:24.091Z"
    test_nodeid: "packages/caws-cli/tests/store/worktree-destroy-archived-spec-commit.test.js::autoCommit input paths that are absent on disk"
