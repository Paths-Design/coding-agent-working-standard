invariants:
  - 'Lifecycle authority is operation specific and never admits generic Git or general CAWS CLI commands'
  - 'The canonical fence remains producer owned through consumer settlement and is never exposed to ordinary USER descendants'
acceptance:
  - id: A1
    given: 'a pinned lifecycle consumer and genuine authenticated caller'
    when: 'an exact typed literal lifecycle call crosses native discovery, analyze and final validation'
    then: 'only the pinned consumer receives fd3 under the producer held canonical fence and unsupported argv or identity drift is refused before launch'
  - id: A2
    given: 'a genuine same agent using exclusive caws_exec'
    when: 'it runs the owned feature workflow'
    then: 'scoped commit, native evidence, normal merge, downstream npm and close complete with raw source and installed identity joined evidence'
observability:
  - 'Retain raw Native refusal and consumer publication disposition with exact candidate identities'
rollback:
