id: CAWS-HOTFIX-SESSION-IDENTITY-REVIEW-FINDINGS-001
title: 'Review findings on the identity lane: honest platform cast, dedicated pinned-source rule id, shell template lint gate'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: wt-identity-review-findings
updated_at: '2026-09-03T22:55:56.616Z'
blast_radius:
  modules:
    - packages/caws-cli/src/shell/session/resolve-session.ts
    - packages/caws-cli/src/shell/rules.ts
    - packages/caws-cli/scripts/lint-shell.sh
    - packages/caws-cli/package.json
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/shell/session/resolve-session.ts
    - packages/caws-cli/src/shell/rules.ts
    - packages/caws-cli/tests/shell/session/resolver-canonical-env.test.js
    - packages/caws-cli/scripts/lint-shell.sh
    - packages/caws-cli/package.json
    - packages/caws-cli/tests/shell/canonical-drift.test.js
    - packages/caws-cli/tests/shell/message-command.test.js
    - packages/caws-cli/tests/shell/specs-create-session-provenance.test.js
    - packages/caws-cli/tests/store/bridge-store.test.js
  out:
    - .caws/policy.yaml
    - .github/workflows
invariants:
  - >-
    NO TYPE-LIES IN GOVERNANCE CODE: the surface-pinned tier casts the pin
    through the real AgentSurface type (never as never); a test pins that the
    resolved platform is a member of the valid surface set, so a future map
    key outside the union fails loudly instead of compiling via the bottom
    type.
  - >-
    DIAGNOSTICS NAME THEIR MECHANISM: the pinned source gets its own stable
    rule id (shell.session.resolved_from_surface_pinned_env) instead of
    reusing the claude_env rule id; existing ids keep their meaning.
  - >-
    SHELL TEMPLATES ARE LINTED, NOT ONLY TESTED: npm run lint (and therefore
    CI pr-checks) parses every templates/**/*.sh with bash -n (fail on
    syntax) and, when a shellcheck binary is available, runs shellcheck in
    informational mode — the bats suites remain the behavioral authority.
non_functional:
  reliability:
    - >-
      A broken shell continuation mid-template (the comment-inside-run bug
      this review surfaced in the identity lane) fails CI at lint time
      instead of at bats time.
acceptance:
  - id: A1
    given: 'the pinned tier in resolveSession'
    when: 'it resolves a pinned surface'
    then: 'the cast is through AgentSurface and the conformance test asserts the platform is a valid surface member'
  - id: A2
    given: 'a resolution whose source is surface_pinned_env'
    when: 'describeSessionSource renders it'
    then: 'it carries shell.session.resolved_from_surface_pinned_env (never the claude_env id)'
  - id: A3
    given: 'a shell template tree'
    when: 'npm run lint runs'
    then: 'bash -n passes for every templates/**/*.sh and an intentionally broken template fails the gate'
contracts:
  - name: 'shell-lint-gate'
    type: behavior
    description: >-
      lint-shell.sh exits non-zero on any bash -n failure across
      templates/**/*.sh and runs shellcheck (when installed) without
      failing the gate.
