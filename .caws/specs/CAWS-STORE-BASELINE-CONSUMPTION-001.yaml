  - 'The trusted pinned bootstrap is an explicit component boundary, not intrinsic compiler identity or defense against arbitrary earlier code execution. Preserve the transforming pre-capture wrapper counterexample; broader compiler custody, native and child-consumer proof remain parent obligations accepted by lead c5d9aeae-7064-4cbb-a3f3-fc5670c8103b.'
