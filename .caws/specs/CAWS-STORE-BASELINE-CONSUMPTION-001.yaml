invariants:
  - 'All six store targets, nine selected suites, perTest coverage, concurrency two, incremental false and per-file mutation floors remain unchanged.'
  - 'Observer qualification never confers child-process, full-campaign, exported-function semantic, native-adoption or cutover authority.'
  - 'No child test edits, candidate direct imports, preloads, dependency changes, foreign hooks or shared runtime configuration changes.'
  - 'The launcher uses the pinned public Stryker API with the same configFile and logLevel; dryRunOnly is omitted when the CLI flag is absent, and successful Promise resolution never resets an existing nonzero process exit code.'
  - 'Only context-matched code submission to the compiler reference captured at observer module load and invocation of its returned module body can satisfy per-suite positives and the six-target union; missing, stale or unsupported bootstrap evidence fails closed.'
  - 'The trusted pinned bootstrap is an explicit component boundary, not intrinsic compiler identity or defense against arbitrary earlier code execution. Preserve the transforming pre-capture wrapper counterexample; broader compiler custody, native and child-consumer proof remain parent obligations accepted by lead c5d9aeae-7064-4cbb-a3f3-fc5670c8103b.'
  - 'Store qualification requires captured original bootstrap tools plus the actual worker startup and normalized constructor topology. Unsupported Node or JEST_JASMINE influence, package Jest configuration and selected-suite environment docblocks refuse before API execution or qualification.'
  - 'Bootstrap plugins are the existing declared jest-runner and typescript-checker packages plus the captured original scripts/mutation-test-runner.mjs local descriptor for store, delegating the public stock Jest factory; appendPlugins remains empty and unrelated installed siblings cannot enter through wildcard discovery. No dependency, lockfile, shared runtime, global hook or additional production process changes are authorized by this descriptor.'
  - 'Original-spawn admission, actual TestRunner job identity and preconstructor Jest suite health must reach the original parent private membership, successful-producer close byte pins and sticky refusal through both outer validation branches, report join and publication. A2 remains FAIL until genuine six-target/nine-suite healthy outer qualification and consequential fresh forged-client refusal; component, fixture-retention and socket probes cannot confer acceptance.'
acceptance:
  - id: A1
    given: >-
      the pinned Node and Jest/Stryker boundary under the audited trusted bootstrap,
      restricted startup influence and captured dependency closure
    when: >-
      baseline and mutant environments submit module code to the compiler reference
      captured at observer module load and invoke its returned body
    then: >-
      exact submitted UTF16 units, parameters,
      target/test/context/run/phase/generation identity and returned-body invocation
      outcomes are retained; mutant and unrelated contexts cannot borrow baseline
      standing; intrinsic compiler identity and arbitrary prior monkeypatch defense
      are not inferred
  - id: A2
    given: >-
      repeated loads, teardown, reattachment, replacement of the captured VM hook
      and observation failures within the trusted pinned bootstrap boundary
    when: 'observer lifetimes transition or artifacts are lost, replaced, malformed or exceed finite caps'
    then: >-
      stale or incomplete observations cannot qualify, returned-body return/throw
      identity and owned restoration are preserved, and replacement after
      compiler-reference capture refuses new standing; an arbitrary pre-capture
      wrapper is retained as an unsupported-influence counterexample
  - id: A3
    given: 'ordinary store runner inputs and sandbox build receipts'
    when: 'it completes its initial baseline'
    then: 'validation requires the actual expected nine-suite target matrix and six-target union bound to current run and sandbox outputs with original observer tool identity, while fixture-only checks remain labeled.'
  - id: A4
    given: 'a fresh ordinary pinned store baseline and a separately prepared distinguishing atomic-write source control'
    when: 'normal build and baseline execute'
    then: 'retained actual code and named test outcomes distinguish positive consumption from semantic failure without weakening production policy; child-process consumption and full mutation quality remain parent obligations.'
  - id: A5
    given: >-
      captured public Stryker API, original launcher, production configuration and
      startup influence policy
    when: >-
      the ordinary runner invokes resolving, rejecting, cleanup-failing and
      resolved-nonzero API outcomes including warning-only unhandled rejection mode
    then: >-
      the launcher awaits the actual API lifecycle, preserves option omission and
      nonzero exit semantics, retains current-attempt terminal artifacts and refuses
      positive qualification without resolved API completion plus actual child exit
      zero
