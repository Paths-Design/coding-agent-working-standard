  - 'The launcher uses the pinned public Stryker API with the same configFile and logLevel; dryRunOnly is omitted when the CLI flag is absent, and successful Promise resolution never resets an existing nonzero process exit code.'
  - 'Only context-matched code submission to the compiler reference captured at observer module load and invocation of its returned module body can satisfy per-suite positives and the six-target union; missing, stale or unsupported bootstrap evidence fails closed.'
  - 'The trusted pinned bootstrap is an explicit component boundary, not intrinsic compiler identity or defense against arbitrary earlier code execution. Preserve the transforming pre-capture wrapper counterexample; broader compiler custody, native and child-consumer proof remain parent obligations accepted by lead c5d9aeae-7064-4cbb-a3f3-fc5670c8103b.'
  - 'Bootstrap plugins are the two existing declared jest-runner and typescript-checker packages with appendPlugins empty; unrelated installed sibling packages cannot enter through wildcard discovery.'
  - 'Store qualification requires captured original bootstrap tools plus the actual worker startup and normalized constructor topology. Unsupported Node or JEST_JASMINE influence, package Jest configuration and selected-suite environment docblocks refuse before API execution or qualification.'
