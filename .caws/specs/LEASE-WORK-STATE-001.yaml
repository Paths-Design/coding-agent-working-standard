invariants:
  - >-
    work_state is visibility-only: a closed enum {working, blocked_awaiting_human,
    review_ready, done}, optional and absent by default. No authority path —
    scope admission, claim, worktree merge/destroy/bind gates, gates run — may
    read it. Doctrine invariant 8 is extended, not weakened: work_state never
    authorizes, refuses, or rescues anything.
  - >-
    Stale classification and message liveness are unchanged: work_state never
    influences active/stale/stopped bucketing, the 30-minute TTL, or
    recipient-liveness decisions in the message channel.
  - >-
    The write path is `caws agents work-state --set <state> [--note <text>]`
    and `caws agents work-state --clear`: enum-validated kernel patch logic
    (pure, time-injected, no I/O) applied through the existing atomic
    per-session-file ownership model — a session writes only its own lease,
    with the same --session-id override rules as the other agents verbs.
  - >-
    Reads surface work_state where presence is already rendered: `agents
    list`, `agents show`, the `caws status` Agents panel, and the message
    sender-context join (poll --json gains workState when the sender's lease
    records it). Enrichment is fail-open and degrades to today's shape when
    the field is absent.
  - >-
    No events.jsonl writes: lease work_state remains operational cache, never
    governance (doctrine invariant 10).
acceptance:
  - id: A1
    given: >-
      A session with an existing lease.
    when: >-
      It runs `caws agents work-state --set blocked_awaiting_human --note
      "waiting on human review of AUTH-BINDING-BRIDGE-001"`.
    then: >-
      The lease file records work_state and the note with a bumped
      last_active, written atomically to its own per-session file, and
      `caws agents show <id>` renders both.
  - id: A2
    given: >-
      One lease with work_state set and one without.
    when: >-
      `caws agents list` and `caws status` run.
    then: >-
      Both surfaces render the state for the first lease; the second renders
      identically to today (absent field produces no placeholder noise).
  - id: A3
    given: >-
      Any string outside the closed enum.
    when: >-
      `caws agents work-state --set <invalid>` runs.
    then: >-
      Exit 1 with a diagnostic naming the accepted values; no lease file is
      written.
  - id: A4
    given: >-
      A governed path, a mergeable lane, and a claimable worktree, each
      exercised twice: once with the acting session's lease carrying
      work_state=review_ready, once with no work_state.
    when: >-
      `caws scope check <path>`, `caws worktree merge <name>`, and `caws
      claim` run in both configurations.
    then: >-
      Decisions and exit codes are identical in both configurations for all
      three commands (authority blindness — mutation-negative test).
  - id: A5
    given: >-
      An undelivered message whose sender's lease records work_state
      review_ready.
    when: >-
      The recipient runs `caws message poll --json`.
    then: >-
      The sender context includes workState; a sender without work_state
      degrades to today's sender-context shape with no error.
  - id: A6
    given: >-
      A lease whose heartbeat is older than the 30-minute TTL and whose
      work_state is set.
    when: >-
      `caws agents list` runs.
    then: >-
      The lease buckets exactly as it would without work_state (stale or
      stopped per existing rules — the field never rescues staleness).
