    - 'Bash mutation projection (src/shell/analysis) as consumed by bash-write-guard'
    - 'Shared bash-write-guard interpreter arm and analysis bridge'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/analysis/'
    - 'packages/caws-cli/templates/hook-packs/shared/bash-write-guard.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/bash-mutation-analysis.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
