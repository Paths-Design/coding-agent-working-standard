    - packages/caws-cli/mutation-policy.json
    - packages/caws-cli/tests/ci/mutation-contract.test.js
  out: []
invariants:
  - 'A recognized write whose target belongs to another session''s worktree, an active claim or a different repository is refused exactly as before'
  - 'Source the projection did not visit, and nested shell source it cannot read literally, stays held'
  - 'caws hooks analyze and the opt-in pin guard keep their own closed admission profiles; only the write guard stops consuming them as write uncertainty'
  - 'Git and reader options that write a file or execute a program stay held, including abbreviated long options'
acceptance:
  - id: A1
    given: 'a governed project and bypassPermissions mode'
    when: 'the guard receives a project script launched by path, by bash or sh with a file operand, or by python or node with a file operand or module'
    then: 'it exits 0 with no refusal, while the same launch whose readable Python or Node source names a write into a different repository exits 2 and names that repository'
  - id: A2
    given: 'read-only git, grep, sed and lookup commands taken from refused agent transcripts, such as git log -8, git merge-base --is-ancestor, git merge-tree --write-tree, git branch --list, grep -A 60, grep --include, sed with substitutions and command -v'
    when: 'the guard evaluates them'
    then: 'each exits 0, and the output- or execution-bearing variants git diff --output, git diff --ext-diff, sort -o, rg --pre and sed with a w or e command are still refused'
  - id: A3
    given: 'literal inline Python or Node'
    when: 'it has no write into a foreign repository or foreign worktree'
    then: 'it exits 0, and a payload that writes a sibling repository or another session''s worktree exits 2'
  - id: A4
    given: 'the hostile corpus of recognized foreign writes behind unmodeled programs, loops, wrappers, builtins and expansions'
    when: 'the guard evaluates it'
    then: 'every case is still refused'
  - id: A5
    given: 'the changed analyzer and shared pack'
    when: 'the analysis, guard, pack-fingerprint suites and the per-file mutation floor run'
    then: 'all pass with SHARED_PACK_VERSION bumped and no declared floor lowered'
non_functional: {}
contracts: []
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Real guard over the compiled CLI: scripts by path, bash/sh file operands, python and node entries and modules exit 0 with empty output; the same launches naming a sibling write, committed or not (publish.py, publish.mjs, retargeted.py), exit 2 and name the sibling. Not covered: a target computed at run time, a module, or another language."
    recorded_at: "2026-11-25T02:13:32.650Z"
    test_nodeid: packages/caws-cli/tests/hooks/bash-write-guard-everyday-commands.test.js
    commit_sha: a763ed3225f1047b9873ab02a7d3866be2a7d296
  - criterion_id: A2
    status: pass
    evidence_ref: "The READS corpus, taken from refused transcripts, exits 0 with empty output; git diff --output and --ext-diff, sort -o, rg --pre and sed w and e stay refused. Known remaining false refusals: an unquoted glob as a script operand (bash -n scripts/*.sh) and git after unset of a GIT_ variable."
    recorded_at: "2026-11-25T02:17:33.732Z"
    test_nodeid: packages/caws-cli/tests/hooks/bash-write-guard-everyday-commands.test.js
    commit_sha: a763ed3225f1047b9873ab02a7d3866be2a7d296
  - criterion_id: A3
    status: pass
    evidence_ref: "INLINE corpus exits 0, including reads of a sibling repository; inline Python and Node naming a sibling or a foreign worktree as a write exit 2 and name it. Node inline is scanned as text, so a read beside an unrelated write can still be refused."
    recorded_at: "2026-11-25T02:23:35.095Z"
    test_nodeid: packages/caws-cli/tests/hooks/bash-write-guard-everyday-commands.test.js
    commit_sha: a763ed3225f1047b9873ab02a7d3866be2a7d296
  - criterion_id: A4
    status: pass
