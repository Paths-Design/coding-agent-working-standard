id: CAWS-GUARD-ADMIT-PROGRAMS-001
title: 'Write guard holds on unproved write targets, not on programs or read options it has no profile for'
mode: fix
lifecycle_state: active
created_at: '2026-11-24T20:48:22.952Z'
updated_at: '2026-11-24T21:17:25.668Z'
