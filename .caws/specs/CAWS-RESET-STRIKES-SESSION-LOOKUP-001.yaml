scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/reset-strikes.sh'
    - 'packages/caws-cli/tests/hooks/bats/reset-strikes.bats'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'strikes exist at HOME/.caws/state/sessions/<sid>/strikes.json'
    when: 'reset-strikes.sh --session <sid> runs'
    then: 'that file is reset, where today the command exits 1 with ''No strike file found for session'''
  - id: A2
    given: 'a legacy repo-local guard-strikes-<sid>.json'
    when: '--session <sid> runs'
    then: 'it is still reset, proving the fix widened the match rather than moving it'
  - id: A3
    given: 'a live session-global strike file'
    when: 'the default listing runs'
    then: 'it is labelled with the real session id, not the literal ''strikes'' parsed from the filename'
  - id: A4
    given: 'a session id with no strike file'
    when: '--session runs'
    then: 'it still fails, and the message names the session ids that do have strikes instead of leaving the operator to guess'
  - id: A5
    given: 'the shared template changed'
    when: 'the pack is installed'
    then: 'SHARED_PACK_VERSION is bumped and pack-fingerprints.json updated, so the fix actually propagates to consumers rather than sitting in-repo'
non_functional: {}
contracts:
  - name: 'reset-strikes-cli'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "A/B against REAL machine state, dry-run so nothing was mutated. Real file: ~/.caws/state/sessions/0d83351d-d384-4100-8148-a3f40dbc6b7a/strikes.json containing {\"shortcut_language\": 4}. OLD (installed pack v78, ./.caws/hooks/reset-strikes.sh --dry-run --session 0d83351d-...): 'No strike file found for session: 0d83351d-d384-4100-8148-a3f40dbc6b7a'. NEW (template v79, bash ./packages/caws-cli/templates/hook-packs/shared/reset-strikes.sh, same flags): '[dry-run] would delete /Users/darianrosebrook/.caws/state/sessions/0d83351d-.../strikes.json (was: {\"shortcut_language\": 4})'. Same session id, same real file, opposite verdicts. File re-read afterwards and unchanged, so --dry-run was honoured. Also bats A1 'session resets the LIVE session-global store' against an isolated HOME."
    recorded_at: "2026-09-16T08:15:39.807Z"
    command: bash packages/caws-cli/templates/hook-packs/shared/reset-strikes.sh --dry-run --session 0d83351d-d384-4100-8148-a3f40dbc6b7a
    exit_code: 0
    commit_sha: "4e7cf268"
  - criterion_id: A2
    status: pass
    evidence_ref: "bats A2 'session still resets a LEGACY repo-local strike file' plants <repo>/.claude/logs/guard-strikes-<sid>.json and asserts it is gone after --session. This test PASSED BEFORE the fix (it was 1 of only 2 green in the red run), which is what makes it a real regression guard rather than a restatement of A1: it proves the change WIDENED the match instead of relocating it. Paired with A2b 'targets ONLY the named session, not every strike file' — two live sessions planted, one named, the other must survive. Without A2b a filter that collapsed to 'reset everything' would satisfy A1 while being catastrophic for a human resetting one wedged session. 8/8 bats green."
    recorded_at: "2026-09-16T08:16:00.398Z"
    command: npx bats tests/hooks/bats/reset-strikes.bats
    exit_code: 0
    commit_sha: "4e7cf268"
  - criterion_id: A3
    status: pass
    evidence_ref: "bats A3 'listing labels the live store with the real session id' asserts BOTH that the output contains session=<the fixture uuid> AND that it does not contain the literal 'session=strikes'. The second assertion is the one that pins the actual bug: describe_file parsed the sid out of the FILENAME, so every live-store file (basename strikes.json) was labelled session=strikes. A3 was the first test to flip green after sid_for_file landed, while A1/A2b/A4 still failed - which correctly localised the remaining failure to the --session matcher rather than the sid derivation."
    recorded_at: "2026-09-16T08:16:18.710Z"
    command: npx bats tests/hooks/bats/reset-strikes.bats
