id: CAWS-DEFECT-MERGE-MAIN-IN-CONCLUSION-BLOCKED-01
title: 'A conflicted merge of base into a lane cannot be concluded: two guards treat incoming base changes as authored, and their pathspec remedy fails mid-merge'
