invariants:
  - 'The gate is opt-in: with no goal binding for the session it is a no-op, and the stock stop chain behaves exactly as it did before this feature'
  - 'The gate only READS acceptance state via caws specs verify-acs; it never writes evidence, so caws specs evidence remains the single writer of acceptance truth'
  - 'Every blocking reason names a human escape (caws goal clear) so a blocked stop is always recoverable without editing guard state'
  - 'A goal can never trap a session indefinitely: consecutive blocks without new evidence are bounded, after which the gate degrades to a loud warning'
  - 'The gate never becomes an authority path: it cannot mark a criterion pass, close a spec, or alter a scope or lifecycle decision'
acceptance:
  - id: A1
    given: 'a session bound to spec S where at least one acceptance criterion has no recorded pass verdict, and the agent has run ''caws goal set S'''
    when: 'the Stop hook fires'
    then: 'goal-ac-gate.sh writes a {"decision":"block","reason":...} control decision to stdout whose reason names each unmet criterion id and its verify-acs status verbatim'
  - id: A2
    given: 'a session bound to spec S where every acceptance criterion has a recorded pass verdict and a goal binding is set'
    when: 'the Stop hook fires'
    then: 'goal-ac-gate.sh writes no control decision, exits 0, and the session stops normally'
  - id: A3
    given: 'a session with no goal binding'
    when: 'the Stop hook fires'
    then: 'goal-ac-gate.sh exits 0 with empty stdout and the observable stop-chain behavior is byte-identical to the pre-feature chain'
  - id: A4
    given: 'a goal binding naming a spec whose verify-acs invocation fails for a reason other than unmet criteria (missing spec, malformed YAML, non-zero exit)'
    when: 'the Stop hook fires'
    then: 'the gate blocks with a reason that names the failure and includes the literal escape command ''caws goal clear'', rather than passing the stop silently'
  - id: A5
    given: 'a goal binding that has already blocked N consecutive stops with no new evidence recorded between them'
    when: 'the Stop hook fires again'
    then: 'the gate stops blocking, emits a loud non-blocking warning naming the still-unmet criteria, and the session is permitted to stop - a goal can never trap a session indefinitely'
non_functional: {}
contracts:
  - name: 'stop-gate'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Unmet acceptance blocks the stop and names each criterion verbatim. Pinned by packages/caws-cli/tests/hooks/bats/goal-ac-gate.bats: 'A1: an unmet criterion blocks the stop and names its id and verdict' (asserts '\"decision\":\"block\"', 'A2=not_rederived', 'no_evidence', and refutes 'A1=verified'), plus 'not_rederived is treated as unmet, never as a pass' and 'a refuted criterion blocks'. Falsifiability shown by mutation: changing the verdict predicate to treat not_rederived as a pass kills 11 of 27 tests. Also demonstrated end to end against the REAL CLI (not a stub): 'caws goal set CAWS-GOAL-AC-STOP-GATE-01' then the real goal-ac-gate.sh invoking the real 'caws specs verify-acs --json' emitted {\"decision\":\"block\",\"reason\":\"...A1=not_rederived(no_evidence), A2=..., A5=not_rederived(no_evidence)...Block 1 of 3...\"}. Run: cd packages/caws-cli && npx bats tests/hooks/bats/goal-ac-gate.bats => 27/27."
    recorded_at: "2026-09-19T01:36:05.755Z"
    commit_sha: f4bc5d2e
  - criterion_id: A2
    status: pass
    evidence_ref: "Fully verified acceptance releases the stop silently. Pinned by goal-ac-gate.bats 'A2: every criterion verified emits no control decision and exits 0' (assert_success + refute_output, so ANY stdout fails) and 'A2: a met goal resets the consecutive-block counter' (asserts the counter sidecar is absent afterwards, i.e. a later regression gets a full budget rather than a spent one). Also proven through the real Stop dispatcher: 'E2E: a met goal leaves the Stop dispatcher emitting no control decision'. Falsifiable: the verdict-predicate mutant that treats not_rederived as verified flips A2's counter-reset test to failing. Run: cd packages/caws-cli && npx bats tests/hooks/bats/goal-ac-gate.bats => 27/27."
    recorded_at: "2026-09-19T01:36:26.089Z"
    commit_sha: f4bc5d2e
  - criterion_id: A3
    status: pass
    evidence_ref: "Opt-in: no binding means the stop chain is byte-identical to the pre-feature chain. Pinned by goal-ac-gate.bats 'A3: with no goal binding the gate is inert (exit 0, no stdout)' (assert_success + refute_output) and 'E2E: with no binding the Stop dispatcher is unchanged by this feature' (drives the real dispatch/stop.sh and refutes both a block decision and any goal-ac-gate output). Demonstrated live: after 'caws goal clear' the real hook produced stdout+stderr=[] exit=0. IMPORTANT SCOPE LIMIT ON THIS PROOF: inertness is asserted as empty stdout and exit 0, NOT as a byte-for-byte diff of the whole chain's observable behavior against the pre-feature build; a finalizer side effect that produces no stdout would not be caught. Commit fb23fbc4 is cited because it fixed a case where the gate was inert for the WRONG reason (binding resolved at the worktree root instead of canonical), which the 26 prior tests could not distinguish. Run: cd packages/caws-cli && npx bats tests/hooks/bats/goal-ac-gate.bats => 27/27."
    recorded_at: "2026-09-19T01:36:46.845Z"
    commit_sha: fb23fbc4