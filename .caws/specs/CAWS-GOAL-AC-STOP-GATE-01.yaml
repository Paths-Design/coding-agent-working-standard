id: CAWS-GOAL-AC-STOP-GATE-01
title: 'Hold a session to its bound spec''s acceptance criteria with a blocking stop gate'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-goal-ac-gate
created_at: '2026-09-18T23:49:52.986Z'
updated_at: '2026-09-19T00:51:13.140Z'
created_by_session: '34188473-6516-4d12-a4e5-df7ff5132232'
blast_radius:
  modules:
    - 'hooks'
    - 'cli-goal'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/goal-ac-gate.sh'
    - 'packages/caws-cli/templates/hook-packs/shared/dispatch/stop.sh'
    - 'packages/caws-cli/src/shell/commands/goal.ts'
    - 'packages/caws-cli/src/shell/register.ts'
    - 'packages/caws-cli/src/shell/command-metadata.ts'
    - 'packages/caws-cli/tests/hooks/bats/goal-ac-gate.bats'
    - 'packages/caws-cli/tests/shell/goal.test.js'
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/tests/init/pack-fingerprints.json
