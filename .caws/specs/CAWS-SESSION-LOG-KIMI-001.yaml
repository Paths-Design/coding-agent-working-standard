invariants:
  - Claude- and qwen-shaped transcripts keep rendering unchanged — the kimi path is additive shape detection (numeric `time` key + dotted type), never a rewrite of the existing parse branches.
  - Kimi file-tool args.path mirrors to file_path at the parse boundary (same normalization as the kimi-code parse-input.sh hook override) so downstream tool branches stay surface-neutral.
  - The renderer stays fail-open on malformed rows — a decode error skips the row, never aborts the render.
acceptance:
  - id: A1
    given: a real Kimi Code wire log (agents/main/wire.jsonl, protocol 1.4, verified on kimi-code 0.31.x)
    when: the renderer parses it
    then: turn.prompt rows become turns, content.part think/text rows become reasoning, tool.call/tool.result rows join into commands and edited files with correct epoch-ms timestamps, and llm.request/usage.record/step.*/context.append_message rows produce no events and no phantom turns
  - id: A2
    given: the session-log.sh hook script on the kimi-code surface (hook payload carries no transcript_path)
    when: Stop/SessionStart/PreCompact fires for a kimi session
    then: resolve_transcript finds the transcript via session_index.jsonl -> <sessionDir>/agents/main/wire.jsonl
  - id: A3
    given: the shared pack templates changed
    when: the pack fingerprint and version are re-recorded and the init/hooks test suites run
    then: pack-fingerprint passes at version 37 and the existing claude/qwen render tests stay green
