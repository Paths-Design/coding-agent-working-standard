invariants:
  - >-
    There is ONE shared shell helper for resolving the canonical hook-state
    directory (lib/caws-state.sh), walking git-common-dir to the canonical repo
    root and returning <canonical-root>/<vendor-dir>/hooks/state. lib/reprieve.sh
    no longer inlines its own equivalent walk; it delegates to the shared helper.
    The behavior is byte-for-byte the reprieve walk's existing semantics
    (canonical root via git-common-dir, no .caws/ existence requirement,
    fail-open to the start dir) — this is a dedup, not a behavior change, proven
    by reprieve's existing tests staying green.
  - >-
    The danger-latch clearer (reset-danger-latch.sh) anchors its STATE_DIR and
    multi-vendor search at the CANONICAL repo root, not the install root
    (SCRIPT_DIR/../..). The writer (block-dangerous.sh) lands latches at
    <git-root>/<surface>/hooks/state (its CAWS_PROJECT_DIR is git-root-normalized
    by HOOK-PROJECT-DIR-ROOT-NOT-CWD-01); the clearer must compute the SAME
    root. Anchoring at install-root diverged from the writer whenever the reset
    ran from a linked worktree, leaving a latch written at the canonical root
    unreachable. The multi-vendor search from CAWS-RESET-LATCH-MULTIVENDOR-001
    is retained as the recovery mechanism — now searching surfaces at the
    CORRECT (canonical) root.
  - >-
    The guard-strike subsystem's state-dir resolution is deliberately UNTOUCHED.
    Its out-of-tree <gitdir>/caws-guard-strikes/ placement is an intentional
    safety invariant (CAWS-GUARD-STRIKE-FILE-OUT-OF-TREE-001: git add -A must
    never sweep strike state) and its logs/ subdir is deliberate. This refactor
    does not unify strike onto the canonical helper.
acceptance:
  - id: A1
    given: >-
      lib/reprieve.sh's caws_reprieve_state_dir after migration onto the shared
      caws_canonical_state_dir helper.
    when: >-
      The existing reprieve bats suite (tests/hooks/bats/reprieve.bats) runs.
    then: >-
      Every reprieve test passes unchanged — the migration is behavior-
      preserving (same canonical-root walk semantics, just delegated).
  - id: A2
    given: >-
      A latch planted at <canonical-root>/.zcode/hooks/state/danger-latch-X.json,
      and reset-danger-latch.sh invoked from a LINKED WORKTREE whose install
      root (SCRIPT_DIR/../..) is the worktree path, NOT the canonical root.
    when: >-
      `reset-danger-latch.sh --session X` runs from that worktree.
    then: >-
      The latch is found and cleared — the clearer anchors at the canonical root
      (via the shared helper), so it searches <canonical-root>/.zcode/... rather
      than the worktree's install-root, which would have missed it.
  - id: A3
    given: >-
      The full bats suite (reprieve + reset-latch + all guards).
    when: >-
      `npm run test:bats` runs.
    then: >-
      All tests pass — no regression from the helper extraction or the
      clearer's canonical-root anchoring.
