  - criterion_id: A1
    status: pass
    evidence_ref: "Driven through the REAL launcher: python3 $home/bin/caws-hook codex pre_tool_use --system, against an isolated CAWS_HOME built by installMachineRuntime(). Arm 'the tier-2 document reaches a guard through bin/caws-hook, changing what it sees' is a controlled pair: identical envelope (file_path native/core.rs), identical fixture guard, the hook-policy.json document as the ONLY variable. Observed SAW:absent: before writing the document and SAW:ok:native/, after, with not.toContain('SAW:no-accessor') asserted on BOTH runs so the difference is the document and not a failure to source the lib. Run: cd packages/caws-cli && npx jest tests/adapter/system-runtime.test.js => 17/17 pass; full suite at this sha => 246/246 suites, 3285/3285 tests, exit 0. SCOPED NON-CLAIM: the arm substitutes a fixture guard for scope-guard.sh, so what is proven is the TRANSPORT and the accessor contract (launcher -> run-handlers -> shared lib -> caws_guard_prefixes), not a scope-guard ADMIT/REFUSE flip on the machine plane; the real-guard verdict flip is proven project-wired in tests/hooks/bats/guard-config-adopters.bats. The substitution was made non-trivial by sourcing the lib exactly as the three real adopters do ($SCRIPT_DIR/lib/guard-config.sh per scope-guard.sh:79, god-object-check.sh:47, loc-delta-check.sh:35) rather than via CAWS_SHARED_LIB_DIR, which is what proves runtimeFiles() reproduces the guard-beside-lib/ relative layout those adopters depend on. Non-vacuity control: arm 'a runtime MISSING the accessor is refused by name' deletes lib/guard-config.sh from the installed snapshot and observes the same envelope go from SAW:absent: to a block naming the absolute path, with no SAW: marker at all."
    recorded_at: "2026-09-19T02:08:46.321Z"
    artifact_path: packages/caws-cli/tests/adapter/system-runtime.test.js
    commit_sha: b8efc5e8
  - criterion_id: A2
    status: pass
    evidence_ref: "Two arms enumerate the install set from both ends. 'the runtime install set carries BOTH guard-config halves' asserts installMachineRuntime({plan:true}).files contains lib/guard-config.sh AND lib/guard-config.py; 'both halves land on disk in the snapshot the launcher actually sources from' asserts both exist under $home/lib/runtimes/<digest>/lib after a real (non-plan) install. Asserted as a PAIR deliberately: the accessor alone would source cleanly and then report 'unavailable' forever, because guard-config.sh resolves its parser as its own sibling — shipping one without the other is silent, not loud. Mechanism: runtimeFiles() (dist/init/machine-adapters.js:100-118) iterates SHARED_PACK.installedFiles and calls add(file.sourcePath, ...), preserving each sourcePath verbatim, so a manifest row propagates to the machine snapshot automatically. Run: cd packages/caws-cli && npx jest tests/adapter/system-runtime.test.js => 17/17; full suite => 246/246 suites, 3285/3285, exit 0. CORRECTION TO THIS AC'S OWN RATIONALE, measured not reasoned: the AC text says a missing lib 'would abort the whole handler chain with exit 2' via run-handlers.sh:420 'caws_source_lib guard-config.sh || return 2'. That line is NOT what fires. Deleting lib/guard-config.sh from the installed snapshot and re-invoking produced {\"decision\": \"block\", \"reason\": \"CAWS machine adapter: [Errno 2] No such file or directory: .../lib/runtimes/<digest>/lib/guard-config.sh\"} at exit 2 — the launcher validates the snapshot against its manifest FIRST and refuses with the absolute path named, ahead of the silent bash abort. The consequence the AC asserts (total failure of every machine-routed call, no degradation to the shipped table) holds and is now pinned by a test; the mechanism named in the AC is the backstop behind the one that actually runs, and the test file's section comment has been corrected to say so."
