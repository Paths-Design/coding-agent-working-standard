id: CAWS-INIT-PLAN-BLIND-TELEMETRY-RETIREMENT-001
title: 'caws init --plan cannot preview the telemetry-row retirement it will perform'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-init-plan-telemetry
created_at: '2026-09-16T05:27:59.949Z'
updated_at: '2026-09-16T05:41:25.754Z'
created_by_session: '1ee72137-dc4a-41c0-a002-23f2c51c90f9'
blast_radius:
  modules:
    - 'caws-cli init plan/apply parity'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/init.ts'
    - 'packages/caws-cli/tests/init/adapter-covered-telemetry-cut.test.js'
    - packages/caws-cli/src/init/hook-install.ts
    - CLAUDE.md
  out: []
invariants:
  - 'A read-only preview must enumerate every mutation the corresponding apply will perform; silence in a plan means no change, never an unmodelled change.'
  - 'Deletions are the highest-consequence class to omit from a preview, because the operator cannot recover what they did not know was at risk.'
acceptance:
  - id: A1
    given: 'a repo where an adapter-covered surface pack is installed and managed shared telemetry rows are present on disk'
    when: 'the operator runs caws init --agent-surface dsh --plan'
    then: 'the plan output names each telemetry row that apply would unlink, rather than listing them as Unchanged or omitting them'
  - id: A2
    given: 'the same repo'
    when: 'the operator runs caws init --agent-surface dsh --plan --json'
    then: 'the plan document carries a structured field enumerating the rows to be retired, so the JSON consumer sees the deletions too'
  - id: A3
    given: 'a repo with no managed telemetry rows on disk, or a non-covered surface'
    when: 'the operator runs caws init --plan'
    then: 'no retirement is reported, because absence is not staleness and a non-covered surface retires nothing'
non_functional: {}
contracts:
  - name: 'init-plan-apply-parity'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Real CLI stdout (spawned dist/index.js, CAWS_HOME pinned to a temp dir) for 'init --agent-surface dsh --plan' against a git repo holding one managed row now renders: 'Telemetry rows (adapter-covered surface owns this plane): / would retire (delete 1): / - .caws/hooks/session-log.sh'. Before the fix that row appeared only under 'Unchanged'. Pinned by test 'the human-readable plan names each row it will unlink', which asserts the path appears AND /retire/i matches so it reads as a deletion, not an unchanged row."
    recorded_at: "2026-09-16T05:40:54.330Z"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: e3d8ec6b
  - criterion_id: A2
    status: pass
    evidence_ref: "InitPlanDocument gains an optional telemetry_retirement: TelemetryRetirePlan field ({retire, absent, unmanaged}). Test 'init --plan --json for an adapter-covered surface enumerates the deletions' spawns the real CLI and asserts plan.telemetry_retirement.retire contains '.caws/hooks/session-log.sh', then asserts the file is STILL on disk - so the JSON promised a deletion without performing one. Before the fix the same assertion failed with 'Received: undefined'."
    recorded_at: "2026-09-16T05:41:05.341Z"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: e3d8ec6b
  - criterion_id: A3
    status: pass
    evidence_ref: "Two halves, both pinned. Nothing-to-retire: test 'a repo with nothing to retire previews an empty retire set' asserts retire is [] and absent equals all four TELEMETRY_ROW_DEST_PATHS, so absence is reported as absence, never staleness. Non-covered surface: test 'a NON-covered surface reports no retirement even with rows on disk' asserts plan.telemetry_retirement is undefined for claude-code with a managed row present - the section is omitted entirely rather than emitted empty. That test also asserts the exit-1 managed_drift refusal on the same row so it cannot pass because the plan failed for an unrelated reason."
    recorded_at: "2026-09-16T05:41:14.971Z"
    command: npx jest tests/init/adapter-covered-telemetry-cut.test.js
    exit_code: 0
    commit_sha: e3d8ec6b