id: CAWS-PREPUSH-STDIN-DRAIN-01
title: 'pre-push drains the ref list git writes to its stdin, so git is not killed by SIGPIPE after every check passes'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-19T18:05:45.491Z'
updated_at: '2026-09-19T18:05:45.491Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'repo-local git hooks (.husky/pre-push)'
    - 'hook test harness (.husky/tests/run.sh)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.husky/pre-push'
    - '.husky/tests/run.sh'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'git invoking the pre-push hook and writing one ref line to its stdin per the pre-push protocol'
    when: 'the hook runs to completion'
    then: 'the writer''s write succeeds and the writer receives no SIGPIPE, because the hook consumed what git sent it'
  - id: A2
    given: 'a hook run whose five stages all pass'
    when: 'the hook exits'
    then: 'it still exits 0 and the stdin drain has not altered any stage''s verdict, so the fix is plumbing and not a gate change'
  - id: A3
    given: 'a hook run where a stage fails'
    when: 'the hook exits'
    then: 'it still exits 1, so draining stdin has not made the hook permissive'
non_functional: {}
contracts:
  - name: 'prepush-stdin-protocol'
    type: behavior
