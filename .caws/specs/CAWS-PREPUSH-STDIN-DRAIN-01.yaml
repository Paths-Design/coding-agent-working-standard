id: CAWS-PREPUSH-STDIN-DRAIN-01
title: 'pre-push drains the ref list git writes to its stdin, so git is not killed by SIGPIPE after every check passes'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-prepush-stdin
created_at: '2026-09-19T18:05:45.491Z'
updated_at: '2026-09-19T18:06:01.541Z'
created_by_session: 'f0fde851-5559-4465-8c54-1bf5b268ded0'
blast_radius:
  modules:
    - 'repo-local git hooks (.husky/pre-push)'
    - 'hook test harness (.husky/tests/run.sh)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.husky/pre-push'
    - '.husky/tests/run.sh'
  out: []
invariants:
  - 'The drain reads to EOF and discards. It must never branch on the ref list: a hook that decides what to check based on which refs are being pushed is a hook whose coverage varies per invocation.'
  - 'The drain happens before the long stages, not after. Its whole purpose is that git''s write completes while the writer is still alive; draining at the end preserves exactly the race it is meant to remove.'
  - 'This is plumbing, not policy. Exit 0 on all-pass and exit 1 on any-fail must be byte-for-byte unchanged, and the no-environment-variable-escape-hatch property is untouched.'
acceptance:
  - id: A1
    given: 'git invoking the pre-push hook and writing one ref line to its stdin per the pre-push protocol'
    when: 'the hook runs to completion'
    then: 'the writer''s write succeeds and the writer receives no SIGPIPE, because the hook consumed what git sent it'
  - id: A2
    given: 'a hook run whose five stages all pass'
    when: 'the hook exits'
    then: 'it still exits 0 and the stdin drain has not altered any stage''s verdict, so the fix is plumbing and not a gate change'
  - id: A3
    given: 'a hook run where a stage fails'
    when: 'the hook exits'
    then: 'it still exits 1, so draining stdin has not made the hook permissive'
non_functional: {}
contracts:
  - name: 'prepush-stdin-protocol'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "T11a: a 256 KiB ref-list payload (larger than any pipe buffer, verified by T11-setup) is written into a fifo that the real .husky/pre-push reads as stdin; the writer exits 0. Mutation-verified: deleting the drain block makes the writer exit 141 (SIGPIPE) and kills T11a, 54 -> 53 passed."
    recorded_at: "2026-09-19T18:33:35.904Z"
    commit_sha: "9ecd0ee0"
  - criterion_id: A2
    status: pass
    evidence_ref: "T11b: with every stage stubbed to pass, the hook still exits 0 after the drain. T11-setup2 gates that the stubs reach the child shell, so the exit-0 is a real all-pass and not a harness artefact. This assertion survives the drain-removal mutation by design -- it asserts no verdict changed, it is not a drain detector."
    recorded_at: "2026-09-19T18:33:38.689Z"
    commit_sha: "9ecd0ee0"
  - criterion_id: A3
    status: pass
    evidence_ref: "T11c: with CAWS_STAGE_FAIL='npx turbo' injecting a lint-stage failure, the hook still exits 1 after the drain, so draining stdin did not make the hook permissive."
    recorded_at: "2026-09-19T18:33:41.144Z"
    commit_sha: "9ecd0ee0"