    - packages/caws-cli/tests/init/hook-install-layout.test.js
    - packages/caws-cli/tests/init/pack-body-drift-observation.test.js
  out: []
invariants:
  - 'This slice changes classification and diagnostics only. Every file that required --overwrite plus --force before still requires it afterward, and nothing is newly auto-updated. A change that improves a refusal message while also loosening the write gate cannot be reviewed as a message change.'
  - 'Baseline absence fails closed. A drifted file with no recorded pristine baseline is classified unobserved and refused; it is never promoted into the upstream-only class. Absence of evidence is not evidence of safety, and guessing safe is the single error that silently destroys grown code.'
  - 'Baseline equality is evidence, never proof. The port path re-baselines a ported body, so no-local-edit-over-baseline narrows the operator investigation without authorizing an unattended overwrite. The refusal reports what was observed and never asserts that refreshing is safe.'
  - 'planOne and applyOne classify through the shared resolveCollision, so a preview can never promise an outcome the write path contradicts.'
acceptance:
  - id: A1
    given: >-
      an installed managed hook whose body differs from the shipping template but is
      byte-identical to its recorded pristine baseline, meaning upstream grew the
      template and the consumer edited nothing
    when: 'caws init --plan runs for a surface whose install set contains that file'
    then: >-
      the refusal names the upstream-only case distinctly from consumer growth, so
      an operator can tell a stale copy from grown code without hand-diffing the
      template against the installed file — the exact investigation
      .caws/hooks/reset-strikes.sh forced on 2026-09-16, where evaluateFileState
      attributed a pure upstream addition to consumer growth
  - id: A2
    given: >-
      an installed managed hook whose body differs from BOTH the shipping template
      and its recorded pristine baseline, meaning the consumer grew it
    when: 'caws init --plan runs'
    then: >-
      it still refuses as consumer growth and still requires --overwrite together
      with --force. The narrowing must not weaken the growth guard, and this is
      proven by a positive control rather than only by the absence of mislabelled
      rows
  - id: A3
    given: >-
      an installed managed hook that differs from the shipping template and has NO
      recorded pristine baseline, the unobserved case
    when: 'caws init --plan runs'
    then: >-
      it refuses as unclassified rather than being assumed upstream-only, because a
      file whose provenance was never recorded is exactly the one where guessing
      safe destroys grown code
  - id: A4
    given: 'a drifted managed hook in any of the three classes'
    when: 'caws init --plan --json emits the structured envelope'
    then: >-
      the structured envelope carries the drift class as its own field alongside the
      existing refusalReason, which keeps its current value. An agent reading --json
      must reach the same verdict as a human reading the rendered table, and
      widening refusalReason itself would break every consumer already matching
      managed_drift
non_functional: {}
contracts:
  - name: 'hook-pack-file-action'
    type: schema
    path: 'packages/caws-cli/src/init/hook-packs/types.ts'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "classifyDrift() reads the installer-written baseline at .caws/hooks/.pristine/shared/<destPath>; when the installed body equals it the difference is attributed to the template rather than the consumer. The fixture writes the same edited body to installed AND baseline, which is what an un-received upstream change looks like from inside the repo, and installs via the real installHookPack so the baseline is the shipping installer output. Falsified, not merely run: collapsing the classifier back to its old always-local_growth answer fails this case with Expected upstream_only / Received local_growth."
    recorded_at: "2026-09-17T04:08:18.096Z"
    test_nodeid: "packages/caws-cli/tests/init/install-drift-classification.test.js::A1: an installed body equal to its baseline is reported as upstream_only, not growth"
    commit_sha: "61d229ad585fc247615c056d645de0d379794d8f"
  - criterion_id: A2
    status: pass
    evidence_ref: "Positive control for the narrowing. The fixture edits ONLY the installed file, leaving the baseline as installed, so installed != baseline and the classifier must still say local_growth and still refuse. Without this case A1 could be satisfied by labelling everything upstream_only. Paired with the shared no-auto-update assertion, which re-runs the real installHookPack for all three classes and asserts action refused, forceRequired undefined and byte-identical file content afterwards, pinning that the write gate did not move."
    recorded_at: "2026-09-17T04:08:31.587Z"
    test_nodeid: "packages/caws-cli/tests/init/install-drift-classification.test.js::A2: a body edited since install is still classified as local growth"
    commit_sha: "61d229ad585fc247615c056d645de0d379794d8f"
  - criterion_id: A3
    status: pass
    evidence_ref: "Fixture deletes the pristine baseline and edits the installed body, so nothing can attribute the difference. classifyDrift returns unobserved on a null baseline read before any body comparison. The test asserts the class is unobserved AND separately asserts it is not upstream_only, because the fail-closed property is that the permissive label must be unreachable when the classifier cannot see, not merely that some other label was chosen."
    recorded_at: "2026-09-17T04:08:35.279Z"
    test_nodeid: "packages/caws-cli/tests/init/install-drift-classification.test.js::A3: drift with no recorded baseline is unobserved, never upstream_only"
    commit_sha: "61d229ad585fc247615c056d645de0d379794d8f"
  - criterion_id: A4
    status: pass
    evidence_ref: "Proven by spawning dist through `caws init --agent-surface dsh --plan --json` with CAWS_HOME pinned to a throwaway dir, not through the handler: the serialize layer is exactly where an added field silently fails to reach the consumer a JSON contract exists for (the register.ts opt-forward class). Asserts driftClass upstream_only AND that refusalReason keeps its existing managed_drift value, pinning that the class was added as a sibling field rather than by widening the enum, which would break every consumer already matching managed_drift. A paired text-rendering case asserts the plan prints the class-specific heading and routes to `caws init diff` rather than promising the refresh is safe."
    recorded_at: "2026-09-17T04:08:49.252Z"
    test_nodeid: "packages/caws-cli/tests/init/install-drift-classification.test.js::A4: init --plan --json carries driftClass through the real CLI"
    commit_sha: "61d229ad585fc247615c056d645de0d379794d8f"