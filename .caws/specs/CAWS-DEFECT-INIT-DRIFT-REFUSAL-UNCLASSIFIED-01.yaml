id: CAWS-DEFECT-INIT-DRIFT-REFUSAL-UNCLASSIFIED-01
title: 'init drift refusal cannot tell a stale copy from grown code, so --force is the only discharge for both'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-17T03:54:41.621Z'
updated_at: '2026-09-17T03:57:02.735Z'
