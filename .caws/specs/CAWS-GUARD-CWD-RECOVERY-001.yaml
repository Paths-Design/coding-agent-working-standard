id: CAWS-GUARD-CWD-RECOVERY-001
title: 'Doctor detects and guides recovery for sessions wedged by a gone cwd (deleted worktree dir)'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-cwd-recovery
created_at: '2026-08-03T21:59:34.102Z'
updated_at: '2026-08-03T21:59:35.041Z'
blast_radius:
  modules:
    - packages/caws-cli/src/shell/cwd-recovery.ts
