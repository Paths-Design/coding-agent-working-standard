invariants:
  - 'A shell-side doctor finding surfaces for every RUNNING session (a lease with status active or stopping) whose recorded cwd points at a path that no longer exists on disk. This is the wedge condition: the session''s sticky shell cwd was inside a directory that a caws worktree merge/destroy (or a manual git worktree remove, or a crash mid-merge) deleted, and now every subsequent shell spawn fails ENOENT with no path to self-recover. The finding names the session, the gone cwd, and the exact recovery (cd to repo_root or restart the session there). The check is read-only (it never writes files, never mutates .caws/, never changes the lease) and is shell-owned, mirroring detectGitignoreDrift (src/init/gitignore-drift.ts) and detectBuildStaleness (src/shell/build-freshness.ts): a shell-owned DoctorFinding appended to the report alongside the kernel findings.'
  - 'Stopped sessions are excluded — a stopped session will not spawn a shell, so a gone cwd is harmless and would be noise. The check loads leases via the existing loadLeases(cawsDir) from src/store/leases-store.ts (lenient per-file; a malformed lease is dropped, not crashed on), gates on status active|stopping, stats each lease.cwd via fs.existsSync, and emits one finding per gone-cwd running session. Severity is error (the session is permanently wedged — matches the kernel WORKTREE_GHOST_REGISTRY_ENTRY posture for physically-gone state). Rule id shell.agent.cwd_gone. No kernel or store-snapshot changes: the existing agent-lease KERNEL findings consume a boolean map the store builds, but routing through that path would require a cross-package kernel release for a recovery-only observability finding; the shell-owned precedent is sanctioned and smaller-surface.'
acceptance:
  - id: A1
    given: 'A lease for session sess-wedged with status active and a cwd that does not exist on disk (e.g. a deleted worktree directory).'
    when: 'caws doctor is invoked.'
    then: 'An error-severity finding with rule id shell.agent.cwd_gone appears, subject is the session id, the message names the gone cwd, narrowRepair instructs `cd <repo_root>` (the lease''s repo_root) or restarting the session there, and the data block carries session_id, cwd, repo_root, branch, pid. The finding is read-only: no lease, registry, or event-log mutation occurs.'
  - id: A2
    given: 'A lease for session sess-ok with status active and a cwd that DOES exist on disk.'
    when: 'caws doctor is invoked.'
    then: 'No shell.agent.cwd_gone finding appears for sess-ok — the check only flags the gone-cwd case.'
  - id: A3
    given: 'A lease for session sess-stopped with status stopped and a cwd that does not exist on disk.'
    when: 'caws doctor is invoked.'
    then: 'No shell.agent.cwd_gone finding appears for sess-stopped — a stopped session will not spawn a shell, so a gone cwd is harmless. Only running (active|stopping) sessions are flagged.'
  - id: A4
    given: 'A lease for session sess-stopping with status stopping and a cwd that does not exist on disk.'
    when: 'caws doctor is invoked.'
    then: 'An error-severity shell.agent.cwd_gone finding appears — stopping sessions can still spawn (a tool may fire during shutdown), so the wedge risk is real.'
  - id: A5
    given: 'A shell.agent.cwd_gone finding in a doctor report.'
    when: 'caws doctor --repair-plan is invoked.'
    then: 'The finding maps to a refused-shape repair-plan item (no allowed_mutation; CAWS will not change a live session''s shell cwd), with a next_command of `cd <repo_root>` and a refusal_reason explaining the operator must reset their shell cwd manually.'
non_functional:
  reliability:
    - 'The check uses loadLeases (lenient per-file) so a single malformed lease cannot crash doctor or fabricate a finding — a lease that fails the AgentLease shape guard is skipped. Missing .caws/leases/ directory is a normal no-op (loadLeases returns empty). The cwd existence check is fs.existsSync — a transient filesystem error is treated as not-gone (fail-open) so doctor never crashes on the check.'
    - 'Performance: bounded by the lease count (typically single digits). One existsSync per running lease. No glob, no walk.'
contracts:
  - name: 'cwd-recovery-doctor-finding'
    type: behavior
    path: 'packages/caws-cli/src/shell/cwd-recovery.ts'
