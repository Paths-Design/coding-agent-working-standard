id: CAWS-DEFECT-SPEC-DEACTIVATE-MISSING-01
title: 'the spec lifecycle has no active-to-draft demotion, so the only exit from a mistakenly-active spec is a false closure'
risk_tier: 2
mode: fix
lifecycle_state: active
worktree: wt-spec-deactivate
created_at: '2026-08-12T08:37:52.990Z'
updated_at: '2026-08-12T11:01:16.905Z'
