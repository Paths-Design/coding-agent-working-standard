  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'an active spec that is not bound to any worktree'
    when: 'caws specs deactivate <id> runs'
    then: 'the spec returns to lifecycle_state draft, a spec_deactivated event is appended, and no resolution or closure_notes is written — the round trip out of active no longer requires asserting that work concluded'
  - id: A2
    given: 'an active spec bound to a live worktree'
    when: 'caws specs deactivate <id> runs'
    then: 'it is refused and the refusal names the worktree, because the one-way property is load-bearing where work has actually started'
  - id: A3
    given: 'a spec in any state other than active'
    when: 'caws specs deactivate <id> runs'
    then: 'it is refused and the refusal names the correct transition for that state — deactivate is the active exit, not a general state setter'
  - id: A4
    given: 'a spec that was closed and carries resolution and closure_notes'
    when: 'it is reopened and then deactivated'
    then: 'the terminal fields are absent from the draft body, so a demoted spec never carries the residue of a closure that no longer applies'
non_functional: {}
contracts:
  - name: 'specs-deactivate'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "commit a605799a: specs-deactivate.test.js A1 group (3 tests) — deactivating an active unbound spec writes lifecycle_state draft, appends spec_deactivated with previous_lifecycle_state active, writes NO resolution/closure_notes, and appends zero spec_closed events. A round-trip test then drives the real dist/index.js activate leg over the demoted body, proving it is a genuinely valid draft rather than one that merely looks like one."
    recorded_at: "2026-08-12T11:02:38.127Z"