id: CAWS-STRIKE-STATE-HOME-001
title: 'Strike state follows CAWS_HOME and never falls back to /tmp'
mode: fix
lifecycle_state: active
worktree: strike-state-home
created_at: '2026-11-11T10:54:58.577Z'
updated_at: '2026-11-11T10:55:00.019Z'
