id: CAWS-GATED-SURFACE-SCOPE-GUARD-001
title: 'Guard scope placement for trust-gated surfaces (qwen-code, zcode): refuse dual wiring, detect silent hook disablement'
risk_tier: 2
mode: fix
lifecycle_state: draft
created_at: '2026-09-03T17:44:05.527Z'
updated_at: '2026-09-03T17:44:05.527Z'
created_by_session: 'session-c5c6ac1b-ed94-4c10-b9e2-3552e8ab3309'
blast_radius:
  modules:
