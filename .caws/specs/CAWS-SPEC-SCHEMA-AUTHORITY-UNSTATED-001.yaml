    status: pass
    evidence_ref: "END-TO-END through the real filesystem and real CLI, not an in-memory fixture: a temp git repo is initialized via 'caws init', a legacy schema is written to .caws/schemas/working-spec.schema.json, and 'caws doctor --repair-plan --json' reports items[].source_rule 'doctor.init.legacy_working_spec_schema_present' with subject equal to that exact path. This is the test that fails against the pre-fix code. NON-VACUOUS AND CRITICAL: restoring the pre-fix observation (LEGACY_SPEC_SCHEMA_RELPATHS reduced to the root entry only) turns 3 store tests RED while ALL 9 kernel+shell tests stay GREEN - so the kernel unit tests alone were structurally blind to the actual defect, which lived in the store observation rather than the rule."
    recorded_at: "2026-09-16T06:57:06.281Z"
    command: npx jest tests/store/doctor-snapshot-legacy-spec-schema.test.js tests/kernel/unit/doctor-legacy-spec-schema.test.ts
    exit_code: 0
    commit_sha: fd4c2108
  - criterion_id: A2
    status: pass
    evidence_ref: "Root-path detection is unchanged and not duplicated. Store e2e: a repo with .caws/working-spec.schema.json yields exactly one finding whose subject is that path. Kernel unit: with the path visible through BOTH the new list and the legacy boolean, exactly ONE finding is emitted (toHaveLength(1)) - widening detection must not double-report. A separate test pins the back-compat path: an older snapshot writer that supplies only workingSpecSchemaJson still produces the original root finding, so upgrading cannot silently drop an error. NON-VACUOUS: replacing the boolean fallback with [] turns that back-compat test RED and leaves the other 14 green."
    recorded_at: "2026-09-16T06:57:18.133Z"
    command: npx jest tests/store/doctor-snapshot-legacy-spec-schema.test.js tests/kernel/unit/doctor-legacy-spec-schema.test.ts
    exit_code: 0
