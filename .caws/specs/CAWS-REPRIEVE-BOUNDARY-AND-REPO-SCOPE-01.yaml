id: CAWS-REPRIEVE-BOUNDARY-AND-REPO-SCOPE-01
title: 'A reprieve names a boundary and a repo: no partial grant across handlers that jointly enforce one invariant, and no silent machine-wide reach'
risk_tier: 2
mode: fix
