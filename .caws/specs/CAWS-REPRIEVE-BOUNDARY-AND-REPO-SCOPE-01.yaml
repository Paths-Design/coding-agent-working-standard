invariants:
  - 'A grant that names some but not all handlers of a declared boundary set is REFUSED, and the refusal names the co-handlers and prints the completed command.'
  - 'A reprieve record carries the repo it was granted for; the hook reader honors it only in that repo unless the grant was explicitly machine-wide.'
  - 'Defaults move narrower, never wider: an omitted scope means this repo, and machine-wide reach requires an explicit flag.'
acceptance:
  - id: A1
    given: 'a session in a repo with the shared guard pack'
    when: 'caws reprieve grant names scope-guard.sh but not bash-write-guard.sh'
    then: 'the grant is refused, the output names bash-write-guard.sh as a co-handler of the cross-repo-write boundary, and prints the completed --handlers command'
  - id: A2
    given: 'the same session'
    when: 'the grant names every handler of the boundary'
    then: 'it is written normally'
  - id: A3
    given: 'the same session'
    when: 'the grant names only handlers that belong to no declared boundary set'
    then: 'it is written normally (the completeness rule constrains declared sets only)'
  - id: A4
    given: 'a grant made without an explicit scope flag while inside repo A'
    when: 'the record is written'
    then: 'it carries repo A''s root, and caws reprieve show reports the grant as scoped to repo A'
  - id: A5
    given: 'a repo-scoped grant for repo A'
    when: 'a guard in repo B consults the reader for a named handler'
    then: 'no ADMIT is emitted and the guard refuses as if no reprieve existed'
  - id: A6
    given: 'a grant made with the explicit machine-wide flag'
    when: 'a guard in any repo consults the reader'
    then: 'ADMIT is emitted, and both grant and show state the reach is machine-wide'
  - id: A7
    given: 'a reprieve record written by an older CLI with no repo field'
    when: 'the reader consults it'
    then: 'it is honored machine-wide as before, so an in-flight grant is not silently voided by the upgrade'
non_functional: {}
contracts:
  - name: 'reprieve-boundary-completeness'
    type: behavior
  - name: 'reprieve-repo-scope'
    type: behavior
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "Partial-boundary refusal. reprieve.ts partialBoundaryCoverage + the refusal block; GUARD_BOUNDARY_SETS declares cross-repo-write = [scope-guard.sh, bash-write-guard.sh]. Proof: npx jest tests/shell/reprieve-boundary-and-repo-scope -- describe 'A1' 3/3 pass. Runtime artifact (stderr, verbatim): \"caws reprieve grant: refused - this grant covers part of a guard boundary, not all of it.\" / \"boundary 'cross-repo-write' is enforced jointly by: scope-guard.sh, bash-write-guard.sh\" / \"your --handlers omits: bash-write-guard.sh\" / \"Grant the whole boundary:  --handlers scope-guard.sh,bash-write-guard.sh\". Exit code 1 and the record file is absent (asserted). Also proven end-to-end against the BUILT binary: 'the real CLI refuses a partial boundary grant (exit 1, co-handler named)' spawns node dist/index.js and asserts status 1 + no record written, so the refusal is not a handler-only artifact."
    recorded_at: "2026-09-19T04:50:21.040Z"
    commit_sha: "8d7d3a26"
  - criterion_id: A2
    status: pass
    evidence_ref: "Complete boundary grant is written. npx jest tests/shell/reprieve-boundary-and-repo-scope describe 'A2' 2/2 pass: --handlers scope-guard.sh,bash-write-guard.sh returns 0 with EMPTY stderr (asserted exactly, so a warning would fail it) and the record on disk has handlers == [scope-guard.sh, bash-write-guard.sh]; the reverse order also passes, so membership is set-based not positional. Falsifiability: the A1 cases share this fixture and differ only in the handler list, so A2 cannot pass by the refusal being unreachable."
    recorded_at: "2026-09-19T04:50:41.074Z"
    commit_sha: "8d7d3a26"
  - criterion_id: A3
    status: pass
    evidence_ref: "Handlers in no declared set are unaffected. npx jest ... describe 'A3' 4/4 pass: a grant for protected-paths.sh,scan-secrets.sh writes normally; partialBoundaryCoverage([]) and (['protected-paths.sh']) return []; a complete set returns []. Plus a structural guard - 'every declared boundary has at least two members' - because a one-member set would declare a rule no input can violate (a vacuous constraint). Runtime artifact: the record file exists at machine-home/state/sessions/<sid>/guard-reprieve-<sid>.json after the boundary-free grant."
    recorded_at: "2026-09-19T04:50:44.212Z"
    commit_sha: "8d7d3a26"
  - criterion_id: A4
    status: pass
    evidence_ref: "Default grant carries the repo root; show reports it. npx jest tests/shell/reprieve-boundary-and-repo-scope describe 'A4' 4/4 pass. Record on disk: repo_root == fs.realpathSync(repoRoot). Grant stdout (verbatim from the surface-detection run): 'reach:    this repo only - /private/var/folders/.../caws-surface-lZraKu' followed by 'A guard in any other repo ignores this grant. For machine-wide reach, re-grant with --all-repos.' show --json returns active:true with applies_here:false when only repo_root is rewritten to another real directory - active and applies_here kept separate so an unexpired foreign-repo grant cannot read as ACTIVE here. Also npx jest tests/shell/reprieve-command (record-shape) and tests/shell/reprieve-surface-detection: 82/82 after both oracles were updated from the old machine-wide shape. Unit-level path semantics in describe 'reprieveReachesRepo - path equality' 3/3: exact match only, symlink-resolved on both sides, and NOT a parent/child prefix match."
    recorded_at: "2026-09-19T04:51:04.950Z"
    commit_sha: "8d7d3a26"
  - criterion_id: A5
    status: pass
    evidence_ref: "Reader refuses in a different repo. npx bats tests/hooks/bats/reprieve.bats 13/13 against the INSTALLED pack (caws_install_pack_once installs from dist, so this exercises the shipped lib/reprieve.sh, not the template in isolation). A11 is the discriminating pair, printed verbatim by the run: 'here=REPRIEVED there=NOT-REPRIEVED' - one record, one session, one handler, findable from both cwds via the machine store; only the repo differs. A10 'result=REPRIEVED' in the granting repo. Adapter-level end-to-end: npx jest tests/adapter/reprieve-roundtrip - a CLI grant in repo a skips guard.sh in a (stderr '[reprieve] guard.sh skipped for session fixture-session') and repo b exits 2 with stdout reason 'fixture guard'; tests/adapter/runtime-context asserts the same through the real ~/.caws/bin/caws-hook dispatcher into a second repo. Why the paired assertion matters: a bare NOT-REPRIEVED would also hold if the record were simply unreadable from there, so A13 (same fixture, field omitted, same foreign repo) is asserted REPRIEVED in the same run."
    recorded_at: "2026-09-19T04:51:08.022Z"
    commit_sha: "8d7d3a26"
  - criterion_id: A6
    status: pass
    evidence_ref: "--all-repos is explicit and visible. Writer: describe 'A6' 4/4 - the record omits repo_root ('repo_root' in record === false), grant prints 'reach:    MACHINE-WIDE - every repo on this machine' and show prints the same. Reader: bats A13 'result=REPRIEVED' consulting from an unrelated git repo. Dist proof (register.ts opt-forward false-confidence risk is a known shipped class): 'the real CLI forwards --all-repos' spawns node dist/index.js twice with the SAME argv except the flag - with it, stdout contains MACHINE-WIDE and the record has no repo_root; without it, stdout contains 'reach:    this repo only' and repo_root == realpath(repoRoot). The paired run is what makes the assertion non-vacuous: asserting only the --all-repos side would hold even if Commander dropped the flag. caws reprieve grant --help on the built dist lists --all-repos. Adapter proof: tests/adapter/runtime-context re-grants with --all-repos after the repo-scoped grant is refused in the second repo, and the dispatcher then exits 0 - so the narrowing is the flag's doing, not a dispatch regression."
    recorded_at: "2026-09-19T04:51:27.648Z"
    commit_sha: "8d7d3a26"