    when: 'the payload is validated against turn-log.v2.json'
    then: 'it validates, because turn_summary is nullable in the schema as it is in the renderer'
  - id: A2
    given: 'a turn rendered with transcript_lineage populated into context'
    when: 'the payload is validated against turn-log.v2.json'
    then: 'it validates, because turnContext declares lineage'
  - id: A3
    given: 'the jest contract fixtures'
    when: 'they are inspected'
    then: 'at least one fixture carries turn_summary null and one carries context.lineage, so the handcrafted set can no longer be green over shapes real output violates'
