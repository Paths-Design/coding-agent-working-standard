  - criterion_id: A2
    status: waived
    evidence_ref: "The stated given — a clone with core.hooksPath unset — cannot be exercised in this repository without first setting core.hooksPath to a bogus value, and for that window every concurrent session here would commit with no git hooks at all. That is the exact ten-month outage this spec exists to prevent, so reproducing it as a test is refused. What IS verified by execution: T6a asserts scripts.prepare is exactly 'git config core.hooksPath .husky'; T6b runs npm run prepare (exit 0) and reads core.hooksPath back as .husky; T6c asserts all three hook-named files exist and are executable under .husky/. The unverified step is a one-command script whose repair behaviour is git's own documented config-set semantics. Closing this gap needs a disposable clone, which is out of reach while git init/clone arms the agent danger latch."
