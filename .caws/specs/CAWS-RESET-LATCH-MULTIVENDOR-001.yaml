id: CAWS-RESET-LATCH-MULTIVENDOR-001
title: 'reset-danger-latch clears latches across all vendor state dirs, not just its own'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-07-31T00:39:00.899Z'
updated_at: '2026-07-31T00:39:11.079Z'
blast_radius:
  modules:
    - packages/caws-cli/templates/hook-packs/shared
    - packages/caws-cli/src/init/hook-packs
    - packages/caws-cli/tests/hooks
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/reset-danger-latch.sh
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/tests/hooks/bats/reset-danger-latch.bats
    - .caws/specs/CAWS-RESET-LATCH-MULTIVENDOR-001.yaml
  out: []
invariants:
  - >-
    reset-danger-latch.sh finds and clears danger latches regardless of which
    vendor state dir they were written under. The latch's location is a property
    of the WRITER's surface (block-dangerous.sh runs under the active harness
    bridge, e.g. CAWS_AGENT_SURFACE=zcode → .zcode/hooks/state/), which the
    human-run clearer cannot know at invocation time. So the clearer enumerates
    every present <vendor>/hooks/state/ (the known surface set from
    agent-surface.sh) plus its own resolved vendor dir, and searches the union.
    It never assumes the latch lives under its own (often claude-code-defaulted)
    vendor dir.
  - >-
    --all actually clears every latch in the project across all vendor dirs,
    not just those under one dir. A multi-surface repo (e.g. .claude + .zcode)
    has its latches fragmented across vendor dirs by design (each harness writes
    its own); --all must sweep the union or it silently leaves latches armed
    while reporting success.
  - >-
    The keyed-filename search (--session <id>, and --current when the session
    resolves) checks every vendor dir, because the writer's surface may differ
    from the clearer's. The one-latch fallback for --current (no session id in
    the human's shell) likewise searches the union: "exactly one latch total →
    clear it; 2+ → disambiguate by listing them", never scoped to one dir.
  - >-
    No safety regression: a genuine 2+-latch situation still refuses to guess
    (lists the latches and asks for --session <id> or --all); only the
    unambiguous single-latch case auto-clears. The reset audit log records every
    cleared file. Read-only commands and the reset itself remain runnable while
    latched (unchanged).
acceptance:
  - id: A1
    given: >-
      A repo with latches present under a NON-default vendor dir (e.g.
      .zcode/hooks/state/danger-latch-<id>.json) and NONE under the clearer's
      own default (.claude/), and the clearer invoked from a plain shell with no
      CAWS_AGENT_SURFACE set (so it defaults to .claude).
    when: >-
      `reset-danger-latch.sh --session <id>` runs.
    then: >-
      The latch under .zcode/ is found and cleared (exit 0, recorded to the
      audit log), instead of "no latch found" while the latch stays armed.
  - id: A2
    given: >-
      The same cross-vendor layout; exactly one latch total exists (under the
      non-default vendor), and --current resolves the session id to "unknown"
      (no harness env in the human's shell).
    when: >-
      `reset-danger-latch.sh --current` runs.
    then: >-
      The single latch is found across the vendor union and cleared (the
      one-latch fallback now spans all vendor dirs), not reported missing.
  - id: A3
    given: >-
      Latches under two different vendor dirs (e.g. one in .claude/, one in
      .zcode/).
    when: >-
      `reset-danger-latch.sh --all` runs.
    then: >-
      BOTH latches are cleared; --all sweeps every vendor dir, not just the
      clearer's default. The audit log records both files.
  - id: A4
    given: >-
      Latches under two different vendor dirs and --current with an unresolved
      ("unknown") session id.
    when: >-
      `reset-danger-latch.sh --current` runs.
    then: >-
      It REFUSES to guess — lists both latches across the vendor union and tells
      the operator to use --session <id> or --all (the 2+ disambiguation now
      spans all vendor dirs). No latch is silently cleared.
non_functional: {}
contracts:
  - name: 'danger-latch-clear'
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/reset-danger-latch.sh'
