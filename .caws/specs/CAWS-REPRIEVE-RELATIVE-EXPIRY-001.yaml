id: CAWS-REPRIEVE-RELATIVE-EXPIRY-001
title: 'caws reprieve grant accepts a relative --for duration alongside absolute --expires-at'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: reprieve-relative-expiry
created_at: '2026-07-25T07:21:27.400Z'
updated_at: '2026-07-25T07:21:27.400Z'
blast_radius:
  modules:
    - 'TODO: list one or more modules this spec touches.'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src/shell/commands/reprieve.ts'
    - 'packages/caws-cli/src/shell/command-metadata.ts'
    - 'packages/caws-cli/src/shell/register.ts'
    - 'packages/caws-cli/tests/shell/reprieve-relative-expiry.test.js'
  out: []
invariants:
  - 'TODO: describe one invariant this spec guarantees.'
acceptance:
  - id: A1
    given: 'an operator runs caws reprieve grant --for 90m'
    when: 'the grant is written'
    then: 'expires_at is a concrete absolute ISO-8601 UTC timestamp 90 minutes from now, because the stored value is the audit record and must not be a relative string needing re-evaluation'
  - id: A2
    given: 'a duration string like 1h30m, 120s, 2d, or 45m'
    when: 'it is parsed'
    then: 'each resolves to the expected offset, and an unparseable or zero/negative duration is refused with the accepted-unit list rather than silently defaulting'
  - id: A3
    given: 'both --for and --expires-at are supplied'
    when: 'the command runs'
    then: 'it refuses with a message naming both flags, because two expiry sources would make the audit record ambiguous'
  - id: A4
    given: 'an operator supplies neither --for nor --expires-at'
    when: 'the command runs'
    then: 'it refuses and names both options, so the ISO-only requirement is never the sole discoverable path'
non_functional: {}
contracts:
  - name: 'reprieve-expiry-input'
    type: behavior
