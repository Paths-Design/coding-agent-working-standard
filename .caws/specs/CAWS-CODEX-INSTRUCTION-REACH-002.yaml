created_at: '2026-09-04T18:06:30.103Z'
updated_at: '2026-09-04T18:07:13.704Z'
created_by_session: '01a06d5b-3024-73b3-8ae2-67a4e79017b1'
blast_radius:
  modules:
    - 'Codex hook-pack instruction placement and init merge reporting'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/init/hook-install.ts
    - packages/caws-cli/src/shell/commands/init.ts
    - packages/caws-cli/src/shell/render/init-hook-pack.ts
    - packages/caws-cli/src/init/hook-packs/manifest-codex.ts
    - packages/caws-cli/templates/hook-packs/codex/AGENTS.md
    - packages/caws-cli/templates/hook-packs/codex/CAWS.md
    - packages/caws-cli/tests/init/codex-instruction-merge.test.js
    - packages/caws-cli/tests/init/pack-fingerprints.json
    - packages/caws-cli/scripts/fresh-install-smoke.mjs
    - docs/architecture/hook-pack-shared-core.md
  out: []
invariants:
  - 'Instruction targeting mirrors Codex discovery precedence: a non-empty root AGENTS.override.md wins; otherwise root AGENTS.md is used or created.'
  - 'CAWS owns only its bounded marker block; all bytes outside that block are preserved exactly.'
  - 'Malformed or duplicate CAWS markers refuse without changing either root instruction file.'
  - 'The always-on block remains concise and self-contained; the full adapter reference is installed as .codex/CAWS.md and is not falsely described as auto-loaded.'
acceptance:
  - id: A1
    given: 'a repository with no Codex project instruction file'
    when: 'the Codex hook pack is planned or installed'
    then: 'init reports and creates a root AGENTS.md carrying the concise CAWS block while the full reference lands at .codex/CAWS.md and no .codex/AGENTS.md is installed'
  - id: A2
    given: 'a repository with existing AGENTS.md content or a non-empty AGENTS.override.md'
    when: 'the instruction merge runs repeatedly or upgrades its managed block'
    then: 'it targets the file Codex actually selects, preserves every byte outside the block, and the second current-version run is byte-identical'
  - id: A3
    given: 'a root instruction file with malformed or duplicate CAWS block markers'
    when: 'init plans or applies the Codex integration'
    then: 'it returns a visible refusal and non-zero status without changing either instruction file'
  - id: A4
    given: 'a disposable project initialized with the Codex hook pack'
    when: 'a fresh Codex session is launched from that project without being told where CAWS instructions live'
    then: 'the session identifies the installed CAWS working contract from the active root instruction chain'
observability:
  - 'Init plan and apply report the active instruction target and merge outcome.'
rollback:
  - 'Revert the implementation commit; existing repository instructions remain intact outside the managed block.'
non_functional:
  security:
    - 'Only a bounded CAWS marker block may be inserted or replaced; malformed or duplicate markers refuse without writing.'
contracts:
  - name: 'codex-instruction-reach'
    type: contract-test
    path: 'packages/caws-cli/tests/init/codex-instruction-merge.test.js'
