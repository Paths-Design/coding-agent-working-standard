    then: 'owned scoped writes are admitted, foreign and out-of-scope writes are refused before effect, and rollback restores baseline bytes'
  - id: A3
    given: 'qualified maintenance bytes and unchanged native registration'
    when: 'normal installer activates the candidate'
    then: 'actual shell commands and owned file edits work, negative guard checks remain enforced, and source plus evidence are retained and properly landed'
