id: WORKTREE-REVIEW-SURFACE-001
title: 'Read-only caws worktree review <name>: the human gate merge lacks — exact commit list, diffstat, scope-provenance table, spec AC status, owner work_state'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-review
created_at: '2026-08-25T00:50:57.572Z'
updated_at: '2026-08-25T15:16:31.881Z'
blast_radius:
  modules:
    - packages/caws-cli/src/shell/commands/worktree.ts
  data_migration: false
scope:
  in:
    - packages/caws-cli/src/shell/commands/worktree.ts
    - packages/caws-cli/src/shell/register.ts
    - packages/caws-cli/src/shell/command-metadata.ts
    - packages/caws-cli/src/shell/index.ts
    - packages/caws-cli/tests/shell/worktree-review.test.js
    - packages/caws-cli/README.md
    - docs/architecture/caws-vnext-command-surface.md
    - docs/command-reference.md
    - docs/api/cli.md
