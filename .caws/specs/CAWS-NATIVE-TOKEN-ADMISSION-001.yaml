id: CAWS-NATIVE-TOKEN-ADMISSION-001
title: 'Add optional per-occurrence transcript number admission without selecting a numeric profile'
mode: feature
lifecycle_state: active
worktree: native-token-admission
created_at: '2026-10-21T02:35:34.254Z'
updated_at: '2026-10-21T02:37:46.604Z'
