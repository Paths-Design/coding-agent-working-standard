id: CAWS-SPEC-CREATION-WITHOUT-TIERS-001
title: 'Remove risk tier selection from new spec creation'
risk_tier: 2
mode: refactor
lifecycle_state: draft
created_at: '2026-10-03T16:14:22.812Z'
updated_at: '2026-10-03T16:14:22.812Z'
created_by_session: '01a10248-00dd-7601-bc4f-6b1696592c89'
blast_radius:
  modules:
    - 'spec authoring and lifecycle compatibility'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/src'
    - 'packages/caws-cli/tests'
    - 'packages/caws-cli/templates'
    - 'packages/caws-cli/docs'
    - 'docs'
    - 'AGENTS.md'
    - 'CLAUDE.md'
    - 'README.md'
  out: []
invariants:
  - 'New specs and creation events contain no inferred or selected risk tier'
  - 'Existing tiered specs and historical event chains remain readable without rewriting them'
acceptance:
  - id: A1
    given: 'a new spec request without a tier'
    when: 'preview and create run'
    then: 'help and commands require no tier and both YAML and creation events omit risk_tier while lifecycle and scope checks still work'
  - id: A2
    given: 'existing tiered specs and tierless new specs'
    when: 'schema validation, semantic validation and gates run'
    then: 'old records remain valid and new records do not inherit tier-specific requirements or an invented sizing budget'
  - id: A3
    given: 'the updated CLI and authoring guidance'
    when: 'focused regressions and installed-package probes run'
    then: 'optional authoring fields retain their data and no current creation example directs agents to choose a tier'
non_functional: {}
contracts:
  - name: 'tierless-spec-creation'
    type: behavior
