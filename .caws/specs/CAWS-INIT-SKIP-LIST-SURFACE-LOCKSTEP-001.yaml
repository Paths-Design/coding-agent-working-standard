id: CAWS-INIT-SKIP-LIST-SURFACE-LOCKSTEP-001
title: 'init skip-message surface list derives from IMPLEMENTED_SURFACES'
risk_tier: 3
mode: fix
lifecycle_state: active
worktree: wt-init-skip-list
created_at: '2026-08-23T21:14:41.669Z'
updated_at: '2026-08-23T21:16:38.348Z'
blast_radius:
  modules:
    - 'packages/caws-cli/src/shell/render'
    - 'packages/caws-cli/tests/init'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/shell/render/init-hook-pack.ts
    - packages/caws-cli/tests/init/init-hook-pack-render.test.js
    - packages/caws-cli/CHANGELOG.md
  out: []
invariants:
  - 'The caws init hook-pack skip messages (skipped_ambiguous and skipped_explicit_none) derive their surface suggestion lists from IMPLEMENTED_SURFACES in init/hook-packs/register.ts — no hardcoded enumeration in the renderer can drift from the registry again.'
  - 'The suggestion list keeps the none opt-out and never advertises declared-but-unimplemented surfaces (cursor, windsurf).'
acceptance:
  - id: A1
    given: 'renderHookPackInstall with outcome skipped_ambiguous'
    when: 'the skip panel renders'
    then: 'it prints one `caws init --agent-surface <s>` line per entry of IMPLEMENTED_SURFACES — including dsh — plus the none opt-out, in registry order'
  - id: A2
    given: 'renderHookPackInstall with outcome skipped_explicit_none'
    when: 'the skip panel renders'
    then: 'the rerun hint names the same IMPLEMENTED_SURFACES-derived list and includes dsh'
  - id: A3
    given: 'the updated renderer and its test file'
    when: 'tests/init/init-hook-pack-render.test.js runs against a freshly rebuilt dist'
    then: 'the new lockstep tests pass and the affected jest suites stay green'
non_functional:
  reliability:
    - 'The lockstep test derives its expectation from the registry, so adding a future surface updates the skip message without a renderer edit.'
contracts: []
