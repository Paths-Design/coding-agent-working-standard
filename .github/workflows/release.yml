name: Release

# CAWS-RELEASE-TAG-DRIVEN-001 v1.
#
# Tag-driven release for @paths.design/caws-cli only. Pushing a tag
# matching `caws-cli-v*` triggers exactly one workflow run that:
#   1. parses the tag
#   2. validates packages/caws-cli/package.json version equals the tag
#   3. validates packages/caws-cli/CHANGELOG.md has a section for the version
#   4. builds caws-cli
#   5. runs the prepublish fresh-install smoke
#   6. runs `npm publish --provenance`
#   7. polls `npm view` to verify registry has the version
#   8. creates a GitHub Release with the CHANGELOG section as body
#
# Asymmetric failure invariant:
#   - Pre-publish failures (1–5): tag is DELETED from origin via gh api.
#   - npm publish failure (6): tag is DELETED (registry was not mutated).
#   - Post-publish failures (7–8): tag is PRESERVED; repair command emitted.
#
# Branch-push to main does NOT trigger publishes. There is no on: push:
# branches block. Refused release-pattern tags (bare v*, caws-kernel-v*,
# malformed caws-cli-v*) ARE observed by the workflow, refused with a
# structured error, AND deleted from origin via gh api. Leaving a refused
# tag in place would create "tag exists, package does not" ambiguity —
# the same class this slice eliminates. Existing historical v* tags on
# origin (pre-dating this slice) are NOT rewritten; only newly-pushed
# refused tags trigger refusal-and-deletion.
#
# The tag-driven flow has no PR-time publish advisory: the human authors the
# version bump + CHANGELOG and decides when to tag. CI only runs on the tag.
# (The retired semantic-release release-guard scripts — release-guard-dry-run,
# release-guard-commit-analyzer-check, release-guard-scope-audit,
# multi-package-release — were removed when this became tag-driven; they
# described a commit-push-publish model that no longer exists.)
#
# Releasing manually:
#   1. Verify the PR is green on CI
#   2. Author/update packages/caws-cli/CHANGELOG.md section for the version
#   3. Bump packages/caws-cli/package.json version to match
#   4. Commit both as a single non-shipping commit on main
#   5. Tag: git tag caws-cli-vX.Y.Z -m "..."
#   6. Push: git push origin caws-cli-vX.Y.Z
#   7. Watch this workflow
#   8. Verify npm registry shows the version and GitHub Release was created
#
# See docs/release-procedure.md for the full procedure.

on:
  push:
    tags:
      # All three patterns are TRIGGERS — not just the canonical accepted one.
      # "Refused via silent non-trigger" is not the same contract as "refused
      # with explicit deletion." The workflow must observe a refused tag so it
      # can delete it, emit a structured refusal log, and exit non-zero. That
      # eliminates the "tag exists, package does not" ambiguity class that
      # this slice exists to remove.
      #
      # caws-cli-v*     accepted candidate; script validates package/version/CHANGELOG
      # caws-kernel-v*  refused in v1 (kernel CI publish deferred); tag is deleted
      # v*              refused (legacy bare-v convention); tag is deleted
      - 'caws-cli-v*'
      - 'caws-kernel-v*'
      - 'v*'

permissions:
  # contents: write — required for tag deletion via gh api on pre-publish
  # failure (CAWS-RELEASE-TAG-DRIVEN-001 contract: pre-publish-failure-
  # deletes-tag). Verified at workflow init via the "Verify tag-deletion
  # permission" step below.
  contents: write
  # id-token: write — used by npm OIDC trusted publishing (the package has a
  # trusted publisher configured for this repo + workflow) and by provenance
  # signing. The publish step intentionally injects NO npm token: a configured
  # authToken preempts the OIDC exchange, which is exactly how the 12.0.0
  # first attempt failed (E404 on PUT with a token the registry refused).
  id-token: write

jobs:
  release:
    name: Tag-driven release
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          # Checkout the tag SHA exactly, not a branch. The workflow operates
          # on the tagged commit content; main may have moved on since.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag context
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow only runs on tag pushes (GITHUB_REF_TYPE was '${GITHUB_REF_TYPE}')."
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ]; then
            echo "::error::GITHUB_REF_NAME is empty; cannot determine tag."
            exit 1
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "🏷️  Tag: ${TAG_NAME}"
          echo "🔖 Commit SHA: ${GITHUB_SHA}"
        id: tag_ctx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
          # NO registry-url here: setup-node's registry-url writes an .npmrc
          # authToken line, and npm uses a configured token INSTEAD of the
          # OIDC trusted-publisher exchange. Public installs need no auth.

      - name: Upgrade npm for OIDC trusted publishing
        # Node 22 bundles npm 10.x, which predates trusted publishing
        # (requires npm >= 11.5.1). The OIDC exchange silently never happens
        # on the bundled npm — publish falls back to token auth and fails.
        run: |
          npm install -g npm@^11.5.1
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: |
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 3
          npm config set fetch-retry-factor 10

          # NOTE the retry shape: the old `npm ci || { ...; sleep; } && break`
          # FAILED OPEN — on attempts 1-2 the failure branch ended in `sleep`
          # (exit 0), so `&& break` exited the loop green after a FAILED
          # install; the build then ran against an empty node_modules and npx
          # fetched tools from the registry (the 12.0.0 lockfile-sync failure
          # was masked exactly this way). A failed install must fail the step.
          ok=""
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            if npm ci --prefer-offline --no-audit --no-fund; then
              ok=1
              break
            fi
            echo "Attempt $i failed, waiting before retry..."
            sleep $((i * 10))
          done
          if [ -z "$ok" ]; then
            echo "::error::npm ci failed on all 3 attempts — refusing to continue to a build with an empty node_modules."
            exit 1
          fi

      - name: Verify tag-ref API access
        # This confirms the workflow can READ the pushed tag ref via gh api.
        # It does NOT prove DELETE authority — actual delete permission is
        # exercised on the refused-tag bake after this workflow lands on
        # main. If this read fails, the runner's GITHUB_TOKEN doesn't even
        # have the ref-read scope, which makes any downstream API call
        # impossible regardless of write semantics.
        run: |
          set -e
          echo "Checking that GITHUB_TOKEN can read the pushed tag ref via gh api..."
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}" >/dev/null || {
            echo "::error::Cannot read tag ref via gh api. Rollback path is unavailable; aborting."
            exit 1
          }
          echo "✓ gh api ref read confirmed. (DELETE authority will be exercised by the refused-tag path, not pre-validated here.)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tag-driven publish
        # Auth is OIDC trusted publishing: id-token: write + npm >= 11.5.1 +
        # the trusted publisher configured on npmjs.com for this repo and
        # workflow file. NPM_TOKEN is deliberately NOT injected — a token,
        # valid or not, preempts the OIDC exchange.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          node scripts/release-tag-publish.mjs "${GITHUB_REF_NAME}"
