name: Mutation Gate

# Fast harness integrity runs on every PR. Full mutation runs nightly, on
# workflow dispatch, or when a PR carries the run-mutation label. Targets,
# dedicated tests, report paths, and per-file floors are owned by
# packages/caws-cli/mutation-policy.json.
#
# Governed by CAWS-CI-MUTATION-PROOF-DURABILITY-001.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      required:
        description: >-
          Run the full per-file mutation floor regardless of event type.
          The release workflow sets this so a tag publish cannot proceed on
          harness-integrity alone. Keeping it an explicit input means an edit
          to the pull_request condition below cannot silently un-gate a
          release.
        type: boolean
        default: false
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness_integrity:
    name: Mutation Harness Integrity (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surface: [kernel, store, shell, analysis, execution]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate mutation source inventory
        working-directory: packages/caws-cli
        run: npm run mutation:validate

      - name: Prove tests and mutant discovery
        working-directory: packages/caws-cli
        run: npm run mutation:dry-run -- --surface "${{ matrix.surface }}"
        env:
          CAWS_TEST_EXECUTION_HOST_CENSUS: '1'

      - name: Retain harness integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-harness-${{ matrix.surface }}-${{ github.sha }}
          path: |
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/mutation-report.json
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/mutation-run.json
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/runs/
          if-no-files-found: warn
          retention-days: 30

  mutation_plan:
    name: Plan every declared mutation target
    needs: harness_integrity
    if: >-
      inputs.required ||
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-mutation')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: matrix
        working-directory: packages/caws-cli
        run: node scripts/mutation-selection.cjs --matrix >> "$GITHUB_OUTPUT"

  mutation:
    name: Mutation (${{ matrix.surface }}, ${{ matrix.target }})
    needs: [harness_integrity, mutation_plan]
    if: ${{ needs.mutation_plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation_plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No incremental cache. scripts/stryker-config.cjs sets
      # `incremental: false` on purpose — Stryker's incremental reports retain
      # removed test metadata and can make a report look current after policy
      # drift, which is exactly the false-pass this gate must not have. A cache
      # step here restored a path Stryker never writes, implying an
      # optimisation that is deliberately absent.

      - name: Run full mutation shard
        working-directory: packages/caws-cli
        env:
          MUTATION_TARGET: ${{ matrix.target }}
        run: >-
          npm run mutation:run:${{ matrix.surface }} --
          --target "$MUTATION_TARGET"
          --summary "$GITHUB_STEP_SUMMARY"
          --sha "${{ github.sha }}"

      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.surface }}-${{ matrix.shard }}-${{ github.sha }}
          path: |
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/mutation-report.json
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/index.html
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/mutation-run.json
            packages/caws-cli/reports/mutation-${{ matrix.surface }}/runs/
          if-no-files-found: warn
          retention-days: 30

  mutation_complete:
    name: Full mutation gate
    needs: [harness_integrity, mutation_plan, mutation]
    if: >-
      always() &&
      (inputs.required ||
       github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'run-mutation'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require every full shard
        working-directory: packages/caws-cli
        env:
          CAWS_MUTATION_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/mutation-selection.cjs --assert-complete
