name: Release Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  tests:
    name: Candidate tests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
          cache: npm
      - name: Observe interpreter immediately after setup
        run: node scripts/observe-test-interpreter.cjs after-setup-node hook-artifacts/interpreter/after-setup-node.json
      - name: Prepare owned CI interpreter permissions
        run: node scripts/prepare-ci-test-interpreter.cjs > hook-artifacts/interpreter/prepared.json
      - name: Verify CI interpreter preparation boundaries
        run: node --test scripts/prepare-ci-test-interpreter.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        id: dependencies
      - name: Verify Qwen qualification wire identity
        run: node --test packages/caws-cli/scripts/native-qualification-qwen-wire.test.cjs packages/caws-cli/scripts/native-qualification-host-tree.test.cjs packages/caws-cli/scripts/qualify-qwen-hook-failure.test.cjs packages/caws-cli/scripts/qualify-qwen-managed-guard.test.cjs
      - name: Prepare pinned Rust and locked Cargo dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path packages/caws-native/Cargo.toml
      - name: Build qualification process custodian
        run: cargo +1.90.0 build --locked --offline --release --manifest-path packages/caws-native/Cargo.toml --no-default-features --example upgrade-supervisor --jobs 2
      - name: Exercise Native guard strike transactions and process contention
        run: 'cargo +1.90.0 test --locked --offline --manifest-path packages/caws-native/Cargo.toml --no-default-features --lib guard_strikes::tests:: --jobs 1 -- --test-threads=1'
      - name: Exercise native image admission on Linux system paths
        run: cargo +1.90.0 test --locked --offline --manifest-path packages/caws-native/Cargo.toml --no-default-features --lib service_image --jobs 2 -- --test-threads=1
      - run: npm run audit:dependencies --workspaces=false
      - run: npm run build -w @paths.design/caws-cli
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run typecheck -w @paths.design/caws-cli
      - run: npm run lint -w @paths.design/caws-cli
      - name: Observe interpreter before tests
        run: node scripts/observe-test-interpreter.cjs before-tests hook-artifacts/interpreter/before-tests.json
      - run: npm test -w @paths.design/caws-cli -- --coverage --maxWorkers=2
        env:
          CAWS_TEST_EXECUTION_HOST_CENSUS: '1'
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
          CAWS_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-scenarios
      - name: Observe interpreter after tests including failure
        if: ${{ always() && steps.node.outcome == 'success' }}
        run: node scripts/observe-test-interpreter.cjs after-tests hook-artifacts/interpreter/after-tests.json
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/caws-cli/coverage/coverage-final.json
            packages/caws-cli/coverage/coverage-summary.json
            packages/caws-cli/coverage/lcov.info
          if-no-files-found: error
      - run: node --test scripts/release-tag-publish.test.mjs scripts/ci-governance-artifacts.test.mjs scripts/ci-matrix-version.test.mjs packages/caws-cli/scripts/runtime-upgrade-smoke.test.mjs packages/caws-cli/scripts/native-upgrade-artifacts.test.mjs packages/caws-cli/scripts/runtime-upgrade-supervisor.test.mjs
        env:
          CAWS_QUALIFICATION_SUPERVISOR: ${{ github.workspace }}/packages/caws-native/target/release/examples/upgrade-supervisor
          CAWS_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-scenarios
      - run: npm run docs:check -w @paths.design/caws-cli
      - run: npm run test:bats -w @paths.design/caws-cli
        env:
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
      - run: node --test packages/caws-cli/scripts/scope-runtime-smoke.test.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
      - run: npm run test:pytest -w @paths.design/caws-cli
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Archive hook byte artifacts without following fixture symlinks
        if: always()
        shell: bash
        run: |
          paths=()
          for directory in hook-artifacts release-scenarios; do
            if [[ -d "$directory" ]]; then
              paths+=("$directory")
            fi
          done
          if (( ${#paths[@]} )); then
            tar -czf hook-byte-artifacts.tgz -- "${paths[@]}"
          fi
      - name: Retain hook byte artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-bytes-${{ github.sha }}
          path: hook-byte-artifacts.tgz
          if-no-files-found: warn

  native-context-custody:
    name: Native context Git custody (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned Rust and locked Cargo dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path packages/caws-native/Cargo.toml
      - run: npm run test:prepare -w @paths.design/caws-cli
      - name: Exercise actual native Git custody
        run: |
          export CAWS_NATIVE_CUSTODY_NODE_PATH="$(command -v node)"
          cargo +1.90.0 test --locked --offline --manifest-path packages/caws-native/Cargo.toml --no-default-features --test context_git --jobs 2 -- --test-threads=1
      - name: Exercise native file protocol with the optimized image
        id: native-file
        env:
          CAWS_NATIVE_TEST_ARTIFACT_ROOT: ${{ github.workspace }}/native-file-observations
        run: |
          mkdir -p "$CAWS_NATIVE_TEST_ARTIFACT_ROOT"
          git rev-parse HEAD > "$CAWS_NATIVE_TEST_ARTIFACT_ROOT/source-commit.txt"
          export CAWS_NATIVE_CUSTODY_NODE_PATH="$(command -v node)"
          cargo +1.90.0 test --release --locked --offline --manifest-path packages/caws-native/Cargo.toml --no-default-features --features native-file-authorization --test native_file_owner --jobs 2 -- --test-threads=1
      - name: Archive native file observations without following fixture symlinks
        if: ${{ always() && steps.native-file.outcome != 'skipped' }}
        run: tar -czf native-file-observations.tgz -- native-file-observations
      - name: Retain native file observations
        if: ${{ always() && steps.native-file.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-file-${{ github.sha }}
          path: native-file-observations.tgz
          if-no-files-found: error

  candidate-package:
    name: Selected CLI candidate artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball-sha256: ${{ steps.selected.outputs.sha256 }}
      tarball-size-bytes: ${{ steps.selected.outputs.sizeBytes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @paths.design/caws-cli
      - name: Pack the candidate once
        run: |
          mkdir -p candidate-package
          npm pack --json --workspace @paths.design/caws-cli --pack-destination candidate-package > candidate-package/npm-pack.json
      - name: Bind the selected artifact to the source and npm receipt
        id: selected
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const digest = (bytes, algorithm = 'sha256', encoding = 'hex') => crypto.createHash(algorithm).update(bytes).digest(encoding);
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          assert.match(sourceCommit, /^[a-f0-9]{40}$/);
          assert.equal(sourceCommit, process.env.GITHUB_SHA);
          assert.equal(execFileSync('git', ['status', '--porcelain=v1', '--untracked-files=no'], { encoding: 'utf8' }), '');
          const root = fs.realpathSync('candidate-package');
          const receipt = fs.readFileSync(path.join(root, 'npm-pack.json'));
          const records = JSON.parse(receipt);
          assert(Array.isArray(records) && records.length === 1);
          const pack = records[0];
          assert.equal(pack.name, '@paths.design/caws-cli');
          assert.equal(pack.version, JSON.parse(fs.readFileSync('packages/caws-cli/package.json', 'utf8')).version);
          assert.equal(typeof pack.filename, 'string');
          assert.equal(path.basename(pack.filename), pack.filename);
          assert(!pack.filename.includes('\\') && pack.filename.endsWith('.tgz'));
          const original = path.join(root, pack.filename);
          const stat = fs.lstatSync(original);
          assert(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= 256 * 1024 * 1024);
          const bytes = fs.readFileSync(original);
          assert.equal(bytes.length, pack.size);
          assert.equal(digest(bytes, 'sha1'), pack.shasum);
          const integrity = 'sha512-' + digest(bytes, 'sha512', 'base64');
          assert.equal(integrity, pack.integrity);
          const sha256 = digest(bytes);
          const selected = path.join(root, 'candidate.tgz');
          assert(!fs.existsSync(selected));
          fs.renameSync(original, selected);
          const selection = {
            schema: 'caws.release.candidate-selection.v1', sourceCommit,
            package: { name: pack.name, version: pack.version },
            tarball: { filename: 'candidate.tgz', sha256, sizeBytes: bytes.length, integrity },
            packReceiptSha256: digest(receipt),
          };
          fs.writeFileSync(path.join(root, 'selection.json'), JSON.stringify(selection, null, 2) + '\n', { flag: 'wx' });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\nsizeBytes=${bytes.length}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: candidate-package/
          if-no-files-found: error

  package-upgrade:
    name: Packaged upgrade (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [candidate-package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: selected-candidate
      - name: Build qualification process custodian
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path packages/caws-native/Cargo.toml
          cargo +1.90.0 build --locked --offline --release --manifest-path packages/caws-native/Cargo.toml --no-default-features --example upgrade-supervisor --jobs 2
      - name: Verify required native runtime tools
        run: |
          /bin/bash --version
          python3 --version
          jq --version
      - name: Install and upgrade the actual candidate package
        run: node packages/caws-cli/scripts/runtime-upgrade-smoke.mjs --report qualification-report.json --tarball selected-candidate/candidate.tgz --tarball-sha256 "$CAWS_SELECTED_TARBALL_SHA256"
        env:
          CAWS_QUALIFICATION_SUPERVISOR: ${{ github.workspace }}/packages/caws-native/target/release/examples/upgrade-supervisor
          CAWS_SELECTED_TARBALL_SHA256: ${{ needs.candidate-package.outputs.tarball-sha256 }}
      - name: Bash 3.2 dispatch regression
        if: runner.os == 'macOS' && matrix.node == '22'
        run: npm run test:bats:macos -w @paths.design/caws-cli
      - name: Archive upgrade evidence with file modes
        if: always()
        shell: bash
        run: |
          paths=()
          for entry in qualification-report.json qualification-report.json.artifacts; do
            if [[ -e "$entry" ]]; then
              paths+=("$entry")
            fi
          done
          if (( ${#paths[@]} )); then
            tar -czf qualification-evidence.tgz -- "${paths[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-${{ github.sha }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            qualification-report.json
            qualification-evidence.tgz
          if-no-files-found: error
