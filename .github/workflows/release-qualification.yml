name: Release Qualification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  tests:
    name: Candidate tests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        id: dependencies
      - name: Prepare pinned Rust and locked Cargo dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path packages/caws-native/Cargo.toml
      - run: npm run audit:dependencies --workspaces=false
      - run: npm run build -w @paths.design/caws-cli
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run typecheck -w @paths.design/caws-cli
      - run: npm run lint -w @paths.design/caws-cli
      - run: npm test -w @paths.design/caws-cli -- --coverage --maxWorkers=2
        env:
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
          CAWS_RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-scenarios
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/caws-cli/coverage/coverage-final.json
            packages/caws-cli/coverage/coverage-summary.json
            packages/caws-cli/coverage/lcov.info
          if-no-files-found: error
      - run: node --test scripts/release-tag-publish.test.mjs scripts/ci-governance-artifacts.test.mjs scripts/ci-matrix-version.test.mjs packages/caws-cli/scripts/runtime-upgrade-smoke.test.mjs
      - run: npm run docs:check -w @paths.design/caws-cli
      - run: npm run test:bats -w @paths.design/caws-cli
        env:
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
      - run: node --test packages/caws-cli/scripts/scope-runtime-smoke.test.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CAWS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/hook-artifacts
      - run: npm run test:pytest -w @paths.design/caws-cli
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Archive hook byte artifacts without following fixture symlinks
        if: always()
        shell: bash
        run: |
          paths=()
          for directory in hook-artifacts release-scenarios; do
            if [[ -d "$directory" ]]; then
              paths+=("$directory")
            fi
          done
          if (( ${#paths[@]} )); then
            tar -czf hook-byte-artifacts.tgz -- "${paths[@]}"
          fi
      - name: Retain hook byte artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hook-bytes-${{ github.sha }}
          path: hook-byte-artifacts.tgz
          if-no-files-found: warn

  native-context-custody:
    name: Native context Git custody (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned Rust and locked Cargo dependencies
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 fetch --locked --manifest-path packages/caws-native/Cargo.toml
      - run: npm run test:prepare -w @paths.design/caws-cli
      - name: Exercise actual native Git custody
        run: |
          export CAWS_NATIVE_CUSTODY_NODE_PATH="$(command -v node)"
          cargo +1.90.0 test --locked --offline --manifest-path packages/caws-native/Cargo.toml --no-default-features --test context_git --jobs 2 -- --test-threads=1

  package-upgrade:
    name: Packaged upgrade (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @paths.design/caws-cli
      - name: Verify required native runtime tools
        run: |
          /bin/bash --version
          python3 --version
          jq --version
      - name: Install and upgrade the actual candidate package
        run: node packages/caws-cli/scripts/runtime-upgrade-smoke.mjs --report qualification-report.json
      - name: Bash 3.2 dispatch regression
        if: runner.os == 'macOS' && matrix.node == '22'
        run: npm run test:bats:macos -w @paths.design/caws-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-${{ github.sha }}-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            qualification-report.json
            qualification-report.json.artifacts/
          if-no-files-found: error
