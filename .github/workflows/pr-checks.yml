name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Quick sanity checks (fail fast)
  sanity:
    name: Quick Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm run audit:dependencies

      - name: Block shadow file patterns
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          # Pattern list is pinned by packages/caws-cli/tests/ci/release-path-integrity.test.js,
          # which executes THIS step against known-bad paths. Narrowing the
          # regex fails that test — a guard consolidated out of another
          # workflow already lost /duplicate-, /backup- and .backup once.
          # (^|/) rather than / so a repo-root shadow file is caught too.
          #
          # ALLOW lists files whose NAME describes the anti-pattern they
          # detect rather than being an instance of it. Entries are anchored
          # and exact: a prefix or substring entry would let a real shadow
          # file hide behind a legitimate neighbour.
          # The [-_](enhanced|new|final|copy) suffixes mirror
          # .caws/hooks/naming-check.sh, the repo's definition of a shadow file.
          #
          # naming-check.sh's *-v[0-9] rule is deliberately NOT enforced here.
          # It cannot distinguish a shadow copy (handler-v2.ts) from a
          # legitimately version-named module (migrate-v10.ts,
          # migration-v10-to-v11.md), both of which are tracked in this repo.
          # A false positive is free in an advisory hook and expensive in a
          # blocking gate, so version suffixes stay advisory. This is pinned
          # by the "every tracked file passes the guard" test — re-adding the
          # rule fails it.
          ALLOW='^(\.caws/hooks|packages/caws-cli/templates/hook-packs/shared)/duplicate-export-check\.sh$'
          CHANGED=$(git diff --no-ext-diff --name-only "${BASE_REF}...${HEAD_REF}")
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev "$ALLOW" | \
            grep -E '(^|/)(copy|final|enhanced|v2)[.-]|(^|/)(new|duplicate|backup)-|[-_](enhanced|new|final|copy)\.|\.backup$| - copy\.' || true)
          if [ -n "$BAD" ]; then
            echo "❌ Shadow/duplicate filename patterns detected:"
            echo "$BAD"
            exit 1
          fi

      # Per-feature spec structure, policy/code separation, waivers, and
      # lifecycle rules are enforced by .github/workflows/caws-gate.yml. The
      # removed job read the retired v10 working-spec singleton and therefore
      # skipped every scope and budget check on v11 repositories.

  # Comprehensive testing
  test_suite:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        # The root `test:unit` script is `turbo run test`. Flags after the
        # script name belong to Jest, not to Turbo. Invoking Turbo directly
        # avoids the npm/turbo double-`--` ambiguity (npm run test:unit -- -- ...)
        # that future maintainers would trip over.
        # Governed by CI-PR-TEST-PASSTHROUGH-001.
        run: npx turbo run test -- --coverage

      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            packages/caws-cli/coverage/coverage-final.json
            packages/caws-cli/coverage/coverage-summary.json
            packages/caws-cli/coverage/lcov.info
          if-no-files-found: error

      - name: Contract tests
        if: hashFiles('tests/contract/**') != ''
        run: npm run test:contract

      - name: Integration tests
        if: hashFiles('tests/integration/**') != ''
        run: npm run test:integration

      - name: E2E smoke tests
        if: hashFiles('tests/e2e/**') != ''
        run: npm run test:e2e:smoke

  # Hook bash-guard behavioral suite (lineage-anchored). These prove each
  # failure-lineage guard still FIRES (block-dangerous, protected-paths,
  # scan-secrets, cwd-guard, naming-check) — the "do as I do" proof. Blocking.
  # Previously absent from every workflow (CAWS-TEST-CI-WIRING-001 A2).
  hook_bats:
    name: Hook Guards (bats)
    runs-on: ubuntu-latest
    needs: sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bats hook guard tests
        working-directory: packages/caws-cli
        run: npm run test:bats

  # Blocking regression guard for CAWS-HOOKPACK-DISPATCH-EMPTY-HANDLERS-CRASH-001:
  # every shared/codex/kimi-code hook dispatch script must exit 0 (fail-open)
  # when every handler for an event is disabled, even on bash 3.2 -- the
  # version macOS ships at /bin/bash by default (frozen there for GPLv2
  # licensing reasons). This bug is NOT reachable on hook_bats above, which
  # runs on ubuntu-latest's modern bash. Deliberately scoped to this one file
  # (not the full bats suite) so a macOS-only CI job stays small and fast.
  # CAWS-HOOKPACK-BASH32-EMPTY-HANDLER-CI-REGRESSION-001.
  hook_bats_bash32_macos:
    name: Hook Guards — bash 3.2 empty-handler regression (macOS)
    runs-on: macos-latest
    needs: sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bash 3.2 empty-handler-array regression guard
        working-directory: packages/caws-cli
        run: npm run test:bats:macos

  # Hook python-classifier suite (classify_command decision matrix +
  # session_log_renderer). Proves the git-init/rebase/hard-reset classifications
  # and the allow/ask/deny enforcement vocabulary. Blocking (CAWS-TEST-CI-WIRING-001 A2).
  hook_pytest:
    name: Hook Classifier (pytest)
    runs-on: ubuntu-latest
    needs: sanity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Pytest hook classifier tests
        working-directory: packages/caws-cli
        run: npm run test:pytest

  # Generate PR comment with summary
  pr_comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs:
      [
        test_suite,
        hook_bats,
        hook_bats_bash32_macos,
        hook_pytest,
      ]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate PR comment
        run: |
          if [ -f "apps/tools/caws/pr-comment.js" ]; then
            npm run caws:pr-comment > pr-comment.md
          else
            echo "PR checks completed - see workflow for details" > pr-comment.md
          fi

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr-comment.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
